<script>var DATA={"entries":[{"file":"版本对比/2026-09-10-0.1.5-rc.1-vs-0.1.5-alpha.2.md","group":"版本对比","date":"2026-09-10","slug":"0.1.5-rc.1-vs-0.1.5-alpha.2","title":"DSH 主库版本观察：0.1.5-rc.1 vs 0.1.5-alpha.2","tags":["@deepseek-ai/dsh","@deepseek-ai/dsh-desktop","dsh-v0","dsh-desktop","0.1.5-rc.1","0.1.5-alpha.2","0.1.2-rc.1","0.1.5","0.1.5-rc.2"],"summary":"latest 从 0.1.2-rc.1 直接跳到 0.1.5-rc.1——默认安装路径（pnpm add @deepseek-ai/dsh）现在拿到的是 0.1.5-rc.1。","bytes":3834,"lines":56,"body":"# DSH 主库版本观察：0.1.5-rc.1 vs 0.1.5-alpha.2\n\n> 观察时间：2026-09-10 · 观察库：`DSHfork/`（独立克隆观察站） · 基线：`dsh-v0.1.5-alpha.2`\n\n## 结论速览\n\n| 问题 | 答案 |\n|---|---|\n| 什么时候更新的 | 0.1.5-alpha.2（09-09 22:13）→ 0.1.5-rc.1（09-10 09:36），**不足 12 小时** |\n| 发布 NPM 了吗 | **已发布，且被标记为 `latest`**。dist-tags：`latest`=0.1.5-rc.1、`next`=0.1.5-rc.1、`alpha`=0.1.5-alpha.2 |\n| 改动规模 | 17 提交（13 非 merge）——收口小版本 |\n| 性质 | LLM 模型目录调整 + sidebar 打磨；**桌面端与 connection 零改动** |\n\n## 关键变化：npm latest 跳版\n\n| 项 | 09-09 实测 | 09-10 实测 |\n|---|---|---|\n| npm `latest` | 0.1.2-rc.1 | **0.1.5-rc.1** |\n| npm `next` | 0.1.2-rc.1 | 0.1.5-rc.1 |\n| npm `alpha` | 0.1.5-alpha.2 | 0.1.5-alpha.2 |\n| 最新 tag | `dsh-v0.1.5-alpha.2` | **`dsh-v0.1.5-rc.1`** |\n| `origin/master` | `b2e3b2a012` | `aa8262ec09` |\n\n`latest` 从 0.1.2-rc.1 直接跳到 0.1.5-rc.1——默认安装路径（`pnpm add @deepseek-ai/dsh`）现在拿到的是 0.1.5-rc.1。\n\n## rc.1 提交构成（13 个非 merge）\n\n- **LLM（3）**：default Chat Completions to DeepSeek V41 Flash ／ retain V4 models alongside V41 Flash ／ restore V4 Flash Vision Exp catalog entry\n- **Sidebar（3）**：refine guide start page and quiet stat pill noise ／ pin the guide hero to the pure-gray ramp ／ refine sidebar document previews\n- **client（3）**：keep preview scrollports current ／ refresh slot catalog ／ address sidebar and stats review feedback\n- **test（3）**、**release（1）**\n\nrc.1 之后的 9 个提交全是 docs/i18n（README 校对、BibTeX 引用）。\n\n## 对本工作区的影响\n\n1. **桌面端（`apps/desktop`、`apps/desktop-host`）零改动** → `2026-09-10-官方桌面壳评估与方案B决策.md` 中所有桌面端实测结论在 rc.1 上仍然成立（不开监听端口、配置层禁用 webserver/web-runtime、独占 `profiles/desktop`）。\n2. **connection 零改动** → carrier-neutral 语义（`inject` 只有 `credentials`、支持 POST、有 `requestBody` 字段）在 rc.1 上成立。**§12 规范草案的技术前提已经满足**。\n3. **npm latest 已是 0.1.5-rc.1** → 该文档 §13 的「重启条件①（内核可升到 0.1.5+）」**已满足**；条件②（官方桌面端发布安装包）仍待满足。\n4. 官方桌面端仍未发布：npm `@deepseek-ai/dsh-desktop` 无包、GitHub Release 的 `assets` 为空。\n\n## 方法备忘（下次续写）\n\n- 观察库：`DSHfork`（origin=官方主库，master 跟踪 origin/master）\n- 更新流程：`git -C DSHfork fetch origin --tags` → `git log \u003c上次tag>..\u003c新tag>` → 按主题聚类 → 追加新观察文档\n- npm 查询：`https://registry.npmjs.org/-/package/@deepseek-ai/dsh/dist-tags`（轻量）\n- 当前最新 tag：`dsh-v0.1.5-rc.2`\n\n## 同日晚补充：0.1.5-rc.2（09-10 21:50）\n\n- tag `dsh-v0.1.5-rc.2`（`fb2c4b9e69`，Yichen Jiang）；rc.1 → rc.2 仅 **4 提交（2 个非 merge）**：`feat(web): backport feedback and file refinements to 0.1.5` + release 提交。\n- **四条关键线零实际改动**：`apps/desktop`、`apps/desktop-host`、`packages/client/connection`、`packages/preset/persona` 在 rc.1→rc.2 的唯一提交都是 `release(dsh): 0.1.5-rc.2`（只改版本号）。→ 本工作区的官方桌面壳评估与升级差异清单结论**不受影响**。\n- npm dist-tags：`latest`=`0.1.5-rc.1`（未动）、**`next`=`0.1.5-rc.2`**、`alpha`=`0.1.5-alpha.2`。即 rc.2 走 `next` 预发布通道，官方未把它标记为推荐版。\n- rc.2 之后 `origin/master` 又前进 **139 提交**（多为 CI / test 修复）。\n- **升级目标建议**：跟 `latest`（rc.1），或等 0.1.5 正式版（非 rc）再升；不必追 `next`。\n"},{"file":"工程范式/2026-09-10-DSH方法论精读原始报告存档.md","group":"工程范式","date":"2026-09-10","slug":"DSH方法论精读原始报告存档","title":"DSH 方法论精读：原始报告存档（2026-09-10）","tags":["dsh-doc","dsh-prose-standard","dsh-speed-up-perf","dsh-ci-test-reliability","dsh-trim-cot-leakage","dsh-code-review","dsh-find-simplifications","dsh-pre-push-checks"],"summary":"源文件：.agents/skills/dsh-doc/SKILL.md、.agents/notes/README.md、.agents/notes/AGENTS.md、.agents/notes/implemented/AGENTS.md、docs/AGENTS.md、dsh-doc/references/structure-hierarchy.md","bytes":34990,"lines":264,"body":"# DSH 方法论精读：原始报告存档（2026-09-10）\n\n> 状态：记录（推断 · 2026-09-12）\n\n> 本文件存档 4 个 subagent 对 8 个官方 skill 的精读报告（保留全部逐字引用与规则清单，删除叙述性重复）。\n> 综合提炼见 `2026-09-10-DSH工程方法论学习笔记.md`；结构与规模见 `2026-09-10-DSH官方工程化范式调查.md`。\n> 素材来源：`DSHfork` @ `origin/master`（`c291e7961a`）。\n\n## 报告 A：文档体系与 Agent Notes 机制\n\n**源文件**：`.agents/skills/dsh-doc/SKILL.md`、`.agents/notes/README.md`、`.agents/notes/AGENTS.md`、`.agents/notes/implemented/AGENTS.md`、`docs/AGENTS.md`、`dsh-doc/references/structure-hierarchy.md`\n\n### A.1 文档分层与职责边界\n\n每层都明写「不收什么」：\n\n| 层 | 职责 | 不收 |\n|---|---|---|\n| Root `AGENTS.md` | 常驻指令（每条 1–3 行 + 链接 home） | 故事、示例、情景流程、从 home 复述的内容 |\n| 子树 `AGENTS.md` | 子树专属指令 | 根文件已有的全仓规则 |\n| JSDoc / 代码注释 | 模块与导出的本地完整契约（行为、失败、时序、所有权、模态、异常、后果） | 推理过程、测试走读、评审分析、复述代码 |\n| Package README | 每包契约（config、语义、limitations、扩展点、Model Experience / Known Limitations） | JSDoc 复述、生成目录复述、别的包的事 |\n| Agent Note | 活跃决策记录（why、放弃了什么、必需验证） | 迁移计划、验收清单、spec-speak（\"should…\"） |\n| 顶层 `docs/` | architecture 有序地图 / subsystems 类型定义 / cookbook 编号验证步骤 / postmortem（唯一可讲事故处）/ user 产品指南 / development 贡献者流程 | — |\n| 网站 `website/` | 投影 | \"The website is a tested projection, never a second copy\"；`.generated/` 永不手改 |\n\n**核心原则（逐字）**：\n\n- \"Preserve one owner per fact: source, tests, generated catalogs, package READMEs, guides, Agent Notes, and scratch each keep their own kind of truth.\"\n- \"Each fact has one home: the tier whose job it is; elsewhere, link there.\"\n- \"Document type does not widen that scope.\"（参考文档只对自身主题穷尽）\n\n**映射规则（逐字）**：\n\n> \"Placement: bugs → postmortems; rationale → Agent Notes; procedures → cookbooks; type definitions → subsystems; package contracts → READMEs; standing orders → root `AGENTS.md` with a rationale link.\"\n\n**kind 元数据机械映射**：package-group / package-reference / package-library / package-bundle，一 kind 一模板；\"Add a new kind only together with a distinct template file, a documented repository position or declared owner, and a focused check that maps documents to it.\"\n\n**硬约束**：一事实一家；重复规则用特征短语 grep 合并（\"keep one home and link the rest\"）；生成目录永不手改；搬迁必须原子修好所有入链。\n\n**「受众优先层级」**：该术语仅出现在 dsh-doc 的 frontmatter description（\"using audience-first hierarchy\"），完整定义条目未读到。可验证支撑三条：① 分页按「一个主要 job + 一个 reader」分类；② 页内顺序固定为 用户可用 → 高级配置 → 开发者细节；③ \"Organize cross-package Markdown under audience and learning intent instead of leaving unrelated pages flat at `docs/`.\"\n\n### A.2 Agent Notes 机制\n\n**触发条件（逐字）**：\"Every non-trivial change MUST add or update at least one Agent Note in the same PR.\"\n\n非平凡 = 改变行为、架构、跨文件/跨包契约、流程或工具、测试策略、磁盘/wire/配置格式，或维护者可能重新审视的其他决策。豁免仅限纯机械、无行为/契约/结构/流程/理由变化的局部编辑。更新既有归属 note 即算满足，禁止另建重复。新增 note 必触发一次 supersession 检查（同 PR 归档合格 triplet，部分取代则双向交叉链接）。\n\n**生命周期（目录即状态）**：\n\n| 目录 | 含义 | 备注 |\n|---|---|---|\n| `proposed/` | 实施前评审的提案，尚未或仅部分构建 | \"Never archive a proposed note: reject an obsolete proposal.\" |\n| `implemented/` | 决策已 ship | 随实际发布同步更新——\"facts only — paths, names, structure — not the decision itself\" |\n| `rejected/` | 已考虑后拒绝 | 仅当理由还能防住一个诱人错误时保留，否则中/英 + sidecar 三件套一起删 |\n| `archived/` | 冻结历史 | 仅 implemented 可进 |\n\n**归档判据**：shipped 决策已完成且理由不太可能指导未来工作。仍活跃的判据（任一成立即保留）：alternatives、ownership boundary、negative guarantee、durable/wire semantics、security rule、reintroduction condition。且 \"word count and age are discovery aids, never archive criteria.\"、\"Do not archive toward a quota.\"\n\n**为什么归档不可编辑（逐字）**：\"Once sealed, every archived triplet is permanently frozen. Do not edit, translate, reformat, update, move, or delete it, and do not treat it as authority for current behavior.\"——归档即宣布它不再对当前行为负责；若仍可编辑就会与 implemented note「随代码同步」的义务冲突，变成第二份会过期的权威。故 gate 跳过 archived 源（含其出链）。归档唯一允许的内容改动：在 `Status: implemented` 正下方插入同一值的 `Archived: YYYY-MM-DD`（两个语言文件）。\n\n**格式要求（全部由 gate 强制）**：\n\n- 路径 `{lifecycle}/{class}/yyyy-mm-dd-topic-title.md`，日期取主题**首次提出日**（按 git 历史）。\n- class 为封闭集合：feature / bug-fix / simplification / architecture / process / testing——architecture = 发布的源码结构；process = 源码周边工具与流程；**刻意没有 refactor**。\n- 禁建中心化 INDEX.md。\n- 头三行固定为 `# Agent Note: \u003ctitle>`、空行、`Status: \u003cstatus>`；Status 仅三形式（proposed / implemented / `rejected — \u003c一行原因>`），不带日期与括号，且必须与所在目录一致（gate 交叉校验）。\n- 正文必以 `## Problem` 开（能在没有方案的情况下独立成立）。\n- proposed 章节：Problem / Proposal / … / Alternatives considered / Acceptance criteria / Risks；implemented：Problem / Decision / … / Alternatives considered / Consequences。gate 拒绝 implemented 中的 `## Proposal`、`## Plan`、`## Migration plan`、`## Acceptance criteria`（spec-speak）。\n- `## Alternatives considered` **强制**且必为真替代：每个真替代一段加粗开头，或有争议的写 `### Why not \u003cX>?`。\n- 决策与架构约束（逐字）：\"An Agent Note is never edited into a *different decision*: supersede it with a new one, and keep both notes cross-linked.\"\n- `.zh.md` 逐节镜像英文结构，机器校验的 header token（`# Agent Note: ` 与 Status 行）保持英文原样。\n\n### A.3 可迁移点（原报告）\n\n**个人**：① 固定四段模板（问题 → 决策 → 替代方案（为什么没赢，必填）→ 后果）；② 写前先问「这条属于哪一层」，一事实一家，重复规则 grep 特征短语合并；③ 当前状态进文档、理由进决策记录、事故进复盘、临时想法只进 Dev Note（\"Dev Note is the only slop zone.\"）；④ \"the only admissible evidence for an operation claim is having run it\"——跑不了就写「未验证 + 验证 owner」；⑤ 决策变更用新记录取代旧记录 + 双向交叉链接。\n\n**≤10 人团队最小可行**：`notes/{proposed,implemented,rejected,archived}/{class}/yyyy-mm-dd-title.md`；class 裁到 4 个（feature / bug-fix / architecture / process）；三条准入规则 = 非机械改动同 PR 必加或更新一条、每条必写 Alternatives considered、新建时做 supersession 扫描；归档即冻结、只作历史链接目标；给 AGENTS.md / README 设字数上限，超限按 relocate → condense → raise。\n\n**未验证项**：①「audience-first hierarchy」精确定义；② `dsh-doc/references/review.md` 与 `dsh-prose-standard` 未读（后者由报告 C 补上）；③ `scripts/verify-archived-agent-notes.ts` 实现细节。\n\n## 报告 B：性能与可靠性\n\n**源文件**：`.agents/skills/dsh-speed-up-perf/SKILL.md`（92 行）、`.agents/skills/dsh-ci-test-reliability/SKILL.md`（131 行）\n\n### B.1 定位（逐字）\n\n- perf：\"Turn a broad “make it faster” request into reproducible user-path measurements and small, evidence-backed fixes.\"；\"This is guidance, not a quota or a script: survey broadly, follow measured cost, and reject attractive changes that do not improve the workload users actually run.\"\n- ci：\"Build tests that remain correct under the repository's real CI topology, not only when run alone on a quiet workstation.\"；\"Process isolation does not isolate host ports, predictable filesystem paths, external services, databases, sockets, or inherited child processes.\"；\"Do not serialize an entire suite merely because one fixture lacks isolation.\"\n\n### B.2 性能七步\n\n1. **定范围**：读 AGENTS/architecture/testing/defensive-patterns，约定五项——可见终点、负载范围、资源约束、可接受行为差异、**停止规则**。后端与浏览器端到端分开：\"a fast history iterator or Client fold does not prove fast transport, paint, scrolling, or input response\"；本机开销须排除 model/网络延迟并声明。\n2. **核对确切当前 base**（merged diff / 源头 / 测试 / 已解决线程）；PR 正文可能描述已废弃实现，历史证据 \"not authority to reintroduce their implementations\"。\n3. **Survey 用户路径 → 排序候选**：冷启动与首读 / 多轮与工具重型历史 / 首绘·滚动·翻页·激活隐藏视图 / 流式与重连；区分独立成本驱动力（bytes / events / records / deltas / turns / tools / children / DOM nodes）。每个候选须写明：生产消费者、重复工作、期望复杂度、最小可伪证干预、必须稳定的行为。\n4. **先建真实合成基准**：扩展现有 required lane，不另立基建；只能提取**聚合**负载特征。\n5. **写 measurement card 后才实现**；Node 测构建后 JS（plain Node），浏览器用构建产物 + 支持的 profile；\"Do not add a production export solely for measurement or copy the algorithm into a “benchmark implementation.”\"；冷样本用 fresh child + 私有临时 root，warm 显式保留 cache，两侧输入/校验/完成条件一致。\n6. **先证回归再删工作**：改前跑未优化负载，存「命令、revision、runtime/platform、fixture 维度、原始值、裁决」；缩小到仍触发真瓶颈，再排可伪证假设。\n7. **一次一个因果因子**，重跑聚焦场景 + 端到端父场景，必须 negative control：\"the tightened assertion fails on the original implementation or a controlled reintroduction of the targeted cost.\"\n\n**measurement card 七字段（逐字）**：\n\n| 字段 | 要求 |\n|---|---|\n| User operation | \"Exact action and externally observable completion condition\" |\n| Workload | \"Fixed dimensions, distributions, construction seed/constants, and why they exercise ordinary and tail use\" |\n| Entry path | \"Production calls/composition and built artifacts; mocked external boundaries\" |\n| Clock | \"Included setup, cold/warm state, timing start/end, and excluded costs\" |\n| Memory | \"Reachable endpoint objects, baseline, GC policy, retained versus transient limits\" |\n| Verdict | \"Raw samples, chosen aggregate, calibrated absolute/ratio/memory limits, and negative control\" |\n| Behavior | \"Owning functional tests/snapshots and permitted minor differences\" |\n\n**不算证据清单（完整）**：怀疑的循环 / 未用缓存 / 大文件（\"A suspicious loop, unused cache, or large file alone is not evidence of a bottleneck.\"）；历史迭代器或 Client fold 快不代表传输、绘制、滚动、输入响应；\"Node folds, fake DOMs, and custom heartbeat events alone cannot establish browser responsiveness.\"；\"A parse-and-discard baseline is not comparable with validated retained history.\"；未区分 merged / closed-unmerged / superseded / estimated / newly-measured 的历史 PR 数字；调阈值——\"Do not widen a budget or select a lucky run to hide a regression.\" 且 \"A threshold so generous that the regression passes is not protection; a budget below a verified noise floor is not reliable either.\"；手工浏览器诊断**无阈值**，浏览器预算须先在真实 CI runner 重复测量才可落为源码常量。另一条底层原则：\"Faster execution with unbounded retention is not an automatic win.\"\n\n**隐私红线（逐字）**：\"Never copy prompts, outputs, paths, identities, IDs, credentials, recordings, or recognizable snippets into fixtures, logs, screenshots, PRs, or artifacts. Generate fixed inputs from reviewed constants; no benchmark depends on the user's home, ambient repository, network service, or private data.\"\n\n### B.3 CI 可靠性：分类与防护\n\n先建模拓扑（可重叠）四层：同文件测试 / 不同 Vitest 文件或 worker 进程 / 同 job 内独立进程 / 共享一台宿主的不同 Actions job。每个已获取资源须点名：owner、原子分配机制、可观测就绪信号、登记清理、静默完成信号。\n\n| 类别 | 防护 |\n|---|---|\n| 并发/隔离 | \"Use the resource owner's allocator instead of checking availability and claiming it later.\"；不因单个 fixture 串行整套 |\n| 端口/网络 | 回环 `listen(0)`，服务报 listening 后才读地址；\"Never scan for a free port and bind it later.\" |\n| 共享路径/资源 | `mkdtemp` per-test 私有根；db/socket/session/输出唯一命名空间；必须不存在时 exclusive creation；录制标识与临时地址分离并在 fixture 内翻译 |\n| 进程全局态 | `process.env`、`cwd`、fake timers、locale/timezone、module mocks、registries、console hooks、`globalThis`、global `fetch` 拦截 = 独占可变资源；优先注入依赖；必须改时 capture 原值存在与否 → 恢复原状 → 立即登记 → `try/finally` 最小作用域 → `afterEach` 兜底 → 只拦最窄目标请求 |\n| 平台语义 | 回写仅在断言容忍回写失败时安全；NTFS 100ns 滴答不给分数毫秒，依赖回写时取 fresh read；Windows 环境变量名大小写不敏感；Windows 句柄异步释放 → 按实测争用做有界重试；无 POSIX 权限/信号语义 → 显式平台 skip 并注明理由 |\n| 超时预算 | `describe`/case timeout 覆盖 runner 的 `--testTimeout`（低于 lane 预算即收窄 CI 已给的）；进程创建型套件取 lane 预算；hook 预算随 test 预算同升 |\n| 同步 | \"A fixed sleep is not evidence that setup completed or cleanup settled.\"；等显式就绪事件/握手/状态转移/自有 promise；deferred/barrier 钉住竞态；\"Use a timeout only to bound a wait, never as the condition that makes the assertion correct.\"；不断言调度器顺序 |\n| 释放到静默 | 获取后立即登记清理；停止新回调、解绑监听、恢复全局钩子、终止自有工作，并 await 子进程退出/服务关闭/worker 终止；\"Calling `abort()`, `close()`, or `kill()` without awaiting the owned completion signal is incomplete teardown.\" |\n\n**「可靠」的判定（不是「多跑几次都过」）**：① 修复前能观察到普通回归失败，新 guard 临时引入被拒用例能观察到预期失败；② 竞态用 barrier 证重叠——\"repeated execution alone is not a race test\"；③ 端口/共享路径/子进程类改动须并发跑独立进程验证跨进程隔离；④ fixture 自设 deadline 时先断言无 signal/timeout 结束子进程；⑤ 验证外部状态/事件/文件/日志/退出/释放而非组件自报；⑥ \"Stress runs supplement a deterministic regression; they do not replace one.\"；⑦ 证据按风险配：全局变更→恢复证据，生命周期/子进程→静默 teardown 证据，共享路径→并发独立进程证据，新 guard→negative control。报告 \"do not describe retries, skipped tests, or pending CI as passing\"。\n\n**反模式（逐字，八条禁令）**：\"increasing a timeout without identifying the awaited state; adding retries; making all files serial; swallowing an error or unhandled rejection; weakening an assertion; normalizing away unstable behavior; adding a sleep before cleanup or assertion.\" 例外：\"Retries remain valid for documented transient external-provider tests under the real-API policy. Keep that exception at the external boundary.\"；\"Restoring a budget is not masking.\"\n\n**延伸阅读**：`dsh-ci-test-reliability` 引用的 `references/ci-flake-diagnosis.md`（诊断既有 flake 的只读工作流）未读。\n\n## 报告 C：写作规范与推理痕迹\n\n**源文件**：`.agents/skills/dsh-prose-standard/SKILL.md`（含 `references/examples.md`、`references/recall-batteries.md`）、`.agents/skills/dsh-trim-cot-leakage/SKILL.md`\n\n### C.1 定位\n\n- **prose-standard**：决定该写多少、写在哪、按位置必须覆盖哪些契约（不够要补写）——\"This is not a one-way shortening pass.\"\n- **trim-cot-leakage**：清掉视角停在「写作会话」而非仓库的推理残留（失效引用／变更叙事／对已离场评审辩解）。\n- 两者是配套关系：trim 把 prose-standard 的 complete-proposition 规则作为前置依赖引用；单独用 trim 会过度删减，故后者专列 overcorrection traps。\n\n### C.2 prose-standard 核心原则（逐字）\n\n1. \"Write enough to preserve the contract, then remove reasoning transcripts, repetition, and decoration.\"\n2. \"A smaller word count alone is not an improvement.\"\n3. \"One explanation has one home; essential contract facts may repeat locally.\"\n4. \"Keep non-obvious rationale when omitting it could plausibly cause misuse or an incorrect simplification.\"\n5. \"Comments describe non-obvious contracts or rationale that code cannot express; they do not restate what code already implies.\"\n6. \"Keep a complete local contract at the point of use\"\n7. \"treat wording as behavior\"\n8. \"This is not a one-way shortening pass.\"\n\n### C.3 prose-standard 规则\n\n**契约判据**：caller／callee／implementer／producer／consumer 依赖的 obligation、invariant、precondition、postcondition、compatibility promise；判据是「caller 推不出才写」。\n\n**完整命题五要素**：actor and action；condition, timing, and ordering；modality（must / may / never）；negative guarantee and exception；ownership, side effect, failure mode, and consequence。修剪前提：\"Remove adjectives, repetition, and narration only when every factual clause survives\"。\n\n**按位置必须覆盖**：Public JSDoc（return distinctions、throws/rejections、side effects、ownership、timing、cancellation、durability）；Internal comments（invariants、race ordering、security boundaries）＋\"Delete control-flow narration and code restatement\"；其后依次点名 Module comments / Tests / Cookbooks / READMEs / Agent Notes / Postmortems / Skills / Examples / Prompts / Diagnostics 共 11 类（如 Tests 只解释 non-obvious test design，删 walkthroughs；Diagnostics 要点名 failing subject or path、violated rule、correction）。\n\n**六分类动作**：keep, add, trim, restore, restructure, or defer；\"do not manufacture edits to satisfy a deletion target\"。borderline 定义 = 至少两版都满足完整命题、且本 skill 未化解取舍。\n\n**反例对（`references/examples.md`）**：把 \"serializes writes per session, flushes buffered events before disposal resolves, and reports backend failures\" 砍成 \"serializes persistence\"；\"normalizes provider errors\" 丢光 failure categories；删掉 \"Throws if initialization has not completed...\" 即丢 caller-visible contract；收尾判据 \"A package README is not a backlog dump.\"\n\n**误报家族（逐条点名）**：instrumental \"used to\"（the key used to sign requests）、`/v1/` 协议路径、\"This PR\" 出现在流程文档、本版本 vs 本版、runtime \"today\"。\n\n### C.4 trim-cot-leakage 规则\n\n**定义（逐字）**：\"Chain-of-thought leakage is prose whose vantage is the authoring session rather than the repository\"。\n\n**单测判定（逐字）**：\"could a reader at HEAD, with no access to any session transcript, PR thread, or uncommitted draft, resolve every reference and verify every claim?\"；\"resolvability only clears this skill's bar\"（在 README/docs/JSDoc 等 current-state 面仍属变更叙事）。\n\n**修复方式（逐字）**：\"The fix is never deletion alone when a passage carries factual clauses — restate each so it stands at HEAD, then delete the transcript around it; a passage carrying none (an audit code, control-flow narration) is deleted outright.\"\n\n**八类泄漏**：① 死设计会引用（`(decision 7)`、`(audit C2)`、`design §4.7`、phase labels 如 T4/W3/P-I）② stack/PR 视角（\"a later PR in this stack\"）③ 变更叙事与版本戳（\"used to\"、\"no longer\"、\"this cut\"、\"today\"）④ review choreography（\"Rejected in review:\"、draft ordinals）⑤ 为评审辩解（\"the cast is safe — it simply…\"）⑥ 复述与推导记录（\"first we X, then we Y\"、test walkthroughs）⑦ hedges（\"probably fine for now\"、\"should be enough\"）⑧ 作者语言滑落（端／设计稿／`---- 私有 ----` 混进英文 prose）。\n\n**每条给「改成什么」**：固定回归写现在时反事实 \"without X, Y happens\"；延期挪 TODO/issue；hedge 提升为 TODO/FIXME 或写真实上界。\n\n**keep 白名单（不得误删）**：issue 引用 `#1470`、`TODO(name)`、suppression 理由（oxlint-disable / coverage-ignore / 空 catch）、**measured 界**（\"the provenance word 'measured' is load-bearing\"）、runtime old/new、外部标准 §、note 的 Alternatives-considered。\n\n**边界（逐字）**：\"the §-ban covers uncommitted internal drafts, not external standards or committed docs that own their §-numbering.\"\n\n**探针阈值与用法**：`rg --hidden` 且排除 glob 必须写在最后；自然语言行加 `-i`（含 `\\bT\\d\\b` 的首行保持大小写敏感）；短语加词边界（\"`\\bthis PR\\b` must match 'this PR adds' without matching 'this project'\"）；每个探针先命中已知正例、再拒绝近邻负例才能信；\"The batteries are probes, not the definition\"。\n\n**流程**：显式 scope（缺失就停下报告，不自行推断仓库级）；永不动 `vendor/` 与 `.agents/notes/archived/`；**owner-first**（\"Edit the owning source or scenario first, then regenerate every derivative\"）；删前枚举命题并查 overcorrection traps（把义务翻成背书、假设升格为已交付、删真事实、丢 provenance）；验证重跑只允许 sanctioned keeps。\n\n### C.5 可迁移点（原报告）\n\n**个人**：注释先问\"caller 推不推得出\"，推得出的分支一句不写；文档一事实一个 home、局部留契约＋外链理由；commit/PR 正文不写\"本轮修订/评审要求改\"；与 AI 协作时说\"只保留契约、删掉推导\"比\"精简点\"有效；\"A rewrite with one proposition-preserving answer is not borderline\"说明别让 AI 处处提问——交互时给 2–3 个可行版本＋推荐＋事实差异。\n\n**工具**：8 类泄漏可落成 rg 探针批（官方自己就这么用），在 SSiD 里是最易实现的自研检查门（lint 插件或 commit-msg / CI gate）；**探针必须带正负例校准 + 白名单，否则误报会摧毁规则可信度**；可落地门禁还有「跨文件引用必须在 HEAD 可解析」「禁 indexical」「prose 预算」「双语成对最小同步」；最强一条是 owner-first，与工作区铁律 5「双处声明」同源；`examples.md` 的 over-trimmed 版可直接当负例回归语料。\n\n## 报告 D：审查、简化与提交\n\n**源文件**：`.agents/skills/dsh-code-review/SKILL.md`、`.agents/skills/dsh-find-simplifications/SKILL.md`、`.agents/skills/dsh-pre-push-checks/SKILL.md`\n\n### D.1 定位（逐字）\n\n- code-review：DSH PR 审查导向器——接到仓库既有标准（AGENTS.md、防御性模式、ADR、质量门），并补上代码本身看不出的检查。\n- find-simplifications：把「找简化点」的宽泛请求变成有证据的 Agent Note，真正删除/折叠既有表面积。\n- pre-push-checks：推送/标 ready 前，选出覆盖本次 diff 的**最小**检查集，而非反射式跑全量套件。\n\n**共同元原则**：三者都声明自己是导向不是清单——\"This skill is guidance, not a complete checklist.\"（simplifications 版为 \"It is guidance, not a checklist\"）；pre-push 的等价声明是 \"There is no universal local baseline beyond the hooks.\"\n\n### D.2 code-review\n\n**顺序**：核对 checkout 与分支 → 验证 live base/exact head → 跑 `pnpm --silent run change-scope --base \u003cverified-base-ref>` → **再**读 diff 与足量周边码 → 按 SSoT 清单逐项过（AGENTS.md、packages/AGENTS.md、defensive-patterns.md、testing.md、Agent Notes、i18n）；该报告只给路径与脏层，\"does not replace semantic review\"；retarget/merge 后重建 base 并重跑范围报告。\n\n**优先级（逐字）**：\"Prioritize correctness, lifecycle, security, and broken required behavior over style; **a short review with one substantiated blocker is better than a list of nits.**\"\n\n**分级**：7 条 Blocking requirements（新增文案必须语义审查；文档与代码同 diff 同步；核心类型与 type-equiv；注册可清理；不变量伴生必须语义化；必需证据存在；客户端 UI 文案归 locale）+ 一长串 Manual checks（接口两侧契约、生命周期与并发、能力与消费者匹配、范围与必要性、配置默认、模型视角、denial 路径、借用 vs 拥有、边界覆盖最终操作、真实入口路径、测试强度与可靠性、不变量负向控制、Agent Note 与已发布现实、transcript、双语文案）。\n\n**分级处置（逐字）**：\"Separate blockers from suggestions and omit issues already enforced by a green gate.\" 局部缺陷 inline 贴最紧 diff 范围，跨切面用 PR 级评论；每条给 defect / location / impact / evidence。无合理关系的不变量伴生须整体删除（export、构建入口、专用测试）并在 README 记 package 专属理由：\"Reject empty installers and invented checks\"。\n\n**两条边界（逐字）**：\"Automated checks do not establish those properties.\"；\"Coverage is necessary but not evidence that the scenario is correct.\"；对既定决策：\"Treat disagreement with an Agent Note as a design discussion, not an automatic veto.\"；收到 review 时 \"verify each claim and fix or rebut it on technical grounds without performative agreement.\"\n\n### D.3 find-simplifications\n\n**判据（逐字）**：\"A strong simplification removes, folds, or demotes something real and has clear evidence that the current design costs more than it buys\"；取舍 \"prefer a few well-proven candidates over a pile of thin guesses\"；\"Do not let the first good candidate stop the survey.\"；替换净值 \"A wrapper that relocates the same complexity is not a win.\"\n\n**怎么找**：先读 AGENTS.md 的 pre-release stance 与两条 doctrine（tests-are-not-golden-truth、Agent Notes-are-not-golden-truth）与 architecture.md，**先标出有意架构与 protected seam**；用并行 subagent 分域（agent loop/session log、ACP+UI、LLM/tools/prompt、bash/工具执行、packages/scripts/tests），\"require evidence, not guesses\"，从生产代码最大 delta 起步；证据法为先 `rg` 精确 symbol / event name / config key（`.name(` 与 `name(` 两写）/ wire string，再读 call sites；消费者分 production / non-production / ambiguous 三类。\n\n**非显而易见的强候选**：无生产消费者的公共方法/事件/配置项/注册通知/包/持久事件；\"Tests or docs are the only consumers, and the behavior they pin is not load-bearing.\"；\"Two representations mirror the same fact, especially across durable session events and transient `agent/*` events.\"；seam 有所有实现都必须支持却无人用的方法；独立 package 只服务测试并增加发布开销；推测性产品通用性（multi-session、background job rosters、live registry invalidation、tool-owned UI rendering）；只为保护无人调用 API 的不变量/回滚/期望输出；手写代码重实现了 Node builtin 或维护良好的 npm 包且替换能连实现与专用测试一起删。放宽条款：\"The simplified behavior may differ slightly, but the new behavior is still reasonable and easier to explain.\"\n\n**反模式**：① \"Thin candidates are not enough for an Agent Note: deleting one typo, running `knip` once, removing an intentionally documented backend/adapter, or flagging \"this looks complex\" without call-site proof.\"；② 四条 reject/downgrade——有生产调用方（属功能决策非清理）／被已实施 Agent Note 或来之不易的防御模式证成／只造成无关 churn 而不减公共 API 或必需行为／想法对但太小（改加定向 TODO/FIXME/XXX，\"Do not add TODOs for speculative complaints or for behavior that needs an Agent Note-level decision.\"）；③ \"Treat dual LLM adapters as intentional by default.\"，不把 twin adapter 或 persistence seam 当「低成本」删；④ 依赖替换须 \"beat the recorded rationale, not just cite the policy\"；⑤ 只有完全不出现在生产码/配置/格式/迁移中的特性才算 full supersession，否则留 partial 并交叉链接。\n\n### D.4 pre-push-checks\n\n**选择律（逐字）**：\"Every behavior change needs the narrowest available test or purpose-built check that would fail for its regression; add broader checks only for surfaces the diff actually reaches.\"\n\n**为什么本地不跑全量**：hooks 故意窄（pre-commit 只修 staged lint、查 staged 空白、守 vendor 元数据；pre-push 只跑增量 typecheck），\"CI owns exhaustive coverage and the platform matrix.\"\n\n**怎么决定**：确认 checkout/分支 → 验证 live PR base 或 stack parent（该命令 \"never guesses or fetches a base\"）→ `change-scope --base \u003cverified-base-ref>` → 按变更类型取最窄证据；merge 新 base 后重跑报告并**只重跑被 merge 失效的检查**。\"Test selection and coverage selection are separate.\"：覆盖率须显式声明被测源范围；`vitest related` 发现不了只经配置、动态加载、子进程、worker、构建产物、外部 provider 到达的行为，须显式点出拥有者测试。\n\n| 变更类型 | 应跑证据 |\n|---|---|\n| 包/脚本行为 | 拥有该行为的 Vitest 文件或 focused test name；共享契约加相邻包测试；仓库级留给 CI |\n| Remote mock 类型 | `pnpm run typecheck`（unbuilt `any` 只是 \"explicit local fallback, not strict evidence\"） |\n| 文档/Agent Note/catalog | `pnpm run doc-sync`，文档工作流要求时 full lint |\n| 模型/编辑器/CLI/终端可见输出 | 拥有该输出的 focused keyless snapshot 或真实可运行示例 |\n| 期望输出位置 | session 往返 → 顶层 `snapshots/`；其余 → 测试旁 `tests/expected/` |\n| Profile/配置位置 | 跨包 → `apps/cli/tests/profiles/`；包内 → 该包 `tests/fixtures/`；用户 overlay → `apps/cli/config/examples/` |\n| manifest/公开导出/构建配置/bin 入口 | `pnpm run build` + hygiene + 构建产物 smoke |\n| 真实 provider/agent | 相关 `pnpm run test:e2e`（有凭据时）；\"never print secrets\" |\n\n**全量本地排练**仅三种情形：用户明确要求、诊断 CI 失败、变更广到没有更窄集合可信；且 \"Use the current workflow and package scripts as the inventory; do not recreate the removed `check:pre-push` aggregate.\"\n\n**严禁**：重复已通过的检查（\"do not run typecheck immediately before pushing solely to duplicate the pre-push hook\"）；用 `--passWithNoTests`、降阈值、缩 include 掩盖未覆盖文件；\"Raw `--force` is never allowed.\"（rewrite 用 `--force-with-lease=\u003cbranch>:\u003cobserved-oid>`）；push 后指望 CI 不同（\"Do not push and hope CI differs.\"）；把平台失败含糊成环境问题（须记录精确命令、失败测试、平台差异，绕过 hook 仅在用户同意时）；`gh stack sync` 成功即称 stack ready；`gh pr checks` 报 \"no checks reported\" 就怀疑基础设施——PR 为 CONFLICTING/DIRTY 时 GitHub 不建 pull_request run，\"total_count: 0\" 即冲突，空提交 / `--allow-empty` / draft 切换 / revert 反弹都无效且污染历史。\n\n### D.5 可迁移点（原报告）\n\n**个人**：① 提交前自检按「回归时会失败的最窄测试」选证据，不习惯性全量；hook 故意窄是设计。② 不重复已通过的检查——重复不产生信息，只产生虚假确定性。③ 让 AI 审查的提示词：先给 base/head，要求**先出范围报告再读 diff**；要求\"少而实\"；blocker 与 suggestion 分栏、跳过已被绿灯门禁覆盖者；每条给 defect/location/impact/evidence；明说对已实施决策的分歧按设计讨论、不许一刀否决。④ 提简化请求的提示词：先列有意架构与 protected seam，分域并行调查并要求 call-site 证据，明令禁止 thin candidate 与「看起来复杂」。⑤ 收到 review：逐条验证，\"fix or rebut it on technical grounds without performative agreement\"。⑥ rewrite 纪律：lease 保护；rewrite 后旧 commit hash 与评论锚点不算证据，须重查 heads/线程/检查。\n\n**工具**：① 移植 `change-scope`（显式 base → 变更路径 + 受影响包与脏层，作选检查的唯一入口；绝不猜 base）。② 固化「diff → 检查集」映射为脚本，输出应跑命令清单；全量排练需显式开关，缺省不跑。③ 覆盖率绑定门禁：选中测试必须声明覆盖源范围，禁 `--passWithNoTests` / 降阈值（可接 SSiD 的 L1 typecheck+test 门槛）。④ 「消费者证据」门禁：新增导出/配置项/事件须能列出生产调用方，否则拒收或降级为带稳定标签的 TODO。⑤ 可机械化的文档/文案门禁：对照 `verify-export-jsdoc`、`verify-doc-budgets`、`verify-client-ui-i18n`、`verify-cordis-config`、`doc-sync`。⑥ 不变量与负向控制：新增守卫须证明存在可独立分叉的观测，且每条变更的验收路径证明会拒绝无效输入。⑦ 推送规程：`--force-with-lease` 强制、raw `--force` 禁；「无检查运行」先读 mergeable 再怀疑基础设施。⑧ 决策记录：非平凡变更同 PR 带 Agent Note（proposed→implemented→archived、归档冻结、一事实一归属）。\n\n**三份报告的公共骨架（原报告结语）**：「**先证据后判断**——范围报告先于阅读，call-site 先于结论，最窄证据先于全量；把「必须改」与「可以不改」显式分栏，把「已由绿灯门禁覆盖」排除在讨论之外。」\n\n"},{"file":"工程范式/2026-09-10-DSH工程方法论学习笔记.md","group":"工程范式","date":"2026-09-10","slug":"DSH工程方法论学习笔记","title":"DSH 工程方法论学习笔记（2026-09-10）","tags":["dsh-prose-standard","dsh-trim-cot-leakage","dsh-code-review","dsh-find-simplifications","dsh-pre-push-checks","dsh-speed-up-perf","dsh-ci-test-reliability","dsh-doc","dsh-archive-agent-notes","dsh-translate-docs","dsh-merging-stacked-prs"],"summary":"「先证据后判断」展开成三条次序： 1. 范围报告先于阅读代码——先跑 change-scope，再读 diff。 2. call-site 先于结论——没有生产调用方证据，就不算「可删」。 3. 最窄证据先于全量——回归时会失败的那个测试，胜过整套跑一遍。","bytes":15744,"lines":161,"body":"# DSH 工程方法论学习笔记（2026-09-10）\n\n> 目的：用户背景是「用自研 SSiD 做 AI 原生中台服务开发」，学习目标有两个——① 升级个人工作方法论；② 升级 SSiD 工具本身。\n> 素材：DSHfork @ `origin/master`（`c291e7961a`）的 8 个 skill 全文，由 4 个 subagent 精读后交叉核对；原文引用均逐字核对。\n> 配套：结构与规模（12 skill / 960 篇 Agent Notes / 215 脚本）见 `2026-09-10-DSH官方工程化范式调查.md`，本篇只讲**方法论与可迁移点**。\n\n> 状态：记录（推断 · 2026-09-12）\n\n## 一、八条核心方法论（跨 skill 提炼）\n\n| # | 原则 | 原文依据 |\n|---|---|---|\n| 1 | **证据驱动**：任何结论须有可复现证据 | \"A suspicious loop, unused cache, or large file alone is not evidence of a bottleneck.\" |\n| 2 | **最小必要**：最窄的测试、最小的改动、最小检查集 | \"Every behavior change needs the narrowest available test or purpose-built check that would fail for its regression.\" |\n| 3 | **一个事实一个家** | \"Each fact has one home: the tier whose job it is; elsewhere, link there.\" |\n| 4 | **决策必留替代方案** | \"A decision recorded without what it beat invites re-litigation — the failure Agent Notes exist to prevent.\" |\n| 5 | **当前状态而非变更史** | \"Document current state, not change history.\" |\n| 6 | **机器强制优于人类自觉** | Gates 体系本身（约 50 个 `verify-*` 在 CI 里拒绝违规） |\n| 7 | **资源点名**：owner / 原子分配 / 就绪信号 / 清理登记 / 静默完成 | \"Use the resource owner's allocator instead of checking availability and claiming it later.\" |\n| 8 | **反模式显式化** | 明文列出\"不得作为根因修复\"的手段（见 §2.4） |\n\n### 1.1 三条共享次序（三个 skill 的公共骨架）\n\n「先证据后判断」展开成三条次序：\n\n1. **范围报告先于阅读代码**——先跑 `change-scope`，再读 diff。\n2. **call-site 先于结论**——没有生产调用方证据，就不算「可删」。\n3. **最窄证据先于全量**——回归时会失败的那个测试，胜过整套跑一遍。\n\n### 1.2 一条容易被忽略的纪律\n\n把「必须改」与「可以不改」显式分栏，并把已被绿灯门禁覆盖的问题排除在讨论之外——重复检查不产生信息，只产生虚假确定性。\n\n## 二、五组 skill 的方法论\n\n### 2.1 写作：`dsh-prose-standard` + `dsh-trim-cot-leakage`\n\n**两者关系**：前者管\"写够、写在哪\"，后者管\"删什么\"；单独用 trim 会过度删减。\n\n**契约判据**：只写 caller **cannot infer** 的内容（义务、不变式、前后置、兼容承诺）。\n**完整命题五要素**：actor and action ／ condition–timing–ordering ／ modality（must·may·never）／ negative guarantee and exception ／ ownership–side effect–failure mode–consequence。\n**修剪前提**：\"Remove adjectives, repetition, and narration only **when every factual clause survives**\"。\n**六类动作**：keep / add / trim / restore / restructure / defer；\"do not manufacture edits to satisfy a deletion target\"。\n**两条反直觉规则**：\n- \"A smaller word count alone is not an improvement.\"\n- \"Keep non-obvious rationale when omitting it could plausibly cause misuse or an incorrect simplification.\"\n\n**CoT 泄漏的定义**：\"Chain-of-thought leakage is prose whose vantage is the authoring session rather than the repository\"。\n**单测判定**（可直接当工具用）：\n> \"could a reader at HEAD, with no access to any session transcript, PR thread, or uncommitted draft, resolve every reference and verify every claim?\"\n\n**修复方式不是单纯删除**：\"The fix is never deletion alone when a passage carries factual clauses — restate each so it stands at HEAD, then delete the transcript around it\"。\n**八类泄漏**：死设计会引用（`(decision 7)`、`design §4.7`、阶段标签）／stack/PR 视角／变更叙事与版本戳（used to, no longer, this cut, today）／review choreography／为评审辩解／复述与推导记录／hedges／作者语言滑落。\n**keep 白名单**（不得误删）：issue 引用、`TODO(name)`、suppression 理由、**measured 界**（\"the provenance word 'measured' is load-bearing\"）、runtime old/new、外部标准 §、note 的 Alternatives-considered。\n**边界**：`§`-ban 覆盖**未提交草稿**的编号，不覆盖已提交且自有编号的文档。\n\n### 2.2 审查与简化：`dsh-code-review` + `dsh-find-simplifications`\n\n**共同元原则**：\"This skill is guidance, not a complete checklist.\"（导向，不是清单）\n\n**审查顺序**：核对 checkout/分支 → 验证 live base/head → 跑范围报告 → **再读 diff** → 按 SSoT 清单逐项过（AGENTS.md / defensive-patterns / testing / Agent Notes / i18n）。\n**分级**：7 条 Blocking requirements + 一长串 Manual checks；\"Separate blockers from suggestions and omit issues already enforced by a green gate.\"\n**审查质量主张**：\"Prioritize correctness, lifecycle, security, and broken required behavior over style; **a short review with one substantiated blocker is better than a list of nits.**\"\n**两条边界**：\"Automated checks do not establish those properties.\"；\"Coverage is necessary but not evidence that the scenario is correct.\"\n**对既定决策**：\"Treat disagreement with an Agent Note as a design discussion, not an automatic veto.\"\n**收到 review 时**：\"verify each claim and fix or rebut it on technical grounds without performative agreement.\"\n\n**简化的判据**：\"A strong simplification removes, folds, or demotes something real and has clear evidence that the current design costs more than it buys.\"\n**强候选**（非显而易见）：无生产消费者的公共 API/事件/配置项/包；只有测试或文档是消费者且其行为非承重；**同一事实的两份表示**（尤其是持久 session 事件与瞬态 `agent/*` 事件之间）；seam 有所有实现都必须支持却无人用的方法；独立 package 只服务测试；推测性通用性；只为保护无人调用 API 的不变量。\n**反模式**：\"Thin candidates are not enough for an Agent Note: deleting one typo, running `knip` once, removing an intentionally documented backend/adapter, or flagging \"this looks complex\" without call-site proof.\"\n**四条拒绝理由**：有生产调用方／被已实施 Note 或防御模式证成／只造成无关 churn／想法对但太小。\n**替换净值**：\"A wrapper that relocates the same complexity is not a win.\"\n\n### 2.3 提交：`dsh-pre-push-checks`\n\n**选择律**：\"Every behavior change needs the narrowest available test or purpose-built check that would fail for its regression; add broader checks only for surfaces the diff actually reaches.\"\n**为什么本地不跑全量**：hooks 故意窄，\"CI owns exhaustive coverage and the platform matrix\"。\n**变更类型 → 证据映射**（节选）：\n\n| 变更类型 | 应跑证据 |\n|---|---|\n| 包/脚本行为 | 拥有该行为的 Vitest 文件或 focused test name |\n| Remote mock 类型 | `pnpm run typecheck`（unbuilt `any` 只是 \"explicit local fallback, not strict evidence\"） |\n| 文档/Agent Note/catalog | `pnpm run doc-sync` |\n| 模型/CLI/终端可见输出 | 拥有该输出的 focused keyless snapshot |\n| manifest/公开导出/构建配置 | `pnpm run build` + hygiene + 构建产物 smoke |\n| 真实 provider | 相关 e2e（有凭据时）；\"never print secrets\" |\n\n**严禁**：重复已通过的检查（\"do not run typecheck immediately before pushing solely to duplicate the pre-push hook\"）；用 `--passWithNoTests`、降阈值、缩 include 掩盖未覆盖；\"Raw `--force` is never allowed.\"（rewrite 用 `--force-with-lease=\u003cbranch>:\u003cobserved-oid>`）；\"Do not push and hope CI differs.\"\n**全量本地排练**仅三种情形：用户明确要求／诊断 CI 失败／变更广到没有更窄集合可信。\n\n### 2.4 性能与可靠性：`dsh-speed-up-perf` + `dsh-ci-test-reliability`\n\n**性能七步**：定范围（含**停止规则**）→ 核对确切当前 base → survey 用户路径并排序 → 先建真实合成基准 → **填 measurement card 才动手** → 先证回归 → 一次一个因果因子 + negative control。\n**measurement card 七字段**：User operation（确切动作 + 外部可观测完成条件）／Workload（固定维度、分布、种子、为何覆盖常规与尾部）／Entry path／Clock（含与不含的耗费、冷热状态）／Memory（基线、GC 策略、保留 vs 瞬时）／Verdict（原始样本、聚合、标定限额、**negative control**）／Behavior（归属测试与允许差异）。\n**完成判据**：\"the tightened assertion fails on the original implementation or a controlled reintroduction of the targeted cost.\"\n**不算证据**：可疑循环/未用缓存/大文件；历史迭代器或 Client fold 快；\"Node folds, fake DOMs, and custom heartbeat events alone cannot establish browser responsiveness.\"；未区分 merged/closed/superseded/estimated/newly-measured 的历史数字。\n**另一条底层原则**：\"Faster execution with unbounded retention is not an automatic win.\"\n**隐私红线**：不得把 prompt、输出、路径、身份、ID、凭据、录制片段写进 fixture / 日志 / 截图 / PR；基准不得依赖 home、本地仓库、网络服务或私有数据。\n\n**CI 可靠性**：先建模拓扑（同文件／跨文件 worker／同 job 独立进程／共享宿主的多个 job），每个已获取资源点名五件东西。\n**关键防护**：回环 `listen(0)` 后等 listening 再读地址（\"Never scan for a free port and bind it later.\"）；`mkdtemp` per-test 私有根；进程全局态（env/cwd/fake timers/locale/module mocks/globalThis/global fetch）视为独占可变资源，改则 capture → 恢复 → 登记 → try/finally → afterEach 兜底。\n**同步纪律**：\"A fixed sleep is not evidence that setup completed or cleanup settled.\"；\"Use a timeout only to bound a wait, never as the condition that makes the assertion correct.\"\n**可靠 ≠ 多跑几次都过**：\"repeated execution alone is not a race test\"（要用 barrier 证重叠）；\"Stress runs supplement a deterministic regression; they do not replace one.\"\n**反模式清单**（八条禁令）：\"increasing a timeout without identifying the awaited state; adding retries; making all files serial; swallowing an error or unhandled rejection; weakening an assertion; normalizing away unstable behavior; adding a sleep before cleanup or assertion.\"\n**报告纪律**：\"do not describe retries, skipped tests, or pending CI as passing.\"\n\n### 2.5 决策记录：Agent Notes（详见调查文档 §2）\n\n三条最值得立刻用：\n1. **目录即状态机**：`{proposed,implemented,rejected,archived}/{class}/yyyy-mm-dd-title.md`，日期取主题首提日。\n2. **事实就地改，决策不可改**：\"Rewrite stale facts in place\" + \"never edited into a *different decision*\"。\n3. **归档即冻结**：归档后不可编辑、翻译、移动，也不再是当前行为的权威。\n\n## 三、可迁移清单\n\n### A. 个人工作方式（12 条）\n\n1. **砍掉强调通胀**：加粗只留给\"改变行为的那一句\"——我当前回复的加粗密度属于官方 slop 清单明列的反模式。\n2. **不写变更叙事**：文档里禁\"此前/现在/不再/已修订\"，历史归 commit。\n3. **不写 review choreography**：不写\"我上次错了/你纠正得对\"，直接陈述当前结论。\n4. **注释只在 caller 推不出时写**；写就写不变式、顺序、失败模式、负向保证。\n5. **性能动代码前先写停止规则 + measurement card**；一次只改一个因果因子；无 negative control 不算修好。\n6. **偶发 bug 先问宿主拓扑**（固定端口、可预测路径、时钟、全局态、子进程句柄），再谈业务代码；复现用 barrier 不用 sleep。\n7. **提交前按\"回归时会失败的最窄测试\"选证据**，不习惯性全量；不重复已通过的检查。\n8. **向 AI 提需求时给约束模板**：measurement card 七字段 / \"先出范围报告再读 diff\" / \"只保留契约删掉推导\"。\n9. **让 AI 审查时要求\"少而实\"**：blocker 与 suggestion 分栏、每条给 defect/location/impact/evidence、跳过已被绿灯覆盖者。\n10. **收到 review 逐条验证**，fix or rebut on technical grounds，不做表演式同意。\n11. **决策用四段模板**：Problem → Decision（现在时）→ **Alternatives considered（必填）** → Consequences。\n12. **不重复讨论已决事项**：决策变更用新记录取代旧记录并双向交叉链接。\n\n### B. SSiD 工具改造（8 项，按优先级）\n\n| # | 项 | 说明 | 成本 |\n|---|---|---|---|\n| 1 | **Agent Notes 状态机** | `docs/决策/` 加 `proposed/implemented/archived` 流转 + `rejected/` 目录；三行头 + `## Problem` 开头 + 强制 `## Alternatives considered` | 低 |\n| 2 | **`check-rules` gate**（待办 #5） | 参考官方一脚本一职责 + 配套自测 + 统一排编器；先把既有手册规则机械化（双处声明、BOM、vendor MD5、旧名残留） | 中 |\n| 3 | **CoT 泄漏探针** | 把八类泄漏做成 rg 探针批，挂 commit-msg 或 CI；**探针必须带正负例校准 + keep 白名单**，否则误报摧毁规则可信度 | 低 |\n| 4 | **插件模板增两份卡** | `perf-card.md`（measurement card 七字段）+ `test-isolation.md`（资源点名五栏）；新插件入库连带隔离声明（呼应铁律 6） | 低 |\n| 5 | **\"消费者证据\"门禁** | 新增导出/配置项/事件须能列出生产调用方，否则拒收或降级为带稳定标签的 TODO | 中 |\n| 6 | **owner-first 纪律** | 先改 owning source（源 JSDoc/模板），再重生成派生件——与铁律 5「双处声明」同源 | 低 |\n| 7 | **提交纪律落地** | `--force-with-lease` 强制、raw `--force` 禁；报告不把 retry/skip/pending CI 说成通过 | 低 |\n| 8 | **文档字数预算** | 给手册/README 设 ceiling；超限按 relocate → condense → raise，且 raise 需说明理由 | 低 |\n\n## 四、立即应用（本周可做）\n\n1. **我自己**：从下一条回复起，加粗密度降到\"只标改变行为的那句\"；文档不写\"此前/修订/我上次错了\"。（§3.A.1–3）\n2. **SSiD 决策目录**：建 `proposed/implemented/archived/rejected` 四目录，把现有 `docs/决策/` 按状态归档一批，并给新决策套四段模板。（§3.B.1）\n3. **一条探针先跑起来**：从八类泄漏里挑最容易命中的两类（变更叙事 + 死设计会引用）写 rg 探针，带正负例校准，先手动跑。（§3.B.3）\n4. **提需求模板化**：下次让我做性能或排查类任务时，直接用 measurement card 七字段当约束。（§3.A.8）\n5. **提交前自检**：按\"回归时会失败的最窄测试\"选检查项，不跑全量。（§3.A.7）\n\n## 附：素材位置\n\n- 8 个 skill：`DSHfork/.agents/skills/{dsh-prose-standard,dsh-trim-cot-leakage,dsh-code-review,dsh-find-simplifications,dsh-pre-push-checks,dsh-speed-up-perf,dsh-ci-test-reliability,dsh-doc,record-browser-gif,dsh-archive-agent-notes,dsh-translate-docs,dsh-merging-stacked-prs}/SKILL.md`\n- Agent Notes 机制：`DSHfork/.agents/notes/{README.md,AGENTS.md}`、`.agents/notes/implemented/AGENTS.md`\n- 文档标准：`DSHfork/docs/AGENTS.md`\n- 元样本（一篇真实 Note）：`DSHfork/.agents/notes/implemented/process/2026-09-06-evidence-driven-performance-skill.md`\n\n**未验证**：`dsh-doc` 中\"audience-first hierarchy\"的完整定义条目未被读取；`dsh-speed-up-perf` 引用的 `references/ci-flake-diagnosis.md` 未读。\n"},{"file":"工程范式/2026-09-10-DSH官方工程化范式调查.md","group":"工程范式","date":"2026-09-10","slug":"DSH官方工程化范式调查","title":"DSH 官方工程化范式调查（2026-09-10）","tags":["dsh-code-review","dsh-speed-up-perf","dsh-doc","dsh-pre-push-checks","dsh-archive-agent-notes","dsh-ci-test-reliability","dsh-find-simplifications","dsh-merging-stacked-prs","dsh-prose-standard","dsh-translate-docs","dsh-trim-cot-leakage","ssid-release","0.1.0"],"summary":"关系：AGENTS.md 说规则 → Skills 教怎么做 → Gates 检查有没有做 → Agent Notes 记录为什么这么做。","bytes":8898,"lines":127,"body":"# DSH 官方工程化范式调查（2026-09-10）\n\n> 目的：DSH 的开发过程本身是 agent 驱动的（仓库大量 Agent Notes、AGENTS.md、skill 体系），其工程范式对 SSiD 的规范建设有直接参考价值。\n> 素材来源：`DSHfork` @ `origin/master`（`c291e7961a`，2026-09-10）；查询命令见文末附录。\n> 状态：**事实已逐条查证；「可移植清单」中的成本评估为判断，未实施**。\n\n## 1. 三套机制总览\n\n| 机制 | 层次 | 规模（实测） | 强制方式 |\n|---|---|---|---|\n| **AGENTS.md** | 规范文本 | 根 + 各包 + 各目录多份 | 靠阅读与自觉 |\n| **Skills** | 方法论 | 12 个（9–60 KB/个） | 靠触发调用 |\n| **Gates** | 执行 | 215 个脚本（约 50 个 `verify-*`） | **机器拒绝（CI 红）** |\n| **Agent Notes** | 长期记忆 | 960 篇英文主文档（含双语共 2921 文件） | 由 `verify-agent-note-*` 部分强制 |\n\n**关系**：AGENTS.md 说规则 → Skills 教怎么做 → Gates 检查有没有做 → Agent Notes 记录为什么这么做。\n\n## 2. Agent Notes（长期记忆）\n\n- **位置**：`.agents/notes/`\n- **状态目录**：`proposed` / `implemented` / `archived` / **`rejected`**\n- **规模**：英文主文档 proposed 21 篇、implemented 310 篇、archived 629 篇（合计 **960 篇**）；含 `.zh.md` 与 `.i18n.yaml` 共 2921 个文件\n- **写入规则**（AGENTS.md 原文）：\"Non-trivial changes MUST include an Agent Note in the same PR; only mechanical/local edits are exempt\"\n- **归档策略**：\"Archived notes are frozen: never edit or treat them as current authority\"\n- **强制**：`verify-agent-note-format`、`verify-agent-note-classification`、`verify-archived-agent-notes` 三个 gate 检查格式与分类\n\n**值得注意**：连**被否决的方案**也保留（`rejected/` 目录），供后人避免重复提出。\n\n## 3. Skills（方法论）\n\n- **位置**：`.agents/skills/\u003cname>/SKILL.md`（单文件，YAML frontmatter：`name` + `description`）\n- **时间线**：最早 `dsh-code-review`（2026-06-13，早于 0.1.0 发布两个月）；最新 `dsh-speed-up-perf`（2026-09-06）；最近修改 2026-09-08（`dsh-doc`、`dsh-pre-push-checks`、`record-browser-gif`）\n- **清单与定位**：\n\n| skill | 定位 |\n|---|---|\n| `dsh-archive-agent-notes` | Agent Notes 新增/审计/裁剪/归档 |\n| `dsh-ci-test-reliability` | CI 并发、时钟、子进程、共享资源导致的非确定性失败 |\n| `dsh-code-review` | PR 审查：对齐本仓规范 / 防御模式 / ADR / 质量门 |\n| `dsh-doc` | 文档创建/重构/审计/迁移（受众优先层级、kind 映射 YAML 元数据） |\n| `dsh-find-simplifications` | 找非显而易见的简化机会（含冗余注释与重文档） |\n| `dsh-merging-stacked-prs` | stacked PR（A←B←C）落地 |\n| `dsh-pre-push-checks` | 推送前选**最小必要证据** |\n| `dsh-prose-standard` | 决定何处该有文档、何处该写注释（19 KB） |\n| `dsh-speed-up-perf` | 把\"再快点\"变成可复现的用户路径测量 |\n| `dsh-translate-docs` | 双语文档工作流 |\n| `dsh-trim-cot-leakage` | 清除\"推理痕迹泄漏\"（残留 `(decision N)`、审计项代码、未提交草稿 §N） |\n| `record-browser-gif` | 浏览器交互演示录为优化 GIF |\n\n### 3.1 两个样本的范式提炼\n\n**`dsh-pre-push-checks`**（10.4 KB）的核心主张：\n\n- 推送前**选最小必要证据**，\"without reflexively running the full repository suite\"\n- \"There is no universal local baseline beyond the hooks\"；\"CI owns exhaustive coverage and the platform matrix\"\n- 提供专用工具：`pnpm run change-scope --base \u003cref>`（计算 outgoing 变更范围，且\"never guesses or fetches a base\"）\n- 明确反模式：**\"Do not manually repeat a passing check merely because commit or push follows\"**\n- 测试选择与覆盖度选择分离：用 `--coverage.include` 把覆盖度量限定到受影响源文件\n\n**`dsh-speed-up-perf`**（12.2 KB，最新）的核心主张：\n\n- \"Turn a broad 'make it faster' request into reproducible user-path measurements and small, evidence-backed fixes\"；\"This is guidance, not a quota or a script\"\n- 先建立 scope（用户可见终点、负载范围、资源约束、停止规则），**backend 与 browser 端到端测量必须分开**\n- 候选排序需要\"production call site + 测量\"，\"A suspicious loop, unused cache, or large file alone is not evidence of a bottleneck\"\n- 实施前必须填 **measurement card**：User operation / Workload / Entry path / Clock / Memory\n- 隐私红线：不得把 prompt、输出、路径、身份、ID、凭据、录制片段写进 fixture / 日志 / 截图 / PR\n\n## 4. Gates（机器强制）\n\n- **位置**：`scripts/`（215 个脚本，其中约 50 个 `verify-*`）\n- **编排**：`scripts/run-gates.ts` —— \"Run local and CI quality gates with bounded in-process scheduling\"；每个 gate 有 `id` / `label` / 依赖关系\n- **聚合模式（Mode，17 个）**：`ci-primary`、`ci-linux-primary`、`ci-static`、`ci-lint-contracts-ready`、`ci-coverage`、`ci-bench`、`ci-snapshot`、`ci-artifacts`、`ci-consumers`、`ci-windows-blocking`、`ci-windows-complete`、`ci-windows-observational`、`node-compat`、`check-all`、`hygiene`、`doc-sync`、`doc-quick`\n- **组织约定**：一个脚本一个职责，多数配 `.spec.ts` 自测\n\n### 4.1 分类清单（举例）\n\n| 约束对象 | 脚本 | 拦住什么 |\n|---|---|---|\n| 文档 | `verify-md-links` / `-md-wrap` / `-doc-budgets` / `-doc-refs` | 死链、换行格式、字数超预算、文档引用失效 |\n| 双语 | `verify-translation-pairing` | 中英文档配对缺失 |\n| 包规范 | `verify-export-jsdoc` / `-package-readme-summaries` / `-readme-model-experience` / `-readme-limitations` | 导出无 JSDoc；README 必填章节缺失 |\n| 架构约束 | `verify-application-entrypoints` / `-cordis-config` / `-client-domain-graph` / `-no-bare-dispatcher` | 绕过 dsh CLI 的应用入口；裸插件未声明依赖；Client 域依赖越界 |\n| Agent 产物 | `verify-agent-note-format` / `-classification` / `-archived` / `-skill-invocation-metadata` | Note 格式/分类合规；skill 元数据完整 |\n| UI | `verify-client-ui-i18n` | 硬编码文案（必须走 locale 字典） |\n\n### 4.2 三个值得注意的设计\n\n1. **`verify-application-entrypoints` 是\"一切皆插件\"的执法者**：架构文档声称\"没有特权内核可改\"，此 gate 拒绝任何绕过 `dsh` CLI 的 Node 应用入口。**约束写在文档里是愿望，写进 CI 才是规则。**\n2. **README 有强制章节**：`-package-readme-summaries` / `-model-experience` / `-limitations` 分别校验三段必填内容，**包括 Known Limitations**——用机器强制诚实。\n3. **`verify-skill-invocation-metadata` 是自举的**：skills 体系自身也要过格式门。\n\n## 5. 可移植清单（对 SSiD 的价值）\n\n| 项 | 我们的现状 | 移植成本 | 优先级 |\n|---|---|---|---|\n| **Agent Notes 状态机**（proposed → implemented → archived + rejected） | `docs/决策/` 为平铺结构，无状态流转 | 低（约定 + 目录） | 高 |\n| **`check-rules` gate**（手册待办 #5） | 已有待办条目与检查项清单 | 中（脚本 + 编排） | 高 |\n| **\"最小证据\"提交纪律**（手册 L1/L2/L3 已接近） | 已分级，但无 `change-scope` 类工具 | 低（纪律）/ 中（工具） | 中 |\n| **measurement card 模板**（性能类改动） | 无 | 低（模板） | 中 |\n| **CoT 泄漏检查**（残留 `(decision N)`、未提交草稿 §N） | 无；我们的产出物常见此类自引用 | 低（检查脚本） | 中 |\n| **README 必填章节校验** | 手册 §9 有\"截图演示\"硬门槛；其余靠自觉 | 低—中 | 中 |\n| **skill 元数据校验** | `ssid-release` 等 skill 已存在，但无格式门 | 低 | 低 |\n\n## 6. 不可直接抄的部分\n\n这些 skill 与 gates 是**为 DSH 仓库量身定做**的：其中命令（`pnpm run change-scope`、`pnpm run doc-sync`、`pnpm run hygiene` 等）都指向它自己的工具链，`verify-*` 的检查对象也是本仓目录结构。**可搬的是方法论与组织方式，不是命令与检查内容。**\n\n## 附：证据与查询命令\n\n```sh\n# skills 清单与时间线\ngit -C DSHfork ls-tree --name-only origin/master .agents/skills/\ngit -C DSHfork log origin/master --diff-filter=A --date=short --pretty=format:'%ad' -- .agents/skills/\u003cname>\n\n# Agent Notes 规模\ngit -C DSHfork ls-tree -r --name-only origin/master .agents/notes/ | Measure-Object -Line\ngit -C DSHfork ls-tree --name-only origin/master .agents/notes/\n\n# gates 规模与编排\ngit -C DSHfork ls-tree --name-only origin/master scripts/ | Select-String 'verify-'\ngit -C DSHfork show origin/master:scripts/run-gates.ts\n\n# 架构约束原文\ngit -C DSHfork show origin/master:docs/architecture.md\ngit -C DSHfork show origin/master:packages/README.md\n```\n"},{"file":"工程范式/2026-09-10-DSH官方Gates拆解原始报告-E-配对与配置门.md","group":"工程范式","date":"2026-09-10","slug":"DSH官方Gates拆解原始报告-E-配对与配置门","title":"DSH Gates 双脚本精读报告","tags":["ssid-gates"],"summary":"- 配对定义 = 纯命名约定，不是 frontmatter：translationPairPaths(anchor) 由英文锚点推出三件套（L109、L154）；.i18n.yaml 是两行 git blob 哈希记录（L230 正则提示 \u003cbasename: \u003c40-hex，期望 40 位十六进制）。 - 缺失：每个 in-scope 且未被排除的 .md 必须有 .zh.md（L186-193","bytes":11866,"lines":94,"body":"## 官方门禁拆解 · 报告 E：配对与配置校验门\n\n本文件是子代理原始报告的存档，未做改写；正文行号均指 `DSHfork/scripts/` 下的对应文件。\n\n# DSH Gates 双脚本精读报告\n\n> 状态：记录（推断 · 2026-09-12）\n\n## A. 两个脚本解决什么问题\n\n| 脚本 | 一句话 | 触发条件 |\n|---|---|---|\n| `verify-translation-pairing.ts`（357 行） | 强制「英文源 `.md` ↔ 中文 `.zh.md` ↔ `.i18n.yaml` 哈希记录」三元组齐全、结构等价、且自上次确认后字节未单边漂移（顶注 L1-11） | `doc-sync` 的叶子门禁（L350 自述「still runs in doc-sync」）；pre-commit 用 `--cached` 走 git index（L6-8、L504） |\n| `verify-cordis-config.ts`（564 行） | 校验 Cordis Loader 配置的条目元数据（只有 `disabled` 可含 `!!js`）与「配置引用的包是否在解析面 package.json 中声明」（顶注 L1-11） | `if (import.meta.main)` 守卫（L60），配置范围由 `cordisConfigFiles(root)`（L61）决定 |\n\n## B. verify-translation-pairing 实现要点\n\n- **配对定义 = 纯命名约定，不是 frontmatter**：`translationPairPaths(anchor)` 由英文锚点推出三件套（L109、L154）；`.i18n.yaml` 是两行 git blob 哈希记录（L230 正则提示 `\u003cbasename>: \u003c40-hex>`，期望 40 位十六进制）。\n- **缺失**：每个 in-scope 且未被排除的 `.md` 必须有 `.zh.md`（L186-193）；三者不齐报 incomplete（L216-220）。锚点取 `.zh.md` 与 `.i18n.yaml` 的**并集**，所以半边删除从任一残骸都能抓到（L198-200）。范围 glob 见 L79-84。\n- **多余**：被 manifest 排除的文件若存在 `.zh.md`/`.i18n.yaml` 也报错（L211-215）。\n- **不同步**：记录哈希与当前内容不符（L234-242）；链接指向错误语言（L252-268）；生成区（marker 分隔）规范化后必须逐段一致（L270-300）；zh 侧缺语言切换器（L304-309）；结构签名 diff（L310-327，覆盖列表种类/起始序号/表格行列）。\n- **白名单/排除**：唯一机制是 `scripts/translation-pairing.manifest.json`，只含 `excluded` 数组（实测 13 行、9 条），目录项以 `/` 结尾表示整目录且不做前缀误匹配（L93-101）。没有「允许内容不同」的宽泛白名单，只有窄豁免（成对文档路径、locale 链接归一化）。\n- **错误信息**：`${file}: 原因` 或 `${source} ↔ ${zh}: diff`；链接违规**带行号** `${violation.sourcePath}:${violation.line}`（L266）。每条都给动作指引（\"bring the other side along, then re-record with --write\"）。全部落 stderr、缩进两空格（L355-356）。\n- **退出码/模式**：`--list` 状态表+计数、exit 0（L336-346）；`--write [pairs…]`/`--write --all` 记录哈希并写 sidecar、exit 0（L150-180）；`--cached` 走 index（L56-57）；参数错误 exit 2（L48-53）；违规 exit 1（L357）。\n\n## C. verify-cordis-config 实现要点\n\n- **校验对象**：条目元数据（`id/name/group/inject/intercept/isolate` 必须静态，L39；仅 `disabled` 可 `!!js` 且必须可解析——用 `new Script()` 只编译不执行，L534-543）+ 插件包解析。\n- **读 package.json 作为权威：是**（`readManifest` L465-467），且按「谁消费」分解析面：apps/cli shipped 配置与 examples 用 `apps/cli/package.json` dependencies + 各 bundle dependencies（L232-248）；apps/cli/tests 用 deps+devDeps（L249-254）；各 bundle 的 patch 行从**该 bundle 自身** deps 解析（L257-265）；`packages/*/*/tests` fixture 从该包 deps/devDeps，并扫描 fixture 目录 `.ts/.mjs` 的 bare import（`ts.preProcessFile`，L335）。\n- **两类错误**：本脚本只处理「**存在但没声明**」——`missingPluginDependencies`（L441-463）报 `${locations}: ${pkg} must be declared in ${owner}`；并带出 chooser 4 个运行期才暴露的后端包（L44-56、L456-458）。自引用豁免（L302、L384）。「声明了但不存在（装不上）」不由它负责（应属 runtime-closure/hygiene，未验证）。\n- **schema/路径/默认值**：无通用 JSON Schema，是手写形状校验（root 必须数组 L65-67，递归 `group.config`/`insert`/`include.patches` L197-220）；**用 TypeScript 编译器 API 做路径解析**：读 `tsconfig.base.json` 的 `paths`，`ts.resolveModuleName` 要求本地包解析到 `.ts/.tsx`，否则判为 built `lib/` 回退（L399-439）。无默认值填充。\n- 另有两条声明一致性：client 包 `exports[\"./client\"]` ↔ `dsh.client` 双向一致（L104-117）；preset 行不得与 host composition 同行，考虑 overlay 的 disabled 撤回（L137-161）。\n- **定位方式**：`${file}${path}`，path 是 JSON 式路径如 `[3].config[1].insert[0]`（L70、L199）；批量 stderr 后 `process.exitCode = 1`（L81-87），**不用 `process.exit()`**。\n\n## D. 共有工程约定\n\n- **入口**：translation 是顶层直接执行（无 main、无顶层 await、全同步）；cordis 用 `import.meta.main` 守卫（L60），以便 spec import 纯函数不触发门禁。\n- **报错退出**：先攒 `errors: string[]` 再一次性打印（fail-soft 汇总，非首错即停）；translation 用 `exit(0/1/2)` 三态，cordis 用 `exitCode = 1`。成功也打印一行计数（L86、L351、L178）。\n- **纯函数与 I/O 分离**：脚本顶层只做 glob/read 与编排，判定抽到具名函数或独立模块（`translation-pairing.ts`、`-record.ts`、`-git.ts`、`-links.ts`；`cordis-config-files.ts`、`cordis-yaml.ts`）。\n- **空语料守卫**：cordis 显式 fail-loud：`found no package-owned Loader configs`（L319-321、L341-343）——门禁发现为空必须失败。\n- **测试**：vitest（spec L10）。`translation-pairing.spec.ts` 9 组 describe、33 个 it，覆盖 git blob 存储/index 读取、manifest 解析、链接语言等价、记录 round-trip、结构签名、CLI 参数归一化、生成区标记；`verify-cordis-config.spec.ts`（155 行）9 个 it，直接 import 导出判定函数并用 `mkdtempSync` 造临时仓库。注意：`verify-translation-pairing.ts` **无同名 spec**，逻辑靠纯模块测。\n\n## E. 可搬到 SSiD 的骨架\n\n1. **双处声明一致性** → 套 C 的「引用集合 ↔ 权威清单」双向差集：解析 profile 与 template 得 `Map\u003cpkg, Set\u003c位置>>`，分别报「只在 profile」「只在 template」，位置带文件+JSON 路径。\n2. **vendor 四份 MD5** → 套 B 的「哈希记录 + 显式豁免」：以权威副本为基准逐份比对；若想避免「四份同时被改」漏检，照 `--write` 先写一份 `.md5.json` 基线再比对。官方用 `gitBlobHash` 而非 MD5，SSiD 用 `crypto` MD5 等价。\n3. **BOM 扫描** → 官方这两个脚本**都没有**（`scripts/*.ts` grep `uFEFF|BOM|byte-order` 零命中，`verify-*.ts` 名单里也无编码类门禁），需自写，但套其结构：读 Buffer 判前三字节 `EF BB BF`。\n\n```ts\nif (import.meta.main) {\n  const errors: string[] = []\n  const files = globSync([...])            // 统一 '\\'→'/'\n  if (files.length === 0) errors.push('scan found no manifests')   // 空语料即失败\n  const prof = pluginMap('profile/.../profile.json')               // Map\u003cpkg, loc>\n  const tpl  = pluginMap('profile-template/.../profile.json')\n  for (const [p, loc] of prof) if (!tpl.has(p)) errors.push(`${loc}: ${p} declared in profile but not in profile-template`)\n  for (const [p, loc] of tpl)  if (!prof.has(p)) errors.push(`${loc}: ${p} declared in profile-template but not in profile`)\n  const base = md5(read(VENDOR[0]))\n  for (const f of VENDOR.slice(1)) { const h = md5(read(f)); if (h !== base) errors.push(`${f}: md5 differs from ${VENDOR[0]}`) }\n  for (const f of [...json, ...ts]) { const b = readFileSync(f)\n    if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) errors.push(`${f}:1: UTF-8 BOM`) }\n  if (errors.length) { console.error('verify-ssid-gates:'); errors.forEach(e => console.error(`  ${e}`)); process.exit(1) }\n  console.log(`verify-ssid-gates: ${files.length} files passed.`)\n}\n```\n判定函数（`pluginMap`/`md5Mismatches`/`bomProblem`）导出，spec 用 vitest + `mkdtempSync` 测 6 类：正常、profile 缺项、template 缺项、BOM 命中、MD5 差异、空扫描 fail-loud。\n\n## 未验证项\n\n① 两脚本在 `run-gates.ts` 中的确切注册位置；② 「声明了但不存在」由哪个门禁负责；③ SSiD 的「vendor 四份」具体指哪四个位置。\n\n## 本次补记\n\n### 1. `.i18n.yaml` 哈希记录格式（父 agent 核实 + 本代理复核）\n\n- **路径**：`\u003cbasename>.i18n.yaml`，与 `\u003cbasename>.md`、`\u003cbasename>.zh.md` 同目录；由 `translationPairPaths` 推导（`translation-pairing-record.ts` L31-40），反向由 `translationPairPathsFromMeta` 推导（L48-53）。\n- **内容**：`renderTranslationPairingRecord`（L86-98）以 `join('\\n')` 输出 **4 行 `#` 注释头 + 2 行哈希 + 1 个空行**，故文件以恰好一个换行结束。实测样本 `DSHfork/docs/api-gateway.i18n.yaml`：L1-4 为注释头（第 4 行是 `#   pnpm run verify-translation-pairing --write docs/api-gateway.md` 重录命令），L5 为 `\u003cbasename>.md: \u003c40位hex>`，L6 为 `\u003cbasename>.zh.md: \u003c40位hex>`。\n  - 父 agent 原述为「3 行 `#` 注释头」；实测为 **4 行**，此处按实测记录（差异仅在注释头行数，机制描述无误）。\n- **解析**：正则常量名为 **`META_LINE`**（非 `PAIR_META_LINE`），值 `/^([^:#]+\\.md): ([0-9a-f]{40})$/`（L23）。`parseTranslationPairingRecord`（L62-77）跳过空行与 `#` 开头的行；任何非注释行不匹配该正则、key 重复（L70）、或最终哈希数不为 2（L75）都返回 `undefined`，即**malformed 而非静默缺失**，由门禁按「malformed consistency record」报错（`verify-translation-pairing.ts` L229-231）。\n- **重录**：`--write \u003csource>`（`verify-translation-pairing.ts` L150-180；渲染出的提示命令即 `pnpm run verify-translation-pairing --write \u003csource>`，L94）。\n\n### 2. vendor 四份副本：应实时直接比对，**不要照搬记录式哈希**\n\n**记录式哈希存在的理由**：双语对的两侧内容**本来就不同**（英文原文 vs 中文译文），无法直接互比。记录式解决的是「两侧无法互比」——先把「上次确认一致时的两侧字节哈希」记下来，之后各自与记录比对，任一侧漂移即报警。\n\n**SSiD 的 vendor 四份副本语义相反**：它们是**应当完全相同**的副本，因此可以直接互比，不存在「无法互比」这一前提。照搬记录式会带来两个坏处：\n\n1. **有毒合法化通道**：记录式配套一条重录路径（`--write`）。若四份中有一份被误改后有人执行了重录，不一致会被永久合法化为「确认态」，门禁从此对这份差异沉默。直接比对没有这条通道——四份不一致就是不一致，无所谓「上次确认过」。\n2. **纯负担**：记录式需要额外维护 4 份（或 1 份基准）sidecar 文件与重录流程，还引入「基线本身可能是错的」这一新失效模式；对「应当完全相同」的副本毫无收益。\n\n**建议做法**：以一份**权威副本**（例如 `profile-template` 下那份，或 npm 上架所用的那份）为基准，其余三份实时逐字节/MD5 比对，不写 sidecar、不提供重录入口。若确实需要固化基准值，应使用外部固化值（架构约定、上一版本的归档产物），而不是「上次跑门禁时看到的字节」——后者正是记录式哈希的固有风险，也正是这里不该沿用的部分。\n\n**一句话**：记录式是给「两侧本就不同、必须记住共同确认态」的双语对用的；vendor 四份是「本就相同、可以当场互证」的副本，套用记录式既多余又会打开合法的漂移缺口。\n"},{"file":"工程范式/2026-09-10-DSH官方Gates拆解原始报告-F-run-gates编排.md","group":"工程范式","date":"2026-09-10","slug":"DSH官方Gates拆解原始报告-F-run-gates编排","title":"DSH官方Gates拆解原始报告-F-run-gates编排","tags":["ssid-shell","dsh-ssid-panels","dsh-capture","dsh-context-doctor","dsh-dream-skin","dsh-quick-toolbar","dsh-ssid-zh-ui","0.2.1"],"summary":"本文件是子代理原始报告的存档，未做改写；正文行号均指 DSHfork/scripts/run-gates.ts。","bytes":13883,"lines":78,"body":"> 状态：记录（推断 · 2026-09-12）\n\n## 官方门禁拆解 · 报告 F：run-gates 编排\n\n本文件是子代理原始报告的存档，未做改写；正文行号均指 `DSHfork/scripts/run-gates.ts`。\n\n## A. 数据模型\n\n**Mode（24–42）17 个聚合名**：ci-primary、ci-linux-primary、ci-static、ci-lint-contracts-ready、ci-coverage、ci-bench、ci-snapshot、ci-artifacts、ci-consumers、ci-windows-blocking、ci-windows-complete、ci-windows-observational、node-compat、check-all、hygiene、doc-sync、doc-quick。parseMode（134–159）是白名单 switch，非法值抛错并回显全部合法 mode。\n\n**Gate（47–63）**：`id`（图的键，依赖按 id 引用）、`label`（人读名，默认=script 名，202）、`displayCommand`（只在诊断里打印的人类可读命令，203）、`command`+`args`（真正 spawn 的，199–207 由 pnpmInvocation 生成）、`needs`（强依赖：必须 passed）、`after`（弱依赖：只需 settled，不看结果，54 注释）、`env`（合并进 process.env，1069）、`quick`（供 doc-quick 过滤，776–778）、`allowFailure`（失败可见但不拖垮聚合，59/118/1573）、`streamOutput`（实时透传不缓冲，61）。**没有** platform/timeout/retry/cwd 字段（cwd 恒为仓库根 root，1068）。\n\n**状态机（43–44）**：`GateResultStatus = passed|failed|skipped`；`GateState = pending|running|\u003c终态>`。迁移 pending→running（937）→passed|failed（1270，判据 `exitCode===0 && signalCode===null && 无 spawnError`）；另有两条直接落 skipped 的边：needs 已失败时对下游 pending 当场构造 skipped（957–972），fail-fast/宿主中断把剩余 pending 全置 skipped（946–953、989–995）。`aborted`（74–77、979–982）保证被中止的结果即便 exit 0 也改写为 skipped，不误报 pass。\n\n## B. 依赖与调度\n\n依赖只有两种表达：needs 强、after 弱，判定在 predecessorsReady（1035–1038）。构造后先校验：validateGateGraph（814–837）拒空图/重复 id/未知依赖；findDependencyCycle（839–869）DFS 三色找环，needs 与 after 一起参与（854）。\n\n调度是单进程手写循环 runGates（897–1008）：每轮 `while (running.length \u003c maxActive)` 找第一个 ready 的 pending 启动（934–941，FIFO，故长门应排前，见 726 注释）；无新启动则 `Promise.race` 等任一子进程结束（976–983）；pending 且 needs 已失败时当场生成 skipped（955–972）；否则抛 `validated graph stalled`（958）。\n\n并发度：defaultConcurrency（168–187）用 `node:os.availableParallelism()`（导入 10、默认参数 171）；ci-consumers 放开为 gate 总数（173，其内部还要嵌套跑子 runner），check-all/hygiene/doc-sync/doc-quick 封顶 4（176–186，注释：doc 门各自建整棵 ts.Program，不封顶会内存爆）；`DSH_GATE_CONCURRENCY` 覆盖（107–108、189–197），来源串在 114 行打印。\n\nNode API：spawn/spawnSync（8）、readdirSync/readFileSync（9，读 /proc）、availableParallelism（10）、resolve（11）、performance（12），另有 AbortController、`process.kill(-pid)`、setTimeout/setInterval。**「bounded in-process scheduling」** = 934–941 容量闸 + 976 单点 race 等待 + 168–197 上限计算，全在同一 Node 进程内，不引入 worker/队列服务。\n\n## C. 聚合与命令\n\n注释 4–5 行：`Package scripts own public aggregate names; this runner owns their validated dependency graphs, scheduler environment, and process diagnostics.` 落地：package.json 77–91 每个聚合一行 `tsx scripts/run-gates.ts \u003cmode>`，且非同名映射——`check:all`→check-all（77）、`check:ci`→ci-primary（78）、`test:docs`→doc-quick（116）、doc-sync/hygiene 同名（170–171）。**所以用户敲的是 `pnpm run check:all`，`pnpm run check-all` 并不存在。**\n\n链路：pnpm→tsx→parseMode→gatesForMode（232–296）拼 Gate[]（每门最终仍是 `pnpm run \u003cscript>`，199–207）→defaultConcurrency→runGates→逐门 spawn→printSummary→只要存在非 allowFailure 的 failed/skipped 就 exit 1（118–120）。子进程不经 shell：pnpmInvocation（pnpm-invocation.ts 9–21）从 `npm_execpath` 推出 `process.execPath` + pnpm 入口，缺 npm_execpath 直接抛错。门本身仍是 package script，可单独 `pnpm run typecheck` 复现。\n\n## D. 输出与诊断\n\n收集（1073–1082）：stdout/stderr 均 `setEncoding('utf8')`，data 事件 push 进 `GateOutputChunk[]`（带 stream 归属）；仅 `streamOutput===true` 实时写父进程（1076、1080），否则缓冲到结束。\n\n打印（1541–1557）：pass 且非 `DSH_GATE_VERBOSE=1` 只一行 `PASS label (x.xxs)`；其余打 `== STATUS label (s) ==` + `command: displayCommand` + `outcome:`，outcome 由 formatGateResultReason（1533–1539）把 error / `exit N` / `signal X` 三类事实全列出（缺省 `no exit code or signal`），互不遮蔽。汇总（1559–1577）：总 passed/failed/skipped + 总时长，再逐条列不成功门，allowFailure 加 `NON-BLOCKING` 前缀（1573）。\n\n计时有（per-gate 1058/1274，聚合 113/117）；重试全文无；per-gate 超时也没有——只有中止路径上的分级宽限：SIGTERM 后 5s SIGKILL（1148）、8s 内确认整树静默否则打 `gate tree not quiescent after 8s`（1237–1262，报错在 1256）、10s 强断 stdio 防挂死（1160–1165）。coverage 的 vitest 超时（614）是传给子命令的参数而非看门狗。\n\n**「process diagnostics」** = 子进程输出的归属与重放 + 退出码/信号/启动错误三类事实 + 进程树终止与静默确认（1091–1265）+ 并发来源与 fail-fast 原因行（114、988）。\n\n## E. 环境与条件\n\n开关（均环境变量）：`DSH_GATE_CONCURRENCY`（107）、`DSH_GATE_FAIL_FAST`（仅接受 '1'，684–689）、`DSH_GATE_VERBOSE`（1542）、`DSH_WEB_SNAPSHOT_WORKERS`（≥2，491–503，决定 test:web:ci 还是 test:web:built）、`DSH_OXLINT_THREADS`（575）、`DSH_NODE_COMPAT_SKIP_TYPECHECK`（348）、`DSH_COVERAGE_MAX_WORKERS`（601–609，按 2:1 切给 instrumented 与 exempt 两门）、`DSH_COVERAGE_PARTITIONS`（615–632，改走 partitioned script）、`DSH_COVERAGE_TEST_TIMEOUT_MS`（614）、`DSH_COVERAGE_EXEMPT_HEAVY`（coverage-exempt.ts:26，传给子进程的豁免标记）、`DSH_BUILD_CLIENT_PROFILE=official`（209–215）、`DSH_DOC_TYPECHECK_USE_BUILD_OUTPUT=1`（279、424、479）、`DSH_SNAPSHOT=replay` 与 `DSH_EXAMPLE_MODE=lib`（505–509、653、662）、`DSH_REQUIRE_BUILT_CLI_SMOKE`（398）。\n\n平台/环境造成的「跳过」：runner 无运行期打 skip 的机制（skipped 只来自 fail-fast 与依赖链），条件性全在构造期——nodeCompatGates 在 `runningNodeMajor() !== 22` 时丢掉 build/build:web（351–365）；doc-quick 只取 `quick===true` 的叶子（776–778）；ci-windows-complete 把 observational 门标 allowFailure（526–537）。子命令内部自跳（如无 `DEEPSEEK_API_KEY` 的 e2e）不经过 runner，其实现**未验证**。\n\n## F. 给 SSiD 的取舍（5–10 个检查脚本）\n\n**只有大规模才需要的复杂度（别搬）**：① needs+after 双依赖与环检测（814–869）——它为「产物读者与写入者互斥」而生（447–461 的 dev:web 与产物读取、526–536 的两种 VitePress 模式同目录不可重叠）；② 手写并发调度 + availableParallelism 上限（168–197、934–941）——10 个门串行也就几分钟；③ fail-fast 的进程树终止体系（1091–1265、1377–1508：detached、`kill(-pid)`、Windows `taskkill /T`、后代采样缓存、SIGKILL 升级、静默确认、stdio 强断）——被 vitest worker / dev server / 编译器这类会留后代的子进程逼出来的；④ 十几个 `DSH_*` 开关与 allowFailure/streamOutput/quick 的多样语义；⑤ 嵌套 runner（464–467 的 ci-consumers 门里再跑 check:node-compat）。\n\n**一开始就该有（形状可抄，实现可缩到约 150 行）**：① 单入口 + 白名单 mode 校验（134–159）；② 门表数据化、命令与展示名分离（47–63、199–207），并 shell-free 起进程（pnpm-invocation.ts）——Windows 上避开 shell 引号/转义坑；③ 依赖失败 ⇒ 下游 skipped，绝不误报 passed（957–972、1035–1046）；④ 逐门计时 + 明确退出码契约（113–120、1270），CI/发版脚本只认退出码；⑤ 失败打 displayCommand + exit/signal/error 三类事实（1533–1539、1549–1556），且每个门自带 `文件:行` 定位——BOM/旧名/vendor MD5 类门没有定位等于没跑；⑥ 每个检查一个独立脚本 + 稳定 script 名（77–91 与 4–5 行注释的约定），便于单独复现、单独入 CI 作业；⑦ 平台条件门用构造期过滤 gate 列表（351–365）而非运行期 skip 状态，少一个状态维度。\n\n**落到 `check-rules` 的具体建议（未验证 SSiD 现有结构）**：profile vs template 逐键对比、BOM 扫描、旧名残留、vendor MD5 各做一个 `scripts/check-*.ts`，package.json 各一行 script，`check:rules` = 顺序跑 4 个并汇总退出码；只有 vendor MD5 依赖构建产物时才加一条 needs 边；门数上 10+ 或单轮超 2 分钟，再引入并发与 fail-fast。\n\n## 本次补记：SSiD 侧真实结构核实结果\n\n下列事实本次由本代理实际读取文件/目录核实（非推测），用于修正上节 F 中「未验证 SSiD 现有结构」一句。\n\n**1. 壳库根目录没有 package.json。** `seek-soul-in-darkness/package.json` 不存在（glob 无结果，已核实）；脚本家在 `seek-soul-in-darkness/shell/`，该目录有 `package.json`（133 行，`name: ssid-shell`、`version: 0.2.1`、`private: true`、`type: module`）与 `scripts/`。\n\n**2. `shell/package.json` 现有 scripts（第 8–16 行，逐字）**：`start`（`electron .`）、`typecheck`（`tsc --noEmit -p tsconfig.json`）、`smoke`（`node --import tsx/esm boot-smoke.ts`）、`test`（`node --import tsx/esm --test tests/profile-merge.spec.ts tests/codegraph-adapt.spec.ts`）、`test:profile-merge`、`test:codegraph-adapt`、`pack`（`npm run bundle-kernel && electron-builder --win`）、`bundle-kernel`（esbuild 打 `kernel.bundle.mjs`）、`pack:mac`。**运行器是 `npm run`，不是 pnpm**（`pack` 脚本第 14 行自证）。\n\n**3. `shell/scripts/` 现有内容（已核实）**：`after-pack.cjs`、`boot-bundled.mjs`、`prepare-runtime.mjs`、`repack-open-sea-skin-vendor.mjs`、`verify-deploy-rename.mjs`；另有 `probes/` 下 4 个：`fake-worker.cjs`、`probe-worker-packaged.mjs`、`probe-worker-source.mjs`、`verify-pack.mjs`。\n\n**4. `verify-deploy-rename.mjs`（72 行）是唯一的 verify 先例，且没有退出码契约（已核实）**：第 1–2 行是中文注释；第 7 行 `const base = fileURLToPath(new URL('./tmp-deploy-test', import.meta.url))` 建临时目录；第 38–39 行失败路径只 `console.log('  [FAIL] ...')` 后 `return false`；第 50/52 行把 `ok1`/`ok2` 打成「成功/失败」文本；第 64 行把预期内的失败打成「失败(符合预期)」；第 69 行固定打印 `ALL CHECKS DONE`；全文唯一的非零退出是第 72 行 `run().catch(...)` 里的 `process.exit(1)`，即只有未捕获异常才非零。**结论：脚本正常走完必然 exit 0，任何检查失败对 CI/发版都不可见。** 新的 check-rules 若沿用这一形状（中文注释 + 临时目录 + 逐场景 console.log），必须额外补上 F 节第 ④ 条的退出码契约：收集各项检查的通过/失败状态，失败时 `process.exitCode = 1`（或显式 exit 1），并让聚合脚本把子脚本退出码向上传递——否则「四份核」跑出红字也拦不住发版。\n\n**5. 目标检查共四项（手册待办 #5）**：profile vs template 声明逐键对比、BOM 扫描、旧名残留、vendor MD5 四份核。\n\n**6. 「vendor 四份」已核实为以下四个位置**（前三项本次实测存在；第 2、3 项为当前用户环境路径）：\n- 源头：`seek-soul-in-darkness/plugins/\u003cpkg>/lib/**`（已核实存在，如 `plugins/dsh-ssid-panels/lib/client.js`）\n- `~/.dsh/profiles/web/vendor/\u003cpkg>`（已核实存在；实测包集合：dsh-capture、dsh-context-doctor、dsh-dream-skin、dsh-quick-toolbar、dsh-ssid-panels、dsh-ssid-zh-ui）\n- `~/.dsh/profiles/ssid/vendor/\u003cpkg>`（已核实存在；实测包集合：dsh-capture、dsh-context-doctor、dsh-quick-toolbar、dsh-ssid-panels、dsh-ssid-zh-ui）\n- `seek-soul-in-darkness/shell/profile-template/vendor/\u003cpkg>`（已核实存在；实测目录含 dsh-capture、dsh-context-doctor、dsh-quick-toolbar、dsh-ssid-panels、dsh-ssid-zh-ui）\n\n**注意（本次实测发现，供 check-rules 设计参考）**：四处 vendor 的包集合并不一致——`web` 比 `ssid` 多出 `dsh-dream-skin`，而 `profile-template` 与 `ssid` 的集合一致。因此「vendor MD5 四份核」不能简单地求四份全等：需要先确定「本应参与核对的包集合」与源头的对应关系（哪些包由 `plugins/\u003cpkg>/lib/**` 派生、哪些是外部引入不参与四份比对），否则会把集合差异误报成 MD5 不一致。`dsh-dream-skin` 的归属规则本次未验证，建议在设计 check-rules 时一并确认。\n\n**7. 对 F 节第 ② ⑥ 条的落地修正**：runner 与检查脚本应放 `shell/scripts/`（与该目录既有形状一致），聚合 script 进 `shell/package.json`（`npm run check:rules` 之类），命名风格沿用现有 `verify-*.mjs` / `check-*.mjs`；F 节第 ② 条提到的「shell-free 起进程」在 SSiD 侧的对应做法是 Node `spawn(command, args)` 直接起 `node`（不经 `sh`/`cmd`），`pnpmInvocation` 那套 `npm_execpath` 解析在 npm 环境下是否同样可用，本次未实测。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-01-门禁体系.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-01-门禁体系","title":"DSH 过程决策精读 · 第 01 批：门禁体系","tags":[],"summary":"2026-06-11-quality-gates.md · 被后续多篇引用为 \"the whole quality story is mechanical gates\"","bytes":19606,"lines":296,"body":"# DSH 过程决策精读 · 第 01 批：门禁体系\n\n> **读的是什么**：`DSHfork/.agents/notes/implemented/process/` 下的决策记录（Agent Notes），共 94 篇，本批 5 篇。\n> **为什么读它**：源码只说明\"他们做了什么\"，判断标准、成立条件、被否决的方案只在决策记录里。本笔记记的是**他们凭什么这么判断**。\n> **本批覆盖**：2026-06-11 → 2026-08-19，正好是这套门禁体系从总纲到成熟期的完整弧线，其中包含一次\"删掉门禁\"的反面案例。\n> **读法提示**：每篇的「被否决的方案」比「决定」更有信息量——决定告诉你结果，否决告诉你边界。\n\n> 状态：记录（推断 · 2026-09-12）\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [机械质量门禁胜过散文约定](#1-总纲机械质量门禁胜过散文约定) | 整套体系的前提：开发主要由 agent 完成 |\n| 2 | [双语配对门禁](#2-双语文档配对门禁) | 6 个被否决方案 + 一段业界先例调研 |\n| 3 | [文档分层与预算](#3-文档分层与字数预算) | 字数这个粗糙代理是刻意接受的 |\n| 4 | [并行 pre-push 门禁](#4-并行-pre-push-门禁) | 每条设计取舍都源于\"拒绝第二份真相\" |\n| 5 | [移除 Knip](#5-移除-knip反面案例) | 什么情况下该**删掉**一个门禁 |\n\n---\n\n## 1. 总纲：机械质量门禁胜过散文约定\n\n`2026-06-11-quality-gates.md` · 被后续多篇引用为 \"the whole quality story is mechanical gates\"\n\n### 他们遇到的事\n\n这个代码库**主要由编码 agent 开发**。早期出过一次事故：类型检查不通过的测试被提交了——因为 vitest 不做类型检查，而这个问题是被人工评审发现的。换句话说，靠的是运气和人的注意力。\n\n### 判断\n\n每一条**可机械检查**的 `AGENTS.md` 承诺，都必须配一条能非零退出的命令。分工是：CI 跑穷尽集，Git hooks 只把延迟预算留给廉价的本地缺陷。\n\n### 凭什么这么判断\n\n> Agents follow enforced gates far more reliably than prose conventions, and \"a lot of work\" is not a cost argument when agents do the labor.\n\n三句话，三件事：\n\n1. **规范的对象是 agent，不是人**——agent 服从机械强制远比服从散文约定可靠。这不是在说人自觉性差，是在说 agent 的服从模型就是这样。\n2. **\"工作量大\"不构成成本论据**——因为干活的是 agent。这句话直接否决了\"写门禁太费事所以算了\"这种想法。\n3. 因此真正的筛选标准不是\"值不值得写脚本\"，而是**\"这条约定能不能被机械判定\"**。\n\n### 他们承认的代价\n\n原文明写了两条，没有藏：\n\n- 门禁本身是**需要维护的代码**，配置变更要像普通改动一样被评审\n- **100% 覆盖率压力会催生没有断言的测试**——对冲手段是变异测试（当时还在提案阶段）\n\n### 被否决的方案\n\n这篇写于格式确立之前，末尾有一行显式豁免注释：`\u003c!-- agent-note-format: alternatives-not-recorded (pre-format Agent Note) -->`。**没有 Alternatives 段这件事本身被记录在案，而不是静默缺失。**\n\n---\n\n## 2. 双语文档配对门禁\n\n`2026-07-02-bilingual-docs-and-pairing-gate.md`\n\n### 他们遇到的事\n\n文档语料要被公司内外的人**和 agent**用中英双语阅读。靠人工维护第二语言、没有任何机制，就是翻译腐烂的标准剧本：一侧前进了，另一侧静默地说着假话，而且没有任何门禁会发现。\n\n原文给这类问题的定性很干脆：*\"The repo's standing answer to invariants of this kind is to encode them as a mechanical check\"*——**这类不变量的标准答案，就是把它编码成机械检查。**\n\n### 判断\n\n一对文档 = 三个兄弟文件：英文 `foo.md`、中文 `foo.zh.md`、一致性记录 `foo.i18n.yaml`。\n\n关键设计：\n\n- **两侧地位平等，没有\"原文\"**——可以先写中文再翻英文，也可以反过来。约束只有一条：两侧必须说同一件事，且**配对整体合并**（两种语言加记录，从不单独一个）\n- 记录里存**两侧的 git blob 哈希**（截至上次确认一致的状态）\n- 重录要点名确认配对（批量重录是显式的 `--write --all`）\n- 清单文件**只包含显式排除项**\n- **全语料一个要求**：一篇文档从创建起就要求完整配对，没有 per-file 过渡态、没有日期截止线、没有 README 专属类别\n\n### 凭什么这么判断\n\n**为什么记录 blob 哈希而不是 commit 哈希**（他们明确参考并否决了 MDN 的 `l10n.sourceCommit` 模型）：\n\n> a same-PR edit has no commit hash yet, so the MDN model cannot express \"consistent as of the state this PR introduces\", and verifying it requires git history instead of file content.\n\n同一个 PR 里的编辑还没有 commit 哈希；而且验证要查 git 历史，而不是读文件内容。**核心判断：验证应当基于内容，不基于历史。**\n\n**为什么重录必须显式点名**：*\"confirming consistency is an explicit, visible act in the PR\"*——确认一致必须是一个可见的动作，而不是顺手批量刷过去。\n\n**为什么清单只列排除项**：*\"so no requirement can bypass discovery and receive a weaker check\"*——不能让任何条目绕过发现流程、从而获得更弱的检查。**绕过必须在结构上不可能。**\n\n### 他们承认的代价\n\n> When the two sides disagree, no mechanical rule picks a winner — the PR review does. That is the price of equal authority, accepted deliberately.\n\n两侧冲突时，**没有机械规则能判定谁对，由 PR 评审决定**。这是\"对等权威\"的定价，**刻意接受**——因为另一条路（指定一种语言为原文）会禁掉中文优先撰写。\n\n另一条代价：每对多一个文件。但因为记录是机器写的（`--write`），成本是**目录噪声，不是维护工作量**；换来的是\"谁在何时确认过一致\"可以从 yaml 的 git blame 直接回答。\n\n### 被否决的方案（6 个）\n\n| 方案 | 否决理由 |\n|---|---|\n| 英文为原文 + 在翻译文件里存指纹（单向 EN→ZH） | 团队要中文优先撰写、双语对等权威，单向模型表达不了这一点。（**但 blob 哈希机制被保留**，只是从\"文件内\"挪到了 sidecar） |\n| locale 目录（`docs/en/` + `docs/zh/`，K8s/ECharts 模式） | 本仓库没有把 locale 映射到路由的文档站框架；移动所有英文文件会搅动全部交叉引用；链接检查需要路径映射逻辑而不能原样工作 |\n| 独立翻译仓库（PingCAP `docs`/`docs-cn` 模式） | 对独立发布节奏的文档产品是对的，对 monorepo 自己的文档是过度设计；而且**把翻译放到了本仓库门禁触及范围之外** |\n| 单文件交错双语 | 每条 diff 翻倍；破坏\"一段一行\"的 diff 工效；**局部不一致变得不可见** |\n| commit 哈希记录（MDN 模型） | 同 PR 编辑还没有 commit 哈希 |\n| 比较两侧的 git 时间戳（不存记录） | 纯格式编辑会**假阳**；无关编辑之后提交的对应文件会**假阴**——**内容同一性是唯一有意义的信号** |\n\n### 顺带：一段业界先例调研\n\n这篇里有一段很值得学的做法——他们在决定前调研了业界：\n\n- **中文大厂的惯例**是配对的同后缀文件（ant-design `index.zh-CN.md`、arco-design、ShardingSphere 的 387 对 `.cn.md`/`.en.md`）——**但没有任何一个仓库在 CI 里强制配对或一致性**，全靠评审\n- **一致性自动化反而在中国之外**：MDN 的 `l10n.sourceCommit`、Vue 的 Ryu-Cho（上游提交监视器，为过时翻译开 issue/PR）、K8s 的本地化漂移脚本、微软 Azure 的 co-op-translator\n- **他们的设计是两者的合成**：中文生态的文件布局 + 哈希配对门禁 + 用 agent 工作流替代 bot 服务\n\n---\n\n## 3. 文档分层与字数预算\n\n`2026-07-04-doc-tiers-and-budgets.md`\n\n### 他们遇到的事\n\n常设文档在积累重复的规则、复述事故经过、重复包地图、过时的 Agent Note 摘要——**尽管当时已经有写作指导**。\n\n原文对原因的判断只有一句：*\"Because review alone did not prevent that growth, the repository needed a mechanical budget alongside its documentation taxonomy.\"*——**因为评审不足以阻止增长。**\n\n### 判断\n\n- **结构跟随文档树**：一份文档拥有自己主题的细节，只总结直接子项的用途、职责和高层行为，并链接到更深的拥有者\n- **一个事实一个家**（one home per fact）：禁止在自己的层级之外复述\n- **窄而硬的预算门禁**：受预算的文件若**缺失也判失败**，这样重命名不能静默地让它的预算成为孤儿\n- 范围**刻意**只覆盖容易膨胀的常设文档（各级 `AGENTS.md`、`architecture.md`、`packages/README.md` 及其接收被驱逐内容的策略文档）。**参考文档、Agent Note、完整的包 README 不设预算——因为穷尽式的事实可以很长**\n- **天花板是棘轮式的**：已达标的文档保留至少 5% 余量、上限随之下调；超标的文档上限被冻结、阻止继续增长直到达标；**提高天花板需要显式的 PR 理由**\n\n### 凭什么这么判断\n\n**为什么不要\"只靠 skill + 评审纪律\"**：\n\n> the accretion above happened while the current-state rule and reviewer attention already existed; a prose rule with no mechanical backstop demonstrably does not hold here\n\n积累**就是在规则和评审注意力都在场的时候发生的**。散文规则没有机械兜底，在这里被证明不成立。\n\n**为什么不要\"覆盖所有文档的宽泛门禁\"**（这条极重要）：\n\n> a blanket ceiling punishes exactly the right kind of long doc (a feature matrix or type catalog where every row is a fact) and generates per-file override churn that trains contributors to rubber-stamp raises.\n\n一刀切的天花板**恰好惩罚了正确的长文档**（特性矩阵、类型目录，每一行都是事实），并产生逐文件覆盖的翻腾，**最终训练出贡献者橡皮图章式地批准提高上限**。——错误的门禁会训练坏行为，这比没有门禁更糟。\n\n**为什么字数这个粗糙代理可以被接受**：\n\n> Word count is a crude proxy accepted deliberately: it cannot judge quality, but it forces the relocation decision at exactly the moment content is being added, which is when the author has the context to place it correctly.\n\n字数**不能判断质量**，但它**恰好在内容被添加的那一刻**逼出\"该放哪\"的决定——而那一刻正是作者最清楚上下文的时候。**门禁的价值在强制决策的时机，不在度量的精度。**\n\n### 被否决的方案（4 个）\n\n| 方案 | 否决理由 |\n|---|---|\n| 只要 skill + 评审纪律，不要门禁 | 积累就发生在规则与评审都在场的时候；没有机械兜底的散文规则在这里被证明不成立 |\n| 覆盖所有完整文档的宽泛门禁 | 惩罚正确的长文档；逐文件覆盖的翻腾训练出橡皮图章式批准 |\n| 每个文档入口各写一套新手教程 | 重复的设置步骤会在命令顺序、首个成果、产品身份上漂移 |\n| 把标准放进 skill 里 | **契约住文档、工作流住 skill**；打包进 `SKILL.md` 的标准，对**不调用该 skill 就编辑文档的 agent 不可见** |\n\n---\n\n## 4. 并行 pre-push 门禁\n\n`2026-07-06-parallel-pre-push-gates.md` · 这就是 `run-gates.ts` 的出生证明\n\n### 他们遇到的事\n\n聚合任务（如文档同步）掩盖了长的**顺序链**，而链上的成员其实是只读且互相独立的。而在 workflow YAML 里复制这些叶子清单，等于给未来的脚本变更留下**多处漂移点**；串行跑包发布检查，则让一道门禁的耗时与包数量成正比。\n\n### 判断（数据化的调度设计）\n\n- `run-gates.ts` 拥有被 CI、`doc-sync`、按需的 `check:all` 共用的**有界调度器**\n- 在启动任何子进程**之前**，拒绝空图或有歧义的依赖图\n- `needs` 边：前置必须**通过**，否则跳过依赖方\n- `after` 边：只等前置**以任意结果结算**，然后仍允许后继运行\n- `allowFailure`：仍报告结果，但不让聚合失败\n- 默认**缓冲**可归因输出；只有声明了 `streamOutput` 的长协调者实时透传\n- 环境变量供不同资源规格的机器调整并发\n\n### 凭什么这么判断——看 6 条否决理由\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 保持聚合任务串行 | 墙钟时间等于独立检查之和，还重复了命令包装器的启动开销 |\n| 每个叶子门禁声明一个 CI job | 并行度最大，但重复 checkout/setup/install 开销，且**在 YAML 里复制了调度器清单** |\n| 在 shell 脚本里后台跑子命令 | 能并行，但**丢失逐门计时、确定性的失败分组和直接的信号处理** |\n| 每个门禁都继承 stdio | 进度立刻可见，但互相独立的门禁输出被交错，且**调度器的可归因输出记录被丢弃** |\n| 每个包声明一个 `publint` job | 并行度最大，但产生**手工维护的包清单**，包一变就漂移 |\n| `publint` 无界并发 | 只在小仓库上减少耗时，代价是赌进程数、内存压力、tarball 创建和日志可读性 |\n\n**把 6 条否决理由放在一起看，会发现它们是同一个模式的 6 个变体**：每个方案都换来了某种即时好处，但代价要么是\"**产生第二份需要同步的东西**\"（YAML 清单、包清单），要么是\"**丢失可归因性**\"（计时、分组、输出归属）。理解了这个模式，后面再看他们的任何编排设计都能预判。\n\n### 他们承认的代价\n\n用\"慢的那条依赖链\"替代\"独立门禁之和\"，代价是**一个自定义调度器 + 一份显式的 mode 清单**。选定的长协调者则用跨门顺序和缓冲日志，换即时诊断。\n\n---\n\n## 5. 移除 Knip（反面案例）\n\n`2026-08-19-remove-knip.md` · **什么时候该删掉一个门禁**\n\n### 他们遇到的事\n\nKnip 从静态源码图推导未使用的文件、导出和依赖。但本仓库还做这些事：从包清单和配置加载 Cordis 插件、把 Typert face 生成进 `lib/`、拆分 Host/Client 程序、声明只被生成代码或运行期加载的代码消费的依赖。\n\n结果是：**为了让受支持的路径通过扫描，不得不维护一套 workspace 专属的入口清单和忽略依赖例外**。包和测试布局一变，就得维护那个\"可执行图的第二份近似\"。\n\n### 判断\n\nKnip 不再作为仓库依赖或质量门禁存在。仓库**不设**仓库级的未使用代码静态检查。\n\n### 凭什么这么判断\n\n这是整篇最关键的一段——他们不是凭\"这工具不好用\"删的，而是做了**覆盖分析**：\n\n> The repository already has narrower checks for the failures it treats as release contracts: TypeScript and Oxlint validate source imports, workspace constraints validate manifests, `verify-optional-dependency-imports` validates optional imports, `verify-runtime-closure` validates runtime dependencies, `verify-client-packages` validates Client packaging, and publint validates published packages. The generic unused-code result is advisory, while its exceptions are required maintenance.\n\n拆开是三个判断：\n\n1. **那些失败模式已经被 6 道更窄的检查覆盖了**——一个泛化工具提供的信息，绝大部分是冗余的\n2. **泛化结果是参考性的（advisory），而它的例外清单是必须维护的**——收益是软的，成本是硬的\n3. 例外清单的存在，让**普通的包变更依赖于一个不能代表组装后应用的源码图**\n\n### 被否决的方案\n\n| 方案 | 否决理由 |\n|---|---|\n| 保留 Knip 和它的例外清单 | 保住了宽泛的参考信号，但每个受支持的动态/生成路径都需要配置，而这些配置**重述了清单、构建配置和包专属检查已经拥有的事实** |\n\n### 他们承认的代价\n\n他们明确放弃了自动的宽泛未使用代码/依赖报告；评审和简化工作必须**针对真实的加载路径**证明删除是安全的。并且给未来的检查定了门槛：\n\n> A future unused-code check must understand manifest-driven Cordis loading, generated outputs, and the Host/Client split **without a per-workspace ignore inventory**.\n\n未来若要重新引入未使用代码检查，**必须理解清单驱动的 Cordis 加载、生成产物和 Host/Client 拆分，且不需要 per-workspace 忽略清单**。最后留下了那句判断：\n\n> a dependency with no source import is not dead-code evidence by itself.\n\n**一个没有源码导入的依赖，本身不构成死代码的证据。**\n\n---\n\n## 这批的共同判断标准\n\n跨 5 篇提炼，按我判断的重要性排序：\n\n**① 可机械判定的不变量必须编码成检查，散文规则不作数。**\n依据是两处独立印证：总纲的立场，以及预算门禁的\"积累就发生在规则和评审注意力都在场的时候\"。这是整套体系的地基。\n\n**② 代价的真正来源不是写脚本，是维护\"第二份真相\"。**\n`remove-knip` 的例外清单、`parallel-gates` 拒绝的 YAML 清单与包清单、`doc-budgets` 拒绝的逐文件覆盖——**三种不同的场景，同一个否决理由**。判断标准：任何要求你维护第二份清单的方案，都要重新审视它带来的收益是否值得。\n\n**③ 验证基于内容，不基于历史。**\n双语门禁同时否决了 commit 哈希和时间戳：前者在同 PR 场景下无法表达，后者既会假阳又会假阴。**内容同一性是唯一有意义的信号。**\n\n**④ 确认动作必须显式、可见。**\n重录要点名、批量要显式开关；豁免要留痕（连\"这篇没写 Alternatives\"都用注释标了出来）。**看不见的确认等于没确认。**\n\n**⑤ 不接受过渡态。**\n全语料一个要求，没有 per-file rollout、没有日期截止线、没有类别特例。过渡态是永久泄漏的开始。\n\n**⑥ 绕过必须在结构上不可能。**\n只列排除项，不列包含项——\"不能让任何条目绕过发现流程而获得更弱的检查\"。\n\n**⑦ 错误的门禁会训练坏行为。**\n一刀切的天花板\"训练贡献者橡皮图章式地批准提高上限\"。这条是对\"我们加个检查吧\"的**最强反驳**：门禁设计错了，比没有门禁更糟。\n\n**⑧ 门禁的价值在强制决策的时机，不在度量精度。**\n字数不能判断质量，但它恰好在内容被添加的那一刻逼出迁移决策——那是作者最清楚该放哪的时刻。\n\n**⑨ 删门禁和加门禁一样需要记录，且门槛更高。**\n`remove-knip` 给出了删除的三个条件：失败模式已被更窄的检查覆盖、泛化结果只是参考性而例外是硬维护成本、例外清单使普通变更依赖一份失真的图。\n\n---\n\n## 下一批（待读）\n\n按同一主题线，下一批候选：\n\n- `2026-07-05-uniform-agent-note-format.md` —— Agent Note 格式如何被机械化强制\n- `2026-07-21-serial-cross-platform-ci-reference.md` —— 跨平台 CI 的顺序化\n- `2026-08-02-native-github-stacks-and-optional-rebases.md` —— PR 历史的选择\n- `2026-08-09-concrete-prose-names-actors-and-recorded-facts.md` —— **文字规范**（与 CoT 泄漏探针直接相关）\n- `2026-08-10-event-directed-pr-review-status.md` —— 评审状态的事件驱动\n\n其中 `2026-08-09-concrete-prose...` 与待办 #8（CoT 泄漏探针）关系最紧，值得优先。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-02-文字规范与引用纪律.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-02-文字规范与引用纪律","title":"DSH 过程决策精读 · 第 02 批：文字规范与引用纪律","tags":[],"summary":"2026-08-09-concrete-prose-names-actors-and-recorded-facts.md","bytes":15911,"lines":235,"body":"# DSH 过程决策精读 · 第 02 批：文字规范与引用纪律\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。比第一批少，原因是这三篇密度极高且内在联系紧——它们共同回答一个问题：**什么样的文字能长期成立**。\n> 第 03 篇尤其重要，它把\"怎么判断一句话该不该删\"讲成了可操作的方法，并罕见地**主动披露了自己的门禁覆盖缺口**。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [具体的散文点名行为者与已记录事实](#1-具体的散文点名行为者与已记录事实) | 为什么\"全局替换同义词\"是错的 |\n| 2 | [Agent Note 的统一格式](#2-agent-note-的统一格式) | 8 个被否决方案，和一条刻意的摩擦 |\n| 3 | [只引用已提交的产物](#3-只引用已提交的产物) | 含召回探针的校准方法，与一次坦诚的缺口披露 |\n\n---\n\n## 1. 具体的散文点名行为者与已记录事实\n\n`2026-08-09-concrete-prose-names-actors-and-recorded-facts.md`\n\n### 他们遇到的事\n\n仓库里的散文**用了抽象类别标签，而读者需要的是不同的具体事实**。同一个标签可能指：\n\n- 被替换掉的引用所引用的更早事件序号\n- 产生某条消息的 provider 和 model\n- 提供上下文的调用方\n- 提供某配置行的文件\n- 构建某个二进制的 CI job\n\n结果是：**读者必须先翻代码，才能知道这句话承诺的到底是哪个事实。**\n\n### 判断\n\n维护中的散文要**点名**本地契约所需的确切**行为者、动作、来源、事件、字段、文件或进程**，并说明**记录了什么、以及谁或什么记录的**。\n\n给写作者的操作方法只有一条，但很锋利：**做口语检查**——把那些你**不会用来向同事解释同一件事**的词替换掉。\n\n适用范围明确列出：Markdown、README、活跃 Agent Note、JSDoc 和注释、提示词、诊断信息、用户可见字符串。\n\n三条约束防止走偏：\n\n- **逐句审查**，不做全仓库同义词替换\n- 编辑后的句子要保留：行为者、动作、条件、顺序、情态、例外、归属、失败行为、后果\n- 精确的代码标识符、公共 API、持久字段、协议成员、类型名、文件名**保持不变**，除非另有一次独立的协同重命名\n\n还有一个专门针对三个高频词的判断：用 `contract` / `boundary` / `shape` 之前，先问这句话是不是其实想说更具体的规则、操作、数据结构、字段集合、校验点、时序点、API、类型或失败条件。\n\n### 凭什么这么判断——三个被否决的方案\n\n| 方案 | 否决理由 |\n|---|---|\n| **禁用一份固定的词表** | 一个词可能是精确的标识符，或在另一份契约里是最清晰的术语——调用方/被调用方的不变量**是真实的契约**，进程或线路边界**是真实的分界**。逐句审查能抓住歧义，而不会否决合法的名称 |\n| **把每个抽象标签都换成 \"source\"/\"origin\"/\"metadata\"** | **另一个宽泛标签仍然让读者去猜**：这句话指的是文件、调用方、事件序号、provider/model 对、commit 还是构建 job |\n| **连同散文一起重命名所有匹配的标识符** | 编辑上的清晰度**不足以正当化**无关的 API、协议、持久格式、类型或文件迁移；那些改动需要各自的消费者审计和独立的决策 |\n\n第 2 条否决理由值得单独记住：**换一个宽泛的词，等于什么都没做，只是把谜题换了个面。**\n\n### 他们承认的代价\n\n文档和诊断信息会多用几个词；仓库范围的散文审计**需要语义分类，不能做盲目替换**。\n\n---\n\n## 2. Agent Note 的统一格式\n\n`2026-07-05-uniform-agent-note-format.md`\n\n### 他们遇到的事\n\nAgent Note 的**路径**已经编码了生命周期和类别，但**文件内容**仍然混杂着各种标题风格、状态格式、ADR 模板和提案模板，甚至 implemented 记录里还留着提案期的章节。\n\n根因一句话：**作者复制他们找到的那个邻居**。而且生命周期移动可以跳过必需的改写——因为没有门禁强制文件内的契约。\n\n### 判断\n\n格式契约落在 README 里，包含：头部块、各生命周期的正文骨架、**强制的 `Alternatives considered` 段**，以及规范章节词汇（在规范章节之间，定制技术章节保持自由形式）。\n\n门禁 `verify-agent-note-format` 作为 `doc-sync` 的一部分强制执行每一条机械条款，于是**跳过硬写的生命周期移动会失败 CI，而不是依赖评审者的记忆**。\n\n两个关键立场：\n\n1. **整个语料在同一次变更里被规范化**——发布前的立场是\"没有过渡期、没有双格式容忍\"\n2. **唯一的祖父条款是内容，不是格式**——alternatives 是**记录的，绝不编造**，所以无法从记录中重建 alternatives 的旧笔记，携带一行精确的注释，而门禁**只对早于本笔记日期的文件**接受它\n\n### 凭什么这么判断——8 个被否决的方案\n\n| 方案 | 否决理由 |\n|---|---|\n| **完全刚性的模板**（每个生命周期一个固定章节序列） | 大型设计笔记带 8–15 个定制的技术章节（包拓扑、线路契约、schema），它们是**承重内容而不是漂移**；刚性序列会强制破坏性重写，并从此永远与模板搏斗 |\n| **只规范化头部**（H1 和 Status，正文不动） | 债务标记标出的恰恰是**正文**的体裁分裂；把 `Context`/`Decision` 与 `Problem`/`Proposal` 长期并置，什么也没解决 |\n| **不要 Status 行**（文件夹本身就是状态） | 选择保留\"自描述的文件\"；促成删除它的那个漂移风险，通过**把该行对着文件夹把关**而被中和 |\n| **带日期的状态**（`implemented (accepted YYYY-MM-DD)`） | 接受日期是**被写作规则挡在文档之外的叙述性历史**；文件名带首次提案时间、git 带其余；而且——**门禁能检查日期的格式，却永远无法检查它的真实性** |\n| **裸 `# \u003ctitle>`** | `Agent Note: ` 前缀让文件在被移到树外阅读时**仍然自描述体裁** |\n| **用 `## What we give up` 作为 implemented 的收尾** | **它只命名代价**，而诚实的 consequences 段必须同时记录这个权衡**买到了什么** |\n| **只靠约定，不设门禁** | slop 检查表已经用约定禁止了 implemented 里的 spec-speak，而**十九个文件展示了单靠约定能达成什么** |\n| **独立的 `FORMAT.md` 契约文件** | 一个入口点同时携带布局、分类和格式，比两个契约文件**更容易被发现和维护** |\n\n第 7 条是整篇最有分量的一条：**\"十九个文件展示了单靠约定能达成什么\"**——这句话把\"我们有规范了\"这种自我安慰直接击穿。\n\n### 他们承认的代价\n\n- 每篇 Agent Note 现在要多花一点结构成本\n- **强制的 `Alternatives considered` 是刻意的摩擦**：*一个没有记录它击败了什么的决策，会招致 Agent Note 本来要防止的重新打官司*\n- 无法重建 alternatives 的旧笔记**永久携带祖父注释**——这是\"记录上一个诚实的空白，而不是编造理由\"\n\n---\n\n## 3. 只引用已提交的产物\n\n`2026-08-09-committed-artifact-citations.md` · **本批最重要的一篇**\n\n### 他们遇到的事\n\n大型设计和评审会话会留下**工作速记**：决策序号、审计项代码、计划章节号、任务和 stack 序号、评审者裁决。这些速记**在会话记录打开时读起来完全自然，会话一关就解析不到任何东西**。\n\n一次仓库范围的审计给出了具体清单（这本身就是个好示范——不是\"感觉有点乱\"，而是\"审计发现集中在 `packages/client`\"）：\n\n- 裸 `(decision 12/16/19/20/21)` 引用，其中**只有 decision 21 有已提交的拥有者**\n- `(audit C2/S1/S3/S7)` 代码——仓库里**任何地方都没有**对应的审计文档\n- `design §4.7` / `web2 §0` / `plan §1.4`——指向**未提交的草稿**\n- 计划阶段标签（`T2/T5/T9`、`P-I`、`W5`）\n- stack 位置（\"a later PR in this stack\"）出现在**持久 JSDoc** 里\n- \"ruling\" / \"design ledger\" 这类词汇\n\n同样的家族还出现在测试、CSS 注释、生成器模板、CI 注释和 Agent Note 里——包括 \"this PR / branch / review round\" 这种视角、评审编排式的归因，以及\"deferred to a later PR\"这类**过时声明（目标其实早已发布）**。\n\n然后是最关键的一句诊断：\n\n> The documentation standard already banned the change-history half (previously/now, PR and commit references) **but stated no counterpart rule for citations**, s
