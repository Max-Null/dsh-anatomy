修复缺失值\"的机会同时也是\"覆盖人的决定\"的机会**——所以宁可保留\"仅 opened、仅空值\"的窄行为，**也不要一个能修复更多、但也会破坏更多的东西**。\n\n### 他们承认的代价\n\n- 规划元数据**被限定在一个 Project 成员资格内**（同一个 Issue 在另一个 Project 里可以有不同值）\n- **字段重命名或类型变更会让工作流失败，而不是回退到 legacy 字段**（fail-loud 优于静默降级）\n- **空值读取让普通重试幂等**——但：\n  > Project field updates have **no compare-and-set precondition**, so simultaneous pull requests can both observe an empty Start Date and **the last mutation can win**.\n\n  **Project 字段更新没有 compare-and-set 前置条件，所以同时的 PR 可能都观察到空的 Start Date，最后一次变更胜出。** 竞态被明确写出来，而不是被\"重试幂等\"这句话掩盖过去。\n\n---\n\n## 3. 仅 master 的平台 CI\n\n`2026-09-06-master-only-platform-ci.md`\n\n### 他们遇到的事\n\nmacOS Intel/ARM 与 Linux ARM64 的 Python 运行时构建，加上通过 Wine 的 Windows 构建/站点检查，**在每一个 PR 修订上消耗付费托管容量**。\n\n而关键在于**证据的重叠**：**原生 Linux 和 Windows x64 已经提供必需的 executable 和 installed-wheel 证据，原生 Windows 检查也在合并前覆盖了构建与进程行为**。\n\n### 判断\n\n- PR 上要求 Linux x64 与 Windows x64 的运行时验证；**Linux ARM64 与两个 macOS 目标只在 master 推送时选中**\n- **Python 发布保留全部五个目标**\n- Wine **在托管 Ubuntu 上作为独立的 master job 跑一次**——因为它既提供检查，也提供默认分支的缓存生产，**所以不需要单独的缓存播种 job**\n\n### 明确接受代价\n\n被否决方案的第一条把取舍摊开：\n\n> This policy **explicitly accepts post-merge discovery for these four checks**.\n\n**这个政策明确接受这四项检查的\"合并后才发现\"。**\n\nConsequences 里再次直说：\n\n> A macOS, Linux ARM64, or Wine-specific regression **can merge while required PR checks are green**.\n\n**一个 macOS／Linux ARM64／Wine 特定的回归，可以在必需的 PR 检查全绿时合并。** 代价没有被措辞软化。\n\n而与之配套的边界也很清楚：**master 失败仍然是普通的失败 job，不是 `continue-on-error` 观察**——**代价是\"晚发现\"，不是\"不发现\"。**\n\n### 三处\"不声称自己验证不了的东西\"\n\n**① 本地调度测试不声称平台执行。**\n\n> Real platform execution **remains CI-owned**; local scheduling tests **do not claim native runtime or Wine execution**.\n\n**② 负控证明门禁\"能红\"。**\n\n> Executed negative controls **remove the Intel target, misroute Wine, and restore the stale aggregate dependency; each produces its intended failure**.\n\n移除 Intel 目标、错误路由 Wine、恢复陈旧的聚合依赖——**每一个都产生预期的失败**。这是第 01 批\"能红再改\"纪律的又一次落地。\n\n**③ 被取代的笔记仍然保留独立价值。**\n\n它**部分取代**了四篇更早的笔记，然后说明那些笔记\"仍然为 artifact provenance、平台保真度、串行完整性和信任规则而活跃\"——**部分取代要写明保留了什么**。\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 A（诚实的空白）——第 8 次，这次是\"把不稳定的部分排除出契约\"。**\n\n\"稳定的契约是增长形态，不是数值\"——**它没有假装能给出一个可靠的数字，而是把契约收缩到能稳定判定的那一层**。同一篇里的\"缺席必须有解释\"是这条模式的反面用法：**空白可以是诚实的，但必须是被标注过的空白**，否则读者无法区分\"这里没有\"和\"这里漏了\"。\n\n**模式 B（拒绝第二份真相）——新论据。**\n\n拒绝\"从源码生成中央上下文目录\"的理由不只\"会漂移\"，还有更根本的一条：**AST 能找到注册，但推断不出语义条件**。**当源信息不足以生成正确的副本时，这个副本不是\"需要维护\"，而是\"不可能正确\"。**\n\n**模式 C（别把不同的事混成一种状态）——\"Does not invalidate\" 的定义。**\n\n**\"不使前缀失效\" ≠ \"保证缓存命中\"**：前者是这个包能承诺的，后者只有 provider 能承诺。**一句话划清了责任边界。**\n\n---\n\n## 这批的共同判断标准\n\n**① 契约要住在实现本地。**\n\"包 README 是实现本地的契约；一份中央副本会增加另一个漂移点。\"**决定某份内容住哪里的，是\"谁在改动它\"，而不是\"谁在阅读它\"。**\n\n**② 数值不可得时，记录形态。**\n精确 token 数依赖 tokenizer、序列化、配置和运行时数据——**它不稳定，所以不进契约**。契约退到\"每次请求固定／条件性／保留／替换／有上限／零直接\"这一层：**能被稳定判定的部分**。\n\n**③ 缺席必须被标注，否则读的人无法解读。**\n\"无约束的缺席，在'审计过的零'和'忘记写文档'之间是模糊的。\"**空白也是一种陈述，它需要被授权。**\n\n**④ 一条政策不该依赖两套独立管理的权限。**\n不是因为做不到，而是因为**那把一个运维面变成了两个**。\n\n**⑤ \"修复缺失值\"的机会，往往也是\"覆盖人的决定\"的机会。**\n所以 Start Date 只在 opened 且为空时写。**能修复更多的东西，常常也能破坏更多——取舍要按最坏方向算。**\n\n**⑥ 明确接受代价，不要软化措辞。**\n\"明确接受这四项检查的合并后才发现\"\"一个回归可以在必需的 PR 检查全绿时合并\"。**同时说清代价的边界：是\"晚发现\"，不是\"不发现\"。**\n\n**⑦ 不声称自己验证不了的东西。**\n本地调度测试**不声称原生运行时或 Wine 执行**。**验证手段的边界要写在它的说明里**，否则会被当成它保证了更多。\n\n**⑧ 门禁管形式，评审管内容——而且要写明谁管什么。**\n\"评审仍然拥有覆盖率、链接相关性和事实准确性。\"\n\n**⑨ 测试要有负控。**\n移除一个目标、错误路由一个 job、恢复一个陈旧依赖——**每一个都必须产生预期失败**，否则你不知道这个测试能不能红。\n\n---\n\n## 下一步\n\n**进度 35/47（74%）**。剩余 12 篇。下一批：`release-rehearsal-selfhosted`、`serial-cross-platform-ci-reference`、`native-windows-pull-request-ci`、`node-compatibility-selfhosted`，之后是纯 runner 配置类（准备快速扫读）。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-12-身份与证据的可靠性.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-12-身份与证据的可靠性","title":"DSH 过程决策精读 · 第 12 批：身份与证据的可靠性","tags":[],"summary":"2026-09-06-release-rehearsal-selfhosted.md","bytes":14353,"lines":241,"body":"# DSH 过程决策精读 · 第 12 批：身份与证据的可靠性\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。共同问题是：**你怎么知道你面对的是你以为的那个东西？**\n> 身份该由标识符还是显示名决定？证据该来自哪里？什么算\"可以据此下结论\"？\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [自托管上的可信发布演练](#1-自托管上的可信发布演练) | 信任边界要窄，清理要不可绕过 |\n| 2 | [job 内分区覆盖](#2-job-内分区覆盖) | **仅仅\"进展缓慢\"永远不构成提高并发的证据** |\n| 3 | [按文件路径识别审批工作流](#3-按文件路径识别审批工作流) | 显示名不标识工作流文件 |\n\n---\n\n## 1. 自托管上的可信发布演练\n\n`2026-09-06-release-rehearsal-selfhosted.md`\n\n### 他们遇到的事\n\n两句话把取舍摆平：\n\n> Dependency-layout and release-pack rehearsals **consume hosted Linux minutes without requiring npm or API credentials**. Moving arbitrary pull-request code or credentialed publication onto a persistent shared host would **weaken isolation**; reusing a checkout without cleaning would also **weaken the packed-payload proof**.\n\n演练消耗托管的 Linux 分钟数，**却不需要 npm 或 API 凭据**——所以有省钱空间。但两个风险也明确：**把任意 PR 代码或有凭据的发布搬到常驻共享主机上会削弱隔离**；**复用一次没清理的 checkout 会削弱打包载荷的证明**。\n\n### 判断：窄的、显式的信任边界\n\n选择器要求**规范仓库**和**非 Dependabot 的 actor**，然后**只接受 master 推送、或同仓库非 fork 且作者不是 Dependabot 的 PR**。\n\n**手动 dispatch 总是选择 `ubuntu-24.04`**——所有其他被拒绝的上下文也一样。这条对应被否决的方案：\n\n> Allowing manual dispatch on arbitrary refs gives a maintainer action **broader persistent-host access than the explicit event trust rule**.\n\n**手动 dispatch 跑在任意 ref 上，会给一个维护者动作比\"显式的事件信任规则\"更宽泛的常驻主机访问权。**\n\n另有一个刻意的耦合被写明：**发布演练与主 CI 共享同一个 Linux 开关**——\"启用或禁用它**同时路由两种工作负载，而不是独立地路由发布**。\" 他们选择让开关语义简单，代价是两者联动。\n\n### 三条清理与隔离的设计\n\n**① 临时目录要落在\"即使进程被杀也会被清理\"的地方。**\n\n`TMPDIR` 指向 `runner.temp`：\n\n> so temporary npm consumers stay **outside the checkout but inside runner cleanup** even when **a killed process cannot execute `finally`**\n\n**临时 npm 消费者待在 checkout 之外、但在 runner 清理之内——即使一个被杀死的进程无法执行 `finally`。** **按\"finally 不会被执行\"来设计清理位置**，而不是假设它总会被执行。\n\n**② checkout 必须显式清理未跟踪与被忽略的输出。**\n\n它在**不可变安装和既有构建之前**清理。理由在别处点明：\n\n> a warm pnpm store **cannot substitute workspace links or stale build output for a tarball payload**\n\n**一个热的 pnpm store 不能替代 workspace links、也不能替代陈旧的构建输出去充当 tarball 载荷。** ——**打包验证的完整性依赖于\"补丁没有被别的东西悄悄填充\"**。\n\n**③ 打包安装验证器在 checkout 之外建全新消费者**，用 npm 安装 tarball、**移除继承的 Node 解析钩子**、并在 `finally` 里删除。\n\n**移除继承的解析钩子**这一条很关键：**否则验证器可能解到仓库里的源码，而不是 tarball 里的内容**——那就是\"你以为在验证 A，实际在验证 B\"。\n\n### 关于负控与边界的两句话\n\n测试跑负控：**fork、Dependabot、其他仓库、非 master 推送、dispatch、缺失 PR 数据、禁用的开关**。\n\n边界声明：\n\n> Real release-build and packed-install execution **remains the PR CI verification owner**; selector tests **do not claim to reproduce those builds**.\n\n**选择器测试不声称复现那些构建。** 与第 11 批\"本地调度测试不声称原生运行时执行\"是同一条。\n\n### 他们承认的代价\n\n- **这是操作者选择的后备，不是自动的 runner 健康检测，也不是对已排队 job 的故障切换**\n- 共享 VM **仍然会与其他可信 job 争用**\n- **没有 workflow 供应主机包，也不改变全局主机配置**（**\"谁能改主机\"被明确留在 workflow 之外**）\n\n---\n\n## 2. job 内分区覆盖\n\n`2026-08-18-in-job-partitioned-coverage.md`\n\n### 他们遇到的事\n\n**原生 Windows 覆盖是完整 PR 清单里最长的反馈路径。** 具体症状：\n\n- 把插桩套件保持在**一个单 worker 的 Vitest 进程**里，避免了更大进程池下出现的 **worker 丢失和 Node 24 CJS lexer 失败**\n- **但一次失败可能要超过十四分钟才出现**，而且门 runner **在完成前一直扣着子进程输出**\n\n两条硬约束同时压着：\n\n1. **优化必须保留每一个测试和合并后的逐文件 100% 阈值**\n2. **必须留在既有的 coverage job 内**——拆到多个 workflow job 会给必需拓扑**增加 checkout、安装、制品传输和一个 merge job**\n\n### 判断：一个 job 内多个单 worker 进程\n\n- 本地 `test:coverage` **仍然是一次 Vitest 调用**（本地保持简单）\n- CI 固定 `DSH_COVERAGE_PARTITIONS=4`\n- **没有基于经过时间的触发器会在运行进行中改变这个数**\n- 协调器用**最小堆按最长处理时间优先（LPT）**分配文件——\"**这样重量级的子进程绑定套件会分散开，而不是堆在路径哈希把它们扔进去的那个分片里**\"\n- 每个分区收到**临时 Vitest 配置**，include 是它自己的文件列表（**命令行传文件超过了 Windows CreateProcess 限制**）\n- **空分区在任何子进程启动之前就被拒绝**\n- **最重的分区最先启动**，让它的裁决最早落地\n- **分区模式在每个子进程里抑制阈值和覆盖率报告器**，每个进程写一个 blob 报告\n\n而裁决的唯一归属是：\n\n> The coordinator waits for every child, validates that the blob directory contains **exactly** the expected files, and then runs **one** `vitest --merge-reports ... --coverage`. **Only that merged command applies the repository's per-file thresholds, so a partition is never judged against an intentionally partial inventory.**\n\n**只有合并后的那一次命令应用逐文件阈值——所以一个分区永远不会被用一份有意不完整的清单来评判。**\n\n被否决的对照方案说得更直白：\n\n| 方案 | 否决理由 |\n|---|---|\n| **在每个分区里独立应用阈值** | **每个分区有意只看到套件的一部分，会报告假未覆盖文件。阈值所有权属于合并后的报告** |\n\n### 三个\"让证据可用\"的设计\n\n**① 失败也要留下可合并的证据。**\n\n> A normal failed test **still emits a blob through `--coverage.reportOnFailure`**, allowing the merge to report the complete coverage state before the coordinator returns failure.\n\n**一个正常的失败测试仍然发出 blob**，让合并能报告**完整的**覆盖状态，**然后**协调器返回失败。**失败不等于放弃完整性。**\n\n**② 具体失败要与最终诊断放在一起。**\n\n协调器保留每个子进程**一个有界的 64 KiB 合并尾部**；当子进程不成功地结算时，它打印 spawn 错误/退出码/信号，**并在验证完整 blob 集之前重复那个尾部**——\"**把具体的 Vitest 失败与最终的分区诊断放在一起**\"。\n\n**③ 清理要防链接陷阱。**\n\n**协调器只移除它自有的覆盖树，并把一个链接形状的路径 unlink 而不是递归跟随它。**\n\n### 本批最锋利的一句：关于\"什么时候才有资格调参\"\n\n> **Future tuning starts from completed runs at one fixed configuration. Slow progress alone never raises partition count or outer concurrency, because repeated restarts would erase the only evidence needed to choose a stable setting.**\n\n**未来的调优从一个固定配置的已完成运行开始。仅仅\"进展缓慢\"永远不会提高分区数或外层并发——因为反复重启会抹掉\"选择稳定设置\"所需要的唯一证据。**\n\n配套的一句同样干脆：\n\n> These values come from completed runs or fixed capacity bounds; **an unfinished run crossing an arbitrary elapsed-time mark is not evidence for increasing concurrency.**\n\n**一个跨过某个任意经过时间标记的未完成运行，不是增加并发的证据。**\n\n**这两句合起来是一条通用的反模式警告：在没有稳定基线时调参，会破坏调参本身所依赖的证据。**\n\n### 他们承认的代价\n\n- 覆盖**为每个分区付一次 Vitest 启动/配置成本，加上一次报告合并成本**\n- **分区输出可能交错**，但分区起始标签和 Vitest 文件身份保留了归因\n- Windows 用四分区**保留独立进程隔离并与 Linux 对齐，代价是更长的单 job 覆盖墙钟时间**——\"这个取舍被接受，以减少高自托管并发下的 vitest worker 启动失败\"\n- 性能数字带着口径说明：\"**那些值比较的是分区延迟，不是当前的峰值**\"\n\n---\n\n## 3. 按文件路径识别审批工作流\n\n`2026-09-10-approval-review-workflow-identity.md` · 短小精悍\n\n### 他们遇到的事\n\n> GitHub can populate a workflow run's `name` with its **expanded `run-name`**.\n\nGitHub **会用展开后的 `run-name` 去填充 workflow run 的 `name`**。审批评审工作流在那个标题里包含了 PR 号，于是**把 `workflow_run.name` 与静态工作流名比较，会在刷新审批状态之前拒绝掉有效的评审事件**。\n\n### 判断\n\n审批发布器**通过它确切的 `workflow_run.path` 识别评审事件工作流**。此外还要求：一个成功的 `pull_request_review` 运行、**从 `display_title` 解析 PR 号**、校验任何提供的 PR 关联、**并在评估审批之前比较当前 PR head 与被评审的 head**。\n\n最后那条是防止\"用旧的评审结论为新的提交背书\"——**审批必须绑定到它实际评审的那个 head**。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **接受一个名称前缀** | **一个显示名不标识工作流文件；另一个工作流可以使用同样的标题** |\n| **移除带编号的运行标题** | **该标题在 GitHub 返回空 `pull_requests` 数组时提供 PR 号**；移除它需要一个不同的交接机制 |\n\n第 1 条是身份判定的通则：**显示名是给人看的，它可以被任何同名的东西复用；标识符才是身份。**\n\n### 他们承认的代价\n\n- **运行标题展开不再阻止审批刷新，而一个意外的工作流文件仍然失败校验**（正确方向上的严格）\n- **移动评审事件工作流需要更新发布器的预期路径**——**把路径当身份，就要承担路径变化的维护成本**\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 D（验证到消费点 / 证据要成立）——本批给出了一条新的强度表述。**\n\n\"未完成运行不是增加并发的证据\"\"反复重启会抹掉唯一的证据\"——**这两句把\"什么算证据\"推进到了\"证据的形成条件\"**：不仅要求\"我看到的是真的\"，还要求\"**我看到的时候，条件没有被我的观察行为破坏**\"。\n\n**模式 C（裁决归属唯一）——再次印证。**\n\n\"阈值所有权属于合并后的报告\"：**分区有意只看到套件的一部分，所以它们不能独立判定。** 这与第 05 批\"评估失败 vs 条件未满足\"、第 10 批\"三种 `always()` 义务\"是同一类：**每个判定都要有唯一且明确的归属。**\n\n**模式 A——新形态：\"不声称验证不了的东西\"已成本批的固定收尾。**\n\n第 11 批的\"本地调度测试不声称原生运行时执行\"、本批的\"选择器测试不声称复现那些构建\"——**每篇都在末尾划定自己验证能力的边界。**\n\n---\n\n## 这批的共同判断标准\n\n**① 身份用标识符，不用显示名。**\n\"一个显示名不标识工作流文件；另一个工作流可以使用同样的标题。\" **显示名是给人看的，可被复用；路径/ID 才是身份。**\n\n**② 信任边界要窄，而且要显式到可枚举。**\n\"规范仓库 + 非 Dependabot actor + 只接受 master 推送或同仓库非 fork PR\"——**边界由具体条件组成，不由\"我们信任自己人\"这种态度组成**。手动 dispatch 被排除在自托管之外，因为它绕过了事件信任规则。\n\n**③ 清理要按\"finally 不会被执行\"来设计。**\n`TMPDIR` 指向 `runner.temp`，为的是**即使进程被杀、`finally` 没跑，临时物仍在清理范围内**。\n\n**④ 验证必须确保它在验证你以为的那个东西。**\n\"移除继承的 Node 解析钩子\"、\"checkout 显式清理未跟踪与被忽略的输出\"、\"一个热的 pnpm store 不能替代 tarball 载荷\"——**三处都在防\"验证器解到了别的东西\"**。\n\n**⑤ 只有稳定配置下的已完成运行，才构成调参的证据。**\n\"仅仅进展缓慢永远不会提高并发，因为反复重启会抹掉唯一的证据。\" **在基线不稳时调参，会破坏调参所依赖的证据本身。**\n\n**⑥ 判定的归属必须唯一。**\n\"阈值所有权属于合并后的报告\"——**一个有意不完整的部分，不能对自己作整体判定**。\n\n**⑦ 失败时也要留下完整证据。**\n失败测试**仍然发出 blob**，让合并报告完整状态之后才返回失败。**\"失败\"和\"证据残缺\"是两件事，不要用一个掩盖另一个。**\n\n**⑧ 优化不该改变拓扑。**\n\"必须留在既有 job 内\"——拆 job 会带来 checkout、安装、制品传输和 merge job。**在既有结构内解决问题，优先于为问题改变结构。**\n\n---\n\n## 下一步\n\n**进度 38/47（81%）**。剩余 9 篇：`serial-cross-platform-ci-reference`、`native-windows-pull-request-ci`、`ci-node-compile-cache-data-disk`、`node-compatibility-selfhosted`、`playwright-video-gif`，加 4 篇纯 runner 配置（`preview-hosted-runner-sizing`、`python-runtime-windows-hosted`、`blacksmith-failover-leg`、`parallel-macos-notarization`）。\n\n下一批读完这 9 篇（后者快速扫），即可进入总结阶段。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-13-别让省事的做法冒充正确做法.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-13-别让省事的做法冒充正确做法","title":"DSH 过程决策精读 · 第 13 批：别让省事的做法冒充正确做法","tags":["11.7.0"],"summary":"2026-07-21-serial-cross-platform-ci-reference.md","bytes":17438,"lines":264,"body":"# DSH 过程决策精读 · 第 13 批：别让省事的做法冒充正确做法\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。每篇都在拆穿一个\"看起来能解决问题、实际解决错了\"的做法：\n> 用超时表达性能目标、用清理解决容量增长、用提高帧率补充缺失的帧。\n> 三者的共同点是——**它们都能让指标变好，而问题还在。**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [串行跨平台 CI 参考](#1-串行跨平台-ci-参考) | 独立的完整性预言机，和刻意的重复 |\n| 2 | [重定向 Node 编译缓存](#2-重定向-node-编译缓存到数据卷) | **缓存不是残留** |\n| 3 | [Playwright 视频捕获](#3-playwright-视频捕获连续演示) | 提高帧率补不回没有的帧 |\n\n---\n\n## 1. 串行跨平台 CI 参考\n\n`2026-07-21-serial-cross-platform-ci-reference.md`\n\n### 他们遇到的事（三个递进的问题）\n\n**① 必需检查不该是唯一的完整性预言机。**\n\n> a defect in their gate inventory or dependency graph could **omit work while the required aggregate stays green**\n\n**门清单或依赖图里的一个缺陷，可能漏掉工作，而必需的聚合仍然全绿。**\n\n**② 把时间目标编码成超时，会制造一个独立的失败模式。**\n\n> Hosted-runner startup and performance vary, so **a correct gate can be cancelled at the target boundary before it emits useful diagnostics**.\n\n**托管 runner 的启动和性能会变化，所以一个正确的门可能在目标边界处被取消——还没发出有用的诊断。** 于是他们划开两个目标：**性能目标需要按 GitHub 时间戳测量，而正确性需要足够的时间去完成。**\n\n**③ 评审者需要一个更简单问题的直接答案**：当仓库完整的聚合在**没有矩阵选择、没有分片变量、没有并发门**的情况下跑在每个操作系统上，会发生什么？\n\n### 判断：一个独立的、串行的、可见的参考\n\n- **PR 和 master 推送被赋予互补的责任**：PR 跑 Linux/native Windows/Node 兼容/Python 检查，**master 推送拿三套 Python 运行时载体和 Wine**\n- master 上活跃的是**串行 standby** 引用，它们是\"**持续重新证明故障切换目标的 hot-standby 演练**\"\n- 每个参考 job 跑 `check:ci` **不带任何分片选择器**，`DSH_GATE_CONCURRENCY=1` 让聚合**一次执行一个就绪的门**\n- **\"独立 job 定义刻意保持它们简短的 checkout、运行时 setup 和不可变安装序列可见，而不是把操作系统藏在矩阵或可复用 workflow 后面\"**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **设每个超时等于它的延迟目标** | **调度方差会取消正确的工作，并压制诊断回归所需的证据** |\n| **只信任并发的主清单** | **调度和验证共享实现假设；一个串行聚合是独立的完整性检查** |\n| 每个 PR 都跑串行参考 | 它们重复完整的跨平台聚合，并给每个变更加 macOS 工作 |\n| 每个 PR 都跑真实内核沙箱矩阵 | 它的四个状态**不参与分支保护**，而重复安装、Landlock 构建、macOS 单元对等**消耗 runner 容量却不改变合并裁决** |\n| 用一个操作系统矩阵 | **三个具名 job 让参考面可见，而不需要另一个选择机制** |\n| 在更大的 runner 上跑串行参考 | **必需 CI 和它的独立参考都必须在组织自有池无法分配 job 时仍可运行** |\n\n第 2 条是本篇的核心判断：**\"调度和验证共享实现假设\"**——同一个实现既调度又验证时，它的错误会同时骗过两边。**所以需要一个走不同实现路径的独立检查。**\n\n第 6 条是另一条通用原则：**正确性路径必须能在没有\"仓库外部的 runner 配置\"的情况下运行。**\n\n### 三处平台正确性的处理\n\n**① 平台所有权要显式。**\n\n`terminal-bash` 支持 Linux 和 macOS，**因此它在 POSIX 上拥有它的单元与逐文件覆盖契约，而不是加载一个拒绝 `win32` 的后端**——**Windows 运行仍然执行每一个可移植包**，但**不声称覆盖一个它加载不了的后端**。\n\n**② 可移植 fixture 要真的可移植。**\n\n通过 `node:path` 推导原生路径；**用与生产相同的原生 realpath 实现**比较规范身份；**使用在每个主机上都合法的文件名**。\n\n**③ 别名归一化要按最长优先。**\n\nACP snapshot 运行把生成 cwd 的两种拼写都传给归一化器，**\"它按最长优先替换别名，这样 Windows 的短路径和长路径不能搅动共享 fixture\"**。\n\n### macOS 上的一处\"遏制而不是移除\"\n\n> Node 24 on macOS arm64 has **aborted in its CJS lexer from a worker thread**; **the process boundary contains that external runtime failure without removing any test from the aggregate**, while Linux and Windows retain the lower-overhead thread pool.\n\n**进程边界遏制了那个外部运行时故障，而不从聚合里移除任何测试。** 用结构隔离一个无法修复的外部缺陷，**而不是把它从检查范围里删掉**。\n\n同段还列了三处\"仓库自有的竞态在它们的观察边界处修复\"：dev bundle 轮询**先暂存**再发布重扫、缺失 bundle **保持 dirty 直到成功的内容哈希**、真实 PTY fixture **在运行时组装同步 token**（\"**这样交互式 shell 的输入回显不能满足一个子进程就绪等待**\"）。\n\n### 他们承认的代价\n\n- **工作流包含重复的 setup 步骤**，master 参考可能比优化的 PR 路径长得多——**\"那个重复是刻意的\"**：评审者能检查每个操作系统的完整命令，而不用解析矩阵或并发调度器\n- **参考可能暴露优化的阻塞集还不声称支持的平台故障**——而定性很关键：\n\n  > Such a failure is **evidence about current cross-platform behavior** rather than a reason to **weaken or silently skip** the aggregate.\n\n  **这样一个失败是关于当前跨平台行为的证据，而不是削弱或静默跳过聚合的理由。**\n- **只对真实主机内核或打包 Landlock 安装可见的回归，可以在 master 报告之前合并**——\"那个合并后检测窗口被接受，以换取从每个 PR 移除四个非阻塞 job；**默认分支保留完整的信号**\"\n- **移除严格时长超时，意味着延迟回归是被观察到而不是被自动取消**——因此**托管测量必须伴随性能变更**\n\n---\n\n## 2. 重定向 Node 编译缓存到数据卷\n\n`2026-08-28-ci-node-compile-cache-data-disk.md`\n\n### 他们遇到的事：一份带数字的现场勘查\n\n自托管 Linux CI VM（**一台主机上 32 个 runner 实例**）**耗尽了根分区的 inode 容量**。机制链查得很清楚：\n\n- pnpm 11.7.0 **在它的入口里启用缓存**（`bin/pnpm.mjs` 里的 `module.enableCompileCache?.()`），**每次调用都启用**\n- TypeScript 在 `tsc`/`tsserver` 里也这么做\n- **vitest 转发该 API 但不自己启用它**\n- 每一次这样的调用都把序列化的 V8 字节码缓存写到 `os.tmpdir()/node-compile-cache`\n\n实测（2026-08-28）：**697,389 个 inode 和 9.2 GB，其中 34,110 个文件年轻于 1 小时**。\n\n> the cache **grows on every CI run and is never cleaned**, so the root partition's 3,276,800 inodes **trend toward exhaustion** even after the `dsh-*` residue is controlled\n\n**缓存在每次 CI 运行时增长且永不被清理，所以根分区的 327 万 inode 趋向耗尽**——即使在另一处残留被控制之后。\n\n### 判断：结构性修复，而不是清理\n\n把 `NODE_COMPILE_CACHE` 重定向到每 runner 的数据卷临时目录（`/data_local`，1 TB，约 1% inode 使用）。**重定向是一个紧接 `actions/checkout` 的步骤，把变量写进 `$GITHUB_ENV`**，于是泳道里每个后续步骤都继承它。\n\n### 三个\"为什么不用更简单的做法\"\n\n**① 为什么不直接禁用编译缓存？**\n\n> `NODE_DISABLE_COMPILE_CACHE=1` would stop root-partition growth immediately but **forfeit the startup speedup on every run**, and the cache is a **legitimately useful Node feature**. **Redirecting preserves the benefit while moving the cost off the constrained partition.**\n\n**会立即停止增长，但每次运行都放弃启动加速。重定向保留了收益，同时把成本移出受限分区。** ——**\"关掉它\"永远是能立刻让指标变好的选项，代价是丢掉一个本来正当的功能。**\n\n**② 为什么不把 `node-compile-cache` 加进残留清扫？**\n\n> the CI sweep targets **test residue**; the compile cache is **a cache, not residue**. **Deleting it every run would discard the speedup the cache exists to provide.** Redirecting is **the structural fix**.\n\n**清扫针对的是测试残留，而编译缓存是缓存，不是残留。每次运行删除它会丢弃缓存存在的意义。** 这是本批最好的一个区分：**\"混乱\"和\"缓存\"看起来都是\"占地方的东西\"，但前者的正确处置是删除，后者是搬家。**\n\n**③ 为什么必须注入到 `$GITHUB_ENV`，而不是 job 级 env？**\n\n两个具体的技术事实：**`runner` 上下文在 job 级 `env` 里不可用**（求值为空字符串，会**静默地**把缓存留在根分区）；而只在门步骤加 step 级 env **会让更早的 pnpm 调用继续写根分区**。\n\n于是校验里有一条**位置断言**：`ci-workflow.spec.ts` 断言每个 Linux 泳道在 `pnpm/action-setup` **之前**注入该变量——**\"位置断言会在注入移到第一次 pnpm 调用之后时失败\"**。\n\n**\"在正确的位置做\"属于被测试的契约，而不只是实现细节。**\n\n### 一处经过实测的\"静默降级是可接受的\"\n\n受限子进程（bwrap/Landlock）如果沙箱不授予 `runner.temp` 路径，**会继承变量但静默跳过缓存**。他们在 VM 上验证了行为差异：\n\n> with `NODE_COMPILE_CACHE` pointing at an ungranted path inside bwrap, **`node` runs normally (exit 0)**, **unlike `mkdtemp` which fails hard** with a read-only filesystem error. The compile cache is **best-effort by design**; a failed write is **a cache miss, not a crash**.\n\n**在 bwrap 里指向一个未授权路径时，`node` 正常运行（exit 0），而不像 `mkdtemp` 那样以只读文件系统错误硬失败。** 由此判定：**编译缓存按设计是尽力而为的，一次失败的写入是缓存未命中，不是崩溃。**\n\n**先实测行为，再决定这个失败是否可接受**——而不是先假设再辩护。\n\n### 他们承认的代价（Bought / Cost 格式）\n\n- **Bought**：编译缓存不再消耗根分区 inode；**没有丢掉缓存的启动收益**\n- **Cost**：缓存在 `runner.temp` 里累积，**而 runner 在 job 之间不清空它**——但在数据卷上（约 1% inode）**那无害**（**代价被量化，然后判定无害**）\n- **Cost**：受限子进程跳过缓存，**\"这是缓存未命中，不是失败，且符合 Node 的尽力而为契约\"**\n- **Cost**：**本地开发保持默认的 `os.tmpdir()` 位置**——CI 与本地不同，且被写出来\n\n---\n\n## 3. Playwright 视频捕获连续演示\n\n`2026-09-08-playwright-video-gif.md`\n\n### 他们遇到的事\n\n第 04 批读过 GIF 证据链，现在补上视频模式。问题一句话：\n\n> A screenshot storyboard **omits intermediate animation frames** and can miss short-lived progress indicators. **Increasing the encoded GIF frame rate cannot recover motion absent from its source images.**\n\n**截图分镜省略了中间动画帧**；而**提高编码 GIF 的帧率，无法恢复它的源图像里没有的运动**。\n\n**插值补不出信息。** 输出采样率再高，源里没有的东西也不会出现——**所以正确的做法是提高源采样率（改用连续录制），而不是提高输出帧率。**\n\n### 判断与其他\n\n- **浏览器控制工作流优先**；当它暴露 `recordVideo` 时，**在同一个受控上下文里**捕获中间帧；否则截图\n- **视口与录制尺寸显式匹配，避免 Playwright 默认缩放到 800×800**\n- 编码器接受视频或截图目录；视频输入**选一个连续区间、应用声明的播放倍率、延长最后一帧**\n- **模式不当的选项和无效区间会失败**（fail-loud）\n- **\"失败的录制不能为一次成功的运行贡献帧\"**（第 04 批那条纪律的延续）\n\n### 一条划清\"演示\"与\"证据\"的规则\n\n> The original video remains available for review; **trimming and speed never establish model response latency.**\n\n**原始视频保持可评审；裁剪和加速永远不确立模型响应延迟。**\n\n**一旦你改变了时间轴，这个产物就不能再被当作时间证据。** 用它做演示可以，用它证明\"模型响应很快\"不行——**因为加速这个动作本身改变了被声明的那个量。**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 只提高编码帧率 | **重复稀疏的截图不会捕获额外的运动**（截图仍对显式状态保持、请求的分镜和无视频支持的工作流有用） |\n| 安装一个单独的录制器，或捕获桌面 | **仓库已经声明了 Playwright。** 另一个驱动增加 setup 和版本管理；**桌面捕获会包含无关窗口和个人状态** |\n\n第 2 条里那个理由值得记：**\"桌面捕获会包含无关窗口和个人状态\"**——**扩大捕获范围会把别人的隐私捎带进来**。\n\n### 他们承认的代价\n\n- **连续录制保留中间状态，所以评审者必须检查选定区间是否有敏感内容与可读性**——**新能力带来了新的评审义务**，而不是\"更真实所以更省事\"\n- 原始视频消耗额外暂存存储；**上下文关闭是成功录制的一部分，不是可选的清理**\n- **编码器的本地测试调用真实 ffmpeg 和 ffprobe**，需要媒体前置条件并**被显式运行；仓库 CI 不供应这些媒体二进制**\n\n最后那条又是\"不声称验证不了的东西\"：**这些测试不在 CI 里跑，就明说不在 CI 里跑。**\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 D（证据要成立）——\"独立预言机\"是一个新维度。**\n\n\"调度和验证共享实现假设\"——**如果一个检查与被检查的对象共享实现，它的通过不能独立地支持任何结论。** 这是\"证据\"要求的又一次升级：不只是\"验到消费点\"，还要\"**用一条不共享假设的路径去验**\"。\n\n**模式 A——\"不声称验证不了的东西\"再次出现（两处）。**\n\n\"仓库 CI 不供应这些媒体二进制\"（本地测试不在 CI 跑，就说明）；\"本地开发保持默认位置\"（CI 与本地不同，就写出）。\n\n**模式 C——\"演示\"与\"证据\"的区分。**\n\n\"裁剪和加速永远不确立模型响应延迟\"：**同一个产物的不同用法，其证明力不同；改变了时间轴，就不能再主张时间结论。**\n\n---\n\n## 这批的共同判断标准\n\n**① 独立检查不能与被检查对象共享实现假设。**\n\"调度和验证共享实现假设；一个串行聚合是独立的完整性检查。\" **同一个实现既调度又验证时，它的错误会同时骗过两边。**\n\n**② 超时不是性能目标的正确表达。**\n\"调度方差会取消正确的工作，并压制诊断回归所需的证据。\" **用取消来表达\"太慢了\"，会让你同时失去\"慢在哪\"的证据。**\n\n**③ 区分\"混乱\"与\"缓存\"。**\n两者看起来都是\"占地方的东西\"，但**前者的正确处置是删除，后者是搬家**。\"每次运行删除它会丢弃它存在的意义。\"\n\n**④ 结构性修复优先于周期清理。**\n重定向 vs 清扫、搬到为它定尺寸的卷 vs 定期删——**当增长是某个东西的正常行为时，问题在\"它长在哪\"，不在\"它长了\"。**\n\n**⑤ 插值补不出信息，要提高源采样率。**\n\"提高编码帧率无法恢复源图像里没有的运动。\" **输出端的任何加工，都不能让输入端不存在的信息出现。**\n\n**⑥ 一旦改变时间轴，就不能再主张时间结论。**\n\"裁剪和加速永远不确立模型响应延迟。\" **编辑手段与被声明的量相冲突时，产物的证明力归属要重新划定。**\n\n**⑦ 让参考面可见，值得付出重复的代价。**\n\"那个重复是刻意的：评审者可以检查每个操作系统的完整命令，而不需要解析矩阵或并发调度器。\"\n\n**⑧ \"在正确的位置做\"属于契约，不只是实现细节。**\n位置断言：**注入必须发生在第一次 pnpm 调用之前，否则整个目的落空**——所以测试断言的是位置。\n\n**⑨ 代价要量化，然后判定它可不可接受。**\n\"缓存在 `runner.temp` 里累积，runner 不清空它——但在数据卷上（约 1% inode）那无害。\"**先量，再判，而不是含糊地说\"影响很小\"。**\n\n**⑩ 新增能力带来新增义务。**\n\"连续录制保留中间状态，**所以评审者必须检查选定区间是否有敏感内容与可读性**。\" **能力变强时，责任清单同步变长。**\n\n---\n\n## 下一步\n\n**进度 41/47（87%）**。剩余 6 篇：`native-windows-pull-request-ci`、`node-compatibility-selfhosted` 两篇精读，加 4 篇纯 runner 配置（`preview-hosted-runner-sizing`、`python-runtime-windows-hosted`、`blacksmith-failover-leg`、`parallel-macos-notarization`）快速扫读。\n\n读完即 47/47，然后我会做**总的收束文档**——把 13 批里反复出现的判断标准合并去重。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-14-真正的瓶颈与不能证明的事.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-14-真正的瓶颈与不能证明的事","title":"DSH 过程决策精读 · 第 14 批：真正的瓶颈，与不能证明的事","tags":["3.12.3"],"summary":"2026-08-08-native-windows-pull-request-ci.md","bytes":16663,"lines":249,"body":"# DSH 过程决策精读 · 第 14 批：真正的瓶颈，与不能证明的事\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。每篇都有一个\"看起来该有效、实际没打中\"的手段：\n> 用 Wine 代替原生 Windows、用共享 Node 安装节省空间、用代理加速公证。\n> 三篇分别说明了它为什么不行，以及**真正的问题在哪**。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [Wine 与原生 Windows CI](#1-wine-与原生-windows-ci) | Wine 不能证明 NTFS、DACL、ConPTY |\n| 2 | [自托管上的隔离 Node 兼容 job](#2-自托管上的隔离-node-兼容-job) | 可变的共享链接会让结果取决于时序 |\n| 3 | [并行 macOS 公证](#3-从独立-app-副本并行-macos-公证) | 代理改善了 5 倍，但瓶颈不是带宽 |\n\n---\n\n## 1. Wine 与原生 Windows CI\n\n`2026-08-08-native-windows-pull-request-ci.md`\n\n### 他们遇到的事\n\n对 Wine 的定性非常干脆：\n\n> Wine checks the win32 toolchain **over a Linux kernel and case-sensitive ext4 with a hoisted dependency layout**. It **cannot prove NTFS, DACL, ConPTY, crash durability, or native process behavior**.\n\n**Wine 在 Linux 内核和大小写敏感的 ext4 上、用 hoisted 依赖布局检查 win32 工具链。它不能证明 NTFS、DACL、ConPTY、崩溃持久性或原生进程行为。**\n\n**所以它不是\"更便宜的 Windows 检查\"，而是一个覆盖面不同的检查。** 由此：PR 正确性需要**独立于合并后 Wine 结果**的原生 Windows 构建与进程检查。\n\n第二件事是一次覆盖审计：**陈旧的分数状态恢复了受支持 LSP 源码的临时排除**——于是原生 Windows 被要求**在同一个 100% 逐文件阈值下执行完整的受支持源码清单，而不是依赖一个更小的平台专属分母**。\n\n### 判断：三层裁决强度\n\n每个 PR 启动**四个独立的原生 job**。关键在于它们与必需聚合的关系**各不相同**：\n\n| job | 与 `all checks passed` 的关系 |\n|---|---|\n| `windows-build`、`windows-native-tests` | **是依赖**，结果阻塞 |\n| `windows-coverage` | **普通 job，缺席于聚合的 `needs`**——所以\"它的 100% 逐文件结果**保持红色且可见，而不延迟必需的裁决**\" |\n| `windows-observational` | **缺席于 `needs` 且用 `continue-on-error`**，因为 Linux 拥有阻塞性的静态/文档/包/构建产物裁决 |\n\n中间那一档值得单独记住：**\"保持红色且可见，但不延迟必需裁决\"是介于\"阻塞\"和\"跳过\"之间的第三种状态。** 第 05 批的 `pending`、第 10 批的三种 `always()` 义务，都是同一族的设计——**不要把所有不阻塞的东西都塞进\"忽略\"。**\n\n另一处与第 13 批形成对照的用法：逐 job 的截止时间是 60–120 分钟，作用是 **\"约束卡住的工作，而不把性能目标当作正确性截止时间\"**。**超时用来防挂死是对的，用来表达性能目标是错的**——两篇合起来把这条讲全了。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 让每个原生 Windows 结果都成为聚合的依赖 | 最高保真，**但让每次合并都等待覆盖和重复的观察清单** |\n| **在 PR 上只跑 Wine** | Wine 快速到达阻塞性 win32 分支，**但可以在一个真实的 NT、NTFS、PowerShell、进程或 addon 契约被破坏时报告绿色** |\n| 把每个非阻塞原生 job 都标 `continue-on-error` | 覆盖保持普通 job 且在 `needs` 之外，**所以阈值失败保持红色可见而不阻塞聚合** |\n| **排除看起来不支持的文件，或削弱 Windows fixture** | **受影响的行为是受支持的。** 对等平台分支被**狭窄地标记**；**可移植的结果留在分母里**，通过主机真实的 fixture 演练 |\n| 保持 GitHub 标准 `windows-2025` | 它能可靠完成，**但 32 分钟的串行结果让自动原生信号实用性差得多** |\n| **用 32 核或更大的 runner** | **32 核比较只比 16 核改进 1.47 秒，并在 Node 的 CJS lexer 里失败**；更早的 32/64 核试验在同一类里失败 |\n\n第 4 条是一条硬纪律：**不要为了测试变绿而缩小被测范围。** \"受影响的行为是受支持的\"——**所以它不是\"不测的东西\"，是\"本来就该测、之前漏了的东西\"**。\n\n第 6 条则是**用实测反驳\"加资源就行\"**：更多容量增加了分配成本，却没有稳定的端到端收益。\n\n### 一处\"第一次真实运行就抓到东西\"的记录\n\n> The first native run **exposed two failures hidden by the compatibility lane**.\n\n**第一次原生运行就暴露了两个被兼容泳道隐藏的失败**：文档投影测试**只按 `/` 切分**推导图片 basename；Chokidar 消费者**通过 `%TEMP%` 的 `C:\\Users\\RUNNER~1` 8.3 别名**收到路径，**而 libuv 返回长目录名**，触发了它的 Windows 事件路径断言。\n\n后者的修复被总结成一条可复用的规则：**在打开 watcher 之前规范化\"已存在的原生 watch base 或最深已存在祖先\"，并保留缺失的后缀。**\n\n### 他们承认的代价\n\n- **原生覆盖和观察结果仍可能在 `all checks passed` 变绿时待定或红色**——所以**分支保护消费定向的构建/进程检查，而评审者和后续自动化消费其余的原生结果**\n- **原生 job 在多处重复 setup 并重复构建，但它们降低了每个 job 的进程数**，并暴露被兼容泳道隐藏的缺陷\n- **维护者必须保留两套刻意的执行拓扑**（Wine 快照 vs 原生工作区），而且：\n\n  > A failure unique to either topology must be **classified against that boundary** rather than **weakened or silently skipped**.\n\n  **一个只对任一拓扑唯一的失败，必须针对那个边界分类**——不是被削弱，也不是被静默跳过。\n\n---\n\n## 2. 自托管上的隔离 Node 兼容 job\n\n`2026-09-06-node-compatibility-selfhosted.md`\n\n### 他们遇到的事\n\nNode 22.19/24.9/26 兼容 job **消耗托管 Linux 分钟数**，即使仓库已经选了自托管池。而搬迁的风险很具体：\n\n> Moving version installers onto a persistent shared machine can create **tool-directory collisions** and **accumulate generated cache files outside runner cleanup**.\n\n**工具目录冲突**，以及**在 runner 清理之外累积生成的缓存文件**。\n\n### 判断：用\"重复下载\"换\"隔离\"\n\n- **临时工具缓存**：\"**用重复的 Node 下载换取跨并发 runner 和 Node 版本的隔离**\"\n- 一个 **setup-node-only 的 ESM preload** 在 action 进程内给缓存赋值——因为**Actions runner 会在读完步骤配置之后覆写保留的环境变量**（所以只能在进程内改）\n- **一个执行期的路径检查拒绝 runner temp 之外的安装**\n- **兼容进程不继承那个 preload**；**不引入全局 Node 符号链接或系统包改动**\n- **托管 job 保留它们的工具与包缓存；自托管 job 不恢复也不上传托管包缓存**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持所有兼容 job 托管 | 避免额外共享主机负载，**但继续为\"不需要不同操作系统或架构\"的 Linux 运行时检查付费** |\n| **使用共享的 Node 安装或全局版本管理器链接** | **job 必须并发跑不同的 Node 发布版。可变的共享链接会让选定的版本取决于另一个 job 的时序** |\n| 在同一次变更里把 Python SDK job 也搬过来 | **它的 setup-python 安装和全局 pip 安装 uv 需要独立的隔离证据**；**它的短托管 job 并不是 Node 优化所需要的** |\n\n第 2 条是一条通用判据：**任何\"共享的可变位置\"都会把并发变成时序依赖。** 这与第 09 批 worktree hooks 那篇（共享 hooks 目录）是同一种病，只是这次的赌注是\"选中的 Node 版本\"。\n\n第 3 条是\"不捎带\"的又一例（第 05、07 批同款）。\n\n### 一处很实用的证据记录法\n\nVerification 段直接列出了三个真实 CI run 的编号与结论，包括一个**只读能力探针**报告：Linux x64、**192 在线逻辑 CPU**、GCC/G++ 13.3、Make 4.3、Python 3.12.3——以及**\"Python 3.10 缺席，强化了单独的 SDK 供应需求\"**。\n\n然后用一句边界收尾：\n\n> These observations establish **version and path compatibility, not an exclusive-host capacity guarantee**.\n\n**这些观察确立了版本与路径兼容性，不是独占主机的容量保证。** ——**用实测支撑结论，同时说清实测覆盖不到的地方。**\n\n### 他们承认的代价\n\n- 池**每个可信 PR 收到三个额外 job**；而 \"**9 月 6 日的清单报告 31 个 Linux 注册，不是 31 台独立机器**\"（第 08 批同款的诚实）\n- **共享 VM 的争用与下载延迟仍然是铺开风险；变量保留了托管恢复能力**\n\n---\n\n## 3. 从独立 App 副本并行 macOS 公证\n\n`2026-09-09-parallel-macos-notarization.md`\n\n### 他们遇到的事\n\nDMG（安装）与 ZIP（更新）需要两份产物。原本**在创建 DMG 之前等待 App 公证，把两次 Apple 提交串行化了**。\n\n而真正的障碍不是带宽：\n\n> **Stapling modifies the App**, so **concurrent notarization and packaging cannot safely share that writable directory**.\n\n**stapling 会修改 App，所以并发公证与打包不能安全地共享那个可写目录。** ——**并行化的障碍是\"同一个可写对象被两条流水线同时改\"，不是服务排队。**\n\n### 判断：先复制，再各走各的\n\n- 签名并验证**一个 App**，然后用 `ditto` **创建两份独立副本**\n- **App 泳道**：公证 + staple 它的副本 + 验证签名/票据/Gatekeeper，**并让 electron-builder 创建 ZIP 与 updater 元数据**\n- **DMG 泳道**：立刻打包它的副本、签名镜像，用既有的 artifact 完成钩子**公证、staple 并验证镜像**\n- 每个 electron-builder 进程**收到实际的 `.app` 路径**（`--prepackaged`）、**一个隔离的输出目录**、`--publish never`\n\n内容上有一个精细差异：**ZIP 里的 App 是单独 staple 过的**（因为 ZIP 更新会被独立解压，依赖在线或缓存票据）；**DMG 里的 App 没有单独 staple 的票据，由 DMG 的外层票据覆盖嵌套代码**。\n\n### 用\"记录缺席\"表达失败\n\n> Only two successful lanes allow promotion... The caller writes the release completion record **last**. **An error leaves that record absent, so the existing upload validation rejects the incomplete release.**\n\n**调用者最后写发布完成记录。一个错误会让那个记录缺席，所以既有的上传校验会拒绝不完整的发布。**\n\n**不是加一个\"是否成功\"的标志位，而是让成功才产生那个必需的东西**——这样\"忘了检查标志\"这种漏洞在结构上不存在。（与第 03 批\"绕过必须在结构上不可能\"同源。）\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **两条泳道共享一个 App** | **一个 DMG 读取者可以与 `stapler` 写入重叠，产生一个非确定性的 bundle**。独立副本让\"提交的字节\"与\"分发的字节\"在每条泳道内保持稳定 |\n| 只公证 DMG | **ZIP 更新独立分发且需要一个 staple 过的 App** |\n| **保持串行公证，只加代理** | **同一个 214.84 MiB 的 DMG，直传 203.83 秒、经测试的系统代理 38.59 秒，但两条路线都不移除 Apple 提交之间的串行依赖** |\n| 在一次 electron-builder 调用里跑两个目标 | **ZIP 必须读那个 staple 过的副本** |\n\n第 3 条是本批最好的一个分析样本：\n\n**代理把上传时间改善了 5 倍以上（203.83 → 38.59 秒），但它没有打中真正的瓶颈——两次 Apple 提交之间的串行等待。** 一个手段只要改善了某个可见指标，就很容易被当成\"问题解决了\"，**而当真正的约束是另一个量时，这个改善不会缩短总时长**。\n\n同一段还划了一条边界：**\"代理配置仍然是构建主机的事；打包脚本不改变主机网络设置。\"**\n\n### 他们承认的代价（含样本量声明）\n\n- 实测（2026-09-09，同一台 Mac、同一代理）：**并行 490.78 秒 vs 串行 751.33 秒，降低 34.7%**；两条泳道相隔 8 毫秒开始，App/ZIP 用 307.36 秒、DMG 用 268.54 秒完成；Apple 两次都接受，上传相隔约一秒\n- 紧跟一句限制：\n\n  > Each configuration has **one full-build sample**, so **cache and Apple queue variation prevent attributing the entire difference to concurrency**.\n\n  **每个配置只有一个完整构建样本，所以缓存和 Apple 队列变化使整个差异不能被归因于并发。**\n- 两份额外 App 副本增加了峰值磁盘占用；**两次上传可能争用带宽**；**\"阶段计时描述的是观察到的行为，而不是一个 CI 延迟预算\"**\n- **一个失败的泳道会等另一条完成再清理**——\"这可能延迟失败报告，**但避免了删除仍被一个子进程持有的文件**\"\n- 测试用**屏障**证明重叠、票据隔离、双侧错误收集、拒绝发布不完整产物；**一个受控的串行回归会让重叠断言失败**\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 C（别把不同的事混成一种状态）——\"第三种状态\"。**\n\n\"`windows-coverage` 缺席于聚合 `needs`，所以它的阈值失败**保持红色且可见，而不延迟必需的裁决**\"。**阻塞 / 可见但不阻塞 / 忽略，是三种不同的处置**，把它们压成两种必然损失信息。\n\n**模式 A——\"用实测支撑结论，同时说清实测覆盖不到的地方\"。**\n\n\"这些观察确立了版本与路径兼容性，**不是独占主机的容量保证**\"；\"每个配置只有一个完整构建样本，所以**不能被归因于并发**\"。**两处都是在给出结论的同时，主动削掉结论够不到的部分。**\n\n**一个可以复用的新判据：一个手段改善了可见指标，不等于打中了瓶颈。**\n\n代理把上传从 203.83 秒降到 38.59 秒（5.3 倍），**而总时长没变**，因为真正的约束是两次 Apple 提交之间的串行等待。**看到某个数字大幅改善时，要再问一次：这个数字是约束吗？**\n\n---\n\n## 这批的共同判断标准\n\n**① 说清一个手段\"不能证明\"什么。**\nWine **不能**证明 NTFS、DACL、ConPTY、崩溃持久性、原生进程行为。**它不是\"更便宜的 Windows 检查\"，而是覆盖面不同的检查**——所以不能拿它替代原生 job，只能让它承担它真正覆盖的那部分。\n\n**② \"红色但可见、不阻塞\"是第三种状态。**\n不是所有不该阻塞的东西都该被忽略。**分三档（阻塞 / 可见不阻塞 / 忽略），比只有两档能保留更多信息。**\n\n**③ 不要为了测试变绿而缩小被测范围。**\n\"排除看起来不支持的文件\"被拒绝，理由是**\"受影响的行为是受支持的\"**——它是\"之前漏测的东西\"，不是\"不该测的东西\"。\n\n**④ 更多资源不等于更好，要用实测判断。**\n32 核只比 16 核改进 1.47 秒，而且在 CJS lexer 里失败。**\"加资源\"是需要证据的主张，不是默认答案。**\n\n**⑤ 任何共享的可变位置，都会把并发变成时序依赖。**\n\"可变的共享链接会让选定的版本取决于另一个 job 的时序。\" **隔离的代价（重复下载）要明说，但换来的是结果的可复现。**\n\n**⑥ 一个手段改善了可见指标，不等于它打中了瓶颈。**\n代理把上传时间改善 5 倍以上，**而真正的约束是两次 Apple 提交之间的串行等待**。**看到某个数字大幅改善时，要再问一次：这个数字是约束吗？**\n\n**⑦ 用\"必需物缺席\"表达失败，而不是用一个可能被漏检的标志。**\n发布完成记录**最后写**，出错时它就不存在——**于是\"忘了检查标志\"这种漏洞在结构上不可能发生。**\n\n**⑧ 结论要附带它够不到的边界。**\n\"确立了版本与路径兼容性，**不是容量保证**\"；\"只有一个样本，**不能把差异归因于并发**\"。\n\n**⑨ 清理要等所有所有者结算。**\n\"失败的泳道等另一条完成再清理——**延迟失败报告，但避免删除仍被子进程持有的文件**。\" **报告的及时性让位于资源的正确释放。**\n\n---\n\n## 进度与下一步\n\n**进度 44/47（94%）**。剩余 3 篇，均为基础设施细节：\n\n- `2026-09-06-preview-hosted-runner-sizing.md`\n- `2026-09-06-python-runtime-windows-hosted.md`\n- `2026-09-09-blacksmith-failover-leg.md`\n\n下一批读完这 3 篇（预计快速扫读），即达 **47/47**，然后进行**收束**：把 14 个批次的「共同判断标准」合并去重成一份可直接查阅的总清单。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-15-回退参与者清单与默认值.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-15-回退参与者清单与默认值","title":"DSH 过程决策精读 · 第 15 批：回退、参与者清单与默认值","tags":["dsh-win-ci","dsh-win-ci-16","dsh-win-ci-21","dsh-win-ci-04","20260831.293.1","20260823.283.1"],"summary":"2026-09-06-preview-hosted-runner-sizing.md","bytes":15905,"lines":246,"body":"# DSH 过程决策精读 · 第 15 批：回退、参与者清单与默认值\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇 = 最后一批，47/47 完成**。\n> 三篇都在处理\"变更的边界\"：一个度量机制如何改变结论、一次失败的迁移如何完整记录、一个开关的**参与者清单**怎么划。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [实测的 PR preview runner 尺寸](#1-实测的-pr-preview-runner-尺寸) | 每分钟价格低，不保证每 job 成本低 |\n| 2 | [Windows Python 运行时回退到托管](#2-windows-python-运行时-ci-回退到托管) | **一份完整的失败迁移记录** |\n| 3 | [Blacksmith 作为故障切换腿](#3-blacksmith-作为-ci-池的故障切换腿) | 参与者清单必须逐个点名 |\n\n---\n\n## 1. 实测的 PR preview runner 尺寸\n\n`2026-09-06-preview-hosted-runner-sizing.md`\n\n### 他们遇到的事\n\n一个容易被忽略的计费机制，写在 Problem 的第一句：\n\n> **A lower per-minute runner price does not guarantee lower job cost because GitHub rounds each job upward to whole minutes.**\n\n**更低的每分钟 runner 价格，不保证更低的每 job 成本——因为 GitHub 把每个 job 向上取整到整分钟。**\n\n于是\"换更便宜的 runner\"这个直觉需要实测，而不是按单价推算。\n\n### 测量结果\n\n| Runner | 冷 / 热 job 秒 | 取整分钟 | 每个 USD | 工作区秒（冷/热） | preview 秒（冷/热） |\n|---|---:|---:|---:|---:|---:|\n| standard, 2 vCPU | 202 / 203 | **4** | **0.024** | 138.92 / 147.21 | 12.65 / 12.94 |\n| larger, 4 vCPU | 177 / 162 | 3 | 0.036 | 124.21 / 114.86 | 10.77 / 9.88 |\n| larger, 8 vCPU | 154 / 154 | 3 | 0.066 | 110.51 / 110.77 | 9.20 / 9.21 |\n| larger, 16 vCPU | 124 / 125 | 3 | 0.126 | 90.57 / 84.99 | 7.62 / 7.33 |\n\n结论：**标准版比 16 核便宜 80.95%、比 4 核便宜 33.33%**，代价是**比 16 核多 78 秒**。\n\n注意那个\"取整分钟\"列：标准版 202 秒取整成 **4 分钟**，而 16 核 124 秒取整成 3 分钟——**时间只差 78 秒，价格差 5.25 倍**。他们的判断是：**\"Preview 构建不足以证明那个 16 核溢价值得\"**（对一个以成本为焦点的决策）。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 16 核 | 最短的实测 job，**但每个样本多花 $0.102 换 78 秒的改进** |\n| 选 4 核或 8 核 | 两者都成功并缩短构建，**但它们取整后的样本成本超过标准 Ubuntu**；4 核保留更多 RAM/磁盘余量**如果未来工作负载耗尽标准容量**——**而这样的改变需要新的测量** |\n| 移到自托管 | **被范围否决**：preview 留在 GitHub CI |\n\n第 3 条的措辞值得记：**\"Rejected by scope\"** ——不是\"做不到\"，是**\"这超出本决策的范围\"**。**范围本身可以是一个否决理由，而且要说清是范围而不是能力。**\n\n### 一段罕见的\"诚实到过头\"的边界说明\n\n- **标准版暴露 2 vCPU / 7.75 GiB RAM**，工作区最大进程 RSS 是 2.86 / 2.76 GiB，preview 是 0.76 / 0.74 GiB，都没有 OOM 或超时。但紧接着：\n\n  > **GNU time RSS is not simultaneous process-tree memory.** These samples establish **successful execution, not a permanent memory guarantee**.\n\n  **GNU time 的 RSS 不是同时的进程树内存**；这些样本确立**成功执行，不是永久的内存保证**。\n- **比较固定了源码、锁文件、命令和运行时版本，但没有固定物理 CPU 或镜像发布**：标准版和 4 核用镜像 `20260831.293.1`，8 核和 16 核用 `20260823.283.1`；**CPU 在 AMD EPYC 9V74/7763 与 Intel Xeon 8370C/8573C 之间变化**。\n- **\"每个缓存状态一个样本，测量的是所提供的标签，不是隔离的 CPU 伸缩或统计可重复性。\"**\n- 关于把生产 job 的开销加进来：\"**那是一个预测，不是实测的标准 runner 发布结果**\"\n\n### 他们承认的代价\n\n- **用大约 78 秒的采样构建延迟，换取更低的计算成本**\n- **\"不从这个单一实验外推任何小时或月度的节省。\"**\n- **临时的基准工作流和它的安全测试不在最终树里；实验提交和链接的 run 保留了方法和证据**——**临时物清理掉，方法与证据留下。**\n\n---\n\n## 2. Windows Python 运行时 CI 回退到托管\n\n`2026-09-06-python-runtime-windows-hosted.md` · **一份完整的失败迁移记录，这类记录很少见**\n\n### 他们遇到的事：带时间线的失败复现\n\n之前一次迁移（PR #3629）把 Windows x64 目标路由到自托管池。结果：\n\n> The shared `dsh-win-ci` pool **did not make the lane more reliable**.\n\n随后是一份精确到分钟的记录（全部 UTC，每个 run 都执行了那个 07:56 合并起生效的选择器）：\n\n| 时间 | 结果 |\n|---|---|\n| **09:12** | 在 `dsh-win-ci-16` 上，installed-wheel 冒烟**通过**（PR #3640 的 commit `ca3ffe95`） |\n| **10:06** | 在 `dsh-win-ci-21` 上**失败**（PR #3337） |\n| **10:46** | 在 `dsh-win-ci-04` 上**失败**（PR #3640 的最终 head `c5ba873f`）——`smoke_sdk_profile_plugin` 的打包 `dsh plugin add` **子进程无输出地退出**，而**同一次运行的 Linux 和 macOS cell 都通过了** |\n| **11:29** | 一次 job 重跑**重复了同样的静默死亡** |\n\n还有一句点出根因的话：\n\n> The migration proposal (#3629) remained **`proposed`** because its **throughput and shared-load acceptance criteria were never measured**.\n\n**那份迁移提案一直停留在 `proposed` 状态——因为它的吞吐量与共享负载验收标准从未被测量。** 换句话说：**没有测量验收标准，就上线了。**\n\n### 判断：完整回退\n\n- Windows x64 目标**总是使用它的托管 `matrix.runner`**，配标准工具链、pnpm 缓存恢复和 pkg 缓存\n- **failover 选择器、job 私有 Python setup 步骤、自托管依赖安装与 post-step 清理、私有 setup 脚本、以及那个路由 spec 全部被移除**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 failover 路由 | **共享池在一天内重复了同样的静默子进程死亡两次，而迁移清单的吞吐量验收仍然开着；而且让一条正确性泳道经过 failover 状态，会把它耦合到一个无关的池故障开关** |\n| **修复共享池** | **留给池运维者**：观察到的失败是\"子进程无输出地死亡\"，**不是缺少镜像前置条件——而同一个镜像服务于原生 Windows failover job** |\n| 在托管镜像上保留 job 私有工具链 | **私有 uv/Python 下载的存在是为了避免改动一个常驻共享宿主；一次性托管镜像已经提供了迁移前泳道使用的已注册 Python 3.10 工具链** |\n\n第 1 条后半句是一个通用判据：**不要把\"正确性泳道\"接到\"故障切换开关\"上**——那会让一次无关的池故障影响到正确性信号的可用性。\n\n第 2 条也很干净：**\"这不是池配错了，是池本身不可靠\"**——承认问题归属不在自己这边，**然后把决策（回退）和自己的处置（不修池）分开**。\n\n### 一段\"给未来重试者的前置条件\"\n\nConsequences 的最后一部分列出了**四条必须重新建立的约束**：\n\n1. **setup-python 的 Windows 安装器会移除匹配的 machine/current-user 记录并为所有用户安装**——**私有 toolcache 不能隔离那个注册表状态**\n2. **每个构建缓存和临时测试根必须 job 自有，用复制导入而不是共享存储链接**\n3. **清理必须在成功、失败和取消时都运行**，带有界的 Windows 文件系统重试\n4. **只有 Windows x64 目标是可移植的——Linux 目标的 manylinux 检查需要 Docker**\n\n并且定下门槛：**\"未来的一次自托管尝试必须在实际池上重新验证吞吐量和失败可复现性，在任何路由变更之前。\"**\n\n**一次失败的迁移，留下的不是\"别再试了\"，而是一份\"要再试的话，先满足这些\"。**\n\n---\n\n## 3. Blacksmith 作为 CI 池的故障切换腿\n\n`2026-09-09-blacksmith-failover-leg.md`\n\n### 他们遇到的事\n\n第三方 runner 供应商的**迁移向导建议整体替换仓库的 `runs-on` 标签**。这在默认状态下不可接受，理由写得很完整：\n\n> it **breaks the workflow contract specs**, **distorts benchmark and performance-budget measurements**, and **moves trust-boundary jobs without a decision record**\n\n**它破坏工作流契约 spec、扭曲基准与性能预算测量，并在没有决策记录的情况下移动信任边界 job。** ——三个不同层面的理由，**没有一个是\"我们不信任第三方\"这种态度**。\n\n### 判断：一个显式开关 + 一份参与者清单\n\n`blacksmith` 作为一个**新值**加入两个 failover 变量。**只在设置期间花钱，所以它是显式的故障或实验选择，永远不是默认。**\n\n真正的工作量在**参与者清单**上——这份清单是这篇的核心价值：\n\n**参与的**：三个企业 Linux worker、`node-compat` 腿、`all-checks-passed` 裁决、四个 Windows 泳道、`expected-filenames`、sandbox bwrap 腿、两个手动基准矩阵。\n\n**不参与的（保持自己的 runner）**，按理由分类：\n\n| 类别 | 例子 |\n|---|---|\n| 被工作流 spec 钉在托管 runner 上 | `node-24-bench`、`python-sdk`、master Wine 门、`release-publish`、Cloudflare preview、加权审批对 |\n| **持有凭据** | real-API e2e 泳道、issue App-token job、npm 与 PyPI 发布器 |\n| **需要 Blacksmith 缺少的宿主能力** | Landlock 腿与其打包验证、Seatbelt 腿、linux-arm64 单 exe 腿 |\n| **release 形态的链** | npm/PyPI 发布器、node-addon-system release 链、Pages 部署——**因为它们的产物喂养已发布的 registry 输出** |\n\n以及两处\"有理由的不动\"：\n\n- **python-runtime 构建器完全保持托管**：它的调用者**传入真实 API 凭据**，它的 macOS/arm64 腿需要 GitHub 的镜像，**而它的 wheel 输出喂养 PyPI 发布链**\n- **release 演练 job 保持变更前的路由不变**：它们**只携带既有的 `selfhosted` 分支，所以在 `blacksmith` 下回落到托管默认值，且不获得 `blacksmith` 分支**——**没做的事也写明**\n\n还有一处与第 08 批呼应的细节：**blacksmith 分支不携带 Dependabot 排除**，因为**\"Blacksmith runner 是短暂的，所以让 Dependabot 留在托管池的那个'常驻 VM'理由不适用\"**。**同一个排除规则，在前提下失效时自动不适用——而这件事被写出来。**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 整体采用迁移向导 | **破坏工作流契约 spec、改变基准语义与性能预算校准，并作为默认把持有凭据和信任边界的 job 移到第三方基础设施上** |\n| 保持自建池作为唯一 failover 目标 | **它们是一个有界的备用；Blacksmith 为\"舰队本身即退化资源\"的故障与实验情形增加弹性容量** |\n\n### 一次精确到触发条件的故障归因\n\n试验暴露了一个 `verify-md-wrap` 在 Blacksmith 上失败的问题。归因写得非常克制：\n\n> The trigger is **the lstat-probe of a path beneath a matched symlink**, **not `**` over symlinked trees in general**: the other `globSync` `**` call sites that scan symlink-bearing trees **stayed green on the same run and needed no change**.\n\n**触发条件是\"lstat-probe 一个已匹配 symlink 之下的路径\"，而不是\"`**` 扫过含 symlink 的树\"**——证据是：**同一次运行里，其他扫描含 symlink 树的 `globSync` 调用点保持绿色，无需改动。**\n\n**用\"同类情况里哪些没出问题\"来收窄故障条件**，比笼统地说\"某个模式有问题\"精确得多。\n\n### 他们承认的代价（含未验证项的标注）\n\n- **blacksmith 腿保持休眠直到值被设置**，只在真实故障或显式实验期间被演练\n- **Blacksmith 把它的 runner 注册为 self-hosted，所以在该值下 `node-compat` 腿会真实执行它们的 toolcache 与隔离验证步骤**（而非跳过）\n- **基准矩阵的 8 和 32 vCPU 标签不在试验范围内，是按已实测的 4/16 vCPU 标签的命名对称推定的；首次使用前请用一次手动 dispatch 确认**\n- **Landlock、Seatbelt 和 linux-arm64 的排除仍基于更早迁移尝试的散文式 dispatch 实测，记录为已知缺口**；试验按设计无法触发这几条腿\n\n最后两条是\"哪些已验证、哪些是推定、哪些是已知缺口\"的三分法——**而且每一项都说清了验证手段的局限**。\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 A（诚实的空白）——最后一课：区分\"已验证 / 推定 / 已知缺口\"。**\n\n\"8 和 32 vCPU 标签……**按命名对称推定**，首次使用前请手动 dispatch 确认\"；\"Landlock、Seatbelt 和 linux-arm64 的排除仍基于**散文式 dispatch 实测**，记录为已知缺口\"。**不是简单标注\"未经验证\"，而是说清它凭什么被推定、以及怎么才能验证。**\n\n**一条新的通用判据：度量机制本身会改变结论。**\n\n\"每分钟价格低不保证每 job 成本低——**因为 GitHub 把每个 job 向上取整到整分钟**\"。**在比较两个方案之前，先弄清度量是连续的还是离散的**——离散化会让\"差 78 秒\"变成\"差 1 分钟\"，也可能反过来让优势消失。\n\n---\n\n## 这批的共同判断标准\n\n**① 先弄清度量机制，再比较方案。**\n取舍整到整分钟的机制让\"价格 5.25 倍差距\"对应\"时间只差 78 秒\"。**度量是离散的，直觉上的比例关系就不成立。**\n\n**② 不从单一实验外推。**\n\"不从这个单一实验外推任何小时或月度的节省。\"\"每个缓存状态一个样本，测量的是所提供的标签，**不是隔离的 CPU 伸缩或统计可重复性**。\"\n\n**③ 失败的迁移要完整记录，包括根因。**\n时间线精确到分钟、失败现象（**子进程无输出地退出，而同 run 的 Linux/macOS cell 通过**）、以及那个真正的根因：**\"验收标准从未被测量，提案一直停在 proposed\"。**\n\n**④ 回退时，给未来的重试者留下前置条件。**\n四条约束（注册表状态无法被私有 toolcache 隔离、缓存必须 job 自有且用复制导入、清理必须在成功/失败/取消时都跑、只有 Windows x64 可移植），加上门槛：**\"必须在实际池上重新验证吞吐量与失败可复现性，在任何路由变更之前。\"**\n\n**⑤ 变更要列参与者清单，逐个点名。**\n谁参与、谁不参与、**为什么**不参与（凭据 / 宿主能力 / 产物喂养发布链 / 工作流 spec 钉住）。**\"谁不受影响\"和\"为什么不受影响\"是同一份清单的两半。**\n\n**⑥ \"没做的事\"也要写明。**\n\"release 演练 job 保持变更前的路由不变……**不获得 `blacksmith` 分支**。\" **沉默会被读成\"忘了\"，而不是\"决定不做\"。**\n\n**⑦ 整体替换作为默认不可接受。**\n三条理由都不是态度：**破坏工作流契约 spec、扭曲基准测量、移动信任边界 job 而无决策记录。**\n\n**⑧ 用\"同类里哪些没出问题\"来收窄故障条件。**\n\"触发条件是 probe 一个已匹配 symlink 之下的路径，**不是 `**` 扫过含 symlink 的树**\"——依据是**同 run 里其他同类调用点保持绿色**。\n\n**⑨ 范围可以是一个否决理由，但要说清是范围而不是能力。**\n\"移到自托管——**被范围否决**。\"\n\n**⑩ 临时物清理掉，方法与证据留下。**\n\"临时的基准工作流和它的安全测试不在最终树里；**实验提交和链接的 run 保留了方法和证据**。\"\n\n---\n\n## 最终进度\n\n**47/47 完成（100%）**。全部 47 篇决策记录已精读，落盘为 15 份批次笔记 + 1 份索引。\n\n下一步：**收束**——把 15 个批次的「共同判断标准」合并去重为一份可直接查阅的总清单。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-判断标准总表.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-判断标准总表","title":"DSH 过程决策精读 · 判断标准总表","tags":["0.0.1"],"summary":"判断与门禁类","bytes":31830,"lines":472,"body":"# DSH 过程决策精读 · 判断标准总表\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **这份文件是什么**：15 个批次笔记各自有一个「共同判断标准」小节，累计约 120 条，彼此有明显重复（\"诚实的空白\"在 7 个批次里各写了一遍）。\n> 这里把它们**合并去重、按主题重排**，形成一份可直接查阅的清单。\n> **完整论证在批次笔记里**——每条后面的方括号是出处（`[01]` = 第 01 批），需要原文佐证时按索引去查。\n>\n> 来源：`DSHfork/.agents/notes/implemented/process/` 全部 47 篇决策记录（2026-06-11 → 2026-09-10）。\n\n---\n\n## 术语对照（读本系列时会撞到的英文词）\n\n**判断与门禁类**\n\n| 英文 | 中文 | 说明 |\n|---|---|---|\n| gate | 门禁 | 能自动跑、失败就非零退出的检查脚本 |\n| tripwire | 绊线式检查 | 简易触发式检查：一碰就报警，**不追求覆盖全部** |\n| advisory | 参考性的 / 提示性的 | 会跑会报告，但**不阻塞**合并 |\n| review-owned | 由评审负责 | 机器根本不跑，靠人看 |\n| fail loud | 大声失败 | 出错就报，不静默吞掉 |\n| non-zero exit | 非零退出 | 命令行表示\"失败\"的方式 |\n| allowlist / denylist | 白名单 / 黑名单 | 分别列出\"允许的\"与\"禁止的\" |\n| grandfather clause | 祖父条款 | 新规不溯及既往（只对之后的东西生效） |\n| ratchet | 棘轮 | 只紧不松——上限只降不升 |\n| Coverage gap | 覆盖缺口 | 明说\"这块没有门禁管\" |\n| Deferred | 推迟 | 暂时不做，但留着重启条件（**区别于\"否决\"**） |\n\n**工程与流程类**（★ = 在本系列正文中出现 5 次以上）\n\n| 英文 | 中文 | 说明 |\n|---|---|---|\n| ★ fixture | 测试夹具 | 测试用的固定输入数据 |\n| ★ coverage | 覆盖率 | 被测试执行到的代码比例 |\n| ★ rebase | 变基 | 把一串提交挪到新的基底上 |\n| ★ head | 提交顶端 | PR 当前指向的那个提交 |\n| ★ lease | 租约 | 带时限的独占权，超时自动失效 |\n| ★ artifact | 产物 | 构建 / 打包出来的文件 |\n| ★ partition | 分片 | 把一批工作切成几份并行 |\n| assertion | 断言 | 测试里判断真假的语句 |\n| no-op | 空操作 | 跑了但什么也不做 |\n| idempotent | 幂等 | 重复执行结果相同 |\n| regression | 回归 | 原本正常的功能变坏了 |\n| snapshot | 快照 | 某一时刻的完整记录 |\n| drift | 漂移 | 两份本该一致的东西渐渐不一致 |\n| stale | 陈旧的 | 过期了但还在被使用 |\n| seam | 接缝 | 模块之间的边界 |\n| invariant | 不变量 | 任何时候都必须成立的条件 |\n| payload | 载荷 | 打包后真正发布出去的内容 |\n| provenance | 来源 | 这个东西从哪来 |\n| verbatim | 逐字 | 一字不差地照抄 |\n| supersede | 取代 | 新决策顶替旧决策 |\n| rationale | 理由 | 为什么这么定 |\n| oracle | 预言机 | 判断正确性的独立依据 |\n| merge-forward | 向前合并 | 把主干合并进分支（而不是变基） |\n\n> **实测说明**：这些词在 15 份笔记正文里的出现频次大多很低（`advisory` 1 次、`review-owned` 0 次、`tripwire` 0 次）——**它们主要密集出现在对话回复里，不在笔记里**。\n> 笔记里英文较多的是**整句原文引用**：全系列 140 行引用中，**108 行是纯英文原文**（77%）。\n> 但已实测：**这 108 行全部（108/108）在前后 2–3 行内有中文**——**没有孤立的英文引用**，每一处原文附近都有中文说明。\n\n---\n\n## 一、地基：为什么要有规范\n\n**1. 可机械判定的不变量必须编码成检查，散文规则不作数。** `[01]`\n依据是两处独立印证——总纲的立场，以及文档预算门禁那句：\"积累**就发生在规则和评审注意力都在场的时候**；没有机械兜底的散文规则在这里被证明不成立。\"\n\n**2. 沉默不是中立：不写下规则，规则会被推断出来，而且更严。** `[03]`\n依赖政策从没写进 `AGENTS.md`，于是执行者从现状推断出\"别加依赖\"——**比任何人实际决定的都严格**。空缺的位置从来不会被留空。\n\n**3. 删门禁和加门禁一样需要记录，门槛更高。** `[01]`\n删 Knip 的三个条件：失败模式已被更窄的检查覆盖、泛化结果只是参考性而例外是硬维护成本、例外清单使普通变更依赖一份失真的图。\n\n**4. 规范只禁了一半，漏洞就从另一半漏进来。** `[02]`\n文档标准禁了\"变更历史\"（previously/now、PR 引用），却没管\"引用\"——于是 `(decision 12)`、`(audit C2)` 这类解析不到的序号一直往仓库里漏。\n**看任何规范都该问：跟它对称的那一半在哪？**\n\n---\n\n## 二、写一条规则\n\n**5. 规范要写成\"可判定的拒绝\"，不是风格建议。** `[08]`\n样式规范的 12 项检查表，每一项都是\"**看到 X，拒绝**\"。**检验标准：一个人读完这条规范，能不能在不咨询作者的情况下得出唯一结论？**\n\n**6. 写的人与评审的人共用同一张表。** `[08]`\n自我检查与评审检查是同一次动作——**这堵掉了\"规范知道但没执行\"的空间**。\n\n**7. 换一个宽泛的词等于什么都没做。** `[02]`\n\"把抽象标签统一换成 source/origin/metadata\"被否决：**另一个宽泛标签仍然让读者去猜**。只是把谜题换了个面。\n\n**8. 约束要在被约束者无知觉的情况下生效。** `[08]`\n暗色模式靠属性选择器的**整表覆盖**，于是**组件里零主题选择器**。**好的约束不需要被约束者配合。**\n\n**9. 表越大，表里每一项的权威越弱。** `[08]`\n拒绝 token 化字号与间距的理由：\"**膨胀的 token 表会稀释颜色 token 的权威性**。\" **约束范围由\"它能守住多少\"决定，不是\"它能覆盖多少\"。**\n\n**10. 用可预测性换精确性，通常是划算的。** `[06]`\n一条更精确的规则（\"这个类型是否每轮都被循环持有/派生/流式/记录\"）输给了一条更粗糙但可预测的规则（按仓库布局）：**要求\"逐例判断重要性\"的规则会在两个方向同时出错——收进不该收的，漏掉该收的**。\n\n**11. 一条政策不该依赖两套独立管理的权限。** `[11]`\n不是因为做不到，而是因为**那把一个运维面变成了两个**。\n\n**12. 不接受过渡态。** `[01]`\n\"全语料一个要求\"——没有 per-file rollout、没有日期截止线、没有类别特例。**过渡态是永久泄漏的开始。**\n\n**13. 缺席必须被标注，否则读的人无法解读。** `[11]`\n\"无约束的缺席，在'审计过的零'和'忘记写文档'之间是模糊的。\" **空白也是一种陈述，它需要被授权。**\n\n---\n\n## 三、设计一个门禁 / 检查\n\n**14. 错误的门禁会训练坏行为——比没有门禁更糟。** `[01]`\n一刀切天花板\"恰好惩罚正确的长文档\"，并产生逐文件覆盖的翻腾，**\"训练贡献者橡皮图章式地批准提高上限\"**。\n\n**15. 门禁的价值在强制决策的时机，不在度量精度。** `[01]`\n字数**不能判断质量**，但它**恰好在内容被添加的那一刻**逼出\"该放哪\"的决定——那是作者最清楚上下文的时刻。\n\n**16. 绕过必须在结构上不可能。** `[01]`\nmanifest **只列排除项**，不列包含项：\"不能让任何条目绕过发现流程而获得更弱的检查。\"\n\n**17. 校验要搭已有的车。** `[09]`\n断言放进测试泳道本来就在跑的 spec——**零新门进程、零新调度槽位、零新 CI 步骤**。这是对\"门禁本身是要维护的代码\"那条代价的直接回应。\n\n**18. 自动修复必须在信息不足时拒绝动手。** `[08]`\n未分类的运行时导出**阻塞所有 `--fix` 写入**。**证据不够时的\"尽力而为\"，等于用一个更强的语气说出一个更弱的判断。**\n\n**19. 验证与生成要分开。** `[10]`\nhook **只验证不重新生成**，所以\"绕过 hook 不能静默地祝福翻译漂移\"。**如果验证会顺手修正，绕过它就成了作弊通道。**\n\n**20. 独立检查不能与被检查对象共享实现假设。** `[13]`\n\"调度和验证共享实现假设\"——**同一个实现既调度又验证时，它的错误会同时骗过两边。**\n\n**21. 每条违规自带 `文件:行` 定位。** `[01][08]`\n漂移报告没有定位等于没跑；未分类导出给**一条可点击的 `path:line:column`**。\n\n**22. 测试要有负控。** `[11]`\n移除一个目标、错误路由一个 job、恢复一个陈旧依赖——**每一个都必须产生预期失败**，否则你不知道这个测试能不能红。\n\n**23. 门禁管形式，评审管内容——而且要写明谁管什么。** `[11]`\n\"评审仍然拥有覆盖率、链接相关性和事实准确性。\"\n\n**24. 不能被机械判定的规则，要么推迟，要么明说缺口。** `[02]`\n他们对\"禁用词汇\"**推迟**了门禁并列出高精度候选清单备用，同时**主动写出**\"覆盖缺口：没有门禁拒绝新的序号引用——这条规则由评审承担\"。**两条路都比'假装有门禁'诚实。**\n\n**25. 让检查\"意外可选\"不是中立行为。** `[09]`\n\"停止自动安装 hooks 会让廉价的提交/推送检查意外变成可选的，**尤其是在短命的 agent worktree 里**。\"\n\n---\n\n## 四、处理不确定性：诚实的空白（出现 9 次，最强形态在 `[10]`）\n\n**26. 不确定的地方要标注，不要补齐。** `[02][04][05][06]`\n无法重建 alternatives 的旧笔记，永久保留一行\"此处不可重建\"，**而不是补一段像样的理由**。\n\n**27. 算不出来时，不要给出一个看起来对的答案。** `[10]` ← **最强形态**\nGit 合并驱动的启动器**能算出一个干净的文本合并结果，却仍然返回冲突**——因为那个结果没经过驱动的校验。**未经校验的结果冒充校验过的结果，比明确失败更危险。**\n\n**28. 数值不可得时，记录\"形态\"。** `[11]`\n精确 token 数依赖 tokenizer／序列化／配置／运行时数据，**它不稳定，所以不进契约**；契约退到\"每次请求固定／条件性／保留／替换／有上限／零直接\"这一层。\n\n**29. 不声称自己验证不了的东西。** `[11][12]`\n\"本地调度测试**不声称**原生运行时或 Wine 执行\"；\"选择器测试**不声称**复现那些构建\"。\n\n**30. 区分\"已验证 / 推定 / 已知缺口\"。** `[15]`\n8 和 32 vCPU 标签\"**按命名对称推定**，首次使用前请手动 dispatch 确认\"；Landlock 等排除\"仍基于**散文式 dispatch 实测**，记录为已知缺口\"。**不是笼统标注\"未经验证\"，而是说清它凭什么被推定、以及怎么才能验证。**\n\n**31. 结论要附带它够不到的边界。** `[14]`\n\"确立了版本与路径兼容性，**不是容量保证**\"；\"只有一个样本，**不能把差异归因于并发**\"。\n\n**32. 明确接受代价，不要软化措辞。** `[11][15]`\n\"明确接受这四项检查的**合并后才发现**\"；\"**明确接受 standby 饥饿**\"。**同时说清代价的边界：是\"晚发现\"，不是\"不发现\"。**\n\n---\n\n## 五、证据与验证\n\n**33. 相似性不构成同一性。** `[04]`\n四种伪装：视觉相似（不同运行的帧）、结果相似（聊天记录显示成功但隐藏失败路径）、来源相似（历史加速看起来是现成答案）、名称相似（宽泛标签替代语义分类）。\n\n**34. 要验到\"评审者真正使用的那条路径\"。** `[04][07][12]`\nGIF 发布不满足于\"push 成功\"，要重读活体 body、用 Markdown API 渲染、抓取上传 URL 确认 `200 image/gif`——**那才是评审者实际看的东西**。\n\n**35. 通用问法：这个验证手段短路掉了什么？** `[07]`\n**被短路的那一段，就是故障的藏身处。** \"fixture 全绿不算完成\"的依据正是：\"fixture 短路掉的正是链路运载链，**而两个经验确认的 bug 都藏在那里**。\"\n\n**36. 验证必须确保它验证的是你以为的那个东西。** `[12]`\n三处防护：**移除继承的 Node 解析钩子**（否则可能解到源码而非 tarball）、**checkout 显式清理未跟踪与被忽略的输出**、**\"一个热的 pnpm store 不能替代 tarball 载荷\"**。\n\n**37. 验证手段不能改变被验证的行为。** `[04]`\n用 fixture 替换不可访问的原生 UI 被否决，因为**那通过改变被观察的产品路径来让自动化更容易**。**凡是让\"验证更容易\"的改动，都要先问它有没有改变被验证的东西。**\n\n**38. 只有稳定配置下的已完成运行，才构成调参的证据。** `[12]`\n\"仅仅进展缓慢永远不会提高并发，**因为反复重启会抹掉唯一的证据**。\" **在基线不稳时调参，会破坏调参所依赖的证据本身。**\n\n**39. 每个 bug 修复钉一个断言，且钉在它所属的层。** `[07]`\n一个原本只能靠 12 秒浏览器哨兵防守的问题，被钉成**纯 Node 的秒级用例**。\n\n**40. 失败时也要留下完整证据。** `[12]`\n失败测试**仍然发出 blob**，让合并报告完整状态之后才返回失败。**\"失败\"和\"证据残缺\"是两件事，不要用一个掩盖另一个。**\n\n**41. 用\"必需物缺席\"表达失败，而不是一个可能被漏检的标志。** `[14]`\n发布完成记录**最后写**，出错时它就不存在——**于是\"忘了检查标志\"这种漏洞在结构上不可能发生。**\n\n**42. 判断错误方向，并往安全的那一侧倾斜。** `[09]`\n运行时披露层**刻意覆盖每一个可挂载的插件**：\"**对一份法律声明来说，披露不足才是代价高昂的方向。**\" **每条规则都该问：如果我错了，会往哪边错？**\n\n**43. 先弄清度量机制，再比较方案。** `[15]`\n\"更低的每分钟价格不保证更低的每 job 成本——**因为 GitHub 把每个 job 向上取整到整分钟**。\" **离散化的度量会让比例直觉失效。**\n\n**44. 不从单一实验外推。** `[15]`\n\"不从这个单一实验外推任何小时或月度的节省。\"\n\n**45. 一个手段改善了可见指标，不等于它打中了瓶颈。** `[14]`\n代理把上传从 203.83 秒降到 38.59 秒（**5.3 倍**），**而总时长没变**——真正的约束是两次 Apple 提交之间的串行等待。**看到某个数字大幅改善时，要再问一次：这个数字是约束吗？**\n\n**46. 用\"同类里哪些没出问题\"来收窄故障条件。** `[15]`\n\"触发条件是 probe 一个已匹配 symlink 之下的路径，**不是 `**` 扫过含 symlink 的树**\"——依据是**同 run 里其他同类调用点保持绿色**。\n\n---\n\n## 六、状态与语义\n\n**47. 未满足 ≠ 失败；没有 ≠ 有但不同。** `[05]`\n`pending`（条件未满足，可解决）/ `success` / `error`（评估本身失败）；registry 的\"没有那个版本\"与\"有但内容不同\"是两个状态——**两种\"已经存在\"只有一个是真的问题**。\n\n**48. 同一个字段名不该回答两个问题。** `[10]`\n`devDependencies` 回答\"安装器要不要下载\"，**不能**回答\"要不要披露\"；`always()` 要区分\"失败聚合\"、\"资源清理\"、\"被取消运行的簿记\"三种义务。**当一个字段名开始承担第二个问题时，错误就藏在两个问题的差集里。**\n\n**49. 状态要表达交接，不要表达判定。** `[03]`\n\"谁拥有下一步\"能驱动行为；\"GitHub 认为可合并\"会在具体反例上说谎。\n\n**50. 三种处置，不是两种：阻塞 / 可见但不阻塞 / 忽略。** `[14]`\n`windows-coverage` 缺席于聚合 `needs`，所以\"它的阈值失败**保持红色且可见，而不延迟必需的裁决**\"。**把三种压成两种必然损失信息。**\n\n**51. 判定的归属必须唯一。** `[12]`\n\"阈值所有权属于合并后的报告\"——**一个有意不完整的部分，不能对自己作整体判定。**\n\n**52. 幂等 = 重复执行不产生新状态。** `[05]`\n跳过状态建立在**内容相等**（integrity 相同）而非版本相等上。**好流程的标志是：重跑它是一件无聊的事。**\n\n**53. 身份用标识符，不用显示名。** `[12]`\n\"一个显示名不标识工作流文件；另一个工作流可以使用同样的标题。\" **显示名可被复用，路径/ID 才是身份。**\n\n**54. 形式检查不是语义检查。** `[05]`\nIssue 政策检查了正文长度和标题语言，**却无法确立\"请求的工作、预期行为、交付物是否清晰\"**。**每条政策都该被问一次：它失败的时候，能不能指出缺失的那个决策？**\n\n**55. 自动化的边界由\"谁拥有这份元数据\"划定。** `[03]`\n本地能确定的事自动做；**共享元数据或影响链外的事留给人类**。\n\n**56. 混淆状态时，错误的方向是\"把失败显示成通过\"。** `[10]`\nsuccess-only 的聚合\"**能把失败的依赖藏在一个被跳过的必需检查后面**\"——比漏报更危险，因为漏报还有机会被发现。\n\n---\n\n## 七、派生物与单一归属\n\n**57. 一份事实只该有一个家，而且那个家要可预测。** `[06]`\n索引复制路径与日期、类型该跟着包走而不是\"重要性\"、每个粘贴声明只有一个家——三个层面上的同一个要求。\n\n**58. 第二份真相有两种成本：漂移，以及争用。** `[06]`\n生成的索引不只是\"要同步\"，**它还把你无关的改动拖进同一份文件**。\n\n**59. 三问决定\"消除\"还是\"自动化\"。** `[09]`\n**① 它是必需的吗？② 源变化时能自动重生成吗？③ 校验能搭现成的车吗？** 三问都否就该消除它；都满足就该接受它并把同步自动化。\n反面教材：把校验做成专门的 `doc-sync` 门，它\"**唯一的失败模式，是在一个贡献者推完无关的依赖升级几分钟后，告诉他去重跑生成器**\"——**把同步成本推给一个人**。\n\n**60. 当源信息不足以生成正确的副本时，这个副本的问题不是\"需要维护\"，而是\"不可能正确\"。** `[11]`\nAST **能找到注册，但推断不出语义条件**（历史保留、输出截断、父子可见性）。\n\n**61. 冻结要真的冻结，包括放弃维护义务。** `[06]`\n归档笔记**被所有其他文档门禁排除**，且**不随重命名包、变化的行为、翻译标准、格式规则、断裂链接更新**。**只冻结内容而不划掉维护义务，等于没冻结。**\n\n**62. 归档与删除的语义不能混。** `[06]`\n归档 = \"已实现的历史决策\"。过时的提案要**明确拒绝**，没价值的拒绝要**删除**，而不是找第二个低价值存放区。\n\n**63. 删除时要区分\"引用\"与\"理由\"。** `[02]`\n死产物的引用可以删，但**事实分句要保留或重述**。\n\n**64. 契约要住在实现本地。** `[11]`\n\"包 README 是实现本地的契约；一份中央副本会增加另一个漂移点。\" **决定内容住哪里的，是\"谁在改动它\"，不是\"谁在阅读它\"。**\n\n**65. 本地分歧要记账。** `[07]`\n\"Cordis vendor 副本与上游又多了一处类型结构分歧，同步时必须重新应用或显式退役。\" **每一笔本地定制都是未来要偿还的债。**\n\n**66. 临时物清理掉，方法与证据留下。** `[15]`\n\"临时的基准工作流和它的安全测试不在最终树里；**实验提交和链接的 run 保留了方法和证据**。\"\n\n---\n\n## 八、变更与边界\n\n**67. 越界的机制不能走那条被阻塞的路径。** `[08]`\nCI 故障切换被设计成**仓库变量**而非一次合并，因为\"**它在检查是红的时候也能工作**\"。**设计应急机制时先问：它依赖的通道，在它要应对的那种故障里还通吗？**\n\n**68. 冗余 ≠ 替换。** `[08]`\n\"让自建池永远留在必需路径里\"被否决：**那是拿 B 的可用性换 A 的可用性——移动了单点故障，没有增加回退。**\n\n**69. 变更要列参与者清单，逐个点名。** `[15]`\n谁参与、谁不参与、**为什么**不参与（凭据 / 宿主能力 / 产物喂养发布链 / 工作流 spec 钉住）。**\"谁不受影响\"和\"为什么不受影响\"是同一份清单的两半。**\n\n**70. \"没做的事\"也要写明。** `[15]`\nrelease 演练 job \"**不获得 `blacksmith` 分支**\"。**沉默会被读成\"忘了\"，而不是\"决定不做\"。**\n\n**71. 整体替换作为默认不可接受。** `[15]`\n三条理由都不是态度：**破坏工作流契约 spec、扭曲基准测量、移动信任边界 job 而无决策记录。**\n\n**72. 范围可以是一个否决理由，但要说清是范围而不是能力。** `[15]`\n\"移到自托管——**被范围否决**。\"\n\n**73. 限定范围本身就是防御。** `[04]`\n\"**有限的场景/修复范围，防止一个宽泛的性能请求变成一次无关的架构重写。**\"\n\n**74. 拒绝把手头问题变成一个通用层。** `[09]`\n\"构建通用 hook 管理器\"被否决：**顺序、参数转发、失败语义、升级会变成与目标无关的仓库自有行为。**\n\n**75. 顺手能做的事，如果不是本次决策的一部分，就不做。** `[05]`\n自动元数据修复被拒绝的理由是\"**它们是独立的决策，而不是随一次政策简化捎带进来**\"。**范围蔓延最隐蔽的形式，就是那些看起来相关且容易的事。**\n\n**76. 优化不该改变拓扑。** `[12]`\n\"必须留在既有 job 内\"——拆 job 会带来 checkout、安装、制品传输和 merge job。\n\n**77. 文档和代码在同一次变更里移动。** `[09]`\n\"必须移动 `engines.node`、兼容矩阵和**这篇 Agent Note**\"——**文档是必须同步移动的三样东西之一。**\n\n**78. 政策反转时要记录被否决政策的完整理由。** `[10]`\n旧豁免当初要保护什么、它的成本被什么界定、以及**\"明确接受 standby 饥饿\"**。\n\n**79. 回退时，给未来的重试者留下前置条件。** `[15]`\n四条约束 + 门槛：\"**必须在实际池上重新验证吞吐量与失败可复现性，在任何路由变更之前。**\" **一次失败的迁移留下的不是\"别再试了\"，而是\"要再试的话，先满足这些\"。**\n\n**80. 失败的迁移要完整记录，包括根因。** `[15]`\n时间线精确到分钟、失败现象、以及真正的根因：**\"验收标准从未被测量，提案一直停在 `proposed`。\"**\n\n**81. 不做的事也要列出来。** `[03]`\n\"不重建评审轮次、不查询 `reviewDecision`、**不加定时对账器**\"——**它划出了\"这条命令管到哪为止\"**。\n\n**82. 选介入点，要选在所有路径都必经的地方。** `[10]`\n包装一个命令只能覆盖\"使用那个命令\"的场景；**合并驱动是裸 Git、stack 工具、rebase、cherry-pick 共享的扩展点**。\n\n**83. 部分成功必须非零退出。** `[10]`\n\"调用者不能把一次部分解析误认为完成的合并。\" **能做完多少就做多少，但汇报时必须说\"没做完\"。**\n\n**84. 失败契约要含\"可观察状态\"。** `[10]`\n那张表三列：失败、**可观察状态**、恢复。**恢复的第一步是识别，所以识别条件属于契约。**\n\n**85. 说清能力的边界，不把\"可取消\"包装成\"会变快\"。** `[10]`\n\"取消是一个**请求**，不是立即终止的保证……它让过时验证可被取消，**不承诺**固定的运行时长或取消延迟。\"\n\n---\n\n## 九、工具与资源\n\n**86. 趁爆炸半径小的时候换承重工具。** `[07]`\n\"现在换\"的依据是**可枚举的**：还没有任何东西发布、工具只需做三件事、唯一专属资产小而机械。\n\n**87. 让工具的错误成为防线。** `[07]`\npnpm 篇**刻意不加** hoisted 逃生舱，因为非扁平 `node_modules` 让**幻影依赖大声失败**——他们对一个\"整个质量故事都是机械门禁\"的仓库称之为 *a feature*。**选工具时问的不是\"它的报错会不会烦到我\"，而是\"它的报错恰好是我需要的那个信号吗\"。**\n\n**88. pin 比范围好；类型不能领先于运行时下限。** `[09]`\n浮动的 major 条目\"**会随时间长上去，并静默停止演练声明的下限**\"；类型跑在运行时前面，**会把运行时故障伪装成编译通过**。\n\n**89. 更多资源不等于更好，要用实测判断。** `[14]`\n32 核只比 16 核改进 **1.47 秒**，而且在 Node 的 CJS lexer 里失败。**\"加资源\"是需要证据的主张，不是默认答案。**\n\n**90. 任何共享的可变位置，都会把并发变成时序依赖。** `[09][14]`\n共享的 Git hooks 目录会让\"一个 worktree 的安装改变另一个的行为\"；可变的共享 Node 链接会\"**让选定的版本取决于另一个 job 的时序**\"。**隔离的代价要明说，但换来的是结果的可复现。**\n\n**91. 结构性修复优先于周期清理；区分\"混乱\"与\"缓存\"。** `[13]`\n\"编译缓存是**缓存**，不是**残留**。每次运行删除它会丢弃缓存存在的意义。\" **当增长是某个东西的正常行为时，问题在\"它长在哪\"，不在\"它长了\"。**\n\n**92. 超时用来防挂死是对的，用来表达性能目标是错的。** `[13][14]`\n\"调度方差会取消正确的工作，**并压制诊断回归所需的证据**\"；而正确的用法是\"**约束卡住的工作，而不把性能目标当作正确性截止时间**\"。\n\n**93. 隔离/清理要按\"finally 不会被执行\"来设计。** `[12]`\n`TMPDIR` 指向 `runner.temp`，为的是**即使进程被杀、`finally` 没跑，临时物仍在清理范围内**。\n\n**94. 清理要等所有所有者结算。** `[14]`\n\"失败的泳道等另一条完成再清理——**延迟失败报告，但避免删除仍被子进程持有的文件**。\"\n\n---\n\n## 十、工作方式\n\n**95. 不留悬空的红。** `[07]`\n行为变更让用例变红时**当场对账**（修测试或修代码，以契约为仲裁）。**一个挂着的红，会让之后每一次\"红了\"都失去意义。**\n\n**96. 知道该怎么修就直接修，别评论。** `[04]`\n\"只评论不修复\"被否决的理由：**它保留无效状态并要求人工清理**。**把一个可自动完成的修复降级成一条提示，是把自己的成本转给未来的某个人。**\n\n**97. 分层要沿着架构的自然接缝，而且层间不重复测试。** `[07]`\n上层只测自己的层；纯函数层不引入任何 fake。**重复测试不是\"更保险\"，是让信号的归属变模糊。**\n\n**98. 探针必须用正例和近似负例校准。** `[02]`\n\"用已知正例和一个近似负例校准\"——**只测正例的探针，无法知道自己有没有误伤。**\n\n**99. 强制的摩擦可以是刻意的。** `[02]`\n`Alternatives considered` 是\"刻意的摩擦\"，因为**\"一个没有记录它击败了什么的决策，会招致它本来要防止的重新打官司\"**。\n\n**100. 自描述优先于依赖上下文。** `[02]`\n`Agent Note: ` 前缀让文件挪出树外仍能自述体裁。**假设读者在错误的上下文里读到它。**\n\n**101. 不要为了测试变绿而缩小被测范围。** `[14]`\n\"排除看起来不支持的文件\"被拒绝，理由是**\"受影响的行为是受支持的\"**——它是\"之前漏测的东西\"，不是\"不该测的东西\"。\n\n**102. 测试环境比真实环境更完备时，测不出缺席。** `[05]`\nworkspace 安装总是有每个包，**所以所有测试都通过，而发布的包对拒绝可选 peer 的消费者是坏的**。**凡是\"我这个环境里一定有\"的假设，都要问一句：在所有真实环境里也一定有吗？**\n\n**103. 潜伏的 bug 需要专门的搜寻。** `[05]`\n那条 `^0.0.1` **从未失败，只因版本从未离开 `0.0.1`**。这类 bug 不会通过\"跑测试\"暴露，只能通过**推理条件边界**（\"如果这个值变了会怎样\"）发现。\n\n**104. 新增能力带来新增义务。** `[13]`\n\"连续录制保留中间状态，**所以评审者必须检查选定区间是否有敏感内容与可读性**。\"\n\n**105. 代价要量化，然后判定它可不可接受。** `[13]`\n\"缓存在 `runner.temp` 里累积，runner 不清空它——**但在数据卷上（约 1% inode）那无害**。\" **先量，再判，而不是含糊地说\"影响很小\"。**\n\n---\n\n## 附：9 条跨批模式\n\n这些不是单条标准，而是**同一立场在多个批次里反复出现**的形态。括号内是出现次数。\n\n| 模式 | 次数 | 一句话 |\n|---|---|---|\n| **A 诚实的空白胜过补齐** | **9** | 不确定/缺失/不利的地方标注出来，不补一个看起来合理的东西。四个强度层次：标注缺失 → 公开不利证据 → 信息不足时拒绝动手 → **放弃一个看似可用的答案** |\n| **B 第二份真相：消除或自动化** | 5 拒 + 1 收 | 能消除就消除；必须存在的，在源头变化时自动重生成，并让校验搭现成的车 |\n| **C 别把不同的事混成一种状态** | **7** | 未满足≠失败、没有≠有但不同、意图≠范围、三种 `always()` 义务、三种处置档位 |\n| **D 证据要成立** | 4 | 验到消费点；短路掉的正是故障藏身处；**不共享实现假设的独立路径**；**观察行为不能破坏被观察对象** |\n| **E 范围蔓延防御** | 2 | 顺手能做的事，不是本次决策的一部分就不做 |\n| **F 可预测性战胜精确性** | 1 | 要求\"逐例判断重要性\"的规则已在制造漏洞 |\n| **G 冻结 = 明确放弃更新义务** | 1 | 只冻结内容不划掉维护义务，等于没冻结 |\n| **H 让工具的错误成为防线** | 1 | 选工具时问\"它的报错是我需要的信号吗\" |\n| **I 越界的机制不能走被阻塞的路径** | 1 | 应急机制依赖的通道，在它要应对的故障里还通吗 |\n| **J 机器判定不可靠时，问它跑起来还有没有剩余价值** | 1 | **有** → 降级为「参考性」（跑但不阻塞）；**没有且会招致表面合规** → 交给评审，不跑。见下方「张力已解答」 |\n\n### 那条张力已经解答（补记）\n\n此前在这里记着一条\"未解决的张力\"——\"可机械判定的必须机械化\"与\"能不能机械判定本身需要判断\"之间的矛盾。**它现在有一手判据**，出处是 `archived/process/2026-07-19-require-agent-notes-for-non-trivial-changes.md`：\n\n> **评审强制这条语义边界。没有任何自动门禁试图把一个 diff 分类为平凡或非平凡**，所以这条政策不增加门禁阶段或运行时。\n\n被否决的对照方案给出了完整理由：\n\n> **加一道 CI 的 diff 分类门禁。** 一个机械检查**无法可靠判断一个语义变更是否平凡**，而另一道门禁会增加运行时，**并招致误报或表面合规（superficial compliance）**。\n\n**判据：当机器的判定不可靠时，问它跑起来还有没有剩余价值。**\n\n| 机器的判定 | 处置 |\n|---|---|\n| 可靠 | 完全机械化（第 ① 档） |\n| **不可靠，但跑起来仍有参考价值** | 降级为**参考性**——跑，但不阻塞合并（例：Knip 的未使用代码扫描） |\n| **不可靠，且跑起来只有害处** | 交给**评审**，不跑（例：\"这个 diff 是否平凡\"） |\n\n**\"表面合规\"是这里的关键词**：一道不可靠的门禁**不会让人去解决它想解决的问题，而是让人学会迎合它**。这与第 01 批的\"一刀切天花板会**训练贡献者橡皮图章式地批准提高上限**\"是同一失败模式的两种表述。\n\n---\n\n## 怎么用这份表\n\n**如果你是作者**：写规范时对照第二、三节（规则与门禁）；写变更时对照第八节。\n\n**如果你是评审者**：第五、六节可直接当检查清单；第四节问\"这个结论的边界在哪\"。\n\n**如果只能记三条**：\n\n1. **模式 A**——不确定就标注，不补齐。\n2. **第五节第 45 条**——一个手段改善了可见指标，不等于打中了瓶颈。\n3. **第六节第 48 条**——同一个字段名不该回答两个问题。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-索引.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-索引","title":"DSH 过程决策精读 · 索引","tags":[],"summary":"读法说明（写在每篇之前的约定）： 每篇按五段提炼——他们遇到的事 / 判断 / 凭什么这么判断 / 他们承认的代价 / 被否决的方案。 其中「被否决的方案」信息量最大：决定告诉你结果，否决告诉你边界。","bytes":21260,"lines":263,"body":"# DSH 过程决策精读 · 索引\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **这个文件的作用**：会话上下文会被反复压缩。批次笔记在磁盘上是安全的，但\"我读到哪了、已经得出过什么结论\"会丢。\n> 这个索引是恢复点——**先读它，再决定读哪一批**。\n> 建立于 2026-09-10，随每批更新。\n\n## 进度\n\n| 项 | 值 |\n|---|---|\n| 精读对象 | `DSHfork/.agents/notes/implemented/process/` |\n| 该目录总数 | **47 篇**（目录下 94 个 `.md` = 47 篇英文 + 47 篇中文配对翻译） |\n| 已读 | **47 篇**（第 01–15 批）＝ **该目录 100% ✅** |\n| **全库规模** | **974 篇英文 Agent Note**：implemented **310** + proposed **21** + rejected **14** + archived **629** |\n| **全库覆盖** | 47 / **345**（当前权威 = implemented + proposed + rejected）＝ **13.6%**；archived 629 篇是**冻结历史**，按官方政策不算遗漏 |\n\n> **计数修正（2026-09-10 第二次）**：本篇最初把\"47 篇\"当成全库总量。实测后全库是 974 篇英文——\n> **\"100%\" 只对 `process/` 这一类成立**，即\"流程与政策\"这一整类读完了，其余 5 类（architecture / feature / bug-fix / simplification / testing）只读了它们的流程侧。\n> 另外，此前报的\"230 篇 architecture\"是**文件数**（含中文配对），英文实际 115 篇——所有目录都存在这个 2 倍偏差。\n\n## 批次索引\n\n| 批次 | 文件 | 主题 | 篇数 |\n|---|---|---|---|\n| 01 | `2026-09-10-DSH过程决策精读-01-门禁体系.md` | 门禁体系（总纲 + 两个门禁 + 编排器 + 删门禁） | 5 |\n| 02 | `2026-09-10-DSH过程决策精读-02-文字规范与引用纪律.md` | 文字规范与引用纪律 | 3 |\n| 03 | `2026-09-10-DSH过程决策精读-03-权威与推断.md` | 权威与推断（事实有多个来源时以谁为准） | 3 |\n| 04 | `2026-09-10-DSH过程决策精读-04-什么算证据.md` | 什么算证据（识破\"看起来等价\"） | 3 |\n| 05 | `2026-09-10-DSH过程决策精读-05-状态的语义精度.md` | 状态的语义精度（未满足≠失败） | 3 |\n| 06 | `2026-09-10-DSH过程决策精读-06-事实住哪里.md` | 事实住哪里（单一归属 + 冻结语义）**含跨批模式交叉验证** | 3 |\n| 07 | `2026-09-10-DSH过程决策精读-07-工具的选择与边界.md` | 工具的选择与边界（选型判据 + 分层）**含跨批模式交叉验证** | 3 |\n| 08 | `2026-09-10-DSH过程决策精读-08-把判断变成可判定的规则.md` | 把判断变成可判定的规则（样式约束 / CI 死锁 / 依赖分类） | 3 |\n| 09 | `2026-09-10-DSH过程决策精读-09-派生物与事实源.md` | 派生物与事实源**（修正模式 B 的边界）** | 3 |\n| 10 | `2026-09-10-DSH过程决策精读-10-把纠缠的事实拆开.md` | 把纠缠的事实拆开（配对合并 / 依赖分区段 / CI 取消）**含跨批印证** | 3 |\n| 11 | `2026-09-10-DSH过程决策精读-11-契约写在哪保证什么.md` | 契约写在哪、保证什么（Model Experience / 规划字段 / 平台 CI）**含跨批印证** | 3 |\n| 12 | `2026-09-10-DSH过程决策精读-12-身份与证据的可靠性.md` | 身份与证据的可靠性（自托管演练 / 分区覆盖 / 审批身份）**含跨批印证** | 3 |\n| 13 | `2026-09-10-DSH过程决策精读-13-别让省事的做法冒充正确做法.md` | 别让省事的做法冒充正确做法（串行参考 / 编译缓存 / 视频录制）**含跨批印证** | 3 |\n| 14 | `2026-09-10-DSH过程决策精读-14-真正的瓶颈与不能证明的事.md` | 真正的瓶颈与不能证明的事（Wine vs 原生 / 隔离 / 并行公证）**含跨批印证** | 3 |\n| 15 | `2026-09-10-DSH过程决策精读-15-回退参与者清单与默认值.md` | 回退、参与者清单与默认值（runner 尺寸 / **失败迁移回退** / Blacksmith）**收尾批** | 3 |\n\n> **`process/` 47 篇读毕（该目录 100%）**。收束文档见 `2026-09-10-DSH过程决策精读-判断标准总表.md`（把 15 批的「共同判断标准」合并去重后的可查阅版本）。\n\n| 补记 | `2026-09-10-DSH决策记录的人机协作形态.md` | **制度层**：Agent Note 制度全貌 + 人机分工证据 + **审阅档位判据**（解答了总表里那条张力） | 制度层 |\n\n> **补记说明**：正读 15 批只覆盖 `process/`（流程与政策）。补记补的是**制度本身**——`.agents/notes/README.md`（制度总纲）、`archived/` 与 `proposed/` 里的相关篇目，\n> 其中 `archived/process/2026-07-19-require-agent-notes-for-non-trivial-changes.md` 给出了那条\"未解决张力\"的**一手判据**（\"表面合规\"）。\n\n**读法说明**（写在每篇之前的约定）：\n每篇按五段提炼——**他们遇到的事 / 判断 / 凭什么这么判断 / 他们承认的代价 / 被否决的方案**。\n其中**「被否决的方案」信息量最大**：决定告诉你结果，否决告诉你边界。\n\n## 跨批模式（本索引最有价值的部分）\n\n单独一篇里的结论可能像是偶然的谨慎；**同一个立场在多批里反复出现，才是可以依赖的判断标准**。目前识别出 5 个跨批模式：\n\n### 模式 A：诚实的空白胜过补齐（出现 9 次）**← 已稳固为默认习惯，10 批出现最强形态**\n\n不一致、缺失、不确定的地方，**标注出来，而不是补一个看起来合理的东西**。\n\n| 出处 | 具体表现 |\n|---|---|\n| 02 批 ⑦ | 无法重建 alternatives 的旧笔记，永久保留一行\"此处不可重建\"的注释，而不是补一段像样的理由 |\n| 02 批（格式强制） | 连\"这篇没写 Alternatives\"都用 HTML 注释显式标出，而不是静默缺失 |\n| 04 批 ④ | 性能表里明写\"这个数字是估算，不是浏览器测量\"；未合并就关闭的 PR **不发明缺失的分类** |\n| 05 批 ⑥ | \"字节可重现性是假设，不是测量\"——并给出行动指令：**在第一次可能被重跑的发布之前先测它** |\n| **06 批（归档）** | **归档\"保留那个证据，而不假装它仍然是当前的\"**；归档笔记**按设计就可能过时**，不随重命名/格式/翻译/链接规则更新 |\n| **07 批（pnpm）** | **主动公开不利于自己的数据**：性能表三个格子对 pnpm 不利，并附上\"我们的测试环境让那个本来可能成立的优势无法显现\"的解释；结论改成\"**理由是生态对齐和安全，不是速度**\" |\n\n**07 批给出了这条立场的一个新形态**：前几次是\"标注缺失\"，这次是\"**公开一个削弱自己结论的证据**\"。\n\n| **08 批（依赖分类）** | **未分类的运行时导出阻塞所有 `--fix` 写入**——\"只有源头安全通过之后，`--fix` 才执行分类所蕴含的区段与范围变更\"。**信息不足时拒绝猜一个分类**，而不是\"尽力而为\" |\n\n**08 批给出了另一个新形态**：不是\"标注缺失\"，也不是\"公开证据\"，而是**工具在信息不足时拒绝动手**。证据不够时\"尽力而为\"，等于用一个更强的语气说出一个更弱的判断。\n\n| **10 批（配对合并）** | **最强形态**：Git 合并驱动的启动器**能算出一个干净的文本合并结果，却仍然返回冲突**——因为那个结果没经过驱动的校验（六 blob 哈希、语言切换器、结构签名）。**主动放弃一个看似可用的答案，只因为它没被验证过** |\n\n**四批四个形态**：标注缺失（02/04/05/06）→ 公开不利证据（07）→ 信息不足时拒绝动手（08）→ **放弃未经验证的可用答案（10）**。**方向一致，强度递增。**\n\n| **11 批（Model Experience）** | **把不稳定的部分排除出契约**：\"稳定的契约是**增长形态**，不是数值\"——精确 token 数依赖 tokenizer／序列化／配置／运行时数据，**它不稳定，所以不进契约**；契约退到\"能被稳定判定的那一层\"。同篇还有这条模式的**反面用法**：\"**无约束的缺席，在'审计过的零'和'忘记写文档'之间是模糊的**\"——空白可以是诚实的，但必须是被标注过的空白 |\n| **12 批（自托管演练）** | **\"选择器测试不声称复现那些构建\"**、\"本地调度测试不声称原生运行时执行\"（11 批同款）——**每篇末尾都在划定自己验证能力的边界**。这已成固定收尾：**不声称验证不了的东西** |\n\n### 模式 B（09 批修正）：能消除的第二份真相就消除；不能消除的，让同步自动化\n\n前 5 次都是\"拒绝\"，第 6 次却是\"接受\"——**09 批接受了一个生成文件（`THIRD_PARTY_NOTICES.md`），而它同样是派生出来的第二份拷贝**。同性质的东西结论相反，边界正好由三问划定：\n\n| 判据 | 生成索引（❌拒绝） | 第三方声明（✅接受） |\n|---|---|---|\n| **① 它是必需的吗？** | 否，只是发现路径的一种便利 | 是，开源合规**要求**这份披露存在 |\n| **② 源变化时能自动重生成吗？** | — | **是**：\"Freshness is **maintained**, not merely enforced\" |\n| **③ 校验能搭现成的车吗？** | — | **是**：断言放进测试泳道本来就在跑的 spec，零新门进程、零调度槽位、零 CI 步骤 |\n\n**三问都否，就该考虑消除它；都满足，就该接受它并把同步自动化。**\n\n| 出处 | 判断 |\n|---|---|\n| 01 批 ② | ❌ Knip 的例外清单（重述了清单、构建配置、包专属检查已有的事实） |\n| 01 批（编排器） | ❌ YAML 里的门禁清单、手工维护的包清单 |\n| 03 批（评审状态） | ❌ 定时对账器（事件流之外的第二套真相） |\n| 05 批（npm） | ❌ `vendor/published.json` 账本——\"**tag 反正必须存在，所以它没有引入状态的第二份拷贝**\" |\n| 06 批（索引） | ❌ 生成的 Agent Note 索引——复制了路径、日期、H1，而且是个**合并热点** |\n| **09 批（notices）** | ✅ 生成的第三方声明——三问全满足 |\n\n**两种成本**：第二份真相的代价不止\"要同步\"（漂移），还有**争用**——无关分支每次都要重写同一份文件。\n\n**被否决的对照方案说明了关键所在**：把校验做成一个专门的 `doc-sync` 门，它\"**唯一的失败模式，是在一个贡献者推完无关的依赖升级几分钟后，告诉他去重跑生成器**\"——**把同步成本推给一个人**。这个方案输在第三问上。\n\n**11 批补了一条更根本的论据**：拒绝\"从源码生成中央上下文目录\"的理由不止\"会漂移\"，还有——**AST 能找到注册，但推断不出语义条件**（历史保留、输出截断、父子可见性、辅助模型边界）。\n**当源信息不足以生成正确的副本时，这个副本的问题不是\"需要维护\"，而是\"不可能正确\"。**\n\n### 模式 C：别把不同的事混成一种状态（出现 6 次）**← 10 批出现危险形态**\n\n| 出处 | 被拆开的两种 |\n|---|---|\n| 03 批 ③ | 交接（谁拥有下一步）vs 判定（GitHub 认为可合并） |\n| 04 批（标签） | 意图（kind）vs 语义范围（area） |\n| 05 批 ① | 未满足的合并条件 vs 评估失败（`pending` vs `error`） |\n| 05 批 ② | 没有那个版本 vs 有但内容不同（重跑 vs 未升版本的改动） |\n| **10 批（依赖区段）** | **分发浏览器代码 vs 让安装器下载同名包**——同一个 `devDependencies`，回答\"要不要下载\"与\"要不要披露\"是两个问题 |\n| **10 批（CI 条件）** | **失败聚合 vs 资源清理 vs 被取消运行的簿记**——三种不同的义务 |\n| **11 批（Model Experience）** | **\"不使前缀失效\" vs \"保证缓存命中\"**——前者是这个包能承诺的，后者只有 provider 能承诺。一句话划清责任边界 |\n| **12 批（分区覆盖）** | **阈值所有权属于合并后的报告**——\"每个分区有意只看到套件的一部分，会报告假未覆盖文件\"。**一个有意不完整的部分，不能对自己作整体判定** |\n| **14 批（Windows job）** | **\"阻塞 / 红色可见但不阻塞 / 忽略\"是三种处置**——`windows-coverage` 缺席于聚合 `needs`，所以它的阈值失败\"**保持红色且可见，而不延迟必需的裁决**\"。**把三种压成两种必然损失信息** |\n\n**危险形态（10 批点明）**：**success-only 的聚合\"能把失败的依赖藏在一个被跳过的必需检查后面\"**。\n**混淆状态时，错误的方向是\"把失败显示成通过\"**——这比漏报更危险，因为漏报至少还能被发现，而假通过会一路走到底。\n\n**判据**：当一个字段名（`devDependencies`、`always()`）开始承担第二个问题时，**错误就藏在两个问题的差集里**。\n\n### 模式 D：验证到消费点，而不是产出点（出现 4 次）**← 12 批给出新强度**\n\n| 出处 | 表现 |\n|---|---|\n| 01 批（门禁） | 门禁必须有退出码契约；`verify-deploy-rename.mjs` 那种\"只打印不退出\"的形状无法挂到任何自动化上 |\n| 04 批 ③ | GIF 发布不满足于\"push 成功\"，要重读活体 body、用 Markdown API 渲染、抓取上传 URL 确认 `200 image/gif`——**那才是评审者实际看的东西** |\n| 07 批（GUI 测试） | **\"fixture 全绿不算完成，真链路也必须通过\"**——**fixture 短路掉的正是链路运载链，而两个经验确认的 bug 都藏在那里** |\n| **12 批（分区覆盖）** | **\"未完成运行不是增加并发的证据\"**、\"反复重启会抹掉唯一的证据\"——**把\"什么算证据\"推进到了\"证据的形成条件\"**：不仅要求\"我看到的是真的\"，还要求\"**我看到的时候，条件没有被我的观察行为破坏**\" |\n| **13 批（串行参考）** | **\"调度和验证共享实现假设\"**——所以需要一条**不共享假设的独立路径**（串行聚合）作完整性预言机。**同一实现既调度又验证时，它的错误会同时骗过两边** |\n\n**通用问法**：这个验证手段**短路掉了什么**？被短路的那一段，就是故障的藏身处。\n**12 批的追加问法**：**我这次的观察行为，会不会破坏我正在观察的那个东西？**\n**13 批的追加问法**：**承担验证的那条路径，和被验证的对象共享实现吗？**\n\n### 模式 E：范围蔓延防御（出现 2 次）\n\n| 出处 | 表现 |\n|---|---|\n| 04 批 ⑥ | \"有限的场景/修复范围，防止一个宽泛的性能请求变成一次无关的架构重写\" |\n| 05 批 ⑧ | 自动元数据修复被拒绝：\"它们是独立的决策，而不是随一次政策简化捎带进来\" |\n\n### 🆕 模式 F：可预测性战胜精确性（06 批新增，出现 1 次）\n\n| 出处 | 表现 |\n|---|---|\n| 06 批（子系统页面） | 一条更**精确**的规则（\"这个类型在每一轮都被循环持有/派生/流式/记录\"）输给了一条更**粗糙但可预测**的规则（按仓库布局）。原因不是精确性不好，而是**要求\"逐例判断重要性\"的规则会在两个方向同时出错：收进不该收的，漏掉该收的**——它漏掉了半个公共 API，同时收进了四个包的类型 |\n\n**判据**：当一个规则要求\"逐例判断重要性\"时，它已经在制造漏洞了。\n\n### 🆕 模式 G：冻结 = 明确放弃更新义务（06 批新增，出现 1 次）\n\n| 出处 | 表现 |\n|---|---|\n| 06 批（归档） | 归档笔记**被所有其他文档门禁排除**，理由是\"它们演变的标准不能产生编辑历史的压力\"；且**不随重命名包、变化的行为、翻译标准、格式规则、断裂链接更新** |\n\n**判据**：只冻结内容而不划掉维护义务，等于没冻结——历史会持续产生工作量，而它已经不再提供价值。\n\n### 🆕 模式 H：让工具的错误成为防线（07 批新增，出现 1 次）\n\n| 出处 | 表现 |\n|---|---|\n| 07 批（pnpm） | **刻意不加** `node-linker=hoisted` / `shamefully-hoist` 逃生舱——非扁平的 `node_modules` 会让**幻影依赖大声失败**，而\"这对于一个整个质量故事都是机械门禁的仓库是一个 *feature*\" |\n\n**判据**：选工具时问的不是\"它的报错会不会烦到我\"，而是\"**它的报错恰好是我需要的那个信号吗**\"。\n\n### 🆕 模式 I：越界的机制不能走那条被阻塞的路径（08 批新增，出现 1 次）\n\n| 出处 | 表现 |\n|---|---|\n| 08 批（CI 故障切换） | 有意的困境：企业池挂了 → **所有 PR 不可合并** → **\"合并一个修复\"这个常规恢复手段也被封死**。所以切换机制被设计成**仓库变量**而非一次合并——\"**它在检查是红的时候也能工作**\" |\n\n**判据**：设计应急机制时先问——**它依赖的通道，在它要应对的那种故障里还通吗？**\n\n### 一条张力（值得持续追踪）\n\n01 批的标准是\"**可机械判定的不变量必须编码成检查**\"，但 02 批第 3 篇**主动不机械化**（术语是无界自然语言，硬上会误伤合法散文）。\n\n两句合起来才完整：**\"能不能被机械判定\"本身需要判断**；硬上一道会误伤的门禁，会制造 01 批说的坏训练（教所有人无视规则）——**那比没有门禁更糟**。\n\n## 已读篇目清单（17 篇）\n\n| # | 篇目 | 批次 |\n|---|---|---|\n| 1 | `2026-06-11-quality-gates` | 01 |\n| 2 | `2026-07-02-bilingual-docs-and-pairing-gate` | 01 |\n| 3 | `2026-07-04-doc-tiers-and-budgets` | 01 |\n| 4 | `2026-07-06-parallel-pre-push-gates` | 01 |\n| 5 | `2026-08-19-remove-knip` | 01 |\n| 6 | `2026-08-09-concrete-prose-names-actors-and-recorded-facts` | 02 |\n| 7 | `2026-07-05-uniform-agent-note-format` | 02 |\n| 8 | `2026-08-09-committed-artifact-citations` | 02 |\n| 9 | `2026-08-10-event-directed-pr-review-status` | 03 |\n| 10 | `2026-08-02-native-github-stacks-and-optional-rebases` | 03 |\n| 11 | `2026-07-26-dependencies-over-hand-rolling` | 03 |\n| 12 | `2026-09-06-evidence-driven-performance-skill` | 04 |\n| 13 | `2026-08-08-browser-gif-evidence-chain` | 04 |\n| 14 | `2026-08-08-unified-github-label-taxonomy` | 04 |\n| 15 | `2026-08-10-npm-release-sequences` | 05 |\n| 16 | `2026-09-09-blocked-weighted-approvals-remain-pending` | 05 |\n| 17 | `2026-09-03-semantic-issue-templates-and-policy` | 05 |\n| 18 | `2026-07-19-remove-generated-agent-note-index` | 06 |\n| 19 | `2026-07-26-frozen-agent-note-archive` | 06 |\n| 20 | `2026-08-03-package-anchored-subsystem-pages` | 06 |\n| 21 | `2026-06-16-pnpm-over-yarn` | 07 |\n| 22 | `2026-06-17-ts-build-config` | 07 |\n| 23 | `2026-07-20-gui-testing-system` | 07 |\n| 24 | `2026-07-19-web-styling-system` | 08 |\n| 25 | `2026-07-26-ci-failover-runbook` | 08 |\n| 26 | `2026-08-26-published-dependency-faces` | 08 |\n| 27 | `2026-07-30-generated-third-party-notices` | 09 |\n| 28 | `2026-07-27-worktree-local-lefthook` | 09 |\n| 29 | `2026-07-06-node-engine-floor` | 09 |\n| 30 | `2026-08-08-automatic-translation-pairing-merges` | 10 |\n| 31 | `2026-09-08-browser-third-party-build-inputs` | 10 |\n| 32 | `2026-09-09-cancel-superseded-ci` | 10 |\n| 33 | `2026-07-12-package-model-experience-contract` | 11 |\n| 34 | `2026-09-02-project-local-issue-planning-fields` | 11 |\n| 35 | `2026-09-06-master-only-platform-ci` | 11 |\n| 36 | `2026-09-06-release-rehearsal-selfhosted` | 12 |\n| 37 | `2026-08-18-in-job-partitioned-coverage` | 12 |\n| 38 | `2026-09-10-approval-review-workflow-identity` | 12 |\n| 39 | `2026-07-21-serial-cross-platform-ci-reference` | 13 |\n| 40 | `2026-08-28-ci-node-compile-cache-data-disk` | 13 |\n| 41 | `2026-09-08-playwright-video-gif` | 13 |\n| 42 | `2026-08-08-native-windows-pull-request-ci` | 14 |\n| 43 | `2026-09-06-node-compatibility-selfhosted` | 14 |\n| 44 | `2026-09-09-parallel-macos-notarization` | 14 |\n| 45 | `2026-09-06-preview-hosted-runner-sizing` | 15 |\n| 46 | `2026-09-06-python-runtime-windows-hosted` | 15 |\n| 47 | `2026-09-09-blacksmith-failover-leg` | 15 |\n\n## 后续可选（未读范围）\n\n`process/` 已 100% 读完。**未读的是另外 5 类**——按第 06 批学到的方法论，它们属于\"另一类\"：读它们更像读**产品决策**，而不是流程决策。\n\n| 范围 | 篇数 | 性质 |\n|---|---:|---|\n| `implemented/architecture` | ≈ **113** | 关于已交付源码的结构决策 |\n| `implemented/feature` | 75 | 面向用户或模型的新能力 |\n| `implemented/bug-fix` | 32 | 缺陷修正与事故复盘 |\n| `implemented/testing` | 20 | 测试基础设施与策略 |\n| `implemented/simplification` | 18 | 移除代码而不新增能力 |\n| `proposed/`（全部） | 21 | 提案，含 `2026-07-13-human-review-skill-maintenance` |\n| `rejected/`（全部） | 14 | 被拒绝的提案，**理由即主要内容** |\n| ~~`archived/`~~ | ~~629~~ | **冻结历史**，官方明确\"不得视为当前行为的权威依据\"，不算遗漏 |\n\n**若要继续，建议的优先顺序**：\n\n1. **`rejected/`（14 篇）**——被否决的理由信息密度最高，与已读的\"边界/否决方案\"主题最契合\n2. **`proposed/process/`（7 篇）**——含那份双评审者流程，是\"人机协作形态\"的直接延续\n3. **`implemented/architecture/` 中与门禁、验证、文档治理相关的少数篇目**（本次补记已读了两篇：`configuration-source-ownership`、`outbound-proxy-policy`）\n4. 其余按需查阅，不必逐篇\n"},{"file":"版本对比/2026-09-09-0.1.5-alpha.2-vs-0.1.2-rc.1.md","group":"版本对比","date":"2026-09-09","slug":"0.1.5-alpha.2-vs-0.1.2-rc.1","title":"DSH 主库版本观察：0.1.5-alpha.2 vs 0.1.2-rc.1","tags":["@deepseek-ai/dsh-desktop","@deepseek-ai/dsh","dsh-v0","dsh-desktop","dsh-app","0.1.5-alpha.2","0.1.2-rc.1","0.1.2-alpha.2","0.1.3-alpha.1","0.1.5-alpha.1","0.1.4","0.1.3-alpha.2"],"summary":"dsh-v0.1.2-rc.1 是 release 分支 tip，不含 master 上并行开发、09-03 之后才合入的提交。已实测确认下列提交 in-rc.1=False： - 19444907f0（08-28 electron 打包）、c58097a826（08-31 写所有权租约）、d1521ea783（08-31 format migration）、f99b06eaed（09-01 fo","bytes":10845,"lines":145,"body":"# DSH 主库版本观察：0.1.5-alpha.2 vs 0.1.2-rc.1\n\n> 观察时间：2026-09-09 · 观察库：`DSHfork/`（独立克隆观察站） · 基线：`dsh-v0.1.2-rc.1`（DSH web 宿主当前版本）\n> 基线变更说明：上篇基线为 `dsh-v0.1.2-alpha.2`；宿主 web 已于 09-06 升到 rc.1，本篇按 README 约定以新基线开题并注明。\n\n## 结论速览\n\n| 问题 | 答案 |\n|---|---|\n| 什么时候更新的 | rc.1（09-03 02:27）→ 0.1.5-alpha.2（09-09 22:13），**6 天 4 个版本**（0.1.3-alpha.1/2、0.1.5-alpha.1/2；**无 0.1.4**） |\n| 发布 NPM 了吗 | **0.1.3-alpha.2 起已发布**（0.1.3-alpha.1 仍未发）。dist-tags：`latest`=`0.1.2-rc.1`、`next`=`0.1.2-rc.1`、`alpha`=`0.1.5-alpha.2` |\n| 改动规模 | 1469 提交（982 非 merge），跨 4 个 release |\n| 包目录变更 | **新增 20 个包目录、删除 0 个**（清单见附录，已逐目录核对） |\n| 性质 | **会话格式 v2 + v3 两级迁移**（rc.1 一级都没有）、**官方自建 Electron 桌面端**、侧边栏/停靠/文件体系扩展、subprocess 强化 |\n\n## 版本时间线\n\n| 版本 | git tag（提交时间 +08:00） | NPM 发布（+08:00） |\n|---|---|---|\n| 0.1.2-rc.1（基线） | 09-03 02:27 | ✅ 09-03 14:21（`latest`） |\n| 0.1.3-alpha.1 | 09-04 17:16 | ❌ 未发布 |\n| 0.1.3-alpha.2 | 09-07 19:45 | ✅ 09-07 21:11 |\n| 0.1.5-alpha.1 | 09-08 23:25 | ✅ 09-08 23:57 |\n| **0.1.5-alpha.2** | **09-09 22:13** | ✅ 09-09 22:41（`alpha`） |\n| 0.1.4 | 无 tag / 无 npm 版本 | ❌ 版本号直接跳过（提交信息中无解释） |\n\n## 口径说明（读本篇必看）\n\n`dsh-v0.1.2-rc.1` 是 release 分支 tip，**不含** master 上并行开发、09-03 之后才合入的提交。已实测确认下列提交 `in-rc.1=False`：\n\n- `19444907f0`（08-28 electron 打包）、`c58097a826`（08-31 写所有权租约）、`d1521ea783`（08-31 format migration）、`f99b06eaed`（09-01 format v2）、`9e7c570094`（09-07 dockkit）、`4ce4f0bac4`（09-07 workspace-files）\n\n即：**本篇\"新增\"里包含 author date 早于 rc.1 的提交，但对宿主 rc.1 而言它们确实是新增**。rc.1 本身无 format v2（与上篇判断一致）。\n\n## 改动主题明细（rc.1 → 0.1.5-alpha.2）\n\n### 1. 会话格式 v2 → v3 迁移链（最大 breaking）\n\n- **新包族（rc.1 完全没有，已核对）**：`session-format`、`session-format-catalog`、`session-format-v0-to-v1`、`session-format-v1-to-v2`、`session-format-v2-to-v3`（后者含 `codec/migration/payload/references/validation` + 8 个 spec）\n- 关键提交：\n  - `d1521ea783` `feat(session)!: add released format migration`（08-31）\n  - `f99b06eaed` `feat(session)!: embed assistant streams in format v2`（09-01）+ `30e045dfad` live assistant stream frames\n  - `bad4254d71` Rename durable PTC vocabulary with identity-preserving v2 migration（09-06）\n  - `f7a6221158` `feat(session): add identity V2-to-V3 migration and writer skeleton`（09-06）\n  - `e04cfc4c87` `feat(session-format): migrate V2 prompts into V3 system surfaces`（09-06）\n  - `657e68186a` canonicalize V3 envelopes through adjacent migration；`5212603a4b` 迁移前审计全部历史内容载体（09-08）\n  - `7b6b8a2baa` 修正 released V3 兼容性指引（09-09）\n- 含义：**从 rc.1 升级要一次跨两级**（v2 + v3），不是单级迁移\n\n### 2. 官方自建 Electron 桌面端（新）\n\n- 新包 `apps/desktop`（`@deepseek-ai/dsh-desktop`）+ 私有 `apps/desktop-host`\n- 设计要点（摘自其 README）：**不开监听端口**（framed byte pipes + `dsh-app://` 协议）、独占 `$DSH_HOME/profiles/desktop`、自带上游 Node.js 与 pnpm、离线 seed store（macOS 分 16 个未压缩 tar 分片以利差量更新）、**Release 身份绑定**（Electron 与 `@deepseek-ai/dsh` 版本永远完全一致）、插件管理独立渲染进程、中英 i18n\n- 提交：`19444907f0`（electron 打包）、`5f135ea977`（mac 签名/公证）、`6aaba0c334`（windows 构建签名）、`903a926897`（ipc 性能）、`22461aedb0`/`d5363c8839`（打包与自动更新）\n\n### 3. 侧边栏 / 停靠 / 文件体系（最大功能群）\n\n- **新增包**：`ui-sidebar-files`（懒加载工作区文件树 tab）、`ui-sidebar-right`、`ui-sidebar-documentpreview`、`ui-dockkit`（可逆停靠引擎）、`ui-open-in-app`、`file-upload`、`resources`（Client 资源注册表 + 保留订阅）、`api/workspace-files`（双面文件 API）、`host/open-in-app`、`fs/tool-present`\n- **注意**：`ui-sidebar`、`ui-conversation`、`ui-primitives`、`ui-deliverables`、`ui-goal`、`ui-message-feedback`、`ui-chat`、`ui-tool`、`connection`、`util/workspace-path` **rc.1 已存在**，本篇属其上的**扩展**，不是新建包\n- 能力扩展：`fs` 增加有界字节窗口读取（`fs-local` / `fs-e2b`）；`util/workspace-path` 补齐 Session 与绝对文件资源地址定义\n- 代表提交：`b67e0a838c`（标签导航 + 全屏壳）、`b24ebc8cce`（文件树 tab）、`9e7c570094`/`838dbbe0d0`（dockkit）、`9241e10a47`（响应式右栏）、`4909550782`（会话头部角落槽）、`5ee343f735`（活动标签标题 + 文件类型图标）、`f4c1e31ba8`（末标签关闭规则）、`581803bf57`（全局侧栏面板）、`a7c7e99652`（交付物经 Sidebar 打开）、`d10af0654f`（分页文件标签 + 阅读状态保留）\n\n### 4. 子进程 containment 强化（71 个 `fix(subprocess)`）\n\n- **包结构未变**：`packages/subprocess/{subprocess,subprocess-local,win32-process}` rc.1 已存在（已核对），master 是**强化**而非新建\n- 主题：原生 runner bootstrap 隔离、SEA bootstrap 移入 runtime packaging、**Windows 子窗口隐藏**、PTY scope launcher 环境归一、containment 结算与取消结算、spawn 错误语义对齐\n- 代表：`0652b7b4d7` close containment review gaps（8 文件，+61/−80）\n\n### 5. 文件预览能力（含一次整体回滚）\n\n- 09-07 `ee35e40bc8` Mermaid 预览 → 09-08 修复系列 → 09-09 `83253e0d16` 合入 → **`58956c1a8a` Revert（PR #3901 回滚 #3710）**\n- 同批被回滚：`a8f9d81f3a`（Graphviz / SVG / HTML 代码块预览）\n- 保留：`8870a13aa9`（侧边栏图片预览）、`d10af0654f`（文本分页预览）\n- 已核对：master 的 `packages/client` 下无 mermaid / graphviz / svg 预览实现，仅剩 `scripts/verify-mermaid.ts`\n\n### 6. 工具集变化：str_replace_editor 移出默认\n\n- `36a4665144`（base）、`965adbb5cf`（sdk）、`63795eaa5c`（minimal）：从 `bundle/{base,sdk-app,web-app}` 的 `cordis.patch.yml` 删除声明\n- **代码仍在**：`packages/fs/tool-str-replace-editor` rc.1 已存在，master 上 `str_replace_editor` 命中文件数 21（rc.1 为 20），只是默认不启用\n\n### 7. agent / subagent / agent-loop\n\n- `48cc1cf1d6` 模型切换公告；`c988a6796f` 系统提示变更按能力路由追加\n- `2db4bdd31d` subagent 记录并观察父级拥有的子目录；`96ead6091d` 人工收件箱控制对齐\n- `ef88756f13` 同会话消息编辑（09-02 引入）→ `e974a655a0` **已 revert**（PR #3459），之后无重新引入、master 无实现文件：**当前 master 不含该功能**\n\n### 8. CLI 与 profile\n\n- `dd25e1e6b3` `feat(cli): create profiles from shipped templates`\n- `1f1537914f` minimal 持久 bash 输出对齐一次性 shell 契约\n\n### 9. 其他\n\n- 反馈：`f2f9700de2` 统一 /feedback 与 Dislike 到一个对话框（含分类与 toast）\n- skills：`e57e7dc57f` 用 Playwright video 录浏览器 GIF\n- workspace：`9292dd8a2d` web UI 用本地应用打开工作区\n- UI：`3997f36999` stats strip → 两个图标 pill + 点击弹窗；`37d27fcdf9` 不可变文件投递下载卡片；`057b4879cf` 文件卡对齐设计\n- 网络：`545e2ad914` 全部出站请求走配置代理（该提交新建 `packages/net`，后经 `c62d6f3a44` 重构为 `packages/util/http-proxy` 六函数工具库；**rc.1 与 master 均无 `packages/net`**）\n- 附件：`65d2015b09`/`8a0ff3aff8`/`bafa6ae11d`/`a1144c4950` 通用文件上传与混合附件呈现\n\n## 对本工作区的含义\n\n1. **升级跨度真实存在**：rc.1 → 0.1.5-alpha.2 会一次引入 v2 + v3 两级格式迁移 + 跨进程写租约。我们自己的会话日志工具链需复核：`.tmp-audit-all.mts` 等修复脚本、chat-rail 投影读取、会话标题修补脚本。\n2. **官方桌面端出现，SSiD 定位需重新评估**：`@deepseek-ai/dsh-desktop` 与思灵同为「Electron 壳 + DSH 内核」，官方方案还带独占 profile、自带 Node/pnpm、签名分片更新。SSiD 的差异化（插件全家桶、中文本地化、壳集成）需要重新论证。\n3. **npm 通道已开**：`alpha` tag = `0.1.5-alpha.2`，可直接 `pnpm add @deepseek-ai/dsh@alpha` 试验，无需源码 checkout。\n4. **侧边栏体系大改**：`ui-sidebar-files` / `ui-dockkit` / `ui-sidebar-right` 与第三方 better-sidebar 类插件存在重叠面，升级前需适配评估。\n5. **工具集默认变化**：若某 profile 依赖 `str_replace_editor`，升级后需显式启用。\n6. **subprocess 强化偏 Windows**：子窗口隐藏、PTY scope、containment 结算——与 SSiD 的 node-pty/子进程路径相关，升级后必须实测。\n\n## 方法备忘（下次续写）\n\n- 观察库：`DSHfork`（origin=官方主库，master 跟踪 origin/master）\n- 更新流程：`git -C DSHfork fetch origin --tags` → `git log \u003c上次tag>..origin/master` → 按主题聚类精读代表提交 → 追加新观察文档\n- 口径校验：`git merge-base --is-ancestor \u003ccommit> \u003c基线tag>` 确认提交是否真在基线内（release 分支 tip 常不含并行开发的提交）\n- **新增包判定**：用 `git ls-tree -r -d --name-only \u003ctag> -- packages apps` 做**目录级** Compare-Object；**不要用 `git diff --name-status`**——文件级 A 会把已有包里的新文件误判为\"新包\"\n- 版本对比基线 tag 命名：`dsh-v0.1.x.y`；**当前最新 tag：`dsh-v0.1.5-alpha.2`**\n- npm 查询：`https://registry.npmjs.org/-/package/@deepseek-ai/dsh/dist-tags`（轻量）；发布时间用 `https://registry.npmjs.org/@deepseek-ai/dsh` 的 `time` 字段\n\n## 附录：包目录级变更（已核对，rc.1 → master）\n\n新增 20 个，删除 0 个：\n\n```\napps/desktop\napps/desktop-host\npackages/api/workspace-files\npackages/client/file-upload\npackages/client/resources\npackages/client/ui-dockkit\npackages/client/ui-open-in-app\npackages/client/ui-sidebar-documentpreview\npackages/client/ui-sidebar-files\npackages/client/ui-sidebar-right\npackages/fs/tool-present\npackages/host/open-in-app\npackages/session/session-format\npackages/session/session-format-catalog\npackages/session/session-format-v0-to-v1\npackages/session/session-format-v1-to-v2\npackages/session/session-format-v2-to-v3\npackages/util/chunked-list\npackages/util/http-proxy\npackages/util/package-manifest\n```\n"},{"file":"版本对比/2026-09-05-rc.1导航条-投影加载机制对比.md","group":"版本对比","date":"2026-09-05","slug":"rc.1导航条-投影加载机制对比","title":"rc.1 导航条（会话侧边栏）加载机制对比（2026-09-05）","tags":["dsh-session-manager","dsh-chat-rail","dsh-sidebar-qa","dsh-better-sidebar","0.4.4","0.5.0","0.18.0"],"summary":"- 注册者：sidebar.workspaces slot 由 packages/client/ui-workspace 提供（client/navigation.ts + client/tree.ts + stores.ts）；外层壳是 ui-sidebar/SidebarRoot（列几何/折叠/滚动条，纯壳）。 - 列表数据 = session 投影，不是全量会话： - SessionSumm","bytes":9156,"lines":94,"body":"# rc.1 导航条（会话侧边栏）加载机制对比（2026-09-05）\n\n> 背景：rc.1 对大会话加载做了新设计（投影缓存 + 窗口化惰性渲染，实测 195 万 token 会话 0.4s 打开）。\n> 官方同期为侧边栏新增了自有的会话管理 UI（归档/移动/删除/分组）。本对比回答：官方机制是什么、\n> 我们的导航条插件（dsh-session-manager 等）是否受影响、可借鉴什么。\n\n## 1. 官方 rc.1 导航条机制（源码实证）\n\n- **注册者**：`sidebar.workspaces` slot 由 `packages/client/ui-workspace` 提供（`client/navigation.ts` +\n  `client/tree.ts` + `stores.ts`）；外层壳是 `ui-sidebar/SidebarRoot`（列几何/折叠/滚动条，纯壳）。\n- **列表数据 = session 投影**，不是全量会话：\n  - `SessionSummary` 字段：`blank` / `displayTitle` / `projectionValues`（如 schedule）/ 归档状态——\n    **标题来自独立投影**（titleInput 的投影，先决标题不入搜索）。\n  - `projectionValues` 是每个会话的第 n 投影行（有界）；列表不加载完整消息流。\n  - 物理缓存：`$DSH_HOME/storages/session_projcache/sessions/\u003cid>.json`（18.6MB 会话的投影缓存仅 1.17MB）。\n- **搜索 = 有界投影合并**（\"Bounded merged search projection\" + refine-query 提示位）：搜索时也是\n  有界投影，不会把全部会话拉到浏览器。\n- **渲染 = 折叠组窗口化**：组折叠时不渲染行（\"visible rows (empty while the group is folded)\"）；\n  组内只渲染可见顶层行；顺序由 Workspace 树排序派生（`ordered`）。\n- **会话打开 = 窗口化惰性**：打开大会话只渲染可见窗口（0.4s 实测；α.4 全量载入 20s+ 翻车已根除）。\n\n## 2. 我们的导航条插件：dsh-chat-rail（实证）\n\n- **定位**：「画卷式消息导航栏」——会话面板右侧竖排导航，每条用户消息一个指示点，scroll-spy 跟随，\n  hover 画卷展开、点击跳转任意历史消息；消息星标收藏 + 一键回填。**消息级导航**（非会话列表）。\n- **数据流**（`src/client/index.tsx` 实证）：\n  - **chatRail 投影**：`anchorSeq`/`messageId` 来自官方 **chatRail projection**（projectionValues.chatRail：\n    每条用户消息一行 seq/time/text 轻量摘要——projcache row keys 已验证）——**不读全量消息流**。\n  - **DOM 锚点收集**：指示点从 `[data-chat-anchor-key^=\"13:input-message\"]`（**已渲染窗口内的消息行**）\n    收集——**跟随官方窗口化渲染**（可见窗口 = 导航点），5xx 行实证。\n  - 跳转**加载反馈**（spinner + 加载中，长会话跳转不卡死）。\n  - 收藏为自建 `FAVORITES_API`（一次性请求，非列表遍历）。\n- **大会话敏感度：低**——数据全在官方投影 + 窗口化 DOM 内，无全量枚举。\n\n## 2b. 其他导航相关插件（第三方——本次不处理，用户决策 2026-09-05）\n\n| 插件 | 角色 | 备注 |\n|---|---|---|\n| dsh-session-manager 0.4.4 | 会话管理增强（归档/移动/删除/preset 迁移/会话树/追问记录） | **第三方**；已接入官方 useSessions/useWorkspaces 投影 hooks（同源）；按用户决策**先不做处理** |\n| dsh-sidebar-qa 0.5.0 | 划选问答（右侧面板） | 第三方；独立会话（fork），不遍历列表；**不处理** |\n| dsh-better-sidebar 0.18.0 | 右侧栏工作台（文件/终端/预览） | 第三方；不接会话列表；**不处理** |\n\n## 3. 机制对照（官方 TurnNavigator vs dsh-chat-rail，源码实证）\n\n> 官方**有**消息级导航：`ui-chat/src/client/chat/TurnNavigator.tsx` + `turn-rail-items.ts`\n> （turn-rail 预览层 #3414，rc.1 已含）。chat-rail 将其**自动隐藏**（aria-label 双文案锚点，README 兼容性段），\n> 由 chat-rail 统一承担会话导航——装 chat-rail 时官方导航不显示（现在依旧生效，功能无冲突）。\n\n| 维度 | 官方 TurnNavigator（新 DSH 机制） | dsh-chat-rail（旧 DSH 起家、逐版对接） |\n|---|---|---|\n| 大纲数据源 | **turnOutline 投影**（每 turn：turn/seq/prompt/response——全会话 turn 大纲，投影行轻量） | **chatRail 投影**（每条用户消息：seq/time/text/images——全用户消息摘要，**粒度更细**） |\n| 窗口数据源 | loaded window items（React 快照 `TurnNavigationItem`：anchorKey+富预览） | chat nodes（`ChatSnapshot.nodes` 新平面 **alpha.2+**；legacy `session.chat.nodes` 旧平面兜底——**双平面**） |\n| 融合层 | **`mergeTurnRailItems` 纯函数模块**（outline→unloaded(seq)、loaded→loaded(key)、双源合并、turn 升序——唯一汇聚点） | **组件内收集 + 投影兜底**（collectFromNodes 枚举节点；投影用于预览/图/跳转序号——无独立融合模块，语义隐性散布） |\n| anchor 类型 | **判别联合** `{loaded:key} \\| {unloaded:seq}`（跳转决策明确） | key 重建（id→`13:input-m
