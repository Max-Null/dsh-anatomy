essage\u003cid>`）+ seq 分开散落 |\n| 跳转 | unloaded → 按 seq loadThrough 翻页 → 滚到 key | `loadThrough(seq)`（alpha.3+）/ 旧内核逐页循环回退 —— **同构**，且兼容面更宽 |\n| 内核依赖 | **仅新内核**（turnOutline/ChatSnapshot 缺则大纲缺席） | **新旧通吃**（双平面 + 回退——主动兼容 α.2→rc.1 全谱系） |\n| 渲染范式 | React 组件（ChatView 内正式注册） | portal + 行内 DOM 注入 + MutationObserver（旧范式，但不依赖内核数据、稳定可用） |\n| 导航杆覆盖 | **全量稳定**（投影大纲 = 全会话 turn 均有标记，未加载 turn 可先翻页再跳） | **窗口导向**（指示点 = 已加载节点；投影作跳转/预览兜底——未加载窗口消息无指示点，但可经收藏/跳转 API 到达） |\n\n## 4. 可借鉴点（机制层，官方 → chat-rail）\n\n1. **投影全量 + 窗口富数据的融合层（最重要）**：抽官方风格纯函数 `mergeRailMessages(chatRailProjection, nodes)`——\n   chatRail 投影提供**全量指示点/序号**（未加载消息也有点、可先 loadThrough 再落位——对齐官方「未加载也能导航」），\n   nodes 提供窗口富预览/锚点；判别联合 anchor（loaded:key | unloaded:seq）。收益：导航杆全量稳定\n   （当前指示点随窗口翻页变化）、可单测、跳转决策明确。\n2. **anchor 判别联合**：对齐官方类型（关键区分「已加载直滚」vs「未加载先翻页」）。\n3. **turnOutline 借力（可选增强）**：会话级 turn 分组头（大会话指示点过多时按 turn 分组折叠）——\n   turnOutline 投影现成（projcache turnOutline row 已验证）。\n4. **保留双平面**（chat-rail 优势，官方只有新平面）：新平面为主、旧平面仅在缺新快照时兜底——不动。\n\n## 4b. 可借鉴点（会话列表/管理增强时的通用契约，官方 → 第三方侧）\n\n1. **列表只消费投影**：一律 `useSessions/useWorkspaces`（SessionListState/投影字段）——不要自建\n   fetch 全量列表端点；新增导航面板（如追问树）的会话元数据取自投影（id/displayTitle/archived）。\n2. **搜索走有界投影**：做列表内搜索/过滤时用官方 search-projection 语义（bounded + refine 提示），\n   或在本地对已投影的可见行过滤（集合操作）——绝不拉全量。\n3. **树渲染窗口化**：折叠组不渲染行（visible rows only），避免一次性渲染数百会话。\n4. **标题信息一律 displayTitle**：不自己读会话文件取标题（官方投影已经含标题 + 独立性语义）。\n5. **消息级导航同构 chat-rail 范式**（chat-rail 本身就是投影契约示例）：消费对应 projectionValues\n   （chatRail 行 = 用户消息摘要）+ DOM 锚点收集已渲染窗口——大会话下自动轻量。\n6. **操作端点保持单会话作用域**：/api 的一次性操作（归档/移动/preset 扫描）不携带列表载入。\n\n## 5. 结论\n\n- rc.1 大会话新设计（投影 + 窗口化）**已通过专项验证**（0.4s），SSiD 零适配。\n- **导航条（dsh-chat-rail）与官方 TurnNavigator 同层同源**（chatRail/turnOutline 投影 + ChatSnapshot 节点\n  窗口 + loadThrough 跳转——机制同构；差异：官方「投影全量导航杆 + 融合层纯函数 + 仅新内核」、chat-rail\n  「窗口导向指示点 + 双平面兼容 + 旧范式渲染」——**屏蔽官方 TurnNavigator（aria 锚点）仍生效，功能无冲突**）。\n- **机制层可借鉴**（§4）：①投影全量 + 窗口富数据融合层（导航杆全量稳定——当前指示点随窗口翻页变化）\n  ②anchor 判别联合 ③turnOutline 借力做回合分组头（可选）④保留双平面（chat-rail 优势）。\n- **会话列表相关第三方插件**（session-manager/sidebar-qa/better-sidebar）：已同源官方 hooks（或无关），\n  按用户决策**本次不处理**（记录在 §2b，后续如需增强按 §4b 契约）。\n- 待办：无新增。后续（自愿）可做「消息级导航增强」（如时间线/搜索跳转）——按 §4.5 chat-rail 范式。\n"},{"file":"版本对比/2026-09-04-0.1.3-alpha.1-vs-0.1.2-alpha.2.md","group":"版本对比","date":"2026-09-04","slug":"0.1.3-alpha.1-vs-0.1.2-alpha.2","title":"DSH 主库版本观察：0.1.3-alpha.1 vs 0.1.2-alpha.2","tags":["dsh-v0","0.1.3-alpha.1","0.1.2-alpha.2","0.1.2-rc.1","0.1.2-alpha.5","0.1.2-alpha.3","0.1.2-alpha.4","0.1.2-alpha.1"],"summary":"- feat(session)!: embed assistant streams in format v2：assistant 流式内容内嵌持久日志；新格式删除旧 chunk-rows.ts - feat(agent): emit live assistant stream frames：agent/assistant-stream 事件 + SessionAssistantStreamAccu","bytes":8048,"lines":104,"body":"# DSH 主库版本观察：0.1.3-alpha.1 vs 0.1.2-alpha.2\n\n> 观察时间：2026-09-04（存档） · 观察库：`DSHfork/`（独立克隆观察站） · 基线：`dsh-v0.1.2-alpha.2`（DSH web/SSiD 锁定版本）\n\n## 结论速览\n\n| 问题 | 答案 |\n|---|---|\n| 什么时候更新的 | 0.1.2-alpha.2（08-30 21:37）→ 0.1.3-alpha.1（09-04 17:16），**5 天 5 个版本**，全部在 2026-08-30 ~ 09-04 |\n| 发布 NPM 了吗 | **0.1.3-alpha.1 未发布**。npm 最新只到 `0.1.2-rc.1`（latest）；`alpha` tag = `0.1.2-alpha.5` |\n| 改动规模 | 750 提交（525 非 merge），跨 0.1.2-alpha.3/4/5、0.1.2-rc.1、0.1.3-alpha.1 |\n| 性质 | 含 **2 个格式级 breaking**（session format v2 + session-persistence handle 重构）+ 3 个大型功能组（通用文件上传 / 出站代理路由 / 会话历史轮次导航） |\n\n## 版本时间线\n\n| 版本 | git tag（提交时间 +08:00） | NPM |\n|---|---|---|\n| 0.1.2-alpha.2（基线） | 08-30 21:37 | ✅ 08-30 |\n| 0.1.2-alpha.3 | 08-31 23:53 | ✅ 08-31 |\n| 0.1.2-alpha.4 | 09-01 23:37 | ✅ 09-01 |\n| 0.1.2-alpha.5 | 09-02 15:48 | ✅ 09-02 |\n| 0.1.2-rc.1 | 09-03 02:27 | ✅ 09-03（`latest`） |\n| **0.1.3-alpha.1** | **09-04 17:16** | ❌ 未发布 |\n\n## 改动主题明细（α.2 → 0.1.3-alpha.1）\n\n### 1. 会话格式 v2（最大 breaking，09-01 ~ 09-04）\n- `feat(session)!: embed assistant streams in format v2`：assistant 流式内容**内嵌持久日志**；新格式删除旧 `chunk-rows.ts`\n- `feat(agent): emit live assistant stream frames`：`agent/assistant-stream` 事件 + `SessionAssistantStreamAccumulator`，冷恢复/回放可拿到生成中中间状态（history 接口 `assistantStream` 回放字段）\n- `feat(session)!: add released format migration`：新包 `session-format` / `session-format-v0-to-v1` / `session-format-catalog`（v0→v1→v2）\n- 迁移兼容系列：v2 stream settlements、迁移工件所有权、surface 顺序校验、body-free 冷列表、迁移数据接受等十余个 fix\n- `fix(agent): terminate live assistant attempts`：被取消流走 try/finally 正确关 live 通道\n\n### 2. 跨进程写所有权租约（09-04，Refs #3245）\n- `feat(session-persistence-jsonl): cross-process write-ownership lease`：写句柄持**内核级写锁**——POSIX `flock(2)`（fs-ext）/ Windows 路径派生命名内核信号量；**进程死亡内核自动释放**（崩溃持有者永不阻塞后继）；POSIX 校验锁定 inode == 锁路径 inode；读句柄永不碰锁；browser worker 下 stub\n- 意义：官方根治\"多实例并发写同一会话日志 → seq gap 损坏\"问题（与此前工作区 `.tmp-*` 修复工具同源问题）\n\n### 3. 通用文件上传与附件（08-28 ~ 09-01，PR #3109）\n- `feat(attachment): store and project generic files`：`attachments.saveFile`（字节级内容寻址，无准入上限）+ `admitEncodedFile`（canonical base64 校验）\n- `feat(session-controller): admit files across command flows`；`feat(conversation): stream files through submission lifecycle`（http-bridge/rpc 改造）\n- `feat(ui-attachment): unify mixed attachment presentation`：`FileCard.tsx`\n- 服务边界重构：isolate/background upload service、prompt admission 收敛等\n\n### 4. 出站网络代理（08-28 ~ 09-04，net 系列）\n- `feat(net): route every outbound request through the configured proxy`：新增 `packages/net`（六函数 util → 四函数收敛到 `http-proxy`）\n- 语义：本机自身排除、子进程/worker 继承路由、`NODE_USE_ENV_PROXY` 细化；新增 `docs/user/guide/network-proxy` + egress 测试矩阵\n\n### 5. 会话历史与轮次导航（08-31 一批）\n- `feat(session-controller): loadThrough deep history paging`、`feat(session-turn-outline): whole-log turn outline projection`、`feat(ui-chat): full-session turn rail with load-and-jump` + scrollable fixed-pitch 轮次栏、settled-response 卡预算预览\n- `feat(session-projection): identity-gated change feed` + unit-declared viewKey change token\n- `feat(ui-chat): settle jump landings after paging completes`\n\n### 6. read_image 图片卡片（08-29 ~ 09-02）\n- `feat(ui-tool): render read_image results as the image`（`tool.call.images` 槽位）+ 嵌套调用支持 + 根调用 meta 缺失回退策略\n\n### 7. skill / 命令模糊排名共享（09-04）\n- `feat(web): rank skill candidates with the shared fuzzy name ranker`：`ui-primitives/rank-by-name.ts`（前缀 + 有序子序列对齐加权），`/` 菜单与 skill 统一；slash token 气泡装饰、clickable-link LinkIcon 统一\n\n### 8. LLM 模型发现扩展（09-02 ~ 09-04）\n- Anthropic Messages 协议模型列表（`GET /v1/models`、`x-api-key`、`anthropic-version`）；解析器同时接受 `data` 数组与富 `models` map；网关 /v1 处理限定到发现\n\n### 9. agent-team / subagent\n- 消息统一 Steer 投递（`steerHostSubagentPrompt`，工具 10→9）；`same-session message editing` 09-02 合入后被 **Revert**（打磨中）\n\n### 10. Web UI 打磨（09-01）\n- 超级椭圆圆角 + 发丝级描边（superellipse / hairline elevation）、composer 描边加深、菜单圆角 20px\n\n### 11. Python SDK 运行时\n- CPython 子进程后端、macOS x64 runtime wheels、SEA 打包劫持子进程 `node` 命令修复（模型发 `node --version` 启动 dsh CLI 的坑）\n\n### 12. 其他\n- storage 跨版本读兼容（`compatibleVersions`）+ legacy bootstrap 版本校验；projcache 跨版本兼容；goal 宿主暂停中止轮次；llm 流式工具调用身份（acceptIdentity）\n- issue-management：PR open 初始化 start date、Project-local Priority、策略令牌守卫\n- `web fetch` 默认暴露（sdk/headless/base）；PTC 模式省略 workflow preset；workspace 路径加固（保留 Windows 盘根）\n\n## 对本工作区的含义\n\n1. **锁 α.2 策略成立**：5 天 5 版 + 2 个格式 breaking；插件生态若跟随主库会持续适配\n2. **未来升级最小风险点 = 0.1.2-rc.1**（npm 已发、无 format v2；含绝大多数修复）\n3. **0.1.3-alpha.1 未发 npm**，且带 format v2 + 写租约等大改——升级需插件重适配，应在 DSHfork 先做迁移试验\n4. fork 上的 `native-cross-session-memory` 与主库无同类冲突（截至本观察日）\n\n## 方法备忘（下次续写）\n\n- 观察库：`DSHfork`（origin=官方主库，master 跟踪 origin/master；fork=Max-Null 三分支已同步）\n- 更新流程：`git -C DSHfork fetch origin`（网络不稳时 `git -c http.version=HTTP/1.1`）→ `git log \u003c上次tag>..origin/master` → 按主题聚类精读代表提交 diff → 追加新观察文档\n- 版本对比基线 tag 命名：`dsh-v0.1.x.y`；当前最新 tag：`dsh-v0.1.3-alpha.1`\n\n## 2026-09-05 补充观察：alpha.1→rc.1 源码构建缺陷（SSiD 适配中发现）\n\n- **现象**：基于 `dsh-v0.1.2-alpha.1` 源码 checkout 的桌面壳（SSiD Electron），web 壳构建产物\n  `apps/web/dist`（`index-D-eoFxDP.js` 424KB，SHA256 前缀 `C43DC436`）丢失 7 个函数级导出\n  （`FISH_LOGO_VIEWBOX` / `diffTotals` / `saveFile` / `ConnectionIndicator` /\n  `IconAlarmClockOutline16` / `IconClockOutline16` / `IconDatabaseOutline16`，grep 计数 0/7）——\n  `packages/client/web/src/seed.ts` 的 `import * as UiPrimitives` 静态表被 tree-shake，\n  页面 client 模块引用 undefined → React `#130 (sidebar.settings)` + `conversation: …reading 'height'`。\n- **对照**：同源码树的 `dsh-v0.1.2-rc.1` tag，`pnpm run clean` 后全量 `pnpm run build`，\n  产物 `index-Df-65__b.js` 423KB（SHA256 `9E845CBB`）7 项导出齐全、页面正常。\n- **推论**：alpha.1→rc.1 之间官方已在源码层面修复（无单一 tree-shake 修复提交，推测为模块图/打包\n  间接触发）；**官方 alpha.1 发布物存在该缺陷，建议复核**（rc.1 已无）。\n- **构建注意**：直接 `vite build`（apps/web 单步）会用各包 `lib/` 预编译残留（client 包 main=lib），\n  tag 切换后必须 `pnpm run clean` + 全量 `pnpm run build`（增量 tsc 缓存撕裂会 MISSING_EXPORT）。\n\n"},{"file":"基线.md","group":"库说明","date":"","slug":"基线","title":"当前观察基线","tags":["0.1.5-rc.1","0.1.5-alpha.2.md","0.1.2-rc.1","0.1.5"],"summary":"1. 更新笔记时同步更新本文件的基线，若结论变了，在笔记里就地更正并注明新基线 2. 不要删除过时结论——改成「在 vX.Y.Z 下如此，vA.B.C 起改为 …」，因为过时本身是证据 3. 新增笔记必须在开头写清读的是哪个版本","bytes":1344,"lines":25,"body":"# 当前观察基线\n\n> 本库所有笔记的结论**只在其读取的 DSH 版本上成立**。上游一变，结论可能失效。\n\n| 项 | 值 |\n|---|---|\n| 观察基线 | **DSH v0.1.5-rc.1** |\n| 记录时间 | 2026-09-12 |\n| 已读范围 | 官方 `.agents/notes/implemented/process/` 全部 47 篇决策记录 |\n| 未读 | `.agents/notes/proposed/` 下的提案（截至基线日期） |\n\n## 升级后要重新核对的高风险结论\n\n| 结论所在 | 结论 | 为什么会被上游改动推翻 |\n|---|---|---|\n| `版本对比/2026-09-10-0.1.5-rc.1-vs-0.1.5-alpha.2.md` | connection 的 carrier-neutral 语义、`ConnectionFetchMethod` 含 POST | 0.1.2-rc.1 只支持 `GET\\|HEAD`，0.1.5 才加 POST；再变一次结论就失效 |\n| `工程范式/` 系列 | 官方门禁的组织方式（一脚本一职责 + 每门自测 + 统一编排器 + 命名聚合） | 官方重构 `scripts/` 时会变 |\n| `决策精读/` 各批 | 提炼出的判断标准 | 标准本身随官方实践演进；新记录可能改写旧结论 |\n\n## 维护约定\n\n1. **更新笔记时同步更新本文件的基线**，若结论变了，在笔记里就地更正并注明新基线\n2. **不要删除过时结论**——改成「在 vX.Y.Z 下如此，vA.B.C 起改为 …」，因为过时本身是证据\n3. 新增笔记**必须在开头写清读的是哪个版本**\n"},{"file":"README.md","group":"库说明","date":"","slug":"README","title":"dsh-anatomy","tags":["dsh-anatomy","dsh-skills"],"summary":"见 [基线.md](./基线.md)。笔记的结论只在其标注的基线版本上成立 —— 引用本库内容时，先确认基线是否仍匹配。","bytes":1520,"lines":27,"body":"# dsh-anatomy\n\n对上游 **[DeepSeek Harness](https://github.com/deepseek-ai/deepseek-harness)** 的**解剖**：把它的内部构造拆开看——\n它凭什么这么判断、门禁怎么编排、版本与版本之间差在哪。\n\n>
