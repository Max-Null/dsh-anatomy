o unresolvable ordinals kept landing.\n\n**文档标准早就禁止了\"变更历史\"那一半（previously/now、PR 和 commit 引用），但没有为\"引用\"这一半陈述对应规则**——所以无法解析的序号不断落地。\n\n这是\"规则有缺口\"的教科书案例：**禁了一半，没管另一半，漏洞就从没管的那半漏进来。**\n\n### 判断\n\n持久散文（注释、JSDoc、文档、笔记、测试注释和标题）**只引用已提交的产物**，且能在仓库内解析、不需要 grep 考古：\n\n- 可以引用：**具名的拥有者 Agent Note**（路径至少出现一次，正文里有个可搜索的名字）、**文档页路径**、**GitHub issue 号**\n- 仍然禁止：PR、commit、branch、stack 位置（按文档标准）；不过 Agent Note 和事故复盘**可以引用已合并的 PR 和 issue 作为证据**\n- **有已提交拥有者的序号 → 用该决策的名字替换**（\"decision 21\" → \"the plain-text-reference decision\"），序号本身在全仓删掉\n- **没有拥有者的序号 → 直接删除，把它的叙事分句重述为能独立成立的陈述**\n- **已修复的回归用现在时的反事实表述**（\"without X, Y happens\"、\"a naive X would…\"），**绝不用仓库历史**（\"used to Y\"）\n- implemented 笔记陈述**已发布现实**：一条 \"deferred to a later PR\" 如果目标早已发布，就改成具名那篇已发布的笔记\n- **豁免**：录制的 fixture、快照、归档笔记——**录制的模型输出和封存的历史保持原声**\n- **召回探针使用词汇边界，并用已知正例和一个近似负例来校准**；撰写语言探针针对**相反语言的那一面**，而不是把完整的中文语料当作\"未翻译残留\"\n- **所有者优先的编辑要追踪每一个生成的消费者**；逐字代码围栏在双语对之间逐字节复制\n\n### 凭什么这么判断——三个被否决的方案\n\n| 方案 | 否决理由 |\n|---|---|\n| **把设计账本和审计文档提交进去，让序号可解析** | 会话记录是**工作产物，不是维护中的参考**；提交它们会在 Agent Note 旁边**创造一份平行的、没有门禁的决策语料**，而且它们的内部编号**仍然会漂移** |\n| **为禁用词汇做一道机械门禁** | **推迟，不是否决**——理由见下 |\n| **删除那些引用了死产物的理由** | 事实分句被保留或重述；**只有引用、评审编排和推导记录被移除** |\n\n第 3 条划出了删除的边界：**删的是引用，不是理由。**\n\n### 为什么机械门禁被\"推迟\"而不是直接做\n\n这是全篇判断力最集中的一段，值得逐句看：\n\n> the vocabulary is unbounded natural language, and the audit's recall batteries need judgment to separate leakage from legitimate prose (\"wait\" the noun, contrastive \"actually\", runtime old/new states)\n\n词汇是**无界的自然语言**，审计的召回电池**需要判断力**才能区分泄漏与合法散文——比如作名词的 \"wait\"、表对比的 \"actually\"、运行时的 old/new 状态。\n\n他们给出了一份**窄的高精度候选门禁清单**，供模式复现时启用：\n\n```\n\\(decision \\d      \\(audit [A-Z]\\d      \\bcut \\d      this cut\n\\bT\\d\\b            P-I                  used to       \\bv1\\b      §\\d\n```\n\n（最后一条 `§\\d` 排除那些章节编号**有已提交拥有者**的引用。）\n\n而这份清单的**来源**很讲究：*\"review of the purge itself caught residuals in exactly the cases those searches missed, so they lead the candidate list\"*——**对清除行动本身的评审，恰好抓到了那些搜索漏掉的情况，所以它们领跑候选清单**。\n\n### 一次坦诚的缺口披露\n\nVerification 段最后一句：\n\n> Coverage gap: no gate rejects a new ordinal citation — review owns the rule.\n\n**覆盖缺口：没有门禁拒绝新的序号引用——这条规则由评审承担。**\n\n官方**主动写出**\"这条规则靠评审而非门禁\"。这一点在第 01 批的判断标准①（\"可机械判定的不变量必须编码成检查\"）旁边看尤其有意思：它说明**\"能不能机械判定\"本身就需要判断**，硬上一道会误伤合法散文的门禁，只会制造第 01 批判断标准⑦所说的坏训练。\n\n### 他们承认的代价\n\n- 注释里的引用通过**路径或名字**解析；读者永远不需要重建一个已关闭的会话来跟进\n- **设计会话必须先把决策落到 Agent Note，持久散文才能引用它们**；序号速记留在会话内部\n- 引用会变长（一个笔记路径替代 \"(decision 21)\"），换来的是**免 grep 的解析**\n\n---\n\n## 这批的共同判断标准\n\n**① 换一个宽泛的词等于什么都没做。**\n\"把抽象标签统一换成 source/origin/metadata\"被否决的理由是：**另一个宽泛标签仍然让读者去猜**。这条直接适用于任何\"统一术语\"的冲动——统一到一个同样模糊的术语，只是把谜题换了个面。\n\n**② 规范只禁了一半，漏洞就从另一半漏进来。**\n文档标准禁止了\"变更历史\"，却没管\"引用\"，于是序号引用不断落地。看任何规范时都该问：**与它对称的那一半在哪？**\n\n**③ 删除时要区分\"引用\"与\"理由\"。**\n死产物的引用可以删，但**事实分句要保留或重述**。删掉引用就删掉理由，是过度清除。\n\n**④ 不能被机械判定的规则，要么推迟，要么明说缺口。**\n他们对禁用词汇**推迟**了门禁，并列出高精度候选清单备用；同时**主动写出**\"覆盖缺口：这条规则由评审承担\"。两条路都比\"假装有门禁\"诚实。\n\n**⑤ 探针必须用正例和近似负例校准。**\n\"用已知正例和一个近似负例校准\"、\"召回电池需要判断力区分泄漏与合法散文\"——这是待办 #8 的直接方法论输入。近似负例（near-miss negative）是这里的关键：**只测正例的探针，无法知道自己有没有误伤。**\n\n**⑥ 强制的摩擦可以是刻意的。**\n`Alternatives considered` 是\"刻意的摩擦\"，理由是：**一个没记录它击败了什么的决策，会招致它本来要防止的重新打官司**。摩擦不总是坏事，要看它阻止的是哪种未来成本。\n\n**⑦ 诚实的空白胜过编造的理由。**\n无法重建 alternatives 的旧笔记，永久保留一行\"此处不可重建\"的注释，而不是补一段像样的理由。**这与\"编造一个合理的历史\"只有一线之隔，而他们选择了留白。**\n\n**⑧ 自描述优先于依赖上下文。**\n`Agent Note: ` 前缀让文件挪出树外仍能自述体裁；Status 行保留而非依赖文件夹。**假设读者在错误的上下文里读到它。**\n\n---\n\n## 下一批（待读）\n\n主题定为**评审与协作机制**：\n\n- `2026-08-10-event-directed-pr-review-status.md` —— 评审状态的事件驱动\n- `2026-08-02-native-github-stacks-and-optional-rebases.md` —— PR 历史的选择\n- `2026-08-08-unified-github-label-taxonomy.md` —— 标签分类\n- `2026-08-09-blocked-weighted-approvals-remain-pending.md` —— 审批语义\n- `2026-07-26-dependencies-over-hand-rolling.md` —— 依赖优于手搓（这条是 AGENTS.md 里直接引用的政策）\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-03-权威与推断.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-03-权威与推断","title":"DSH 过程决策精读 · 第 03 批：权威与推断","tags":[],"summary":"2026-08-10-event-directed-pr-review-status.md","bytes":15835,"lines":221,"body":"# DSH 过程决策精读 · 第 03 批：权威与推断\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。读之前我以为主题是\"评审与协作\"，读完发现它们共同回答的是一个更基础的问题：\n> **当\"事实\"有多个可能的来源时，以谁为准？**\n> 三篇分别给出了三种答案，而且第三种（依赖政策）反过来讲了一件更狠的事：**当权威根本不存在时，发生了什么。**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [评审状态的事件驱动](#1-评审状态的事件驱动) | 聚合状态会撒谎，交接事件不会 |\n| 2 | [原生 stack 与可选 rebase](#2-原生-stack-与可选-rebase) | 共享元数据优先于本地推断 |\n| 3 | [依赖优于手搓](#3-依赖优于手搓) | **沉默不是中立**——没写下的政策会被推断得更严 |\n\n---\n\n## 1. 评审状态的事件驱动\n\n`2026-08-10-event-directed-pr-review-status.md`\n\n### 他们遇到的事\n\nIssue Project 的状态记录的是**\"谁拥有下一步\"**——这是一个交接（handoff）语义。\n\n但 GitHub 给出的聚合评审状态回答的是另一个问题：**\"GitHub 是否认为这个 PR 可合并\"**。它无法表达交接，有一个具体的反例：\n\n> an earlier `CHANGES_REQUESTED` review can remain effective after the author fixes the code and requests review again\n\n**一个更早的\"请求修改\"评审，在作者修完代码并重新请求评审之后，仍然保持生效。** 于是聚合状态说\"被阻塞\"，而现实中球已经踢回评审者那边了。\n\n第二个问题：单调（只前进）的投影**无法**在评审者请求修改时，把一个自动化拥有的 Issue 从 `In review` 退回 `In progress`。\n\n### 判断\n\n把评审 webhook 当作**命令**来处理，而不是当作状态快照：\n\n- `pull_request.review_requested`（**包括重复请求**）→ 目标状态 `In review`\n- `pull_request_review.submitted` → 目标状态 `In progress`，**仅当** `review.state` 是 `changes_requested`\n- submitted 事件**仍然必要**，因为**评审者可以在没有更早的评审请求事件的情况下直接请求修改**\n- approved 和 commented 的提交**运行它们的生命周期 job 但什么也不做**（从不触达 Project token 那一步）\n- dismissed（被驳回的）评审**不订阅**\n\n然后是最关键的不对称设计：\n\n- 普通订阅的 PR 事件保持**只前进**——可以把 `Inbox`/`Backlog`/`Ready` 移到 `In progress`，但**不能把 `In review` 往回移**\n- 而 changes-requested 命令**只有在**目标 Project 的最新状态事件是由配置的生命周期 actor 写下的时候，才能把 `In review` 往回移\n- **人类或未知的最新 actor，保留当前状态**\n\n### 一份\"不做什么\"的清单\n\n这篇花了整整一段列举它**不做**的事，这在这批材料里很罕见，值得单独记住：\n\n不改变终态、不为没有 Project 状态的 Issue 添加状态、不依赖 PR 元数据的有效性、不查询 `reviewDecision`、不重建评审轮次、不从 Issue 反查 pull request、**不运行定时的对账器**。\n\n最后一条尤其值得注意：**不加一个定时对账器来兜底**。对账器看似稳妥，实则引入了一个\"与事件流并行的第二套真相\"——正是第 01 批判断标准②要拒绝的东西。\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 从 `reviewDecision` 或重建的评审轮次推导状态 | GitHub 的聚合**在重复评审请求之后可能仍停留在 `CHANGES_REQUESTED`**；而一个轮次 reducer 会引入**超出两个显式交接**的评审者语义和顺序语义 |\n| 保持只前进的投影 | 单调推进保护了后续状态，但**让 Issue 停在 `In review`，而作者正在实现被请求的修改** |\n| **无条件**应用每一个评审命令 | 这是最小的处理器，但它**让自动化覆盖人类拥有的 Project 状态**——所以\"最新目标 Project 状态的 actor\"成为唯一那道后退转换的守卫 |\n| 恢复 `ready_for_review` 或加一个防抖队列 | ready 状态**不携带任何评审交接**；而多一个队列**增加延迟和控制面状态，却不改变任何一个命令** |\n\n第 3 条的对照最有教育意义：**\"最简单的实现\"和\"正确的实现\"在这里正好相反**——无条件应用是代码最短的写法，但它跨越了一条所有权边界。\n\n### 他们承认的代价\n\n坦诚得不寻常，原文列了三条：\n\n- 重复的评审请求会把自动化管理的 Issue 移到 `In review`，**即使 GitHub 仍报告一个更早的阻塞评审**\n- 投影保持事件驱动，**不会修复一个从未运行的事件**\n- **重放一个旧的 workflow run 可以重放它当时的旧命令**；而且 ProjectV2 **仍然不提供**\"读取最新状态\"与\"变更\"之间的原子 compare-and-swap\n\n也就是说：存在竞态，他们用\"逐 PR 的 workflow 并发\"和\"人类所有权守卫\"**减少**了竞态，但**没有引入持久的生命周期状态**去根除它。这个取舍是明写的。\n\n---\n\n## 2. 原生 stack 与可选 rebase\n\n`2026-08-02-native-github-stacks-and-optional-rebases.md`\n\n### 他们遇到的事\n\n一个只由 base 分支表示的依赖 PR 链，**没有官方的 stack 身份**。落地这样一条链需要手工一次合并一个 PR、保留中间分支、给每个子 PR 重定目标，然后**重建这条链是否还活着**。\n\n而 GitHub 的原生 stacked-PR 特性把这些都接了过去：携带顺序、对**每一层**应用 trunk 规则和 CI、自己拥有自底向上的合并和重定向。\n\n同时出现了第二条线索：**一刀切禁止重写已评审分支**，会把官方的 `gh stack` 同步工作流也排除掉（它的级联 rebase 会更新每一层并用 lease 保护发布）。而如果只在 stack 之外应用那条禁令，又会**给独立 PR 和 stack PR 两套不一致的历史选择**。\n\n### 判断\n\n- 每个同仓库、两个及以上依赖 PR 的链，**落地前必须使用 GitHub 官方的 stack 对象**\n- **活的** `PullRequest.stack` 和 `stackEntry.position` 字段是权威\n- 单作者的非 stack 链**自动**链接（`gh stack link`，自底向上）；**混合作者或作者不可用需要用户确认**\n- **缺少原生支持、跨 fork 链 → 硬停**\n- 已存在于冲突 stack、或官方顺序与分支拓扑不一致 → **需要用户指示**才能解散或重建\n- \"落地 stack\" 合并**完整的**官方 stack；部分落地**必须**指定一个显式的边界 PR\n- **绝不回退**到逐 PR 的 `gh pr merge` 加手工重定目标\n\n历史改写方面：\n\n- **merge-forward 和 rebase 都允许**作为刷新历史的手段，**包括评审之后**\n- 远程历史重写必须用**精确的 lease**或受 lease 保护的 push 路径，**远端移动就中止**；**裸 `--force` 禁止**\n- `gh stack sync` 是一个**显式例外**：因为它把 fetch、级联 rebase、push 当作一个操作，所以**每一个被重写的层都要在之后立刻验证，且任何受影响的 PR 在证据通过前都不得合并**\n- 任何重写后的 push 之后，**重新审计**：当前 heads、未解决的评审线程、批准、可合并性、检查——因为**更早的 commit OID 和内联锚点可能已经过时**\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 保持分支链作为唯一的 stack 表示 | 保留了手工流程，但**给不了 GitHub 一个 stack 对象**去展示顺序、在每一层强制 trunk 规则、或原子地合并一个范围 |\n| 采用原生 stack，但禁止其评审后的 rebase 命令 | 保持 commit OID 稳定，但**在 stack 处于活跃评审时禁用了官方同步路径**，并让独立 PR 落在**另一套政策**下 |\n| 要求每个 PR 刷新都 rebase | 线性历史有用，但**合并检查点仍是有效选择**——当\"保留已完成的冲突解决及其恢复点\"比\"紧凑历史\"更重要时 |\n| 自动解散冲突的 stack | 会让**本地分支推断覆盖共享的 GitHub 元数据**，还可能打扰被请求链**之外**的 PR 或作者 |\n\n### 一条贯穿的边界：谁的元数据\n\n把四种\"需要用户确认\"的场景排在一起看——混合作者、冲突 stack、顺序与拓扑不符、部分落地——会发现它们共享同一个性质：**这些是共享的元数据，不是本地状态**。\n\n于是自动化的边界就清楚了：**本地能确定的事自动做，涉及共享元数据或链外影响的事，必须留给人类。** 这与第 1 篇的\"人类拥有权守卫\"是同一条原则的两种应用。\n\n### 他们承认的代价\n\n- 重写 push 会使 commit 哈希、批准或评论锚点失效，**所以每次重写 push 都带着一次活的评审与检查审计**\n- `gh stack sync` **可能短暂地发布本地证据尚在等待的代码**；受影响的 PR 保持禁止合并直到同步后验证通过\n- merge-forward 仍然可用并保留已完成的检查点，**代价是额外的合并提交**\n\n---\n\n## 3. 依赖优于手搓\n\n`2026-07-26-dependencies-over-hand-rolling.md` · **本批最重要的一篇**\n\n### 他们遇到的事\n\nharness 手搓了大量成熟外部包已经提供的基础设施。其中**有一部分是刻意的**（vendored Cordis、孪生 LLM 适配器、schemastery 作为配置 schema 标准）——但他们诚实地指出，**更多的部分是从一个从未被说出口的\"避免新依赖\"反射中积累出来的**：\n\n> the repo-wide external dependency list stayed tiny while packages grew their own SSE parsers, protocol framers, retry loops, and glob matchers\n\n仓库范围的外部依赖列表保持极小，而各个包长出了自己的 **SSE 解析器、协议分帧器、重试循环、glob 匹配器**。\n\n然后是整篇的题眼，也是我在这 94 篇里读到的最重要的一句：\n\n> Nothing in `AGENTS.md` actually stated a dependency policy, so agents inferred one from the existing pattern, and the inferred rule (\"don't add deps\") is stricter than anyone decided.\n\n**`AGENTS.md` 里没有任何地方陈述过依赖政策，所以 agent 从既有模式中推断出了一条——而推断出的规则（\"别加依赖\"）比任何人实际决定的都严格。**\n\n他们对这个现象的命名是：**默认运行的\"非我发明\"（Not Invented Here）谬误**。每一个手搓的成熟库克隆，都是我们自己要测试、写文档、评审、调试的代码，**却一点也拿不到生态积累的边界情况修复**。\n\n### 判断\n\n- 引入外部依赖是**合法的简化**，不是政策例外\n- 当维护良好的包（或引擎底线之上的 Node 内置模块）覆盖了手搓的面，**替换手搓代码是首选方向**\n- 但受**与其他简化相同的证据标准**约束：交换必须**真正缩小我们所拥有的东西**（代码、测试、契约面），**而不是把复杂度搬到一个 wrapper 后面**\n\n新依赖的四条门槛：\n\n| 门槛 | 判断内容 |\n|---|---|\n| **净删除** | 依赖替换的是**真实的、已拥有的代码**（实现 + 专用测试 + 文档），不是假设的未来代码。**只增加能力的依赖是特性决策，不是简化** |\n| **健康度** | 活跃维护、广泛使用、传递依赖足迹合理。**一个微小的无人维护的包，是用我们的代码换了别人的废弃代码** |\n| **边界契合** | 包的语义要覆盖我们**实际**的契约；**我们仍然围着它手搓的剩余语义要算作这次交换的负分** |\n| **不是已定的接缝** | schemastery、vendored Cordis、`@earendil-works` 孪生等已记录在 implemented Agent Note 里的决策**不因本政策重开**；一个要瓦解已记录设计的交换，**需要击败那个已记录的理由，而不只是引用本笔记** |\n\n还顺手澄清了一处被误读的规则：`packages/util/` 的\"零依赖\"宪章描述的是那个组的**导出**纪律（util 包保持不含 harness 依赖，这样任何组都能依赖它们），**并不禁止外部包**。一个 util 包如果它的全部工作都被维护良好的外部包做得更好，**应该被依赖替换，而不是为了宪章而保留**。\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 保持隐式的\"不加新依赖\"文化 | **它从来不是一条被记录的决定**；而它的成本是具体的——手搓的协议与解析代码重复了久经沙场的库，**抬高了逐文件覆盖率负担**，并**拖慢每一个必须重新推导\"生态早已修好\"的边界情况的评审者** |\n| 一份获批包的硬白名单 | 仓库处于发布前、依赖集很小；**逐 PR 的证据门槛（净删除、健康、契合）加评审，把判断留在有上下文的地方**，而不是建立一个本身就需要维护的常设委员会制品 |\n| 像 Cordis 那样 vendor 每个新依赖 | vendor 是留给**我们必须打补丁或对抗上游翻腾而钉住**的包；广泛套用它**会重建依赖本来要卸下的维护负担** |\n\n第 2 条否决理由里那句\"**把判断留在有上下文的地方**\"值得记住——他们宁可逐 PR 付证据成本，也不要一个\"本身需要维护的常设制品\"。\n\n### 他们承认的代价\n\n- 依赖列表会增长，随之而来的是**供应链面**；而本政策**让那个供应链提案变得更紧迫**（原文就用\"more urgent\"）\n- 根 `AGENTS.md` 只放一行规则，**理由和门槛由这篇笔记承担**\n\n---\n\n## 这批的共同判断标准\n\n**① 当推断与权威冲突时，权威胜。**\n三篇的三个版本：聚合状态 vs 交接事件（**选事件**）、本地分支推断 vs 共享元数据（**选共享元数据**）、从现状推断的模式 vs 写下的决定（**选写下的决定**）。\n\n**② 而权威不存在时，必须显式建立它。**\n第 3 篇证明：**沉默不是中立**。政策不写下来，就会被从现状中推断出来一条——而且**推断出来的总是比你想的严格**。这大概是\"把规范写下来\"最有力的论证，比\"便于查阅\"这种理由强得多。\n\n**③ 状态要表达交接，不要表达判定。**\n\"谁拥有下一步\"是交接，能驱动行为；\"GitHub 认为可合并\"是判定，会在具体反例上说谎。**选状态时先问：它是用来驱动谁的下一步动作的？**\n\n**④ 自动化的边界由\"谁拥有这份元数据\"划定。**\n第 1 篇的人类所有权守卫、第 2 篇的四类\"需要用户确认\"，是同一条原则：**本地能确定的事自动做；共享元数据或影响链外的事留给人类。**\n\n**⑤ 重写历史必须带租约，且事后重新审计。**\n精确 lease 或受 lease 保护的路径，远端移动就中止；裸 `--force` 禁止。而且因为 commit OID、批准和评论锚点会失效，**每次重写 push 都要重新审计评审、批准、检查、可合并性**。\n\n**⑥ 不做的事也要列出来。**\n第 1 篇那段\"不重建评审轮次、不查询 reviewDecision、不加定时对账器\"，价值不低于决策本身——**它划出了\"这条命令管到哪为止\"**。定时对账器尤其典型：它看似稳妥，实则是事件流之外的第二套真相。\n\n**⑦ 交换必须真正缩小我们所拥有的。**\n\"净删除\"这条门槛针对的是一个常见伪装：**把复杂度藏到 wrapper 后面**，看起来代码变短了，实际什么都没减少。\"我们仍然围着它手搓的剩余语义要算负分\"是同一个判断的延伸。\n\n---\n\n## 下一批（待读）\n\n继续**协作机制**线，补齐本批未读的两篇，外加相邻主题：\n\n- `2026-08-08-unified-github-label-taxonomy.md` —— 标签分类\n- `2026-09-09-blocked-weighted-approvals-remain-pending.md` —— 审批语义\n- `2026-07-26-ci-failover-runbook.md` —— 故障切换\n- `2026-09-03-semantic-issue-templates-and-policy.md` —— issue 模板的语义化\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-04-什么算证据.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-04-什么算证据","title":"DSH 过程决策精读 · 第 04 批：什么算证据","tags":["2.99.0"],"summary":"2026-08-08-browser-gif-evidence-chain.md · Problem 段写得极好，值得整段记住","bytes":14557,"lines":215,"body":"# DSH 过程决策精读 · 第 04 批：什么算证据\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。读完发现它们在做同一件事：**识破\"看起来等价\"的替代品**。\n> 一堆各自为真的截图不等于一次真实执行；历史上出现过的加速不等于现在该做的优化；从路径推导的标签不等于语义影响。\n> 三篇都在回答：**这个东西凭什么算证据？**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [浏览器 GIF 保留单一证据链](#1-浏览器-gif-保留单一证据链) | 各自为真的截图，证明不了一次真执行 |\n| 2 | [证据驱动的性能优化](#2-证据驱动的性能优化) | 历史加速产生假设，不构成处方 |\n| 3 | [统一的 GitHub 标签分类](#3-统一的-github-标签分类) | 评论而不修复，等于保留无效状态 |\n\n---\n\n## 1. 浏览器 GIF 保留单一证据链\n\n`2026-08-08-browser-gif-evidence-chain.md` · **Problem 段写得极好，值得整段记住**\n\n### 他们遇到的事\n\n一个浏览器演示的分镜（storyboard）可以**包含各自都为真的截图，却不能证明一次真实的执行**。他们列了四种具体的失效：\n\n- **复用全局应用状态**，会把旧的设置或会话带进来\n- 捕获自动化会**意外地把来自不同模型运行的帧组合在一起**\n- **聊天记录可以展示一次成功的回退，却不暴露导致它的那次工具拒绝**\n- 模糊的可访问名称匹配会接受**提示词回显**或后代文本，而不是预期的结果\n\n还有两条发布边界：\n\n- 产品默认可能打开一个**自动化无法驱动的原生操作系统界面**；而用 mock 或测试钩子替换它，意味着 **GIF 不再展示生产路径**\n- **一次成功的上传或 push，并不证明上传的资产在评审路径上可达且完整**，也不证明 GitHub 把 PR 的 Markdown 认作图片\n\n### 判断：一个分镜 = 一条证据链\n\n核心原则一句话：**一个分镜就是一条证据链，钉在确切的 PR head 上。**\n\n- 构建前要求**干净的工作树**，并记录那个 commit SHA\n- 每次运行使用**全新的** `DSH_HOME`、`DSH_AGENTS_HOME`、工作区、会话和隔离的浏览器状态\n- **每个发布的帧都来自同一次服务器 + 模型驱动的场景运行**\n- 失败的一次捕获**整场丢弃、从全新的根重来**，**绝不与另一次运行拼接**\n- 浏览器自动化**等待唯一的、确切语义的状态**\n- 当主张涉及工具调用、拒绝或恢复时，分镜必须包含一个**细节帧或轨迹帧**：指明是哪个工具、展示其状态或稳定错误码、并展示下游结果\n- **最终编码的 GIF 才是验证主体**——查看器动不了它时，要**从那个 GIF 里解码代表帧**，而不是拿源截图当等价证据\n- 原生生产界面**只能通过正常的应用配置**、用一个官方可被浏览器驱动的生产后端来替换，且**这个覆盖要标注在 GIF 旁边**\n- **fixture、mock 传输、合成事件、测试专用钩子，都不构成真实生产主张的证据**\n\n### 发布阶段要再验一次边界\n\n他们不信任\"上传成功\"这件事，而是把发布拆成可验证的几步：\n\n- 首选 `gh --attach`（v2.99.0+、仅 github.com、上限 10 MB）：body 文件引用本地 GIF 路径 → 命令上传**已验证的产物**并**就地重写那个引用** → 然后**活体 body 必须显示重写后的 URL，且该 URL 必须返回 `200` 和 `image/gif`**\n- 改动 PR body **之前**，活体 head 必须**仍等于**记录的 head；编辑**之后**再检查一次，必须**仍在该记录值上**\n- GitHub 的 Markdown 渲染器**单独**必须产出预期的图片\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 当可见状态\"看起来等价\"时，允许不同运行的帧混用 | **视觉相似性不确立共享状态、因果顺序或单次场景执行。** 重录要再花一轮真实成本，但**保住了分镜所主张的东西** |\n| 用聊天记录作为\"工具恢复\"的充分证明 | 最终答案证明任务完成了，但它**可以隐藏：哪个工具运行了、失败是否是结构化的、模型是否从该失败中恢复** |\n| 用 fixture 或测试钩子替换不可访问的原生 UI | 那**是通过改变被观察的产品路径**来让自动化更容易。通过正常配置选择官方生产后端，**让被执行的实现保持真实**，并让更窄的模式**显式** |\n| 相信一次成功的上传或 push | 上传或 push **只证明 GitHub 接受了那些字节**，不证明 body 引用指向了上传的资产，也不证明 Markdown 渲染了图片 |\n\n### 他们承认的代价\n\n- 工作流要花额外的暂存状态；**捕获失败后可能要重复一轮真实模型**\n- 通常要多加一个细节帧，外加一串发布检查（活体 head 与 body 重读、Markdown 渲染、上传 URL 抓取）\n- **无头录制能用的生产后端比交互式桌面少**，而每一个被选中的后端**都要标注在 GIF 旁边**\n\n最后一条是\"诚实边界\"的又一例：**能力受限这件事被写在产物旁边，而不是瞒着。**\n\n---\n\n## 2. 证据驱动的性能优化\n\n`2026-09-06-evidence-driven-performance-skill.md`\n\n### 他们遇到的事\n\n两件具体的事：\n\n1. 性能工作**会改进一个孤立的阶段，同时把成本搬到另一个阶段、保留更多数据、或者跳过必需的行为**\n2. **历史 PR 描述会保留被放弃的实现和估算**——所以照着它们表面上的解决方案做，**可能恢复一个已被拒绝的设计**，而不是解决当前的瓶颈\n\n### 判断\n\n把宽泛的性能调查导向**有界的、可测量的用户路径**，并组合：\n\n- 聚焦的归因 + **独立计时**的后端与浏览器端点\n- 合成的工作负载分布\n- **可比较的**冷/热与保留内存条件\n- **针对收紧预算的负对照**（negative controls）\n\n一条容易被忽略但很关键：**工作流要求独立于计时的行为证据**。模型可见日志、持久代际与发布规则、流顺序、取消、释放**仍然是义务**——性能优化不能成为删掉它们的理由。\n\n以及两条边界：\n\n- **授权的私有语料检查只产出聚合的工作负载灵感**；提交的输入和发布的产物**只含合成材料**\n- 优化 PR 携带它**更紧的预算**；而前面一层基准可以保护已测量的基线，并**保持可独立合并**\n\n### 他们怎么处理\"历史证据\"（这段最有教育意义）\n\n表格开头先声明三点：\n\n> These are **author-reported historical measurements, not benchmarks rerun for this workflow**. **Final merged diffs and owning source take precedence over original PR descriptions.** The rejected intermediate proposal is retained **only to explain why identity registries are not a general prescription**.\n\n1. 这些是**作者自报的历史测量，不是为这个工作流重跑的基准**\n2. **最终合并的 diff 和拥有它的源码，优先于原始的 PR 描述**\n3. 被否决的中间提案**保留下来，只为解释\"为什么身份注册表不是一条通用处方\"**\n\n然后表格里每一行都给一个 \"Reusable lesson\"，而且**诚实标注哪些数字是估算而非测量**（例如 \"The 10,000-node timing table is **estimated, not browser measurement**\"）。还专门保留了一行 **closed unmerged** 的 PR，并写明\"**没有当前的所有权证据就不要复活它**\"。\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| **先优化可疑代码，再测量** | 局部复杂度**不能识别主导的用户成本**，也**无法建立改进或回归保护** |\n| **把历史上的加速当作可复用的处方** | 表示法、所有权和生命周期要求**会变**。**历史证据产生假设；当前生产路径和新鲜测量决定一个改动是否适用** |\n| **只用微基准，或只用端到端计时** | 孤立的阶段会**漏掉被搬走的成本**，而聚合计时**无法定位原因**。两者都需要，在适合所选问题的范围内 |\n\n第 2 条是本批最重要的一句：**历史证据产生假设，不构成处方。**\n\n### 他们承认的代价\n\n- 这个 skill **不增加任何运行时行为、基准实现或新的 CI 政策**；它的验证只是文档/链接一致性与 skill 元数据\n- **每个未来的优化，都在自己的拥有者处提供可执行的测量和功能证据**\n- **有限的场景/修复范围，防止一个宽泛的性能请求变成一次无关的架构重写**\n\n最后一条值得单独记：**限定范围本身就是一种防御**——防止任务从\"优化 X\"蔓延成\"重写架构\"。\n\n---\n\n## 3. 统一的 GitHub 标签分类\n\n`2026-08-08-unified-github-label-taxonomy.md`\n\n### 他们遇到的事\n\nPR 标签实际在回答**两个独立的问题**：这次改动做的是**哪一类工作**，以及它**实质影响了哪些持久的仓库领域**。\n\n两个失效模式：\n\n- **混合这两个维度**，或保留同义的普通标签与命名空间标签，会让**查询变得有歧义**\n- 而**一个封闭的领域清单，会强迫新领域进入不准确的类别**\n\n### 判断\n\n- 每个开放的或已合并的 PR：**恰好一个**规范的 `kind/*`，**至少一个**实质影响的 `area/*`\n- **从未合并就关闭的 PR，保留迁移过来的历史分配，但不会获得被臆造的缺失分类**\n- kind 集合**封闭且互斥**；kind 记录**主导意图**——附带的测试、文档、清理、依赖移动，**不覆盖** feature 或 bug fix\n- **保留（reserve）统一化过程中移除的每一个别名**（`kind/bug`、`feature`、`docs`…），理由很精准：*\"防止一个过时的同义词被重新创建为一个看起来无关的操作标签\"*\n- area 集合**刻意可扩展**：当没有现存的描述能**诚实地**覆盖一个持久且可复用的领域时，**agent 可以不经单独批准就创建**一个 `area/\u003clowercase-kebab-case>`；但**不得**为一个 PR、一个偶然路径、一个临时项目、一个状态、或一个人/团队创建。应用后要**向请求者报告新标签和理由**\n\n最后一条附了一个很硬的约束：**仅仅为了避免一次有正当理由的新增，而复用一个不准确的 area，是不可接受的。**\n\n### 凭什么这么判断（9 个被否决方案，挑最利的几条）\n\n| 方案 | 否决理由 |\n|---|---|\n| **一个未区分的标签集合** | **一个标签的存在，不会证明\"意图\"和\"语义范围\"都被考虑过** |\n| **从包或路径推导 area** | **area 描述跨包边界的语义影响，而变更路径包含偶然的测试、文档和支持文件** |\n| **宽泛的实现标签替代产品或工程主题** | **一个具体能力不仅仅是它的工具、界面、文件系统或进程实现** |\n| **在 Issue 上加 kind** | 原生 Issue Type 已经拥有那个分类；**重复它作为标签会产生漂移** |\n| **只靠评论来做 Issue 执行** | **一条评论保留无效元数据并要求人工清理，即使唯一有效的结果就是移除。** 生命周期直接应用那个移除，只为它**无法推断**的选择保留评论 |\n| **每个 PR 恰好一个 area** | 连贯的改动可以实质影响多个独立的 API 或行为，**丢掉次要 area 会隐藏受影响范围** |\n\n第 5 条是本批的另一颗珍珠：**\"评论而不修复\"被否决，因为它保留了无效状态并要求人工清理。** 这与第 01 批的\"不接受过渡态\"是同一条原则的不同侧面——**知道该怎么修却不修，只是把成本推给未来的人力**。\n\n### 他们承认的代价\n\n- 维护者必须**读改动和活的标签描述**，而不是从标题前缀或路径**推断分类**\n- **活的目录、这份理由、以及政策执行，必须在 kind 或某个不明显的 area 边界变化时一起移动**\n- 分类法的迁移**带有明确的历史回填与验证成本**\n\n---\n\n## 这批的共同判断标准\n\n**① 相似性不构成同一性。**\n这是本批的核心。\"看起来等价\"有四种典型伪装：**视觉相似**（不同运行的帧）、**结果相似**（聊天记录显示成功但隐藏了失败路径）、**来源相似**（历史加速看起来是现成答案）、**名称相似**（用宽泛标签替代语义分类）。每一次他们的判断都是：**回到\"这个主张到底需要什么\"**。\n\n**② 历史证据产生假设，不构成处方。**\n性能篇的原话。配套的两个操作：**合并后的 diff 优先于 PR 描述**（因为描述里留着被放弃的设计），**被否决的提案要保留但只为解释边界**。\n\n**③ 要验到\"评审者真正使用的那条路径\"。**\nGIF 篇不满足于\"push 成功\"，而是要**重读活体 body、用 Markdown API 渲染、抓取上传后的 URL**——因为那才是评审者实际看的东西。**验证的终点应当是消费点，不是产出点。**\n\n**④ 不确定的地方要标注，不要补齐。**\n三篇三次出现：性能篇标注\"哪些是估算不是测量\"；标签篇**不发明缺失的分类**（未合并关闭的 PR 就保留历史分配）；GIF 篇把\"这个后端是替代品\"标在 GIF 旁边。这是第 02 批\"诚实的空白胜过编造的理由\"的第二次现身——**它显然是一贯立场，不是偶然**。\n\n**⑤ 知道该怎么修就直接修，别评论。**\n\"只评论不修复\"被否决的理由是：它保留无效状态并要求人工清理。**把一个可自动完成的修复降级成一条提示，是把自己的成本转给未来的某个人。**\n\n**⑥ 限定范围本身就是防御。**\n性能篇明确说\"有限的场景/修复范围，防止一个宽泛的性能请求变成一次无关的架构重写\"。**边界不只是为了省事，是为了防止任务变质。**\n\n**⑦ 验证手段不能改变被验证的行为。**\n用 fixture 替换不可访问的原生 UI 被否决，因为**那通过改变被观察的产品路径来让自动化更容易**。这是观察者效应在工程规范里的版本：**凡是让\"验证更容易\"的改动，都要先问它有没有改变被验证的东西。**\n\n---\n\n## 下一批（待读）\n\n补齐协作机制线并延伸：\n\n- `2026-09-09-blocked-weighted-approvals-remain-pending.md` —— 审批语义\n- `2026-09-03-semantic-issue-templates-and-policy.md` —— issue 模板的语义化\n- `2026-07-26-ci-failover-runbook.md` —— 故障切换与运行手册\n- `2026-08-10-npm-release-sequences.md` —— 发布顺序\n- `2026-08-03-package-anchored-subsystem-pages.md` —— 文档结构锚定\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-05-状态的语义精度.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-05-状态的语义精度","title":"DSH 过程决策精读 · 第 05 批：状态的语义精度","tags":["0.0.1","0.0.2","0.0.1-rc.1"],"summary":"2026-08-10-npm-release-sequences.md · 本篇 184 行，是这 94 篇里最长的之一","bytes":16751,"lines":251,"body":"# DSH 过程决策精读 · 第 05 批：状态的语义精度\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。共同点比我预想的更集中：**把\"看起来都是坏结果\"的情况拆成语义不同的类别，并各自给正确的处理。**\n> 未满足 ≠ 失败；没有 ≠ 有但不同；形式不对 ≠ 语义缺失。三篇都在纠正同一类混淆。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [npm 发布的三个独立序列](#1-私有-npm-发布作为三个独立序列) | 184 行，本批最长；\"tag 是 commit 指针，不是发布证明\" |\n| 2 | [阻塞的加权批准保持待定](#2-阻塞的加权批准保持待定) | 未满足的合并条件不是发布者故障 |\n| 3 | [语义化 Issue 模板](#3-语义化-issue-模板与呈现中立的政策) | \"产生了失败，却没有识别出任何缺失的语义决策\" |\n\n---\n\n## 1. 私有 npm 发布作为三个独立序列\n\n`2026-08-10-npm-release-sequences.md` · **本篇 184 行，是这 94 篇里最长的之一**\n\n### 他们遇到的事\n\n仓库有三组**互不相关**的可发布包，而它们在三件事上都不同——**版本基线、变更率、构建要求**：\n\n- `packages/*/*` 和 `apps/*` 随产品移动\n- `vendor/*`（九个 rescope 过的 Cordis 框架包）只在上游重新同步或本地修改变化时移动\n- `native/*` 需要 musl 工具链，且每个架构构建一次\n\n> Forcing them through one pipeline means every product release republishes the framework and the native binaries.\n\n**强迫它们走一条流水线，意味着每次产品发布都要重新发布框架和原生二进制。**\n\n### 一个潜伏了很久的 bug（本批最精彩的细节）\n\n他们发现 933 个手写的 `peerDependencies: \"^0.0.1\"` 存在于兄弟 dsh 包之间。为什么这是 bug：\n\n- `pnpm pack` 会替换 `workspace:` 协议，但**对 semver 范围不管不顾**\n- `^0.0.1` 的含义是 `>=0.0.1 \u003c0.0.2`——**它把 `0.0.2` 排除在外**\n- 而 semver **会把预发布版本排除在一个自身不带预发布的范围之外**，所以它也排除了 `0.0.1-rc.1`\n\n> Those entries never failed only because the version never left `0.0.1`.\n\n**这些条目从未失败，仅仅因为版本从未离开过 `0.0.1`。** 一个一直在那儿、只是条件还没满足的 bug。\n\n### 判断（六块，我只取判断价值最高的部分）\n\n**① 三个独立序列。** `packages/`、`vendor/`、`native/` 各有一个 bump 序列和一个发布，**不共享版本、不共享触发、不共享等待**。\n\n**② 版本从本地命令落入仓库，CI 只检查和上传。**\n\n每个序列有一个 bump-and-commit 命令：推导目标版本 → 写入相关 manifest → `pnpm install --lockfile-only` → 连同 lockfile 一起提交。于是**已发布的版本可以直接从仓库读到**。人类在 commit 合并到 master 之后创建 tag；**CI 从不写仓库，因此也不需要仓库写权限**。\n\n**③ \"registry 决定什么该出去\"——三个状态。**\n\n发布时不读取任何 tag，也不读任何\"本次发布包含什么\"的清单。对每个打包好的 tarball，把版本与 registry 比对：\n\n| 状态 | 动作 |\n|---|---|\n| registry 没有那个版本 | 发布 |\n| registry 有，且 tarball 的 sha512 **等于**记录的 `dist.integrity` | **跳过**：这是对同一个产物的重跑 |\n| registry 有，且 integrity **不同** | **失败**，报告\"内容变了却没有 bump 版本\" |\n\n第三个状态是精髓：它抓住**改了代码却没升版本**的情况。而前两个状态一起提供了幂等性——**对同一产物重跑发布，什么都不会重发，也不需要人工挑选包**。\n\n**④ 让 tag 成为账本，而不是新建账本文件。**\n\n变更判断**不增加任何状态文件**：每个包有自己的 tag，**那个 tag 记录了它上次从哪个 commit 发布**。bump 读取最新的 `vendor-\u003cpackage>-v*` tag，把包目录与该 tag 做 diff。\n\n其中一条规则特别细，也特别重要：**对 `files` 只选 `lib/` 的包，构建输入（`src/**`、`tsconfig*.json`、构建配置）也算变化。** 理由：\n\n> a built payload is not tracked by git: without it, a real source change reads as \"nothing changed\" and the next publication fails on a version whose bytes moved\n\n**构建产物不被 git 跟踪；没有这条规则，一次真实的源码变更会被读成\"什么都没变\"。**\n\n还有一条更硬的区分：\n\n> A tag is a commit pointer, not proof of publication.\n\n**tag 是 commit 指针，不是发布证明。** 所以 bump 会去问 registry：它最新的 tag 所命名的版本真的存在吗？不存在就**失败并交给人类解决**——因为一个为\"最终失败了的发布\"推的 tag，否则会被读成\"已发布\"，从而**无限期地跳过那个包**。\n\n**⑤ 可选依赖绝不在模块作用域加载（一段完整的推理链）。**\n\n这段值得逐句抄：\n\n- `optionalDependencies` 里的依赖、或带 `peerDependenciesMeta.\u003cname>.optional` 的 peer，**可能不在安装树里**——**那个缺席正是\"可选\"的全部承诺**\n- **静态 import 在导入模块被加载时就被求值**，所以一个缺席的包会从\"这个能力不可用\"变成**所有到达那个导入模块的代码的加载失败**\n- 而这个失败**只出现在缺少那个包的安装树里，偏偏这里没有任何测试构造过这样的树**：\n\n> a workspace install always has every package, so the unit tests, the snapshots, and the packed-install probe all pass while the published package is broken for the consumer who declined the optional peer\n\n**workspace 安装总是有每一个包，所以单元测试、快照、打包安装探针全部通过——而发布的包，对那个拒绝了可选 peer 的消费者来说是坏的。**\n\n这是\"**测试环境比真实环境更完备，所以永远测不出缺席**\"的典型。门禁的补救方式是**读每个包自己的 manifest** 来决定\"允许什么缺席\"，再去扫真正会发布的文件。\n\n细节上还有两处判断：**值 vs 类型要针对绑定的 Program 判定，而不是看 import 语法**（因为 `verbatimModuleSyntax` 是关的）；以及——\n\n> A dynamic `import()` only moves the failure to first use... reaching for it is a sign the dependency is not optional\n\n**动态 `import()` 只是把失败挪到首次使用**；伸手去拿它，恰恰说明这个依赖**并不是可选的**——所以门禁**不把它当作补救方案提供**。\n\n**⑥ 两条 registry 现实。**\n\n- 写入之间至少间隔两秒并带退避重试，因为连续发布多个包会**跑过 registry 自己的处理**，招致 `E409 Failed to save packument`\n- **每次重试都先重读 registry**：一个被报告为失败的操作**可能实际上已经落地了**，所以\"现在存在、且 integrity 正是这个 tarball 的\"应当算已发布，而不是要再放一次的版本\n\n### 凭什么这么判断（12 个被否决方案，取最利的几条）\n\n| 方案 | 否决理由 |\n|---|---|\n| **`\u003cbase>-\u003ctimestamp>-\u003cshort SHA>` 版本** | 与\"把已发布版本留在仓库里\"冲突：版本内嵌 commit SHA，而把版本写回又会产生新 commit，于是 **SHA 只能命名被发布的父 commit**，链接需要一整套约定来解释 |\n| **`vendor/published.json` 账本** | **它增加一个必须不与 registry 漂移的状态文件。** 每包一个 tag 提供同样的 commit 指针，而 tag 反正必须存在——**所以它没有引入状态的第二份拷贝** |\n| **只从版本判断\"已发布\"，不比较内容** | **跳过只看版本，会漏掉\"改了代码但没升版本\"——而这是唯一会悄悄把陈旧字节留在 registry 上的失败。** 代价是一次 registry 查询 |\n| **按入口闭包选择子集** | 从两个入口爬 `dependencies` 得到 156 个包（比全集少 61 个）。**但本仓库的插件是从 `cordis.yml` 按名字挂载、而不是 import 的**——有两个包落在依赖闭包之外却在运行时被需要。按代码依赖选包会失败为\"消费者装了它却起不来\"，而且**需要一份常设证明\"没有漏掉任何被挂载的包\"** |\n| **在 CI 里跑 bump 并把版本推回去** | 需要工作流的仓库写权限，而且**发布分支上的版本 commit 会与人类的 commit 撞车** |\n| **一个工作流加 `family` 输入** | 一个文件里放两种版本模型，会把并发组、tag 前缀、演练触发器**分叉成条件表达式**；一族一个文件**既更短也更好读** |\n\n第 2 条再次印证第 01 批的核心模式：**拒绝\"产生第二份需要同步的真相\"**。\n\n### 他们承认的代价（原文列了 9 条，这里是关键的几条）\n\n- **tag 可能与 registry 漂移**（只在有凭据的机器上被抓到）\n- **变更判断依赖可见的 tag**：浅克隆或没有 tag 的 checkout，会把 vendored 判断退化成\"首次发布全部\"——**`fetch-depth: 0` 是前置条件，不是优化**\n- **私有包需要凭据安装**\n- **字节可重现性是假设，不是测量**：\n\n  > Nothing measures that yet: if the build embeds absolute paths or timestamps, a re-run reports a false failure. **Measure it before the first publication a re-run might follow.**\n\n  跳过状态建立在\"同一个 commit 打包两次产生相同字节\"这个前提上，**但没有任何东西在测量它**。\n- **对更老的产物重跑发布，可能把 `latest` 往后移**（因为发布是逐版本决定的）\n- **首次发布是一大步**：九个 vendored 包加整个 dsh 集一次发布，任何载荷缺陷都会在单次发布中暴露——**这就是为什么先用一个预发布版本驱动完整路径**\n\n---\n\n## 2. 阻塞的加权批准保持待定\n\n`2026-09-09-blocked-weighted-approvals-remain-pending.md`\n\n### 他们遇到的事\n\n加权批准的 commit status **必须区分两件不同的事**：\n\n1. **一个未被满足的合并条件**\n2. **一次失败的政策评估**\n\n一个来自**有写权限评审者**的有效 `CHANGES_REQUESTED`，会阻止 PR 满足批准政策——**但它是一个可逆的评审状态，不是一次评估失败**。\n\n为他们发布 `failure` 会造成两个后果：\n\n- **把批准决策与发布者自身的健康混为一谈**\n- **把这一种未满足的政策条件，与草稿 PR、批准点不足区别对待**——而后者保持 pending，且贡献者可以解决\n\n### 判断\n\n- 发布 `pending` 的三种情况：草稿 PR、批准点不足、**来自有写权限评审者的有效 `CHANGES_REQUESTED`**\n- **阻塞性评审支配点数**——所以即使计数的批准达到阈值，状态**仍然保持 pending**\n- 只有\"已就绪 + 达到点数阈值 + 没有阻塞性评审\"三者齐备才发 `success`\n- **评估本身失败**（而非政策未被满足）才发布 `error` 状态并让那个 job 失败\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 为阻塞性评审发布 `failure` | 它**把一个未满足且可逆的合并条件表示成了故障**，并把政策结果与发布者健康混为一谈 |\n| 让批准点数覆盖阻塞性评审 | 这会让分数成为唯一成功条件，但**允许一个有效决定仍在请求修改的评审者存在时出现成功状态** |\n\n### 他们承认的代价\n\n- 必需状态的分支规则仍然会拦住 PR（因为 `pending` 不满足必需状态），所以**约束力没有损失**\n- **消费者不会仅因为有阻塞性评审就收到失败的 commit status**——他们需要读状态描述或有效评审，才能区分一个阻塞者与其他待定条件\n\n最后一条是**主动暴露的可观测性损失**：为了语义精确，消费者多了一步工作，这件事被写下来了。\n\n---\n\n## 3. 语义化 Issue 模板与呈现中立的政策\n\n`2026-09-03-semantic-issue-templates-and-policy.md`\n\n### 他们遇到的事\n\n两个问题：\n\n- Issue 和 PR 模板**把受理问题与评审证据混在一起**，还把完整内容藏进 `\u003cdetails>` 里；**未使用的前言、单独的 Idea 与 Research 模板，增加了选择却没有改变仓库如何规划工作**\n- 更根本的一个：Issue 政策**把 Markdown 呈现当成了仓库元数据**——它要求 `\u003cdetails>` 元素、50 单位的可见正文、中文标题、标题元数据前缀、以及一行 `Owner:` 正文\n\n对后者的判断一句话击穿：\n\n> produced failures **without identifying a missing semantic decision**\n\n**这些规则产生了失败，却没有识别出任何缺失的语义决策。** 政策在检查形式，而形式与内容无关。\n\n### 判断\n\n- 模板只覆盖 Bug、Feature、Task。**Idea 和 Research 归属 Task，除非未来的决策给它们不同的生命周期行为**\n- 模板前言**只含** `name`、`about`、`type`\n- **Markdown 标题定义层级，HTML 注释解释每个标题下该放什么**（用注释承载指导，而不是用政策承载形式）\n- Issue 政策**不再检查**：`\u003cdetails>` 呈现、可见正文长度、标题语言、标题前缀、正文所有权行\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保留 Idea 和 Research 模板 | 它们的表单**没有确立与 Task 不同的生命周期或政策行为**，所以分开的入口**增加了选择，却没有保留有意义的类型区别** |\n| 把呈现规则保留为警告 | **这些规则可能让本来可行动的 Issue 失败，而且无法确立\"请求的工作、预期行为或交付物是否清晰\"** |\n| 增加自动元数据修复或 Issue 分类 | 那些行为需要新的变更规则、权限、失败处理和运营证据；**它们仍然是独立的决策，而不是随一次政策简化捎带进来** |\n\n第 3 条值得单独记住：**明确拒绝\"顺手捎带\"**。一个简化动作不做额外的事，即使那些事看起来相关。\n\n### 他们承认的代价\n\n政策**不重写历史标签、不选择缺失的 Issue Type、不同步 Priority、不迁移现有数据**；**未来任何针对那些操作的自动化，都需要它自己的决策和评审范围**。\n\n---\n\n## 这批的共同判断标准\n\n**① 未满足 ≠ 失败。**\n\"没有满足条件\"和\"东西坏了\"是两种状态，混在一起会让真正需要警报的情况被淹没。审批篇给了最清晰的切法：`pending`（条件未满足，可解决）/ `success` / `error`（评估本身失败）。\n\n**② 没有 ≠ 有但不同。**\nnpm 篇的第三个 registry 状态（内容变了但版本没变）之所以必须独立存在，是因为它和\"重跑\"看起来都是\"这个版本已经存在了\"。**两种\"已经存在\"只有一个是真的问题。**\n\n**③ 形式检查不是语义检查。**\nIssue 政策检查了正文长度和标题语言，**却无法确立\"请求的工作、预期行为、交付物是否清晰\"**。任何一条政策都该被问一次：**它失败的时候，能不能指出缺失的那个决策？**\n\n**④ 潜伏的 bug 需要专门的搜寻。**\n那条 `^0.0.1` **从未失败，只因版本从未离开 `0.0.1`**。这类 bug 不会通过\"跑测试\"暴露，只能通过**推理条件边界**发现——\"如果这个值变了会怎样\"。\n\n**⑤ 测试环境比真实环境更完备时，测不出缺席。**\nworkspace 安装总是包含每一个包，于是所有测试都通过，而发布的包对拒绝可选 peer 的消费者是坏的。**凡是\"我这个环境里一定有\"的假设，都要问一句：在所有真实环境里也一定有吗？**\n\n**⑥ 假设要标记为假设，并定下验证时点。**\n\"字节可重现性是假设，不是测量\"——而且给出了行动指令：**在第一次可能被重跑的发布之前先测它**。这与第 02、04 批\"诚实的空白\"是同一立场的第三次现身。\n\n**⑦ 幂等不是\"重复执行不出错\"，是\"重复执行不产生新状态\"。**\n跳过状态建立在**内容相等**（integrity 相同）而不是版本相等上，所以\"对同一产物重跑\"这类日常操作不需要任何人工判断。**一个好流程的标志是：重跑它是一件无聊的事。**\n\n**⑧ 顺手能做的事，如果不是本次决策的一部分，就不做。**\n\"自动修复元数据 / 自动分类\"被拒绝的理由是\"它们是独立的决策，而不是随一次政策简化捎带进来\"。**范围蔓延最隐蔽的形式，就是那些看起来相关且容易的事。**\n\n---\n\n## 下一批（待读）\n\n- `2026-07-26-ci-failover-runbook.md` —— 故障切换与运行手册\n- `2026-08-03-package-anchored-subsystem-pages.md` —— 文档结构锚定\n- `2026-07-19-web-styling-system.md` —— 样式系统的约束\n- `2026-08-26-published-dependency-faces.md` —— 发布依赖面\n- `2026-07-19-remove-generated-agent-note-index.md` —— 移除生成的索引\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-06-事实住哪里.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-06-事实住哪里","title":"DSH 过程决策精读 · 第 06 批：事实住哪里","tags":[],"summary":"2026-07-19-remove-generated-agent-note-index.md","bytes":13954,"lines":215,"body":"# DSH 过程决策精读 · 第 06 批：事实住哪里\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**，主题是\"单一归属\"：**一份事实应该住在哪里、由谁维护、什么时候停止维护。**\n> 这批还有额外价值：**它们对我此前归纳的跨批模式做了交叉验证**（见文末），其中模式 B 和模式 A 得到强力印证。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [移除生成的 Agent Note 索引](#1-移除生成的-agent-note-索引) | 索引是第二份真相，还是个合并热点 |\n| 2 | [冻结低未来价值的 Agent Note](#2-冻结低未来价值的-agent-note) | 存档不是\"假装它仍然是当前的\" |\n| 3 | [包锚定的子系统页面](#3-包锚定的子系统页面) | 可预测性战胜了精确性 |\n\n---\n\n## 1. 移除生成的 Agent Note 索引\n\n`2026-07-19-remove-generated-agent-note-index.md`\n\n### 他们遇到的事\n\n他们曾经提交一个生成的 Agent Note 索引进仓库。两个问题：\n\n**① 它复制了已经存在的事实。** 每个文件的**生命周期/类别路径、文件名日期和 H1** 已经编码了这些信息——索引只是把它们再抄一遍。\n\n**② 它是个可预测的合并热点。**\n\n> Every branch that adds, moves, or renames an otherwise unrelated Agent Note rewrites the same generated file.\n\n**每一个\"添加、移动或重命名一个本来无关的 Agent Note\"的分支，都会重写同一个生成文件。** 换句话说：一个跟你的改动毫无关系的文件，每次都要在你的 diff 里出现。\n\n而且这个集中式时序列表**在树导航和仓库搜索之外，几乎不增加发现价值**——但它的生成器、渲染器、命令和新鲜度检查**仍然是维护负担**。\n\n### 判断\n\n- **生命周期/类别文件系统树就是 Agent Note 的清单**\n- README 保持为**精选的入口点与契约**\n- 发现工作交给**普通的树导航和仓库搜索**\n- 门禁**拒绝**旧的家目录和根 `INDEX.md`；它**不渲染、也不做新鲜度检查**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保留提交的生成索引，用\"重新生成\"来解决冲突 | **重新生成让冲突解决变得机械，但不能阻止无关分支修改同一个产物，也不减少它制造的评审噪声** |\n| 提供一个不提交的按需索引命令 | 避免了提交冲突，**但为一个已经由树导航和仓库搜索服务的发现路径，保留了一个渲染器和一条命令** |\n| 恢复手工维护的索引 | **同样的共享文件争用，外加生成方式本来避开的完整性与顺序错误** |\n\n第 3 条尤其利落：**手工索引 = 原有的争用 + 一批新的错误类型。**\n\n### 他们承认的代价\n\n读者**失去了一个单独的时序页面**，改用生命周期/类别树或仓库搜索。\n\n---\n\n## 2. 冻结低未来价值的 Agent Note\n\n`2026-07-26-frozen-agent-note-archive.md`\n\n### 他们遇到的事\n\nimplemented Agent Note 被当作**当前决策记录**来维护，于是活跃语料里的**每一条路径、符号、默认值、翻译、代码围栏、包引用和出站链接，都是一项持续义务**。\n\n当理由能指导未来工作时，这个成本是正当的。但对**已关闭的 UI 细节、小修复、被取代的实现机制、或当前权威在别处的过程历史**，就不正当了。\n\n而两个显而易见的出路都不行：\n\n- **删掉每一个低价值的 implemented 记录** → 会抹掉有用的历史证据\n- **保留每一个被拒绝的提案** → 保留了那些**既不合理也无教益**的想法\n\n他们要的是一条**保留边界**，能区分\"活跃指导\"与\"冻结历史\"，**而又不把归档变成另一个维护层级**。\n\n### 判断（保留规则写得极精细）\n\n- **只有 implemented 笔记能被归档**；proposed 笔记**永不进入归档**（一个过时的提案变成 rejected）\n- 归档条件：已发布的决策**已完成**，且它的**理由、替代方案、后果、负面保证和重新引入条件**都不太可能指导未来工作\n- **不论年龄或字数，以下保持活跃**：基础边界、持久与线路语义、安全规则、**反复出现的设计诱惑**、**未解决的重新引入条件**\n- **rejected 笔记只在它能防止\"一个诱人且有意义的错误\"时保留**，否则作为完整三件套删除\n- 归档变更**只允许四种编辑**：重定位、插入 `Archived: YYYY-MM-DD` 元数据行、相应的 sidecar 重录、机械的入站链接修复\n- 根 `.rgignore` **把归档从\"遍历父目录的搜索\"里排除**（历史查询要显式点名归档目录）\n- **归档后三件套永久冻结**：**不因重命名包、变化的行为、翻译标准、格式规则、断裂的出站链接或后来的文档契约而更新**\n- 门禁**验证指向归档文件的链接**，但**从不把归档文件当作链接源**\n- `verify-archived-agent-notes` 用**路径 + SHA-256 内容哈希**把每个产物封存进一个**只追加的清单**；`--write` 模式**先证明每个现有封印未变**，才追加新归档的产物\n- **所有其他文档门禁排除归档源**——这样\"它们演变的标准不能产生编辑历史的压力\"\n- **supersession 检查在写新笔记时进行，而不是推迟到以后的语料清理**\n\n### 凭什么这么判断（7 个被否决方案，取最锋利的）\n\n| 方案 | 否决理由 |\n|---|---|\n| **删掉每一个离开活跃语料的笔记** | 一个 implemented 记录可以**前向指导价值低，却仍提供关于一个已关闭决策的有用历史证据**。**内容封存的归档保留了那个证据，而不假装它仍然是当前的** |\n| **把归档笔记留在默认的搜索结果里** | **归档事实按设计就可能过时，并且可能靠词汇匹配压过当前结果** |\n| **把 supersession 清理推迟到周期性语料审计** | **替代笔记的作者拥有关于所有权和重叠的最新鲜证据。** 推迟会留下冗余的活跃权威，并让以后的分类更贵 |\n| **也归档 rejected 或 proposed 笔记** | 归档状态的意思是\"已实现的历史决策\"。**一个过时的提案需要一次明确的拒绝；而一个没有护栏价值的拒绝需要删除，而不是第二个低价值的存放区** |\n| **继续对归档笔记适用所有文档门禁** | 后来的格式、翻译、代码、包或链接规则**会要求重写那个历史快照** |\n| **允许事实刷新，只冻结理由** | **那重新制造了活跃语料的判断和翻译负担，并让\"哪些分句是历史的\"变得不清楚** |\n\n第 4 条对\"归档\"这个动作的语义界定值得记住：**归档 = \"已实现的历史决策\"，所以它不能用来处理其他状态的废弃物。** 每一种废弃有它自己的正确出口——过时提案 → 明确拒绝；无价值拒绝 → 删除。\n\n### 他们承认的代价\n\n- 活跃语料变成\"**一组预期会影响未来工作的决策**\"\n- 写一篇新笔记现在包含一次**有范围的 supersession 检查**\n- **归档事实和出站链接可以按设计就是过时的**——所以读者和 agent **必须把活跃代码与文档当权威，只把归档笔记作为历史引用**\n\n最后一条是**把\"存档会腐坏\"这件事正当化并明写出来**，而不是假装存档还能保持新鲜。\n\n---\n\n## 3. 包锚定的子系统页面\n\n`2026-08-03-package-anchored-subsystem-pages.md`\n\n### 他们遇到的事\n\n子系统目录的前页曾用一条 **spine-vs-seam 规则**划定范围：**一个类型是 \"core\" 的，如果循环在每一轮都持有、派生、流式传输或记录它。**\n\n这条规则的问题在于——**它选的是类型，不是包**。随着文件夹长到四十多页：\n\n- **前页变成了一个跨包的大杂烩**：LLM 对话词汇坐在 agent 契约之上\n- 创建/所有权词汇（`AgentHandle`、`CreateAgentOptions`…）**在整个文件夹里哪儿都没被记录**，因为生成器把它们豁免到了一个包 README\n- **读者无法从\"这个类型住在哪里\"预测哪个页面记录它**\n\n同时，包组 README **没有共同形状**——有的带分节表格，有的夹着设计散文，有的拖着本该属于子系统页面的段落。\n\n### 判断\n\n- 每个 `docs/subsystems/` 页面**锚定到声明它词汇的那个包或包组**，**页面成员资格跟随仓库布局**\n- 仓库范围的类型模式（`…Map → derived-union`、branded ids）**留在一个显式框定的收尾章节**里，而不是与包内容交错\n- **每个被生成的签名引用到的类型，都必须在文件夹里的某处可解析**——所有权词汇从生成器的 `TYPE_LINK_EXEMPTIONS` 移进了 `LINK_MAP → core.md`，于是**豁免被保留给真正的服务本地或 vendor 形态**\n- **每个被粘贴的声明只有一个家**\n- 每个 `packages/\u003cgroup>/README.md` 对是一个**薄入口点，形状统一**：why-first 引言段 + 一张包表（Package / Role / ctx key）+ 结尾指向所属子系统页面\n- **承载实质内容、超出该形状的散文，重定位到所属子系统页面，而不是被删除**\n- 门禁拒绝：缺失的组 README、**既没有读者可见的直接链接也没有显式豁免的组**、空白或孤立的豁免、**\"已豁免的组后来又获得了链接\"**、以及所指页面缺失的链接\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 spine-vs-subsystem 范围规则 | **它按类型回答\"这个类型是不是 core？\"——这就是为什么前页积累了来自四个包的类型，却漏掉了 `packages/core/agent` 公共 API 的一半。按仓库布局的可预测性胜出** |\n| 一个扁平的单一文档目录 | 原笔记里已被否决；**增长到四十一页确认了那个判决** |\n| 只在包 README 里记录所有权词汇（豁免的现状） | 这让 `AgentHandle` 和创建/恢复选项**对那个自称\"类型参考\"的文件夹不可见** |\n\n第 1 条的否决理由是一次很干净的自我修正：**规则问错了维度**（问\"类型重不重要\"，而不是\"类型住在哪个包\"），于是既收进了不该收的，又漏掉了该收的。结论只有五个字：**可预测性胜出。**\n\n### 他们承认的代价\n\n- 每个包组**必须让它的子系统拥有者、或者一个有理由的缺席，变得可评审**（不能只是\"没有\"）\n- `verify-type-equiv` 的 1:1 清单要求每个粘贴单一归属——**重复的 `SessionEvent` 粘贴被删掉了**\n\n---\n\n## 对索引里跨批模式的验证\n\n第 06 批的选题目的之一就是**交叉验证**，结果是两条得到强力印证：\n\n### ✅ 模式 B：拒绝\"第二份真相\"——**强验证**\n\n第 1 篇是这条模式的完美例证，而且理由比我之前记录的更完整：\n\n- 索引**复制了**路径、日期、H1 已经编码的事实（第二份真相）\n- 而且它还是个**合并热点**——无关分支每次都要重写它\n\n这里补上了我之前没意识到的一个维度：**第二份真相的代价不只是\"要同步\"，还包括\"它会把无关的改动拖进同一份文件里\"。** 争用与漂移是两种不同的成本。\n\n### ✅ 模式 A：诚实的空白胜过补齐——**强验证，且更彻底**\n\n第 2 篇把这条立场推到了制度层面：\n\n> A content-sealed archive preserves that evidence **without pretending it remains current**.\n\n**内容封存的归档保留那个证据，而不假装它仍然是当前的。**\n\n它甚至把\"存档会腐坏\"**正当化并写进规范**：归档笔记**不因重命名包、变化的行为、翻译标准、格式规则、断裂的出站链接而更新**。这不是疏忽，是设计。\n\n### 🆕 新增一条模式：可预测性战胜精确性（第 3 篇）\n\n一条更精确的规则（spine-vs-seam）输给了一条更粗糙但可预测的规则（按仓库布局）。原因不是精确性不好，而是**精确的规则需要每次判断，而判断会漏**——它漏掉了半个公共 API，同时收进了四个包的类型。\n\n**当一个规则要求\"逐例判断重要性\"时，它就已经在制造漏洞了。**\n\n### 🆕 新增一条模式：冻结 = 放弃更新它的义务\n\n归档笔记与其他文档门禁**完全脱钩**，理由是\"它们演变的标准不能产生编辑历史的压力\"。\n\n**冻结一个东西，意味着明确划掉它未来的维护义务**——否则\"冻结\"只是名义上的，实际负担照旧。\n\n---\n\n## 这批的共同判断标准\n\n**① 一份事实只该有一个家，而且那个家要可预测。**\n索引复制路径与日期（第 1 篇）、类型该跟着包走而不是跟着\"重要性\"走（第 3 篇）、每个粘贴声明只有一个家（第 3 篇）——三个不同层面上的同一个要求。\n\n**② 第二份真相有两种成本，漂移只是其中之一。**\n另一种是**争用**：它会把你无关的改动拖进同一份文件。评估任何\"再维护一份清单\"的方案时，两种成本都要算。\n\n**③ 冻结要真的冻结，包括放弃维护义务。**\n归档笔记**不跟随重命名、格式规则、翻译标准更新**，且**被所有文档门禁排除在外**。否则\"历史\"会持续产生新的工作量，而它已经不再提供价值。\n\n**④ 归档与删除的语义不能混。**\n归档 = \"已实现的历史决策\"。所以过时的提案要**明确拒绝**，没价值的拒绝要**删除**，而**不是找第二个低价值存放区**。\n\n**⑤ 用可预测性换精确性，通常是划算的。**\n要求\"逐例判断重要性\"的规则，会在两个方向同时出错：收进不该收的，漏掉该收的。\n\n---\n\n## 下一批（待读）\n\n交叉验证可以继续：`2026-07-26-ci-failover-runbook`（手册与自动化边界）、`2026-07-20-gui-testing-system`（测试系统）、`2026-08-26-published-dependency-faces`（发布依赖面）、`2026-06-16-pnpm-over-yarn`（工具链选择）、`2026-09-02-project-local-issue-planning-fields`（规划字段）。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-07-工具的选择与边界.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-07-工具的选择与边界","title":"DSH 过程决策精读 · 第 07 批：工具的选择与边界","tags":["@pnpm/exe"],"summary":"2026-06-16-pnpm-over-yarn.md","bytes":16986,"lines":262,"body":"# DSH 过程决策精读 · 第 07 批：工具的选择与边界\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。都在讲同一件事的不同侧面：**工具不是中立的，选择工具等于选择它会替你挡住什么。**\n> 这批还有一条罕见的诚实——一份**削弱了自己迁移理由的性能数据**被完整公开。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [pnpm 而非 Yarn 4](#1-pnpm-而非-yarn-4) | 选了\"生态期待的那个\"，而不是\"能用的那个\"；且公开了不利于自己的数据 |\n| 2 | [TSC 优先的构建](#2-tsc-优先的构建与单一编译器所有权) | 一个编译器拥有转换，边界用项目引用划 |\n| 3 | [GUI 测试系统三层结构](#3-gui-测试系统的三层结构) | fixture 全绿不算完成 |\n\n---\n\n## 1. pnpm 而非 Yarn 4\n\n`2026-06-16-pnpm-over-yarn.md`\n\n### 他们遇到的事\n\n仓库原本跑在 **Yarn 4 + `node-modules` linker** 上——原文承认这是一个**刻意保守的选择**：行为像 npm 的扁平布局，同时拿到 Yarn 的 workspaces 和 `yarn constraints`。\n\n> It worked.\n\n**它能用。** 但两个趋势让\"能用\"不够：\n\n- Yarn 4 的 Plug'n'Play 血统**让 `node-modules` linker 成为偏离常轨的模式**\n- 更广的 JS 生态——工具默认值、CI actions、Corepack 示例、贡献者熟悉度——**越来越以 pnpm 为中心**\n\n而对一个**主要由 agent 构建、偶尔由人类贡献者阅读**的仓库，\"**大多数工具和人期待的那个包管理器**\"有真实价值：**更少的意外、更好走通的失败路径、更多可复制的答案**。最后一条尤其贴切——生态默认的那个，意味着你能搜到答案。\n\n### 凭什么判断\"现在是换的时候\"\n\n这段时机论证值得学：\n\n- 仓库**还不发布任何东西**（每个包都是 `private: true`）\n- 开发、测试、源码 demo 都走各自声明的 TypeScript 启动器\n- 所以包管理器只需要做三件事：**(a) 解析和链接 `node_modules`、(b) 运行 workspace 脚本、(c) 强制 workspace 约束**\n- 唯一的 Yarn 专属资产是 `yarn.config.cjs`，**小而机械**，容易重新表达\n\n结论一句话：**趁爆炸半径还小的时候，用一个更健康生态的选项替换一个承重工具。**\n\n### 判断：把工具的错误变成防线\n\n最关键的一条设计：\n\n> We deliberately add **no** `node-linker=hoisted` / `shamefully-hoist` escape hatch: pnpm's non-flat `node_modules` makes phantom dependencies (importing an undeclared transitive dep) fail loudly, which is a *feature* for a repo whose whole quality story is mechanical gates.\n\n**他们刻意不加逃生舱。** 幻影依赖（导入一个未声明的传递依赖）在扁平布局下能侥幸工作，在 pnpm 的非扁平 `node_modules` 下**会大声失败**——而他们把这当作 feature，因为\"整个质量故事都是机械门禁\"。\n\n**门禁套件（typecheck、lint、test、build）就是\"不存在这类幻影导入\"的安全网证明。**\n\n另一条：**构建脚本允许清单**。pnpm 10+ 默认不运行依赖的生命周期脚本，他们显式列了 `allowBuilds`——**仓库已经对模型/工具输出采取的同一套供应链加固姿态，现在应用到安装期的代码执行**。同一个姿态，换了作用面。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 Yarn 4 | 零改动，**但赌在一个更少人走的 linker 模式，和一个绑定到单一包管理器的约束引擎上** |\n| npm workspaces | 无处不在，**但没有约束故事，monorepo 工效更弱** |\n| **pnpm + hoisted linker** | 迁移更平滑，**但丢掉了幻影依赖的安全性——而那正是这次迁移的主要正确性理由** |\n| 总是通过 Node 运行 `npm_execpath` | 对 pnpm 的 JS 分发有效，**但要求 Node 去解析 `@pnpm/exe` 提供的 ELF / Mach-O / PE 可执行文件** |\n| 通过 shell 运行重入命令 | 接受更多启动器形式，**但改变了每个子命令的引号、元字符展开、可执行文件解析和信号行为** |\n\n第 3 条体现了一种一致性：**如果一个方案的卖点是\"迁移更平滑\"，而它恰好削掉了你迁移的全部理由，那就没有理由。**\n\n### 他们承认的代价（本批最值得记的一段）\n\n先是一处功能损失：约束检查**失去了 Yarn 的自动修复**（`workspace.set()` 可以就地重写 manifest），新脚本只检查、非零退出。判断是\"可接受\"——因为**CI 从来不跑 `--fix`**，一行手工编辑也很少见。\n\n然后是**性能数据**，先标前置条件：\n\n> measured at migration time on the dev NFS filesystem; **single-digit-run samples, high variance — directional, not a benchmark suite**\n\n| 场景 | Yarn 4 | pnpm 11 |\n|---|---|---|\n| 冷启动（空 cache/store，无 `node_modules`） | ~14 s | **~16 s** |\n| 热重链（store 热，删掉 `node_modules`） | ~12–14 s | **~15–22 s** |\n| 冻结、`node_modules` 存在（no-op 复核） | ~2–8 s | ~0.5–7 s |\n\n**大多数格子对 pnpm 不利。** 而他们接着解释了为什么这个测试本就测不出真实优势：pnpm 的内容寻址存储本应在磁盘占用上大胜（一个全局 store 硬链接进每个 `node_modules`，而 Yarn 每个 worktree 复制 ~279 MB，有些开发者同时留十几个 worktree）——但**测试 store 和 `node_modules` 在不同文件系统上，硬链接失效了**。\n\n然后是那句总结：\n\n> The honest summary: install speed on our NFS dev filesystem is a wash within noise; the move is justified by ecosystem alignment, phantom-dependency safety, and cross-checkout disk dedup — **not by a raw install-time win**.\n\n**诚实的总结：安装速度在噪声范围内是平局；这次迁移的正当理由是生态对齐、幻影依赖安全和跨 checkout 磁盘去重——不是原始的安装时间收益。**\n\n一份**削弱了自己迁移理由**的数据，被完整贴出来，还附上\"我们的测试环境让这个优势无法显现\"的解释。这是第 02、04、05、06 批\"诚实的空白\"立场的又一次现身。\n\n---\n\n## 2. TSC 优先的构建与单一编译器所有权\n\n`2026-06-17-ts-build-config.md`\n\n### 他们遇到的事\n\n- `build` **让两个工具都做 TypeScript 转换**：用 `tsc` 产 `.d.ts`，用 `tsdown` 产打包的 `.js`\n- `typecheck` 倾向于**用一个根配置**验证 packages、vendor 源码、examples、tests 和 scripts\n\n具体冲突写得很细：\n\n- `tsdown` 用 `oxc` 转换 TypeScript，**与 `tsc` 行为不同**——**打包的 `.d.ts` 与 Cordis 内部的相对模块增强形态冲突**；**打包的 `.js` 与 `tsc -b` 的逐文件 `.js` 行为也不同**（如装饰器转换）\n- `vendor/*/src`、examples、tests、scripts **不能全部朴素地放进一个根严格程序**：直接在根严格配置下检查 vendor 源码**会触发许多超出本项目所有权的类型错误**；而 `packages/*/*` 对 vendor 的依赖被解析到 `vendor/*/lib`，本来就是**为了不同的 tsconfig 严格度**\n\n### 判断\n\n- **`tsdown` 不再是 TypeScript 编译或声明输出的所有者**——它在每个 lib 阶段只在 `tsc` 发射之后读取 JavaScript、产出发布入口和浏览器包\n- 每个普通模块**有一个本地 tsconfig**，供 build、typecheck 和直接运行源码的工具（tsx、vitest、源码加载器）共用\n- 严格度差异用**项目引用**做边界，而不是一个根程序\n- **构建不自动调用 clean**，所以普通构建保留增量状态\n\n### 一段与主题无关但值得单独记的细节\n\n`clean` 在删除一个已存在的目标之前，**会解析目标的父目录，如果解析出的父目录在仓库之外就拒绝执行**：\n\n> so a symlinked project reference cannot redirect cleanup outside the checkout\n\n**一个符号链接的项目引用，不能把清理重定向到 checkout 之外。** 这类防护很便宜，但它防的是\"清理脚本删掉你的家目录\"这一档事故。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 `tsdown`/oxc 作为 TS 转换器 | oxc 的转换**不是 `tsc` 行为**；打包的 `.d.ts` 与 Cordis 的模块增强形态冲突 |\n| 一个根严格程序覆盖所有目录 | **vendor 源码在根严格标志下触发超出项目所有权的类型错误** |\n| 每次构建前清理 | **会丢弃 `tsc` 和打包器拥有的增量状态**，即使工作区布局没变 |\n| 删除每个包级的 `node_modules` | 有效的包依赖链接**不会**导致工作区发现失败；删除它们**会把构建清理变成依赖重装** |\n\n### 他们承认的代价\n\n发布面的规则被完整写下来：`lib/types/*.d.ts` 是发布声明输出、`.d.ts.map` **只作本地编译产物保留**、`lib/types/*.js` **通常只是打包器输入**（只有当某个运行时导出显式指向发射树时才发布）、`lib/index.*` 是发布运行时输出。\n\n还有一条坦白的负债：**Cordis vendor 副本与上游又多了一处类型结构分歧，在上游同步时必须被重新应用或显式退役**。**每一个本地分歧都是一笔要在未来偿还的债，他们把它记在账上。**\n\n---\n\n## 3. GUI 测试系统的三层结构\n\n`2026-07-20-gui-testing-system.md`\n\n### 他们遇到的事\n\nGUI 栈横跨多种应用形态，而**在一种形态内又有多个运行时环境**（Node host、数据协议层、浏览器对象层、React/DOM）。\n\n原文的结论很直接：**单泳道测试套件无法给出有意义的信号。** 每一环都需要自己的有效测试，**加上**全链路测试的基础能力。\n\n### 判断：按架构的自然测试钩子切三层\n\n| 层 | 被测对象 | 关键技术 |\n|---|---|---|\n| **1 协议同构** | 生成的 Remote 描述符 + ApiGateway + Connection RPC 载体（参数/结果/错误/流/取消） | **同构点上的全链路**：进程内验证描述符编解码与分发；无浏览器演练同样的 `/api` 载体分帧与信任检查 |\n| **2 对象层编排** | Session / SessionManager / ConnectionController（状态机与时序：拼接/去重/分页/乐观草稿清除/pendingBuffers/重连/退避） | **\"事件序列进 → 快照出\"的黄金路径**：可编程 fake + 控制时序的 deferred + 控制退避的假计时器 |\n| **3 组装呈现** | 构建产物 × 真实客户端 loader 与插件组合 | 语义快照在 jsdom 下启动全部八个已构建插件；裸 Playwright 冒烟单独证明真实浏览器/载体边界 |\n\n**层间纪律一句话**：\n\n> each tier tests its own layer, upper tiers never re-test lower ones\n\n**每一层测自己的层，上层从不重复测试下层。** 落到具体：应用语义快照**只钉住跨组装插件边界的用户可见投影**；Playwright 冒烟**只证明浏览器与载体的活性**；**线上语义归第 1 层，数据语义归第 2 层**。而纯函数层（lineage/partial/notifier/transcript-adapter）在同包的 tests/ 里**零 fake 直接测试**。\n\n### 反回归纪律（本批最有价值的一节）\n\n**① 每一个 bug 修复都钉住一个断言。**\n\n按 bug 的可见面归位：浏览器可见的 bug 钉进它所属的浏览器 spec；数据层的 bug 钉进匹配的 spec。他们给了一个先例说明这样做的收益：\n\n> the res-close misjudgment pinned in the webserver bridge suite — **pure Node, reproduces in seconds, no longer needs the 12s browser sentinel as the only defense**\n\n一个原本只能靠 12 秒浏览器哨兵防守的问题，被钉成纯 Node 的秒级用例。\n\n**② fixture 全绿不算完成，真链路也必须通过。**\n\n这条直接印证第 04 批的模式 D：\n\n> what the fixture short-circuits is exactly the wire carriage chain (node:http bridge close semantics, real network timing); **both empirically confirmed bugs hid there**\n\n**fixture 短路掉的正是链路运载链**（node:http 桥接的 close 语义、真实网络时序）——而**两个经验确认的 bug 都藏在那里**。所以凡是触碰 connection/bridge/handler/SSE 的改动**必须跑浏览器泳道**。\n\n**③ 盘上代码即答案。**\n\n行为变更让现有用例变红时**当场对账**（修测试或修代码，以契约作仲裁），**不留悬空的红**。\n\n### 凭什么这么判断\n\n| 被否决 | 一行理由 |\n|---|---|\n| 单一 e2e（一切都过浏览器） | 浏览器启动慢 N 倍且时序不可控；**线上的/对象层的不变量可以在 node 环境里毫秒级完整断言** |\n| 把校验脚本迁到 vitest | 一个有序脚本共享一个浏览器会话；拆开要么把它形式化（顺序+共享页面），要么**把前导重跑 N 次**；而**流式 PASS/FAIL 输出正是 agent 的定位接口** |\n| 在测试里复用 FixtureApiClient | demo 跑在真实时钟上，测试需要手工控制的 deferred 时序——**目的正交**；强制复用会把测试链到 demo 的节奏上 |\n| 为 GUI 包单独一个 vitest 配置 | 包级 tests/ 已被根的 include 扫描；**路径过滤就是那个紧回路——零新配置** |\n| 推迟 hooks/组件层的单元测试 | jsdom 仍是覆盖率主线（快速的逐文件组件行为）；**必需的浏览器重放门禁在组装层补充它，而不是替代它** |\n\n第 2 条里那句值得单独记：**\"流式的 PASS/FAIL 输出正是 agent 的定位接口\"**——他们把测试输出格式当成 agent 工作流的一部分来设计，而不是当成给人看的日志。\n\n### 他们承认的代价\n\n- **层间纪律仍由评审承担**（只有 Linux CI 机械强制浏览器黄金输出的新鲜度）\n- **每个新的应用快照都必须避开不稳定的布局或时钟输出**\n\n---\n\n## 对索引里跨批模式的验证\n\n### ✅ 模式 D：验证到消费点——**第三次印证，且是同一条理由**\n\nGUI 篇的\"fixture 全绿不算完成\"与第 04 批 GIF 篇\"push 成功不算完成\"是同一个判断：**别在\"我这层通过了\"停住，要验到下一层真实消费的地方**。而且他们给了这次的具体缺口——fixture 短路掉的正是链路运载链，**两个真实 bug 都藏在那里**。\n\n### ✅ 模式 A：诚实的空白——**第五次现身，这次是反方向的**\n\n前几次都是\"标注缺失\"，这次是**主动公开不利于自己的数据**：性能表三个格子对 pnpm 不利，还附上\"我们的测试环境让那个本来可能成立的优势无法显现\"的解释。**结论改成\"迁移的理由是生态对齐和安全，不是速度\"。**\n\n**这条立场已经稳固到可以当作他们的默认习惯了。**\n\n### 🆕 新增模式：让工具的错误成为防线\n\npnpm 篇拒绝加 hoisted 逃生舱，因为**非扁平 `node_modules` 会让幻影依赖大声失败**——他们把工具的报错当作质量体系的一部分。\n\n**判据**：选工具时问的不是\"它的错误会不会烦到我\"，而是\"**它的错误恰好是我需要的那个信号吗**\"。\n\n---\n\n## 这批的共同判断标准\n\n**① 趁爆炸半径小的时候换承重工具。**\n时机论证写得很具体：还没有任何东西发布、工具只需做三件事、唯一专属资产小而机械。**\"现在换\"的依据是可枚举的，不是感觉。**\n\n**② 让工具的错误成为防线。**\n幻影依赖 fail loudly 是 feature；构建脚本白名单把\"安装期执行任意代码\"变成显式决定。**别去关掉那个正在替你挡事的报错。**\n\n**③ 单一所有权。**\n一个编译器拥有 TypeScript 转换（不是两个），一个事实一个家（第 06 批）。**同一件事有两个所有者，冲突迟早会以\"两边都对\"的形式爆发。**\n\n**④ 分层要沿着架构的自然接缝，而且层间不重复测试。**\n上层只测自己的层，不重测下层；纯函数层不引入任何 fake。**重复测试不是\"更保险\"，是让信号的归属变模糊。**\n\n**⑤ fixture 全绿不算完成。**\n要问一句：**这个 fixture 短路掉了什么？** 那正是真实故障藏身的地方。\n\n**⑥ 每个 bug 修复钉一个断言，且钉在它所属的层。**\n这是同一个 bug 在归属层被**秒级复现**的成本，对比它作为\"唯一防线\"需要 12 秒浏览器哨兵的现状。\n\n**⑦ 不留悬空的红。**\n行为变更导致用例变红时当场对账（修测试或修代码，用契约仲裁）。**一个挂着的红，会让后面每一次\"红了\"都失去意义。**\n\n**⑧ 本地分歧要记账。**\n\"Cordis vendor 副本与上游又多了一处类型结构分歧，同步时必须重新应用或显式退役\"——**每一笔本地定制都是未来要偿还的债，写进文档才不会被遗忘。**\n\n---\n\n## 下一批（待读）\n\n- `2026-07-19-web-styling-system.md` —— 样式系统的约束\n- `2026-07-26-ci-failover-runbook.md` —— 手册与自动化边界\n- `2026-08-26-published-dependency-faces.md` —— 发布依赖面\n- `2026-09-02-project-local-issue-planning-fields.md` —— 规划字段\n- `2026-07-27-worktree-local-lefthook.md` —— worktree 与本地钩子\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-08-把判断变成可判定的规则.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-08-把判断变成可判定的规则","title":"DSH 过程决策精读 · 第 08 批：把判断变成可判定的规则","tags":[],"summary":"2026-07-19-web-styling-system.md","bytes":14989,"lines":230,"body":"# DSH 过程决策精读 · 第 08 批：把判断变成可判定的规则\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**，共同主题是**可判定性**：把\"风格建议\"变成\"看到 X，拒绝\"，把\"主题分支\"变成\"一张 token 表\"，\n> 把\"紧急时该不该切换\"变成一个**不需要合并**的变量。\n> 其中 CI 那篇讲了一个堪称完美的死锁困境。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [Web 样式系统](#1-web-样式系统) | 12 项检查表，每一项都是\"看到 X，拒绝\" |\n| 2 | [CI 故障切换手册](#2-ci-故障切换运行手册) | 修复 CI 的改动，需要 CI 通过才能合并 |\n| 3 | [发布的依赖面](#3-发布的依赖面与有界的-peer-中继) | 未分类的导出阻塞一切自动写入 |\n\n---\n\n## 1. Web 样式系统\n\n`2026-07-19-web-styling-system.md`\n\n### 他们遇到的事\n\n两句话，但把前提说尽了：\n\n> The GUI **has no designer supply**; styles are written by an agent and reviewed. **Without a machine-checkable token system and coding rules**, colors/radii/motion drift as literals across components, and dark mode grows into conditional branches scattered inside components.\n\n**GUI 没有设计师供给**；样式由 agent 写、由人评审。**如果没有机器可检查的 token 系统和编码规则**，颜色/圆角/动效就会作为字面量在组件之间漂移，而暗色模式会长成**散落在组件内部的条件分支**。\n\n### 判断：五条框架规则\n\n1. **视觉基线 = 与 Chat 前端对齐**。每个值来自一次 Chat 前端调研（品牌蓝、灰阶、气泡几何、阴影层级…）；**偏差允许，但必须先记录在偏差表里**\n2. **两层 token，不是三层**。基线仓库用 static→alias→specific 三层；**在他们的规模上压缩成两层**——\"直接持有真实值的语义层 + 少量组件专属槽位\"\n3. **字号与间距不做 token 化**。字号在组件里写 px，且**总是搭配行高**（16/24、14/22、12/18）；间距用 4 的倍数；**token 化只覆盖颜色/圆角/动效/字体栈/阴影**\n4. **边框与交互态用透明度方案**。理由很实用：`rgba(...)` **叠加在任何高度背景上都成立**，于是**不需要引入新的实色灰**\n5. **暗色模式只发生在 token 表里**——**组件 CSS 里零主题选择器**。当某个非 token 值确实必须随主题变化时，走\"**CSS 变量桥**\"：组件定义局部变量，主题块只覆盖那个变量\n\n### 一条为 agent 设计的规范形态\n\n> The spec is maintained as a **review checklist** (12 items): each item is a decidable \"**see X, reject**\" — **not a style suggestion** — and **writing styles and reviewing styles share the same table**.\n\n三个要点叠在一起：\n\n- 每一项都写成**可判定的拒绝**，不是风格建议\n- **写和评审共用同一张表**（作者的自我检查与评审者的检查是同一次动作）\n- 规范带**操作清单**：新增组件怎么做、加 token 怎么做（先加表行 → 再改两个 CSS 块 → 才在组件里引用）、偏离基线怎么做（**先记偏差表再落代码**）\n\n### 分工：RFC 与活文档\n\n| 内容 | 家 |\n|---|---|\n| 五条框架规则、工程约束、\"为什么两层\"、\"为什么字号不 token 化\" | **本 RFC——改它需要一份新的取代 RFC** |\n| 每个 token 的权威值、视觉基线常量、12 条编码规则、偏差记录 | 活文档，随实现演进 |\n\n**判断性的内容（为什么）冻结在 RFC，事实性的内容（值）放在活文档。** 改事实是日常，改判断要重新走一次决策。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **token 化字号/间距** | 基线仓库**证明了不 token 化也能收敛**（配对行高的纪律替代了它）；而**一个膨胀的 token 表会稀释颜色 token 的权威性** |\n| **暗色模式用 `prefers-color-scheme` 或组件内分支** | 属性选择器的**整表覆盖让组件保持无知觉**；系统偏好以后可以叠加到开关上，而不触碰 token 机制 |\n\n第 1 条里那句值得单记：**表越大，表里每一项的权威越弱。** 他们宁可少收一点，也不稀释已经收进表里的东西。\n\n### 他们承认的代价\n\n- 字号/间距**依赖纪律而非 token**（配对行高 + 4 的倍数）\n- **任何框架变更都需要一份取代 RFC**\n\n---\n\n## 2. CI 故障切换运行手册\n\n`2026-07-26-ci-failover-runbook.md`\n\n### 他们遇到的事：一个完美的死锁\n\n三个必需的 Linux worker job 跑在托管的企业 32 核池上。当企业池退化时——\n\n> When the enterprise pools degrade — jobs queue indefinitely or the enterprise labels vanish — **every open pull request becomes unmergeable**, and **the ordinary recovery of merging a fix is itself deadlocked behind the very required checks that cannot run**.\n\n**每一个开着的 PR 都变得不可合并；而\"合并一个修复\"这个常规恢复手段本身，被那些跑不起来的必需检查死锁住了。**\n\n修复 CI 的改动要走 CI，而 CI 挂了。**这正是\"常规出路恰好被故障本身封死\"的经典形态。**\n\n### 判断\n\n**范围：两个独立开关，每个平台一个。** `DSH_CI_FAILOVER_LINUX` 恢复企业 Linux 池故障；`DSH_CI_FAILOVER_WINDOWS` 恢复托管 Windows 池故障。**一个平台的故障不必重定向另一个平台的 job。**\n\n关键性质：\n\n> Each switch is **writer-manageable repository state, not a merge**, so it works while checks are red.\n\n**每个开关都是 writer 可管理的仓库状态，不是一次合并，所以它在检查是红的时候也能工作。**\n\n### 他们凭什么敢把它交给 writer 级权限（这段是权限推理的范本）\n\nGitHub 允许任何有写权限的协作者管理仓库变量，所以这不是 admin-only。他们的回应：\n\n> In this repository's trust model that is **not an escalation**: the runner groups admit all workflows of this private, fork-disabled repository, so **any writer could already reach the VMs by pushing a branch workflow**. **The boundary against untrusted code is repository membership; the variables only route work for members.**\n\n**对不可信代码的边界是仓库成员资格，而变量只是为成员路由工作。** 换句话说：这个开关没有创造任何新能力，它只是让已有的能力便宜了一点。\n\n### 三条附带的诚实设计\n\n**① Dependabot 例外。** 两个开关的自托管腿**刻意排除 `dependabot[bot]`**：在自托管故障切换下，Dependabot PR **保持排队等待托管池，而不是在常驻 VM 上执行依赖提供的代码**。\n\n而且明确写了期望行为：**一个在故障期间保持排队的 Dependabot PR 是预期行为，不是切换失败。**\n\n**② 自建池的容量描述不许美化。** `vm-backup` 是**一个共享 VM 上的多个 runner 实例**：\n\n> Registrations share its CPU, memory, and disk; **their count is not a count of independent machines.**\n\n**它们的数量不是独立机器的数量。** 同段还写着\"额外注册只增加调度槽位，不增加机器资源\"。\n\n**③ 一条实测教训写进了规范。** 把 runner 组钉到 master-ref workflow **与这个故障切换不兼容**——因为故障切换 job 是 `pull_request` 运行、从 PR merge ref 评估的，master 钉住的组会让它们**保持排队**：\n\n> (observed live on 2026-07-27; the group was widened to all workflows of this repository to unblock the switch)\n\n**更严格的 runner 侧策略，代价是 PR 故障切换。**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **合并一个 workflow 变更来切换池** | **促成这个开关的故障状态，恰恰是没有任何 PR 能合并的状态——那些必需的检查正是失败的那些。** 仓库变量是 writer 可管理状态，重跑即生效、无需合并 |\n| **让自建池永远留在必需路径里** | **那是拿托管池的可用性换了自建 VM 的可用性，等于移动了单点故障，而不是增加了一个回退。** 按平台拆分意味着一个平台的故障不会重定向另一个平台 |\n\n第 2 条是一个可以复用的判据：**\"把 A 换成 B\" 不是冗余，只有\"A 或 B 都能用\"才是。**\n\n### 他们承认的代价\n\n- **每个平台要维护第二套 runner 拓扑**，而且自托管的并发与缓存分支必须**与托管腿保持同步**\n- **只有完成的 verdict 才算就绪证据**——一个被取消的、或仅仅被排入的运行**不是就绪证明**\n- 按平台拆开关**多了一个要管理的变量**，但把每个开关的影响范围**限制在单一平台的 job 上**\n\n---\n\n## 3. 发布的依赖面与有界的 peer 中继\n\n`2026-08-26-published-dependency-faces.md`\n\n### 他们遇到的事\n\n一个包可能同时包含**浏览器 bundle、Host 入口、共享 TS 声明和 Cordis 注入元数据**。把所有这些关系都编码成必需的 npm peer，导致发布的 CLI **安装变得昂贵**：npm 会自动安装 peer，并且沿着深层的、收敛的 peer 路径**反复评估放置位置**。\n\n关键判断：**改范围、或者把 peer 变成可选，都没有消除那个遍历。** ——问题不在\"范围写得不合适\"，在\"关系被放错了区段\"。\n\n而且两类关系的归属本就不同：**选择 Client 构建输入的是\"发布的 profile\"**，而**Host 值导入是由 Node 从导入包处加载的**。\n\n### 判断：三档分类 + 一道硬闸\n\n每个 Host 运行时导出被归入三档之一，**只能归入一档**：\n\n| 分类 | 含义 | 结果 |\n|---|---|---|\n| `duplicateSafePackages` | 该包的值是无状态的、结构可识别的、或通过版本化互操作描述符存储 | 整包作为**普通依赖** |\n| `safeHostDependencyExports` | 包的其余导出无法作同样保证，但**列出的这些可以** | 仅列出的导出作为普通依赖 |\n| `peerRequiredHostExports` | **构造函数身份或模块状态必须共享**的导出 | **整条包边**保持 peer + dev |\n\n然后是那道硬闸：\n\n> An unclassified Host runtime export is a policy violation that **blocks all `--fix` writes**... Once source safety passes, `--fix` performs only the section and range changes implied by the classification.\n\n**未分类的运行时导出是政策违规，阻塞所有 `--fix` 写入。** 只有源头安全通过之后，`--fix` 才执行分类所蕴含的区段与范围变更。\n\n**自动修复拒绝在存在未分类项时动手**——因为此时任何自动写入都是在**猜测**。这与第 05 批\"tag 是 commit 指针不是发布证明\"是同一种谨慎：**工具只做它有证据做的事。**\n\n诊断形态也值得记：\n\n> An unclassified runtime import reports **one clickable `path:line:column` diagnostic per imported export.**\n\n**每个被导入的导出，一条可点击的 `path:line:column` 诊断。** 而且验证器**读源文件，所以它在干净树上运行**——不需要先构建。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持内部关系为 peer | npm 必须沿着收敛的祖先路径放置和验证每个必需 peer——**即使所有内部版本都兼容，也会重现报告过的安装时故障** |\n| 用 `\"./client\"` 导出作为 Client 面的名册 | 一个包可以发布面向 Client 的类型或浏览器 API，**却不贡献动态加载的行**；选择它会**把迁移扩大到无关的 Host 包**。`dsh.client` 标识动态行，`packages/client/` 目录独立覆盖静态输入 |\n| 展平每个 Host 包 | 消除了更多 peer 工作，**但把迁移扩大到那些个别基准结果微不足道的包**。显式列表**保留剩余的 peer 契约，直到测量证明另一个条目正当** |\n| 把每个 Client 相关声明移到仅开发 | 双面包的 Host 值导入**仍然是真实的 Node 加载**；省略它们**会让包依赖于某个 profile 的偶然提升** |\n| 在 CI 里强制墙钟阈值 | **resolver 时间随机器负载和元数据完成顺序变化。确定性的 manifest 分类属于 CI；计时留给维护者基准** |\n\n**\"直到测量证明另一个条目正当\"** 与第 07 批\"趁爆炸半径小的时候换\"是同一套纪律：**不做没有测量支撑的扩大。**\n\n### 他们承认的代价\n\n- **把一个公开的类型-only 关系移到 `devDependencies`，意味着一个独立 TypeScript 消费者在消费那个声明时必须安装被引用的类型包。** 发布的 profile 安装完整族；**支持独立组装的消费者将需要一个不同的政策**\n- **元数据-only 基准是诊断证据，不是发布时的性能承诺**\n\n第 1 条是主动写出\"这个决定的受益者之外还有受损者\"——**代价不只作用于自己，也作用于下游消费者，他们说清楚了。**\n\n---\n\n## 这批的共同判断标准\n\n**① 规范要写成\"可判定的拒绝\"，不是风格建议。**\n12 项检查表的每一项都是\"看到 X，拒绝\"。**判断标准：一个人读完这条规范，能不能在不咨询作者的情况下得出唯一结论？**\n\n**② 写的人与评审的人共用同一张表。**\n自我检查与评审检查是同一次动作——**这消除了\"规范知道但没执行\"的空间**（第 02 批\"十九个文件展示了单靠约定能达成什么\"的正面解法）。\n\n**③ 约束要在被约束者无知觉的情况下生效。**\n暗色模式靠属性选择器的**整表覆盖**，于是**组件里零主题选择器**。**好的约束不需要被约束者配合。**\n\n**④ 表越大，表里每一项的权威越弱。**\n他们拒绝 token 化字号与间距，理由是**膨胀的表会稀释颜色 token 的权威性**。**约束的范围应该由\"它能守住多少\"决定，不是由\"它能覆盖多少\"决定。**\n\n**⑤ 越界的机制不能走那条被阻塞的路径。**\nCI 那篇的决定性论证：把切换做成\"一次合并\"是错的，**因为需要切换的时刻，正是合并被阻塞的时刻**。\n**判据：设计应急机制时，先问它依赖的通道在故障时是否还通。**\n\n**⑥ 冗余 ≠ 替换。**\n\"让自建池永远在必需路径里\"被否决，因为**那是用 B 的可用性换 A 的可用性——移动了单点故障，没有增加回退**。\n\n**⑦ 自动修复必须在信息不足时拒绝动手。**\n未分类导出阻塞所有 `--fix` 写入。**工具只做它有证据做的事**——证据不足时的\"尽力而为\"，等于用一个更强的语气说出一个更弱的判断。\n\n**⑧ 诊断要可直接定位。**\n每个未分类导出给一条**可点击的 `path:line:column`**。这是第 01 批\"每条违规自带 文件:行\"的又一次落地。\n\n---\n\n## 下一步\n\n**进度 26/47（55%）**，已过半。下一批候选：`project-local-issue-planning-fields`（规划字段）、`worktree-local-lefthook`（worktree 与钩子）、`generated-third-party-notices`（生成物）、`serial-cross-platform-ci-reference`（跨平台 CI）、`node-engine-floor`（引擎下限）。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-09-派生物与事实源.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-09-派生物与事实源","title":"DSH 过程决策精读 · 第 09 批：派生物与事实源","tags":["@anthropic-ai/claude-agent-sdk","@earendil-works/pi-ai","@types/node","0.79.3","22.19.0"],"summary":"2026-07-30-generated-third-party-notices.md · 本批最重要的一篇","bytes":18982,"lines":301,"body":"# DSH 过程决策精读 · 第 09 批：派生物与事实源\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。主题是\"派生出来的东西怎么保持不撒谎\"。\n> 这批解决了一个我此前记录为\"模式 B（拒绝第二份真相）\"的悬案：**同一类东西，为什么他们拒绝了索引和账本，却接受了一个生成文件？答案是有边界的。**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [生成的第三方声明](#1-生成的第三方声明) | 新鲜度是**被维护**，不只是被强制 |\n| 2 | [worktree 局部的 Lefthook](#2-worktree-局部的-lefthook) | 隔离共享可变状态；拒绝造通用层 |\n| 3 | [把 Node LTS 下限提到 22.19](#3-把-node-lts-下限提到-2219) | 下限是\"已安装工作区\"的契约，不只是源码的契约 |\n\n---\n\n## 1. 生成的第三方声明\n\n`2026-07-30-generated-third-party-notices.md` · **本批最重要的一篇**\n\n### 他们遇到的事\n\n开源要求披露依赖及其许可证。这个披露必须同时满足三件事：\n\n1. **完整**\n2. **随依赖变化保持真实**\n3. **说出读者能行动的东西**——哪些包最终会出现在用户机器上，哪些只用于构建和测试\n\n然后一句判决：\n\n> A hand-written inventory answers **none of those durably**. Roughly a hundred rows... **drift silently the moment a package is added, removed, or relicensed, and nothing would notice.**\n\n手写清单一条都做不到。大约一百行名字与许可证字符串，**一旦有包被添加、移除或改许可就会静默漂移，而没有任何东西会注意到。**\n\n### 判断：把\"新鲜度\"设计成被维护，而不是被检查\n\n这是本篇最有价值的设计，也是对模式 B 的一个正面解法：\n\n> **Freshness is maintained, not merely enforced.** A pre-commit job regenerates the file and stages it **whenever a generator input is staged**... so **an unrelated dependency edit never has to come back and rerun a generator**.\n\n**在生成器的任一输入被暂存时，pre-commit job 重新生成并暂存该文件。** 输入清单包括：任何 manifest、workspace 声明、根锁文件、`vendor/README.md`、`pyproject.toml`、生成器本身、以及持有构建期 pin 的脚本。\n\n于是**一次无关的依赖编辑永远不必回头重跑生成器**——文件在提交的那一刻就已经是对的。\n\n而**校验**则搭了现成的车：提交后的字节在 `gen-third-party-notices.spec.ts` 里被断言，**而测试泳道本来就会跑它**：\n\n> the check adds **no gate process, no scheduler slot, and no separate CI step**\n\n**不增加门进程、不增加调度槽位、不增加独立 CI 步骤。**\n\n对比一下他们否决的那个方案就明白这个设计的分量：\n\n> its only failure mode is telling a contributor, **minutes after they pushed an unrelated dependency bump**, to go rerun a generator\n\n**它唯一的失败模式，是在一个贡献者推完一个无关的依赖升级几分钟后，告诉他\"去重跑一下生成器\"。**\n\n### 一个被接受、而不是被绕过的缺口\n\n> lefthook inspects only files present on disk, so **deleting** a manifest runs no job\n\nlefthook **只看磁盘上存在的文件**，所以**删除**一个 manifest 不会触发任何 job。他们试过补救——重建暂存文件列表以包含删除——**不行**，因为 lefthook 无论如何都会用工作树过滤那个列表。\n\n于是他们**接受这个缺口并指定兜底**：断言正是为这种情况存在的。**\"接受并指定兜底\"不同于\"忽略\"**——差别在于缺口被写下来了。\n\n### 三条关键的内容判断\n\n**① 只披露直接依赖。** 完整传递闭包（几千个包）**已经带精确版本记录在锁文件里**：\n\n> re-materializing either as prose would be a **second, worse copy**\n\n**把它们重新物化成散文，会是第二份、更差的拷贝。** 文件改为指向锁文件和 `pnpm licenses list` 渲染器。\n\n**② 分层跟随\"分发\"，不跟随 manifest 区段。**\n\n这是本篇的技术核心，也是他们明确推翻的一个\"机械上简单\"的做法：\n\n| 规则 | 结果 |\n|---|---|\n| 按 manifest 区段分层（`dependencies` vs `devDependencies`） | **机械上简单，在真实数据上两个方向都错** |\n| 按\"从已发布装配的可达性\"分层 | 层更紧，**但把 MCP 客户端和 OpenTelemetry 导出器判为仅开发——即使用户运行已安装的仓库时可以挂载它们** |\n\n实际规则：运行时库 = `dependencies` 或 `optionalDependencies` **且不在 `DEV_ONLY_AREAS` 里**；**被发布的 tsdown 和 Vite 配置解析的浏览器输入也算运行时，即使它们在 `devDependencies` 里**；而**测试支持的依赖不会仅因为它的 manifest 写着 `dependencies` 就发布**。\n\n最关键的一条：**运行时层刻意覆盖每一个可挂载的插件**，不只是默认装配加载的那些——因为**源码执行可以从用户的 `cordis.yml` 挂载任何插件包**。原文由此给出错误方向判断：\n\n> **Under-disclosure is the costly direction for a legal notice.**\n\n**对一份法律声明来说，披露不足才是代价高昂的那个方向。**\n\n**③ 各处 fail-loud 的清单。**\n\n- manifest 集合**从根 `pnpm-workspace.yaml` 声明的成员派生**——\"**一个新的成员区域在被声明的那天就被读到，而不是等到有人记得扩展列表的那天**\"\n- **一个包若既不在 store 也不在 link farm 里解析，就大声失败，而不是发出一个空单元格**\n- **许可证不在许可列表上的运行时依赖是硬错误**：*\"发布 copyleft 是一个分发决定，不是一张重新生成的表可以静默吸收的东西\"*\n- vendored 包与 `vendor/README.md` 交叉核对，**任何一个不是 MIT 就被拒绝**\n- `patchedDependencies` 列在运行时表下——因为 **pnpm 在安装时应用那些补丁，发布的产物携带修改过的副本，而补丁文件就是\"改了什么\"的记录**\n\n### 一段极精细的授权设计（Claude SDK）\n\n项目所有者单独授权分发官方 `@anthropic-ai/claude-agent-sdk`。生成器把它表示为**一个精确的直接包身份例外，而不是一次许可证宽松化覆盖**：\n\n- `SEE LICENSE IN README.md` 这类**仍然是非宽松分类**\n- **每一个无关的非宽松运行时仍然 fail closed**\n- 当 SDK 存在时，生成器读它已安装的 manifest、**拒绝官方 SDK 载荷前缀之外的可选身份**、验证已安装宿主载荷的身份/版本/声明许可字段\n- 版本、声明许可和载荷集变化**不需要新的身份授权**，但**仍然需要常规的依赖、锁文件、兼容性、条款和 notices 评审**\n\n被否决的两个替代形状：\n\n| 方案 | 否决理由 |\n|---|---|\n| 把 Claude SDK 条款当作宽松 | **错述上游声明** |\n| 加一个可复用的非宽松允许列表 | **让一个无关的运行时继承它从未被授予的授权** |\n\n### 测试要钉住\"静默遗漏路径\"\n\n> It also pins the parsers against the shapes that would otherwise **drop a package without a word**... **Each of those is a silent-omission path, which is the failure mode a disclosure file cannot afford.**\n\n被钉住的形态包括：`vendor/README.md` 表格不再覆盖某个 vendored 目录、带 extras 的 requirement（`\"httpx[http2]\"`）、完全没有版本的 requirement、作者命名的 `[dependency-groups]` 表、**一个不在任何硬编码列表里的 workspace 成员区域**。\n\n测试还钉住了**促成这条规则的那两种情况**：一个测试支持包的 `dependencies` 条目、一个没有应用挂载的插件包。\n\n### 他们承认的代价\n\n- 依赖编辑现在**把重新生成的文件带进同一个提交**；贡献者在触碰 manifest 的提交上付**大约一秒**，其他提交上不付\n- **禁用钩子提交会把成本推迟到一次指名命令的测试泳道失败**\n- 生成器**需要已安装的树**，比纯源码生成器重；**新包若有不可用的发布元数据，需要一条 `OVERRIDES` 条目，而不是静默渲染空白许可证**——两个失败都**大声且指名补救方法**\n\n---\n\n## 2. worktree 局部的 Lefthook\n\n`2026-07-27-worktree-local-lefthook.md`\n\n### 他们遇到的事\n\n每次 `pnpm install` 跑根的 `postinstall`，它调用 `lefthook install --force`。问题是：\n\n> Linked Git worktrees otherwise **share the common repository's default hooks directory**, so **an install in any worktree can rewrite hooks used by every other worktree**.\n\n**链接的 Git worktree 共享公共仓库的默认 hooks 目录，所以在任何一个 worktree 里安装，都能重写其他每一个 worktree 正在用的 hooks。**\n\n而更具体的失效：Lefthook 生成的 hooks **优先使用\"安装它的那个 worktree\"捕获的绝对二进制路径**，然后才尝试当前 worktree 的回退。所以：\n\n> Shared hooks can therefore **run another worktree's pinned binary until that worktree disappears**, while concurrent installs write the same files.\n\n**共享的 hooks 可能运行另一个 worktree 钉住的二进制，直到那个 worktree 消失**——而并发安装还在写同一个文件。\n\n这是**共享可变状态**的经典事故：两个本该独立的实体，通过一个共享的隐式位置互相破坏。\n\n### 判断\n\n把 hooks 安装变成 **worktree 作用域**。防护清单极其详尽（择要）：\n\n- `CI=true` 或 `GITHUB_ACTIONS=true` 时**在 Git 发现或变更之前就返回**——\"自动化 job 不消费贡献者的 hooks\"\n- 要求 Git 2.26+（`git config --show-scope` 能报告值来自哪个作用域）\n- **升级 format-0 仓库之前，拒绝直接的 common-config `extensions.*`**、拒绝 `core.worktree` 或 `core.bare=true`、拒绝**启用扩展后会激活的非空休眠配置**\n- **这些检查禁用 include 展开**——\"因为 Git 的仓库格式解析器也忽略被包含的目标\"（**模拟对方的行为，包括它的盲区**）\n- 仓库作用域的锁串行化迁移与写入，**释放时必须核对进程 ID、随机令牌、文件身份和确切内容**\n- **死锁或无效锁需要人工恢复，而不是自动破锁**\n- 每个 hook 目录带 JSON 所有权标记，**只允许替换那个确切过时的自有值**\n- **`$GIT_COMMON_DIR/hooks` 里的现有文件永不被移除或重写**\n- Lefthook 在改完 `core.hooksPath` 后失败时**恢复先前的值**；**回滚失败与安装失败一起报告**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持共享 hooks，依赖\"当前 worktree 回退\" | **捕获的绝对路径在它的 worktree 存在期间胜出，所以回退不提供版本或生命周期隔离** |\n| 让每个 worktree 指向一个签入的 `.githooks` | **改变共享的 `core.hooksPath` 会禁用那些分支不含该目录的旧 worktree 的 hooks，而且仍然把每个 worktree 耦合到一个共享配置值** |\n| **构建一个通用的 hook 管理器链式层** | 顺序、参数转发、失败语义和升级**变成与 Lefthook 隔离无关的仓库自有行为** |\n| 白名单 provider 专属的 CI 凭证 include 路径 | **会把安装器安全耦合到 provider 的 checkout 内部**，并削弱对贡献者安装的严格校验 |\n| 停止自动安装 hooks | 避免了共享写入，**但会让仓库廉价的提交/推送检查意外变成可选的——尤其是在短命的 agent worktree 里** |\n\n第 3 条是\"拒绝造通用层\"的范例：**一个只为解决 X 的改动，不该顺手引进一套属于别的问题的仓库自有行为。**（与第 05 批\"不随一次简化捎带进来\"同源。）\n\n第 5 条点出一个隐蔽后果：**让检查变成\"可选\"不是中立的**，它在短命的 worktree 里尤其致命——而 agent 恰好大量使用短命 worktree。\n\n### 他们承认的代价\n\n- 仓库在第一次安装后**变成 Git format-1 仓库**\n- **自定义 worktree hook 管理器需要一个显式的集成选择**\n- **旧式公共 hooks 保留在磁盘上供未升级的 worktree 使用：它们可能变陈旧，但自动移除它们会破坏一个尚未采用此安装器的已注册 worktree**\n\n最后一条是\"**迁移期间必须容忍双重存在**\"——而且**容忍的方向明确偏保守**（宁可留陈旧的，不可破坏在用的）。\n\n---\n\n## 3. 把 Node LTS 下限提到 22.19\n\n`2026-07-06-node-engine-floor.md`\n\n### 他们遇到的事\n\n根 `engines.node` 的 Node 22 分支**不只是 harness 源码直接调用的运行时 API 的契约**：\n\n> it is a contract **for the installed workspace**, not only for the runtime APIs the harness source calls directly\n\n它必须**不低于**在该分支上安装的依赖的 `engines.node` 声明。否则：\n\n- **`pnpm install --engine-strict` 会在一个被广告的 LTS 版本上失败**\n- 非严格安装会**运行在一个依赖支持的运行时之外**\n\n### 判断与推理链\n\n源码特性给出的边界：`node:sqlite` 丢实验标志在 **22.13**，原生 TypeScript 类型剥离成为默认在 **22.18**。\n\n**但这些源码特性在 22.18 就通过了，真正抬高下限的是已安装的依赖**：`@earendil-works/pi-ai@0.79.3` 声明 `engines.node >=22.19.0`。所以 LTS 下限是 **22.19**。\n\n然后是不相交范围的论证：**完全排除 Node 23**——23.0–23.5 仍至少有一个被标记的源码特性，**而 23 线是非 LTS/EOL，所以广告 `>=23.6` 会增加一条死的发布线和一条没有部署应该使用的 CI 腿**。\n\n### `@types/node` 的 pin 逻辑（这段很实用）\n\n保持钉在 22.x 线，理由是**失败要发生在编译期而不是运行期**：\n\n> Pinning `@types/node` to the 22.x line turns that into a **compile error everywhere**.\n\n对照被否决的方案：\n\n| 方案 | 否决理由 |\n|---|---|\n| 让 `@types/node` 领先于下限（`^25`） | **类型领先于运行时下限，会让一个 Node 24/25-only 的 API 编译干净，只在 22.x 上运行时失败。** 钉到 22.x 把它变成每处都编译错误 |\n\n以及矩阵与范围的两条：\n\n| 方案 | 否决理由 |\n|---|---|\n| 矩阵写 `[22, 24, 26]` 而不是钉 `22.19` | **浮动的 major 条目会随时间长上去，并静默停止演练声明的 LTS 下限** |\n| 开放式 `>=22.19` | 广告了对 23.0–23.5 的支持——**那里至少有一个特性仍被标记** |\n| `>=22.13` 加版本条件测试标志 | **为一个狭窄范围增加一个版本条件标志，并把一个实验性标志依赖打扮成一等支持** |\n\n### 他们承认的代价\n\n> A future dependency or source API that raises the runtime floor must move `engines.node`, the compatibility matrix, and **this Agent Note** in the same change.\n\n**一个未来的依赖或源码 API 若抬高运行时下限，必须在同一次变更里移动 `engines.node`、兼容矩阵和这篇 Agent Note。** 文档被列为**必须在同一变更里更新的三样东西之一**。\n\n---\n\n## 对索引里跨批模式的补充：模式 B 的边界终于清楚了\n\n前几批我记录了三处\"拒绝第二份真相\"：**生成的 Agent Note 索引**、**`vendor/published.json` 账本**、**Knip 的例外清单**。而这一批，他们**接受**了一个生成文件（`THIRD_PARTY_NOTICES.md`），它同样是\"从别处派生出来的第二份拷贝\"。\n\n同一类东西，为什么结论相反？原文给了答案：\n\n**① 它是业务必需的，不是便利。** 开源合规**要求**这份披露存在——你不能\"消除\"它，只能选择\"手写\"还是\"生成\"。而索引只是发现路径的一种便利，账本只是状态的一种记录。\n\n**② 自动化的位置不同。** 他们不是事后检查它是否新鲜，而是**在源头变化的同一时刻重生成**：\n\n> Freshness is **maintained**, not merely enforced.\n\n**③ 校验搭了已有的车。** 断言放进测试泳道本来就在跑的 spec，**零额外 CI 成本**。\n\n由此我修正模式 B 的表述：\n\n> **模式 B（修正）：能消除的第二份真相就消除；必须存在的第二份真相，就在源头变化的同一时刻自动重生成它，并让校验搭已有的车——绝不让\"同步\"成为某个人某天要记得做的事。**\n\n判据的三问：**它是必需的吗？源变化时能自动重生成吗？校验能搭现成的车吗？** 三个都否，就该考虑消除它。\n\n这条也解释了那个被否决的 doc-sync 门方案为什么输：**它唯一的失败模式是把同步成本推给一个人**（\"在无关提交之后几分钟告诉他去重跑生成器\"）。\n\n---\n\n## 这批的共同判断标准\n\n**① 新鲜度要被\"维护\"，不只是被\"强制\"。**\n在源头变化时重生成，而不是在事后告诉人去重跑。**让同步成为机制的一部分，而不是某个人的待办事项。**\n\n**② 校验要搭已有的车。**\n断言放进测试泳道本来就在跑的 spec——**零新门进程、零新调度槽位、零新 CI 步骤**。（第 01 批说过\"门禁本身是要维护的代码\"，这是对那条代价的直接回应。）\n\n**③ 分层跟随真实分发，不跟随 manifest 区段。**\n\"机械上简单，在真实数据上两个方向都错。\"**读 manifest 的字段名很容易，判断它是否真的随产物到达用户很难——但只有后者是对的。**\n\n**④ 判断错误方向，并往安全的那一侧倾斜。**\n\"对一份法律声明来说，披露不足才是代价高昂的方向。\"**每一个规则都要问：如果我错了，会往哪边错？**\n\n**⑤ 测试要钉住\"静默遗漏路径\"。**\n那些\"否则会一声不响丢掉一个包\"的输入形态，才是披露类产物承受不起的失败模式。**测的不是\"它能工作\"，而是\"它不会安静地不工作\"。**\n\n**⑥ 隔离共享可变状态。**\n一个 worktree 的安装不该改另一个 worktree 的行为。**隐式共享的位置（默认 hooks 目录）是这类事故的标准温床。**\n\n**⑦ 拒绝把手头问题变成一个通用层。**\n\"构建通用 hook 管理器\"被否决，因为**顺序、参数转发、失败语义、升级会变成与目标无关的仓库自有行为**。\n\n**⑧ 让检查\"意外可选\"不是中立行为。**\n\"停止自动安装 hooks 会让廉价的提交/推送检查意外变成可选的，**尤其是在短命的 agent worktree 里**。\"\n\n**⑨ pin 比范围好，类型不能领先于运行时下限。**\n浮动的 major 条目**会随时间长上去，并静默停止演练声明的下限**；类型跑在运行时前面，会把运行时故障伪装成编译通过。\n\n**⑩ 文档和代码在同一次变更里移动。**\n\"必须移动 `engines.node`、兼容矩阵和这篇 Agent Note\"——**文档是必须同步移动的三样东西之一，不是事后补的。**\n\n---\n\n## 下一步\n\n**进度 29/47（62%）**。下一批候选：`project-local-issue-planning-fields`、`serial-cross-platform-ci-reference`、`automatic-translation-pairing-merges`、`browser-third-party-build-inputs`、`package-model-experience-contract`。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-10-把纠缠的事实拆开.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-10-把纠缠的事实拆开","title":"DSH 过程决策精读 · 第 10 批：把纠缠的事实拆开","tags":["dsh-translation-pairing"],"summary":"2026-08-08-automatic-translation-pairing-merges.md","bytes":19259,"lines":271,"body":"# DSH 过程决策精读 · 第 10 批：把纠缠的事实拆开\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。共同点是**区分**：同一个 package.json 区段，对\"要不要下载\"和\"要不要披露\"是两个问题；\n> 同一个 `always()`，对\"失败聚合\"和\"资源清理\"有不同义务。\n> 这批还给出了模式 A（诚实的空白）的最强形态。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [自动合成翻译配对记录](#1-自动合成翻译配对记录) | **我算不出来，但我不假装算出来了** |\n| 2 | [浏览器第三方库作为构建输入](#2-浏览器第三方库作为构建输入) | 分发代码 ≠ 让安装器下载同名包 |\n| 3 | [取消被取代的 CI 验证](#3-取消被取代的-ci-验证) | 三种义务，三种条件 |\n\n---\n\n## 1. 自动合成翻译配对记录\n\n`2026-08-08-automatic-translation-pairing-merges.md`\n\n### 他们遇到的事\n\n第 01 批读过的那套双语配对记录，在合并时暴露了一个结构性问题：\n\n> Two branches that independently update different parts of the same confirmed pair therefore **conflict on both hash lines even when Git cleanly composes both Markdown owners**.\n\n两个分支独立更新同一个已确认配对的不同部分——**即使 Git 干净地合并了两侧的 Markdown，也会在两行哈希上冲突**。而选择任何一侧都会留下陈旧的哈希，**手工重新生成记录则是在重复一个确定性操作**，并**阻止了一次本来可以是自动的合并**。\n\n### 判断：让合并驱动重新推导，而不是选择一侧\n\n用一个仓库自有的 `dsh-translation-pairing` **合并驱动**：\n\n- 解析 ancestor/current/other 记录，加载它们哈希命名的**六个 owner blob**\n- **独立地为英文和中文三件套运行 Git 的默认三方文本合并**，要求两个都干净\n- 验证语言切换器与配对结构签名，把两个合并后的 blob 的**哈希写成规范记录**\n- **它合成的是双方父提交中已经存在的确认；它从不记录一次普通的单边文档编辑**\n\n最后一句是这套机制的安全边界：**它能自动合成的，只有\"两边都已经确认过\"这一种情况。**\n\n### 本批最值得记的一处设计：\"算不出来时不假装算出来了\"\n\nGit 的驱动通过一个**签入的 shell 启动器**调用（启动器本身不需要 Node），而启动器在每次执行前会**探测运行时和入口点**。探测失败时：\n\n> When the runtime or entrypoint is unavailable, the launcher **materializes Git's ordinary three-way text result in the sidecar but returns a conflict even when that text merge is clean**, so Git retains the unmerged index stages and **never accepts unverified metadata**.\n\n**它把 Git 的普通三方文本结果物化到 sidecar 里，但即使那个文本合并是干净的，也返回冲突。**\n\n**它明明能算出一个结果，却拒绝让这个结果被当作有效。** 因为那个文本结果**没有经过驱动的那套校验**（六个 blob 的哈希、语言切换器、结构签名）。**用未经校验的结果冒充校验过的结果，比明确失败更危险**——这是模式 A（诚实的空白）到目前为止最强的一个形态：不是\"我不知道所以留白\"，而是\"**我能给出一个看起来对的答案，但我知道它没被验证过**\"。\n\n### 一张失败契约表\n\n他们为正常 `git merge` 期间的每种失败写明了**可观察状态**与**恢复方式**：\n\n| 失败 | 可观察状态 | 恢复 |\n|---|---|---|\n| 全新安装无法探测驱动或装 Lefthook | 不发布新配置；任何新加入的集成**被回滚到先前的 hook 查找** | 恢复依赖并重跑安装器 |\n| 安装后 Node/tsx/入口点变得不可用 | 合并在 sidecar 处于 `UU` 时停止，索引阶段 1/2/3 保留，`MERGE_HEAD` 存在，不创建提交 | 恢复依赖并跑解析器，或 `git merge --abort` |\n| 驱动拒绝记录 | 合并停止，驱动打印 owner 修复与显式解析器路径 | 修复后跑打印出的流程或中止 |\n| 驱动进程以高于 128 的状态崩溃 | **Git 中止合并策略，不发布 `MERGE_HEAD` 或未合并索引阶段** | 修复运行时并重跑合并 |\n| `pre-merge-commit` 拒绝一次本来干净的合并 | 无未合并条目残留，完整结果带 `MERGE_HEAD` 被暂存，不创建合并提交 | 修复 hook 并 `git commit`，或中止 |\n\n**\"可观察状态\"这一列很有价值**：它把\"出问题时你会看到什么\"变成契约的一部分——**恢复的第一步是识别，所以识别条件必须写下来。**\n\n### 两处\"防止误认为完成\"的设计\n\n**① 部分成功必须非零退出。**\n\n`resolve-translation-pairing-conflicts` 在合并停止后应用同样算法：\n\n> It writes and stages every safe record as one batch even when another pair still needs manual work, then reports the remaining pairing conflicts and **exits unsuccessfully so callers cannot mistake a partial resolution for a completed merge**.\n\n**它把每个安全的记录作为一批写入，即使另一对仍需手工处理**——然后**非零退出**，因为\"调用者不能把一次部分解析误认为完成的合并\"。\n\n**② hook 只验证，不重新生成。**\n\n> They validate driver output but **do not regenerate records**, so **bypassing a hook cannot silently bless translation drift**; the corpus-wide `doc-sync` check remains authoritative in CI.\n\n**它们验证驱动输出，但不重新生成记录**——于是**绕过 hook 不能静默地祝福翻译漂移**。\n\n如果 hook 顺手重新生成，那\"绕过 hook\"就变成了\"用陈旧记录蒙混过关\"的通道。**验证与生成分开，让绕过失效。**\n\n### 凭什么这么判断（4 个被否决方案）\n\n| 方案 | 否决理由 |\n|---|---|\n| 取 ours 或用 Git 的 union 驱动 | 任何一侧的父记录命名的都是**合并前**的内容，而 union 会产生重复或无序的哈希键。**两者都不代表合并后的 owner** |\n| 在 `post-merge` 或只在 commit hook 里重新生成 | **`post-merge` 在冲突合并后不运行**，无法影响其结果；**commit hook 只在索引已无未解决条目之后才到达**——单独一个 hook 清不掉那个生成的冲突 |\n| **把每次合并都包进一个仓库命令** | 包装器能解析，且显式解析器保留了那条恢复路径，**但裸 Git、stack 工具、rebase 和 cherry-pick 仍然会在它之前停下来** |\n| 在 GitHub 上通过 Actions 或 app 解析 | 托管自动化可以更新 PR 分支，**但它增加凭据、并发控制和分支变更**；本地与 agent 驱动的 merge-forward 工作流**已经有 checkout 和 push 权限**，仓库**让远程自动化远离这个机制** |\n\n第 3 条是一个关于**介入层次**的判断：包装某一个命令，只能覆盖\"用那个命令\"的路径；而**合并驱动是所有那些操作共享的文件级扩展点**。**选介入点时，要选在\"所有相关路径都必经\"的地方，而不是\"你恰好会用的那条路\"上。**\n\n### 他们承认的代价\n\n- **GitHub 托管的可合并性计算不运行 worktree-local 的可执行文件**，所以贡献者或 agent **仍然必须合并 base 并推送结果提交**，远程冲突徽章才会清除\n- 自动合成**依赖已安装的 Node 依赖**；**运行时丢失会产生一个可见的未解决文本结果，而不是选中陈旧的元数据**（\"失败要可见\"）\n\n---\n\n## 2. 浏览器第三方库作为构建输入\n\n`2026-09-08-browser-third-party-build-inputs.md`\n\n### 他们遇到的事\n\n预构建的浏览器插件**把第三方实现内联在 JavaScript 里**，但生产 npm 依赖**仍然让安装器单独下载那些库并解析它们的 peer**。后果具体到版本：\n\n> When React is declared only for development, **installers can select a different React version for those extra dependencies than the browser artifact uses**.\n\n而且明确排除了\"这是版本问题\"的可能：**相关两个包都支持当前的 React 18，这个问题不需要 React 升级。** 它是**分类**问题。\n\n### 判断：两个事实要分开\n\n决定本身简单——**纯浏览器的第三方依赖属于 `devDependencies`**。但支撑它的判断是本批最锋利的一处：\n\n> **License classification follows distributed content.** ... resolved third-party implementations **remain runtime disclosures even when manifests declare them for development**.\n\n**许可证分类跟随\"分发的内容\"**——通过真实浏览器构建配置解析出的第三方实现，**仍然是运行时披露，即使 manifest 把它们声明为开发依赖**。\n\n而反方向同样成立：**测试工具、被擦除的类型导入、构建工具，不会仅仅因为出现在 `devDependencies` 里就变成分发的代码。**\n\n被否决的那个方案把这件事说得最清楚：\n\n> **Distributing browser code and having an installer download a same-named package are different facts**; that distinction cannot remove license checks on distributed code.\n\n**\"分发浏览器代码\"与\"让安装器下载一个同名包\"，是两个不同的事实。** 同一个 manifest 区段，回答**\"要不要下载\"**和**\"要不要披露\"**是两个不同的问题——**用同一个字段名去回答两个问题，必然在某一头出错。**\n\n### 另外三条判断\n\n- 分类器**从源码导入和 JSX 收集构建输入**；**Host 运行时可达的第三方库优先作为 `dependencies`**；**类型 only 的源码引用不产生 Host 运行时依赖**\n- **npm 区段不选择浏览器打包行为**：动态插件内联私有库并从平台表获取 React；静态浏览器库保留裸导入和样式给最终的 Vite 构建\n- **许可证解析同样不得依赖现有的 `lib/` 文件或写构建输出**（分类保持基于源码）\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 声明另一个生产 React，或覆盖 peer 解析 | **保留了一个浏览器并不使用的额外安装图，而没有让那个安装的副本成为浏览器的共享实例** |\n| 提前内联每个静态库依赖 | **改变了 Vite 的第三方 chunk、缓存与 CSS 处理**；而分类并不需要那些构建改动 |\n| 移动每个含 Client 包的第三方依赖 | 双面包**仍然加载 Host 库**（ZIP 用的 `fflate`、RPC 校验用的 `zod`）；**那些安装关系必须保留** |\n| 直接按 manifest 区段分类许可证披露 | 见上——两个不同的事实 |\n\n第 2 条值得单记：**分类问题不要顺手改构建**。**改变打包行为是另一个问题，把它混进来会让这次改动既难评审又难回滚。**\n\n### 他们承认的代价\n\n> Developers independently consuming static packages or public types **supply the corresponding build dependencies themselves**; this decision **adds no standalone browser-library support promise**.\n\n**独立消费静态包或公共类型的开发者需要自行提供构建依赖**——而且明说**这个决定不增加任何独立的浏览器库支持承诺**。**受益者之外还有受损者，写清楚。**\n\n---\n\n## 3. 取消被取代的 CI 验证\n\n`2026-09-09-cancel-superseded-ci.md`\n\n### 他们遇到的事\n\n> Validation of an obsolete PR revision or master commit **consumes runner capacity without establishing the newest revision's status**.\n\n对一个**过时**的修订做验证，**消耗容量却不确立最新修订的状态**。而附带的一句指出隐性成本：**无条件的聚合裁决和覆盖率历史上传，还会让被取消的运行继续做簿记。**\n\n### 判断：三种义务，三种条件\n\n这篇的核心是**把 `always()` / `!cancelled()` 按义务拆开**：\n\n| 用途 | 条件 | 理由 |\n|---|---|---|\n| PR 聚合裁决 | `!cancelled() && github.event_name == 'pull_request'` | **显式的 status 函数在依赖失败/跳过之后仍保留求值**，而不是接受 GitHub 默认的 success-only 条件 |\n| 覆盖率时长历史 | `!cancelled()` | **失败的覆盖率仍能保存有用的测量；被取消的覆盖率不上传它们** |\n| Wine 资源清理 | `always()` | **仍然是必要的资源清理，而不是可选簿记** |\n\n被否决的那个\"大简化\"把区别点明了：\n\n> **Replace every `always()` condition.** ... **Failure aggregation and resource cleanup have different obligations.** A success-only aggregate **can hide failed dependencies behind a skipped required check**; removing unconditional Wine cleanup **can leave resources running**. **Only cancelled-run bookkeeping is suppressed.**\n\n**失败聚合、资源清理、被取消运行的簿记是三种不同的义务。** 一个 success-only 的聚合**能把失败的依赖藏在一个被跳过的必需检查后面**——这是**最危险的那一类简化：它让失败看起来像通过**。\n\n### 一条原则性的豁免\n\n发布自有的构建被排除在取消之外，理由只有一句：\n\n> Release-owned builds are exempt because **they belong to an intentional publication transaction**.\n\n**它们属于一次有意的发布事务。** 判据由此清楚：**过时的验证可以取消，因为它的价值随新版本出现而贬值；而一次有意的发布事务不会因为\"有更新的提交\"而失效。**\n\n### 一次\"明确接受代价\"的政策反转\n\n这篇**逆转**了更早的故障切换运行手册里的取消豁免。难能可贵的是它**完整记录了旧政策的理由**，而不是一句\"过时了\"：\n\n- 旧豁免（`github.event_name != 'push'`）**偏爱周期性的就绪证据**：每个 standby 用一个门 worker 执行完整的未分片聚合，**可能比 master 合并之间的间隔还长**\n- **即使那个政策也不保证每次演练都完成**\n- GitHub **每个组只保留一个待处理运行，替换中间的待处理推送**；而取消是在新触发的运行上求值的，所以一个共享 master 组的手动基准**仍然可能取消一次演练**\n- 那次罕见的中断**被接受，预期后续推送会提供证据**\n- 旧政策的成本**被 master-only 运行时检查、Wine 和两次演练所界定**\n\n然后是结论，写得毫不含糊：\n\n> This policy is rejected in favor of **freeing capacity for current validation, explicitly accepting standby starvation**.\n\n**这个政策被否决，以换取为当前验证腾出容量，明确接受 standby 饥饿。**\n\n**\"explicitly accepting\"** —— 他们知道新政策会让 standby 演练饿死，并把它写出来，而不是假装没有代价。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保留正在运行的 master-push 演练 | 见上（旧政策的完整成本被摊开后否决） |\n| **用 job 级 concurrency 保护一次演练，或只取消 PR 事件** | **job 级组不能把一个 job 从整个 workflow 的取消中豁免**；只取消 PR 也会豁免手动 dispatch——**一次重复的 runner 基准可以占用十二个 larger runner 长达十五分钟，而不是替换一次过时的测量** |\n| 保留每次合并后、夜间和 pack 运行 | 历史完成度提供更多证据，**但过时的验证会与最新的运行竞争**；而且这些验证**不发布包**，所以保留每一次运行**与保护一次有意的发布事务不是同一个要求** |\n| 替换每个 `always()` | 见上——三种义务不同 |\n\n### 他们承认的代价（含一句关于\"承诺\"的澄清）\n\n- **快速的 master 更新可以重复取消更长的 standby 演练，在它们产生裁决之前**。运维必须使用最新的**已完成**裁决，**检查它的年龄和提交**才能依赖它；**一个已调度、运行中、或被取消的演练不是就绪证据**\n- 政策**不保证**每个中间提交、夜间触发或基准完成\n- 最后一条尤其精确：\n\n> Cancellation is a **request** handled by GitHub Actions and its runners, **not a guarantee of immediate termination or bounded queue delay**. ... The policy **makes obsolete validation cancellable; it does not promise a fixed runtime or cancellation latency**.\n\n**\"让过时的验证可被取消\"不等于\"取消会及时发生\"。** 他们把能力的边界说清楚，**不把\"可取消\"包装成\"能省多少时间\"**。\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 A（诚实的空白）——第 7 次，且是最强形态。**\n\n启动器那处设计：**它能算出一个干净的文本合并结果，却仍然返回冲突**，因为那个结果没经过驱动的校验。这比前几次的\"标注缺失\"或\"公开不利数据\"更进一步：**它主动放弃一个看似可用的答案，只因为它没被验证过。**\n\n**模式 C（别把不同的事混成一种状态）——强印证。**\n\n三种 `always()` 义务的拆分、以及\"分发代码 vs 下载同名包\"的拆分，都属于这条。而且这次出现了它的**危险形态**：**success-only 的聚合能把失败的依赖藏在一个被跳过的必需检查后面**——**混淆两种状态时，错误的方向是\"把失败显示成通过\"。**\n\n---\n\n## 这批的共同判断标准\n\n**① 同一个字段名不该回答两个问题。**\n`devDependencies` 回答\"安装器要不要下载\"，但**不能**回答\"要不要披露\"；`always()` 回答\"要不要无条件执行\"，但**不能**区分\"失败聚合\"和\"资源清理\"。**当一个字段名开始承担第二个问题时，错误就藏在两者的差集里。**\n\n**② 算不出来时，不要给出一个看起来对的答案。**\n启动器明明能产出干净的文本合并，却返回冲突——因为**未经校验的结果冒充校验过的结果，比明确失败更危险**。这是模式 A 的判据，也是这条标准最纯的表述。\n\n**③ 选介入点，要选在所有路径都必经的地方。**\n包装一个命令只能覆盖\"使用那个命令\"的场景；**合并驱动是裸 Git、stack 工具、rebase、cherry-pick 共享的文件级扩展点**。\n\n**④ 部分成功必须非零退出。**\n\"调用者不能把一次部分解析误认为完成的合并。\"**能做完多少就做多少，但汇报时必须说\"没做完\"。**\n\n**⑤ 失败契约要含\"可观察状态\"。**\n那张表有三列：失败、**可观察状态**、恢复。**恢复的第一步是识别，所以识别条件属于契约。**\n\n**⑥ 验证与生成要分开。**\nhook 只验证不重新生成，所以**绕过 hook 不能静默祝福漂移**。**如果验证会顺手修正，绕过它就成了作弊通道。**\n\n**⑦ 政策反转时要记录被否决政策的完整理由。**\n他们写下了旧豁免当初要保护什么、它的成本被什么界定、以及**\"明确接受 standby 饥饿\"**。**记录代价，而不要假装新政策没有代价。**\n\n**⑧ 说清能力的边界，不把\"可取消\"包装成\"会变快\"。**\n\"取消是一个请求，不是立即终止的保证\"\"它让过时验证可被取消，不承诺固定的运行时长或取消延迟。\"\n\n---\n\n## 下一步\n\n**进度 32/47（68%）**。剩下 15 篇以 CI 基础设施为主。下一批打算读 `package-model-experience-contract`、`serial-cross-platform-ci-reference`、`project-local-issue-planning-fields`，以及两篇 CI 策略类（`master-only-platform-ci`、`release-rehearsal-selfhosted`）——后两篇与刚读的取消政策直接相关，应该能形成印证。\n"},{"file":"决策精读/2026-09-10-DSH过程决策精读-11-契约写在哪保证什么.md","group":"决策精读","date":"2026-09-10","slug":"DSH过程决策精读-11-契约写在哪保证什么","title":"DSH 过程决策精读 · 第 11 批：契约写在哪、保证什么","tags":[],"summary":"2026-07-12-package-model-experience-contract.md","bytes":14511,"lines":232,"body":"# DSH 过程决策精读 · 第 11 批：契约写在哪、保证什么\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。共同点是**契约的选址与强度**：把契约写在实现本地还是中央？\n> 数值不可得时记录什么？以及——**这个验证手段究竟保证了什么、没保证什么。**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [Model Experience 契约](#1-package-model-experience-契约) | 稳定的契约是\"增长形态\"，不是数字 |\n| 2 | [Project 本地的 Issue 规划字段](#2-project-本地的-issue-规划字段) | 一条政策不该依赖两套独立管理的权限 |\n| 3 | [仅 master 的平台 CI](#3-仅-master-的平台-ci) | 明确接受\"合并后才发现\" |\n\n---\n\n## 1. Package Model Experience 契约\n\n`2026-07-12-package-model-experience-contract.md`\n\n### 他们遇到的事\n\n一个包 README 可以解释 API 和运行时机制，**却不回答主导 agent harness 行为与成本的那些问题**：\n\n> what from this package reaches a model request, under which conditions, how long those tokens remain, and whether later requests preserve a reusable KV-cache prefix\n\n**这个包的什么内容会到达模型请求、在什么条件下、那些 token 停留多久、后续请求是否保留可复用的 KV-cache 前缀。**\n\n而麻烦在于**这个遗漏在插件架构里尤其难审计**：\n\n> A consumer may turn a backend result into a tool message, a policy plugin may replace success with an error, compaction may remove old history, and an agent-scoped registration may change one agent's prompt or schemas while leaving every other agent unchanged.\n\n消费者可能把后端结果变成工具消息；策略插件可能把成功替换成错误；压缩可能移除旧历史；**而一个 agent 作用域的注册可能改变某个 agent 的 prompt 或 schema，同时让其他所有 agent 保持不变**。\n\n于是两边都走不通：**只读那些\"名义上面向模型\"的包会错过真实的上下文效应；而跨每个依赖读源码，对常规评审来说太贵。**\n\n### 判断：契约写在包 README（实现本地）\n\n- 每个有面向模型或模型相邻契约的包 **README 以规范的 Model Experience 段结尾**\n- 有直接/条件/有上限/生命周期/多面/辅助模型效应的包，**每个上下文面用一个 H3**；每个面含三个有序 H4：`What the model sees`、`Token effect`、`KV Cache effect`，**每个字段以一段散文开始**\n- 无效应或完全由别包渲染的路径，用**审计过的短形式**：一句以 `None, as ` 或 `Indirectly, through ` 开头的句子 + 一个 `KV Cache effect` H4\n\n### 三处\"区分两个事实\"的精确措辞\n\n**① \"不失效\"不等于\"保证命中\"。**\n\n> \"Does not invalidate\" means **the package preserves an already-reusable prefix**, not that **a provider promises a cache hit or retention period**.\n\n**\"Does not invalidate\" 的意思是\"这个包保留了一个已经可复用的前缀\"，而不是\"provider 保证缓存命中或保留期\"。** 一句话划清了自己能承诺的与上游才能承诺的。\n\n**② 稳定契约是\"形态\"，不是\"数值\"。**\n\n被否决的方案是\"要求数字化的 token 计数\"，理由是：\n\n> exact counts depend on the selected model tokenizer, adapter serialization, configuration, and runtime data. **The stable contract is the growth shape**: fixed per request, conditional per call, retained, replaced, capped, or zero-direct.\n\n**精确计数取决于 tokenizer、适配器序列化、配置和运行时数据——它不可稳定。** 于是契约退到**可稳定判定的那一层**：增长形态（每次请求固定／每次调用条件性／保留／替换／有上限／零直接效应）。\n\n**③ 缺席必须有解释。**\n\n> unconstrained absence is **ambiguous between an audited zero and forgotten documentation**\n\n**无约束的缺席，在\"审计过的零\"和\"忘记写文档\"之间是模糊的。** 所以省略**只留给**被校验器点名并附理由的模型无关包——**其余零影响的包也必须写一句明确的话**。\n\n这是\"诚实的空白\"的反面用法：**空白本身可以是诚实的，但前提是它被标注过。** 没有标注的空白，读的人无法区分\"这里确实没有\"和\"这里漏了\"。\n\n### 凭什么这么判断（7 个被否决方案，取最利的）\n\n| 方案 | 否决理由 |\n|---|---|\n| **只记录注册了 prompt 或工具的包** | **后端、策略插件、适配器、持久化、作用域和压缩都会改变 token 的内容或生命周期，却不拥有面向模型的 schema** |\n| **从源码生成一个中央上下文成本目录** | **AST 能找到注册，但无法推断语义条件**——历史保留、输出截断、父子可见性、辅助模型边界。**包 README 是实现本地的契约；一份中央副本会增加另一个漂移点** |\n| 要求数字化的 token 计数 | 见上——精确计数不稳定 |\n| 用一张表 | 精确的源码文本和条件结果形态**让单元格密集、难以扫读** |\n| 允许每个零影响包都省略 | 见上——缺席的歧义 |\n| 零影响/简单间接包也用完整结构化形式 | **那是在一个事实周围重复标签** |\n| 只靠约定、不设门禁 | **一个仓库范围的契约还必须覆盖每一个未来的包；评审记忆无法可靠地察觉一个被省略的 README 段** |\n\n第 2 条是模式 B（第二份真相）的又一次印证，而且给出了新论据：**AST 能提取\"结构\"，但提取不出\"语义条件\"**——所以生成物在这里不可能正确，不只是\"会漂移\"。\n\n### 门禁管到哪为止\n\n校验器检查：三种分类、规范的末段顺序、字段标题深度与顺序、非空字段段落、H5 对逐字块的所有权、**具体字面量证据**、锚定的工具目录链接。\n\n而最后一句划了边界：**\"评审仍然拥有覆盖率、链接相关性和事实准确性。\"** —— **门禁管形式，评审管内容**，谁管什么写在明面上。\n\n---\n\n## 2. Project 本地的 Issue 规划字段\n\n`2026-09-02-project-local-issue-planning-fields.md`\n\n### 他们遇到的事\n\n一段很具体的权限与存储耦合：\n\n> A workflow token with Project write access **can** read and update Project custom fields **while GitHub rejects Issue-field reads**, so using both storage systems makes **one policy depend on two independently administered permission sets**.\n\n一个带 Project 写权限的工作流 token 能读写 Project 自定义字段，**而 GitHub 拒绝 Issue 字段的读取**——于是同时使用两个存储系统，会让**一条政策依赖于两套独立管理的权限集**。\n\n这是\"**一条政策不该被两套权限绑住**\"的判据——**不是因为技术上做不到，而是因为它把一个运维面变成了两个。**\n\n### 判断\n\n- 规划字段（`Priority`、`Severity`、`Cost`、`Start Date`、`Target Date`）**归 `DSH Issue Management` Project 所有**\n- 仓库政策**从配置的 Project 解析**；**它拒绝 Issue 支撑的字段或错误的数据类型**\n- 组织级 Issue 字段**只保留为 `Legacy ...` 迁移来源**，不被仓库工作流读取\n- `Start Date` **只对 `pull_request.opened` 初始化**，且**只在当前 Project 值为空时写入**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持组织级 Issue 字段 | 它们让一个值跨 Project 可见，**但工作流不需要那个作用域，而且 GitHub App 会需要单独的组织级 Issue Fields 访问权** |\n| **双写 Issue 和 Project 字段** | 镜像字段保留了跨 Project 可见性，**但每一个写入者和手工编辑都能制造漂移，并需要一条对账政策** |\n| 处理每个订阅的 PR 事件，或覆盖 Start Date | 更晚的事件可以修复缺失日期，**但它们会在工作开始之后才分配日期，或替换一次手工计划** |\n\n第 3 条里那个取舍值得记：**\"
